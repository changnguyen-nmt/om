            { id: 265, chapter: 3, text: 'Gradual, long-term movement in time series data is called:', options: ['seasonal variation', 'cycles', 'irregular variation', 'trend', 'random variation'], answer: 3, explanation: 'Trends move the time series in a long-term direction.' },
            { id: 266, chapter: 3, text: 'The primary difference between seasonality and cycles is:', options: ['the duration of the repeating patterns', 'the magnitude of the variation', 'the ability to attribute the pattern to a cause', 'the direction of the movement', 'there are only 4 seasons but 30 cycles'], answer: 0, explanation: 'Seasons happen within time periods; cycles happen across multiple time periods.' },
            { id: 267, chapter: 3, text: 'Averaging techniques are useful for:', options: ['distinguishing between random and non-random variations', 'smoothing out fluctuations in time series', 'eliminating historical data', 'providing accuracy in forecasts', 'average people'], answer: 1, explanation: 'Smoothing helps forecasters see past random error.' },
            { id: 268, chapter: 3, text: 'Putting forecast errors into perspective is best done using:', options: ['Exponential smoothing', 'MAPE', 'Linear decision rules', 'MAD', 'Hindsight'], answer: 1, explanation: 'MAPE depicts the forecast error relative to what was being forecast.' },
            { id: 269, chapter: 3, text: 'Using the latest observation in a sequence of data to forecast the next period is:', options: ['a moving average forecast', 'a naive forecast', 'an exponentially smoothed forecast', 'an associative forecast', 'regression analysis'], answer: 1, explanation: 'Only one piece of information is needed for a naive forecast.' },
            { id: 270, chapter: 3, text: 'For the data given below, what would the naive forecast be for the next period (period #5)? Period 1:58, 2:59, 3:60, 4:61', options: ['58', '62', '59.5', '61', 'cannot tell from the data given'], answer: 3, explanation: 'Period 5\'s forecast would be period 4\'s demand.' },
            { id: 271, chapter: 3, text: 'Moving average forecasting techniques do the following:', options: ['immediately reflect changing patterns in the data', 'lead changes in the data', 'smooth variations in the data', 'operate independently of recent data', 'assist when organizations are relocating'], answer: 2, explanation: 'Variation is smoothed out in moving average forecasts.' },
            { id: 272, chapter: 3, text: 'Which is not a characteristic of simple moving averages applied to time series data?', options: ['smoothes random variations in the data', 'weights each historical value equally', 'lags changes in the data', 'requires only last period\'s forecast and actual data', 'smoothes real variations in the data'], answer: 3, explanation: 'Simple moving averages can require several periods of data.' },
            { id: 273, chapter: 3, text: 'In order to increase the responsiveness of a forecast made using the moving average technique, the number of data points in the average should be:', options: ['decreased', 'increased', 'multiplied by a larger alpha', 'multiplied by a smaller alpha', 'eliminated if the MAD is greater than the MSE'], answer: 0, explanation: 'Fewer data points result in more responsive moving averages.' },
            { id: 274, chapter: 3, text: 'A forecast based on the previous forecast plus a percentage of the forecast error is:', options: ['a naive forecast', 'a simple moving average forecast', 'a centered moving average forecast', 'an exponentially smoothed forecast', 'an associative forecast'], answer: 3, explanation: 'Exponential smoothing uses the previous forecast error to shape the next forecast.' },
            { id: 275, chapter: 3, text: 'Which is not a characteristic of exponential smoothing?', options: ['smoothes random variations in the data', 'weights each historical value equally', 'has an easily altered weighting scheme', 'has minimal data storage requirements', 'smoothes real variations in the data'], answer: 1, explanation: 'The most recent period of demand is given the most weight in exponential smoothing.' },
            { id: 276, chapter: 3, text: 'Which of the following smoothing constants would make an exponential smoothing forecast equivalent to a naive forecast?', options: ['0', '.01', '.1', '.5', '1.0'], answer: 4, explanation: 'An alpha of 1.0 leads to a naive forecast.' },
            { id: 277, chapter: 3, text: 'Simple exponential smoothing is being used to forecast demand. The previous forecast of 66 turned out to be four units less than actual demand. The next forecast is 66.6, implying a smoothing constant, alpha, equal to:', options: ['.01', '.10', '.15', '.20', '.60'], answer: 2, explanation: 'A previous period\'s forecast error of 4 units would lead to a change in the forecast of 0.6 if alpha equals 0.15.' },
            { id: 278, chapter: 3, text: 'Given an actual demand of 59, a previous forecast of 64, and an alpha of .3, what would the forecast for the next period be using simple exponential smoothing?', options: ['36.9', '57.5', '60.5', '62.5', '65.5'], answer: 3, explanation: 'Multiply the previous period\'s forecast error (-5) by alpha and then add to the previous period\'s forecast.' },
            { id: 279, chapter: 3, text: 'Given an actual demand of 105, a forecasted value of 97, and an alpha of .4, the simple exponential smoothing forecast for the next period would be:', options: ['80.8', '93.8', '100.2', '101.8', '108.2'], answer: 2, explanation: 'Multiply the previous period\'s forecast error (8) by alpha and then add to the previous period\'s forecast.' },
            { id: 280, chapter: 3, text: 'Which of the following possible values of alpha would cause exponential smoothing to respond the most quickly to forecast errors?', options: ['0', '.01', '.05', '.10', '.15'], answer: 4, explanation: 'Larger values for alpha correspond with greater responsiveness.' },
            { id: 281, chapter: 3, text: 'A manager uses the following equation to predict monthly receipts: Yt = 40,000 + 150t. What is the forecast for July if t = 0 in April of this year?', options: ['40,450', '40,600', '42,100', '42,250', '42,400'], answer: 0, explanation: 'July would be period 3, so the forecast would be 40,000 + 150(3).' },
            { id: 282, chapter: 3, text: 'In trend-adjusted exponential smoothing, the trend adjusted forecast (TAF) consists of:', options: ['an exponentially smoothed forecast and a smoothed trend factor', 'an exponentially smoothed forecast and an estimated trend value', 'the old forecast adjusted by a trend factor', 'the old forecast and a smoothed trend factor', 'a moving average and a trend factor'], answer: 0, explanation: 'Both random variation and the trend are smoothed in TAF models.' },
            { id: 283, chapter: 3, text: 'In the "additive" model for seasonality, seasonality is expressed as a _____ adjustment to the average; in the multiplicative model, seasonality is expressed as a _____ adjustment to the average.', options: ['quantity, percentage', 'percentage, quantity', 'quantity, quantity', 'percentage, percentage', 'qualitative, quantitative'], answer: 0, explanation: 'The additive model simply adds a seasonal adjustment to the de-seasonalized forecast. The multiplicative model adjusts the de-seasonalized forecast by multiplying it by a season relative or index.' },
            { id: 284, chapter: 3, text: 'Which technique is used in computing seasonal relatives?', options: ['double smoothing', 'Delphi', 'Mean Squared Error (MSE)', 'centered moving average', 'exponential smoothing'], answer: 3, explanation: 'The centered moving average serves as the basis point for computing seasonal relatives.' },
            { id: 285, chapter: 3, text: 'A persistent tendency for forecasts to be greater than or less than the actual values is called:', options: ['bias', 'tracking', 'control charting', 'positive correlation', 'linear regression'], answer: 0, explanation: 'Bias is a tendency for a forecast to be above (or below) the actual value.' },
            { id: 286, chapter: 3, text: 'Which of the following might be used to indicate the cyclical component of a forecast?', options: ['leading variable', 'Mean Squared Error (MSE)', 'Delphi technique', 'exponential smoothing', 'Mean Absolute Deviation (MAD)'], answer: 0, explanation: 'Leading variables, such as births in a given year, can correlate strongly with long-term phenomena such as cycles.' },
            { id: 287, chapter: 3, text: 'The primary method for associative forecasting is:', options: ['sensitivity analysis', 'regression analysis', 'simple moving averages', 'centered moving averages', 'exponential smoothing'], answer: 1, explanation: 'Regression analysis is an associative forecasting technique.' },
            { id: 288, chapter: 3, text: 'Which term most closely relates to associative forecasting techniques?', options: ['time series data', 'expert opinions', 'Delphi technique', 'consumer survey', 'predictor variables'], answer: 4, explanation: 'Associative techniques use predictor variables.' },
            { id: 289, chapter: 3, text: 'Which of the following corresponds to the predictor variable in simple linear regression?', options: ['regression coefficient', 'dependent variable', 'independent variable', 'predicted variable', 'demand coefficient'], answer: 2, explanation: 'Demand is the typical dependent variable when forecasting with simple linear regression.' },
            { id: 290, chapter: 3, text: 'The mean absolute deviation (MAD) is used to:', options: ['estimate the trend line', 'eliminate forecast errors', 'measure forecast accuracy', 'seasonally adjust the forecast', 'all of the above'], answer: 2, explanation: 'MAD is one way of evaluating forecast performance.' },
            { id: 291, chapter: 3, text: 'Given forecast errors of 4, 8, and -3, what is the mean absolute deviation?', options: ['4', '3', '5', '6', '12'], answer: 2, explanation: 'Convert each error into an absolute value and then average.' },
            { id: 292, chapter: 3, text: 'Given forecast errors of 5, 0, -4, and 3, what is the mean absolute deviation?', options: ['4', '3', '2.5', '2', '1'], answer: 1, explanation: 'Convert each error into an absolute value and then average.' },
            { id: 293, chapter: 3, text: 'Given forecast errors of 5, 0, -4, and 3, what is the bias?', options: ['-4', '4', '5', '12', '6'], answer: 1, explanation: 'Sum the forecast errors.' },
            { id: 294, chapter: 3, text: 'Which of the following is used for constructing a control chart?', options: ['mean absolute deviation (MAD)', 'mean squared error (MSE)', 'tracking signal (TS)', 'bias', 'none of the above'], answer: 1, explanation: 'The mean squared error leads to an estimate for the sample forecast standard deviation.' },
            { id: 295, chapter: 3, text: 'The two most important factors in choosing a forecasting technique are:', options: ['cost and time horizon', 'accuracy and time horizon', 'cost and accuracy', 'quantity and quality', 'objective and subjective components'], answer: 2, explanation: 'More accurate forecasts cost more but may not be worth the additional cost.' },
            { id: 296, chapter: 3, text: 'The degree of management involvement in short range forecasts is:', options: ['none', 'low', 'moderate', 'high', 'total'], answer: 1, explanation: 'Short range forecasting tends to be fairly routine.' },
            { id: 297, chapter: 3, text: 'Which of the following is not necessarily an element of a good forecast?', options: ['estimate of accuracy', 'timeliness', 'meaningful units', 'low cost', 'written'], answer: 3, explanation: 'A good forecast can be quite costly if necessary.' },
            { id: 298, chapter: 3, text: 'Current information on _____ can have a significant impact on forecast accuracy:', options: ['prices', 'promotion', 'inventory', 'competition', 'all of the above'], answer: 4, explanation: 'Demand in the future could be subject to decision-making prompted by prices, promotions, inventory or competition. Accuracy will be affected if these are (or are not) taken into consideration.' },
            { id: 299, chapter: 3, text: 'A managerial approach toward forecasting which seeks to actively influence demand is:', options: ['reactive', 'proactive', 'influential', 'protracted', 'retroactive'], answer: 1, explanation: 'Simply responding to demand is a reactive approach.' },
            { id: 300, chapter: 3, text: 'Customer service levels can be improved by better:', options: ['mission statements', 'control charting', 'short term forecast accuracy', 'exponential smoothing', 'customer selection'], answer: 2, explanation: 'More accurate short-term forecasts enable organization\'s to better accommodate customer requests.' },

            // === CHƯƠNG 4: 77 câu ===
            { id: 401, chapter: 4, text: 'Global teams provide diversity while eliminating conflicts and miscommunication.', options: ['True', 'False'], answer: 1, explanation: 'Using globally diverse design teams increases the risks of conflicts and miscommunication.' },
            { id: 402, chapter: 4, text: 'A House of Quality\' is achieved when no department in a single location has more than 15% rejects.', options: ['True', 'False'], answer: 1, explanation: 'The house of quality is a means of integrating the voice of the customer into the product or service development process.' },
            { id: 403, chapter: 4, text: 'Concurrent Engineering is another term for sequential development.', options: ['True', 'False'], answer: 1, explanation: 'Concurrent engineering involves simultaneous product and production development.' },
            { id: 404, chapter: 4, text: 'One of the main advantages of standardization is that it increases the potential variety of products.', options: ['True', 'False'], answer: 1, explanation: 'Standardization reduces the variety of products.' },
            { id: 405, chapter: 4, text: 'A disadvantage of standardization is the possibility of standardizing designs too early, which may make it difficult to modify in the future.', options: ['True', 'False'], answer: 0, explanation: 'Standardization locks firms into designs that aren\'t easily changed.' },
            { id: 406, chapter: 4, text: 'Reducing consumer choices makes service more efficient.', options: ['True', 'False'], answer: 0, explanation: 'Efficiency comes from the standardization that results from reduced consumer choices.' },
            { id: 407, chapter: 4, text: 'Modular design increases costs of purchasing and controlling inventory compared to non-modular.', options: ['True', 'False'], answer: 1, explanation: 'Modular designs make inventory management easier and cheaper.' },
            { id: 408, chapter: 4, text: 'Product failures can be easier to remedy with modular design.', options: ['True', 'False'], answer: 0, explanation: 'Modular designs make it easy to change only portions of the design.' },
            { id: 409, chapter: 4, text: 'One motivation for an organization to redesign its product or service is to avoid the alternative of downsizing the organization.', options: ['True', 'False'], answer: 0, explanation: 'The threat of downsizing often spurs product or service redesign.' },
            { id: 410, chapter: 4, text: 'A major benefit of Computer Aided Design (CAD) is the increased productivity of designers.', options: ['True', 'False'], answer: 0, explanation: 'CAD tends to greatly increase designers\' productivity.' },
            { id: 411, chapter: 4, text: 'Most of the time what is called product or service design is actually a redesign of an existing product or service.', options: ['True', 'False'], answer: 0, explanation: 'Usually the core product or service remains relatively unchanged even though other features are modified or enhanced.' },
            { id: 412, chapter: 4, text: 'A service blueprint is quite similar to an architectural drawing.', options: ['True', 'False'], answer: 0, explanation: 'A service blueprint shows the basic customer and service actions involved in a service operation.' },
            { id: 413, chapter: 4, text: 'The process of dismantling and inspecting a competitor\'s product to discover product improvement is called benchmarking.', options: ['True', 'False'], answer: 1, explanation: 'Dismantling and inspecting a competitor\'s product to discover product improvement is called reverse engineering.' },
            { id: 414, chapter: 4, text: 'To save money, it is essential that designers revise the production capabilities to meet the requirements of the new products.', options: ['True', 'False'], answer: 1, explanation: 'Saving money requires designers to ensure that new products can be produced using existing production capabilities.' },
            { id: 415, chapter: 4, text: 'Many US manufacturers are now shifting their focus from products to both product and process improvements.', options: ['True', 'False'], answer: 0, explanation: 'Both product and process must be considered in the product/service design question.' },
            { id: 416, chapter: 4, text: 'Applied research has the objective of achieving commercial applications for new ideas.', options: ['True', 'False'], answer: 0, explanation: 'Applied research is aimed at commercializing basic research.' },
            { id: 417, chapter: 4, text: 'Basic research is done with the expectation that discoveries will have near-term commercial application.', options: ['True', 'False'], answer: 1, explanation: 'Basic research is done with no clear expectations regarding commercial application.' },
            { id: 418, chapter: 4, text: '"Design for production" takes into account the capabilities of the organization to produce or deliver a given product or service.', options: ['True', 'False'], answer: 0, explanation: 'Design for production is important to ensure that product or service design decisions are feasible.' },
            { id: 419, chapter: 4, text: 'Consumers tend to resist purchasing products containing recycled materials.', options: ['True', 'False'], answer: 1, explanation: 'Consumers are beginning to respond positively when informed that their purchases contain recycled materials.' },
            { id: 420, chapter: 4, text: '"Concurrent engineering" brings people concerned with manufacturing into the design phase earlier than in the "over-the-wall" approach.', options: ['True', 'False'], answer: 0, explanation: 'In concurrent engineering people concerned with manufacturing are actively engaged in the design phase.' },
            { id: 421, chapter: 4, text: '"Concurrent engineering" means that at least two engineers are involved in product design at the same time.', options: ['True', 'False'], answer: 1, explanation: 'Concurrent engineering means that engineers, marketing, manufacturing and purchasing personnel often are jointly involved in the product design.' },
            { id: 422, chapter: 4, text: 'One approach to extending a product\'s life cycle is to promote alternate uses of the product.', options: ['True', 'False'], answer: 0, explanation: 'Alternate uses extend product life cycles.' },
            { id: 423, chapter: 4, text: '"Quality Function Deployment" is a structured approach that guarantees that the highest quality product or service will be designed.', options: ['True', 'False'], answer: 1, explanation: 'Quality Function Deployment ensures that the voice of the customer is integrated into the product or service design question.' },
            { id: 424, chapter: 4, text: 'Product liability means that a manufacturer is liable for any injuries and damages caused by a faulty product because of poor workmanship or design.', options: ['True', 'False'], answer: 0, explanation: 'Product liability is a serious issue for manufacturers.' },
            { id: 425, chapter: 4, text: 'The process of dismantling and inspecting a competitor\'s product to discover improvement is called reverse engineering.', options: ['True', 'False'], answer: 0, explanation: 'Reverse engineering is a legitimate means of evaluating the competitive landscape.' },
            { id: 426, chapter: 4, text: 'Research and development (R&D) refers to organized efforts that are directed toward increasing scientific knowledge and product (or process) innovation.', options: ['True', 'False'], answer: 0, explanation: 'Product or process innovations often result from deliberate R&D programs.' },
            { id: 427, chapter: 4, text: 'Standardization refers to the extent to which there is absence of variety in a product, service, or process.', options: ['True', 'False'], answer: 0, explanation: 'Standardization reduces variety and leads to greater efficiency.' },
            { id: 428, chapter: 4, text: 'Re-manufacturing refers to removing some of the components of old products and reusing them in new products.', options: ['True', 'False'], answer: 0, explanation: 'Re-manufacturing is a way of increasing sustainability.' },
            { id: 429, chapter: 4, text: 'The demand for a product and the rate of technological change have significant impact on the length of a given phase of the product life cycle.', options: ['True', 'False'], answer: 0, explanation: 'How long a product stays in a particular phase of its life cycle depends greatly on the rate of technological change.' },
            { id: 430, chapter: 4, text: 'Robust design describes a product that will perform satisfactorily so long as it is used in a very narrow range of conditions.', options: ['True', 'False'], answer: 1, explanation: 'Robust designs perform satisfactorily across a wide range of conditions.' },
            { id: 431, chapter: 4, text: 'Taguchi design methods involve identifying the optimal operating or environmental conditions for a given product.', options: ['True', 'False'], answer: 1, explanation: 'Taguchi design methods involve designing products that are relatively insensitive to environmental factors.' },
            { id: 432, chapter: 4, text: 'Quality function deployment (QFD) is based on a set of standards which relate customer requirements to company capabilities.', options: ['True', 'False'], answer: 1, explanation: 'QFD relates customer requirements to product designs and the capabilities necessary to carry these designs out.' },
            { id: 433, chapter: 4, text: 'The quality function deployment (QFD) matrices are often referred to as the "House of Quality" because, when completed, they "house" all of the customer\'s quality requirements.', options: ['True', 'False'], answer: 1, explanation: 'QFD matrices link customer requirements with other product/process design elements.' },
            { id: 434, chapter: 4, text: 'Service design often must take into account the degree of customer contact required.', options: ['True', 'False'], answer: 0, explanation: 'Customer contact is a critical service design issue.' },
            { id: 435, chapter: 4, text: 'Reliability refers to the ability of a product to perform its intended function under normal conditions.', options: ['True', 'False'], answer: 0, explanation: 'Greater reliability translates into a greater likelihood of the product working in normal conditions.' },
            { id: 436, chapter: 4, text: 'Applied research is the major R & D effort of business organizations because of the desire for commercial applications.', options: ['True', 'False'], answer: 0, explanation: 'Most business organizations focus on applied rather than basic research.' },
            { id: 437, chapter: 4, text: 'Commonality of components is beneficial for manufacturing but not for services.', options: ['True', 'False'], answer: 1, explanation: 'Services can benefit from commonality in service elements.' },
            { id: 438, chapter: 4, text: 'Standardization can at times lead to serious difficulties and competitive struggles, particularly when systems are running under different conditions.', options: ['True', 'False'], answer: 1, explanation: 'It is the lack of standardization that can at times lead to serious difficulties and competitive struggles.' },
            { id: 439, chapter: 4, text: 'The term failure as applied to reliability means that a part or item does not function at all.', options: ['True', 'False'], answer: 1, explanation: 'Failure means that the part or item does not function as it should.' },
            { id: 440, chapter: 4, text: 'Reliability can be defined in terms of a particular point in time or in terms of length of service.', options: ['True', 'False'], answer: 0, explanation: 'Reliable designs can be counted on to work over time.' },
            { id: 441, chapter: 4, text: 'Reliability can be improved by the use of backup components.', options: ['True', 'False'], answer: 0, explanation: 'Adding a backup component is often cheaper than increasing the reliability of a given component.' },
            { id: 442, chapter: 4, text: 'Delayed differentiation and modular design are tactics for mass customization.', options: ['True', 'False'], answer: 0, explanation: 'These allow variety without giving up too much in the way of standardization.' },
            { id: 443, chapter: 4, text: 'Life-cycle assessment involves incorporating where the product or service is in its life-cycle into system-design decision-making.', options: ['True', 'False'], answer: 1, explanation: 'Life-cycle assessment involves assessing the environmental impact of a product or service as it goes through its useful life.' },
            { id: 444, chapter: 4, text: 'The goal of life-cycle assessment is to incorporate the environmental impact of products or services into product-design or service-design decision-making.', options: ['True', 'False'], answer: 0, explanation: 'Life-cycle assessment involves assessing the environmental impact of a product or service as it goes through its useful life.' },
            { id: 445, chapter: 4, text: 'The three Rs - Reduce, Re-use and Recycle - are more applicable in service design than in product design.', options: ['True', 'False'], answer: 1, explanation: 'Services cannot be re-used or recycled.' },
            { id: 446, chapter: 4, text: 'The goal of value analysis is to find ways of:', options: ['I. Reducing the cost of parts and materials', 'II. Improving the performance of the product or service', 'III. Incorporating multiple cultural values in global system design', 'Both I and III', 'Both I and II'], answer: 4, explanation: 'In value analysis an attempt is made to reduce the cost and/or improve the performance of the product.' },
            { id: 447, chapter: 4, text: 'When considering re-use issues for a given product, an important factor to take into account is that product\'s:', options: ['Ethical impact', 'Reliability', 'Durability', 'Design for assembly', 'None of the above'], answer: 2, explanation: 'Remanufacturing refers to refurbishing used products.' },
            { id: 448, chapter: 4, text: 'Incorporating design for disassembly (DFD) principles in product design helps firms with _____ design issues.', options: ['Legal', 'Social', 'Re-use', 'Reverse engineering', 'Re-engineering'], answer: 2, explanation: 'Refurbished products must first be disassembled.' },
            { id: 449, chapter: 4, text: 'Designing for recycling helps facilitate:', options: ['Reduced legal liability', 'Compliance with regulatory environments', 'Increased product reliability', 'Reduced standardization costs', 'None of the above'], answer: 1, explanation: 'Regulatory environments are increasingly focused on encouraging recycling.' },
            { id: 450, chapter: 4, text: 'One way to increase reliability is to:', options: ['improve component design', 'increase the number of service stations', 'increase mean repair time', 'increase the number of dependent components', 'none of the above'], answer: 0, explanation: 'Another way is to add backup components.' },
            { id: 451, chapter: 4, text: 'One way to increase reliability is to:', options: ['eliminate backup component', 'improve preventive maintenance procedures', 'increase mean repair time', 'increase the number of independent components', 'none of the above'], answer: 1, explanation: 'Preventative maintenance leads to longer intervals between breakdowns.' },
            { id: 452, chapter: 4, text: 'Which of the following is not a reason for redesigning a product or service?', options: ['to reduce labor or material cost', 'to increase the level of employee satisfaction', 'to increase the level of customer satisfaction', 'to attract and increase customer demand', 'to increase quality'], answer: 1, explanation: 'A product or service redesign does not necessarily involve improving employee satisfaction.' },
            { id: 453, chapter: 4, text: 'A disadvantage of global teams for product design is that:', options: ['Customers may have different needs in different countries', 'The product designed may have increased marketability and utility', 'The diversity of an international team may be a detriment', 'Ease of face to face meetings is absent since members are located everywhere', 'Technology allows constant contact with team members'], answer: 3, explanation: 'If face to face interaction is required, global design teams might not be a viable option.' },
            { id: 454, chapter: 4, text: 'Mobile phones have evolved from devices intended to place and receive phone calls into handheld multimedia communications devices, but in the eyes of some customers these new features make the phones less desirable. This is an example of:', options: ['robust design', 'creeping featurism', 'sustainable design', 'quality function deployment', 'component commonality'], answer: 1, explanation: 'Customer satisfaction isn\'t strictly dependent on the number of features a product offers.' },
            { id: 455, chapter: 4, text: 'One step that isn\'t part of service blueprinting is:', options: ['Eliminate boundaries for the service and decide on the level of interaction needed', 'Identify and determine the sequence of customer and service actions and interactions', 'Develop time estimates for each phase of the process', 'Understand the time variability involved', 'Identify potential failure points and develop a plan to minimize them'], answer: 0, explanation: 'Defining boundaries is a critical part of service blueprinting.' },
            { id: 456, chapter: 4, text: 'The research and development activity which starts after positive research results are available and attempts to turn these results into useful commercial applications is:', options: ['basic research', 'applied research', 'development', 'redesign', 'commercial research'], answer: 2, explanation: 'Development is the conversion of applied research into useful commercial applications.' },
            { id: 457, chapter: 4, text: 'The advantages of standardization include which of the following? (I.) The opportunity to freeze design at a very early stage (II.) Fewer parts to deal with in inventory (III.) Reduced training cost and time (IV.) Purchasing is more routine', options: ['I, II', 'I, IV', 'I, II, III', 'II, III, IV', 'I, II, III, IV'], answer: 3, explanation: 'Standardization doesn\'t necessarily help in freezing designs early.' },
            { id: 458, chapter: 4, text: 'Products or services with a high degree of similarity of features and components are called:', options: ['generic', 'copy-cat', 'rip-offs', 'product families', 'product/service matrix'], answer: 3, explanation: 'Delineating product families helps lead to component commonality.' },
            { id: 459, chapter: 4, text: '"Must have," "expected" and "excitement" characteristics are categories in the _____ model.', options: ['Bi-polar', 'Kano', 'Pareto', 'Quality', 'Service Matrix'], answer: 1, explanation: 'The Kano model is an alternative to "more is better" design approaches.' },
            { id: 460, chapter: 4, text: 'One possible disadvantage of modular design is that:', options: ['replacement and repair is more difficult', 'failure diagnosis is more complex', 'number of configurations of modules decreases', 'individual parts lose their identities', 'inventory problems arise'], answer: 2, explanation: 'Modular designs do have the effect of reducing variety.' },
            { id: 461, chapter: 4, text: 'In the area of product and service design, the acronym CAD refers to:', options: ['conceptually appropriate design', 'computer aided design', 'commercial applications design', 'competitive advantage design', 'completely automated design'], answer: 1, explanation: 'CAD can increase the productivity of product designers.' },
            { id: 462, chapter: 4, text: 'Which of the following statements about CAD is not true?', options: ['It increases the productivity of designers.', 'It uses computer graphics.', 'It requires a good data base.', 'Some systems permit engineering or cost analysis of proposed designs.', 'It is used successfully by all manufacturing companies.'], answer: 4, explanation: 'Not all manufacturers use CAD.' },
            { id: 463, chapter: 4, text: 'Which one of the following is not a factor of successful product and service design?', options: ['be aware of what the competitors are doing', 'be aware of what customers want', 'know what government regulations are', 'use computerized design techniques', 'know what new technologies are available'], answer: 3, explanation: 'Computerized design techniques don\'t necessarily lead to successful product and service design.' },
            { id: 464, chapter: 4, text: 'A software company is weighing whether to release a new version of its software. The company can go ahead and release the version now and correct flaws with subsequent patches or upgrades, or it can wait until the new version is reasonably bug-free. This is an example of _____.', options: ['life-cycle analysis', 'value analysis', 'vaporware', 'concurrent engineering', 'design for production'], answer: 2, explanation: 'Vaporware is attractive from some perspectives but not from others.' },
            { id: 465, chapter: 4, text: 'Ideas for new or improved designs can come from:', options: ['customers', 'competitors', 'research and development departments', 'production departments', 'all of the above'], answer: 4, explanation: 'Companies look to many sources for ideas for new or improved designs.' },
            { id: 466, chapter: 4, text: 'The process of dismantling and inspecting a competitor\'s new or revised product for the purpose of gleaning design ideas is called:', options: ['design by imitation', 'product analysis', 'reverse engineering', 'benchmarking', 'disassembly'], answer: 2, explanation: 'Reverse engineering can be a good source of ideas for product design.' },
            { id: 467, chapter: 4, text: 'The term \'degrees of newness\' is associated with:', options: ['average age of employees', 'average length of time on the job', 'total years of business experience', 'degree of design change', 'average age of the capital equipment'], answer: 3, explanation: 'Superficial design changes are low in \'degrees of newness.\'' },
            { id: 468, chapter: 4, text: 'The term \'standardization\' is closely associated with:', options: ['customization', 'high cost', 'longer lead times', 'variety', 'interchangeability'], answer: 4, explanation: 'Modular designs depend on standardized parts that are interchangeable.' },
            { id: 469, chapter: 4, text: 'Service design generally differs from product design in which of the following ways?', options: ['Service design tends to focus on tangible factors.', 'There is less latitude in detecting and correcting errors prior to delivery.', 'There is a lesser requirement to be aware of competitors\' offerings.', 'There is less visibility to customers.', 'There is no difference.'], answer: 1, explanation: 'Often service design flaws are not discovered until some customers have been served.' },
            { id: 470, chapter: 4, text: 'The structural approach for integrating customer requirements into every aspect of product development is known as:', options: ['total quality management', 'customer satisfaction', 'quality function deployment', 'customer integration', 'a product development team'], answer: 2, explanation: 'Quality Function Deployment brings the voice of the customer into the product development process.' },
            { id: 471, chapter: 4, text: 'Which of the following is an issue that designers must take into account in product and service design?', options: ['legal, environmental, and ethical issues', 'reliability', 'standardization', 'range of operating conditions', 'all of the above'], answer: 4, explanation: 'Designs must reflect a large number of factors.' },
            { id: 472, chapter: 4, text: 'One of these is not a characteristic of a well-designed service system:', options: ['User friendly', 'Robust', 'Distributed computer networks', 'Cost effective', 'Easy to sustain'], answer: 2, explanation: 'Well-designed service systems tend to be user friendly, robust, cost-effective and easy to sustain.' },
            { id: 473, chapter: 4, text: 'A formal way to document customer requirements is:', options: ['consumer surveys', 'quality function deployment (QFD)', 'focus groups', 'Delphi technique', 'sales/marketing matrix'], answer: 1, explanation: 'QFD brings the voice of the customer into the design process.' },
            { id: 474, chapter: 4, text: 'Which of the following is not true about re-manufacturing?', options: ['Re-manufactured products can be sold at lower cost.', 'The process requires mostly unskilled and semiskilled workers.', 'There is less depletion of natural resources.', 'It produces high quality products easily.', 'Re-manufacturing is mainly carried out by small and mid-sized companies.'], answer: 1, explanation: 'Re-manufacturing can be a very difficult and costly process.' },
            { id: 475, chapter: 4, text: 'Which of the following is not one of the phases of product design and development?', options: ['specify product specifications', 'conduct market test', 'specify process specifications', 'conduct design review', 'performance applied research'], answer: 4, explanation: 'Product design and development begins after applied research has been done.' },
            { id: 476, chapter: 4, text: 'Elements of the service process in which there is little to no contact with the customer are referred to as:', options: ['robust', 'delayed differentiators', 'back-of-the-house', 'user-friendly', 'mission-consistent'], answer: 2, explanation: 'Those elements involving substantial contact with the customer are referred to as "front-of-the-house" operations.' },
            { id: 477, chapter: 4, text: 'In services, flowcharts are useful for:', options: ['translating basic research into applied research', 'identifying and determining the sequence of customer and service actions and interactions', 'developing time estimates for each phase of the service process', 'evaluating ways of standardizing service elements with component commonality', 'estimating customer satisfaction with the service process'], answer: 1, explanation: 'The customer-service interaction is depicted using flowcharts.' },

            // === CHƯƠNG 4S: 10 câu ===
            { id: 478, chapter: '4s', text: 'Reliability is the probability that a product or system will function when activated.', options: ['True', 'False'], answer: 0, explanation: 'The higher the probability, the more reliable the product or system.' },
            { id: 479, chapter: '4s', text: 'If a system depends on two sub-systems functioning when activated, the reliability of that system is equal to the lower reliability of the two sub-systems.', options: ['True', 'False'], answer: 1, explanation: 'The reliability is the probability that both sub-systems will activate.' },
            { id: 480, chapter: '4s', text: 'Redundancy is often more cost-effective than increasing individual component reliability.', options: ['True', 'False'], answer: 0, explanation: 'Increasing individual component reliability is often much more expensive than simply adding redundancy.' },
            { id: 481, chapter: '4s', text: 'Availability cannot be increased without improving the time between breakdowns.', options: ['True', 'False'], answer: 1, explanation: 'Reducing the amount of time required to repair a product is also a way of increasing availability.' },
            { id: 482, chapter: '4s', text: 'Product reliability involves both short-term and long-term perspectives.', options: ['True', 'False'], answer: 0, explanation: 'Reliability involves whether a product will work at a point in time, as well as the probability that it will work for a given length of time.' },
            { id: 483, chapter: '4s', text: 'A system consists of two components, each of which must activate if the system is to activate. One component has a reliability of .99. The other has a reliability of .95. What is the overall system reliability?', options: ['.99', '.95', '.94', '.90', 'Cannot be determined with this information.'], answer: 4, explanation: 'Whether these components\' reliabilities are independent of one another is not specified here.' },
            { id: 484, chapter: '4s', text: 'A system consists of two components, each of which must activate if the system is to activate. One component has a reliability of .99. The other has a reliability of .95. The components are independent of one another with respect to reliability. What is the overall system reliability?', options: ['.99', '.95', '.94', '.90', 'Cannot be determined with this information.'], answer: 2, explanation: 'The system reliability is the product of the two component reliabilities.' },
            { id: 485, chapter: '4s', text: 'An electrical appliance will not work unless component QK does. Component QK\'s reliability is 0.95. Every other part of the appliance is 100% reliable. What would the reliability of the appliance be if a backup QK were added?', options: ['.95', '.9975', '.9025', '.9205', '.9795'], answer: 1, explanation: 'The reliability is .95 + [(1 - .95)*.95] = .9975.' },
            { id: 486, chapter: '4s', text: 'The time between failures for an electrical appliance is exponentially distributed with a mean of 25 months. What is the probability that the next failure won\'t occur before 30 months have elapsed?', options: ['Not in excess of .2', 'In excess of .2 but not in excess of .3', 'In excess of .3 but not in excess of .4', 'In excess of .4 but not in excess of .6', 'In excess of .6'], answer: 2, explanation: 'T/MTBF is 1.2. From the chart, the reliability is 0.3012.' },
            { id: 487, chapter: '4s', text: 'Waygate\'s residential internet modem works well but is sensitive to power-line fluctuations. On average, this product hangs up and needs resetting every 200 hours. On average about 45 minutes is needed to reset this product. What is this product\'s availability?', options: ['Not in excess of .75', 'In excess of .75 but not in excess of .8', 'In excess of .8 but not in excess of .9', 'In excess of .9 but not in excess of .95', 'In excess of .95'], answer: 4, explanation: 'MTBF is 200 and MTTR is .75. This leads to an availability of 0.996.' },

            // === CHƯƠNG 5: 109 câu ===
            { id: 488, chapter: 5, text: 'The term capacity refers to the maximum quantity an operating unit can process over a given period of time.', options: ['True', 'False'], answer: 0, explanation: 'An operation\'s capacity is defined as the maximum rate of output possible.' },
            { id: 489, chapter: 5, text: 'Capacity decisions are usually one-time decisions; once they have been made, we know the limits of our operations.', options: ['True', 'False'], answer: 1, explanation: 'A number of factors can either increase or reduce a unit\'s capacity over time.' },
            { id: 490, chapter: 5, text: 'Stating capacity in dollar amounts generally results in a consistent measure of capacity regardless of the actual units of measure.', options: ['True', 'False'], answer: 1, explanation: 'The dollar value of a unit\'s output can change even though that unit\'s capacity hasn\'t.' },
            { id: 491, chapter: 5, text: 'Design capacity refers to the maximum output that can possibly be attained.', options: ['True', 'False'], answer: 0, explanation: 'Design capacity is only reachable under ideal conditions.' },
            { id: 492, chapter: 5, text: 'If the unit cost to buy something is less than the variable cost to make it, the decision to make or buy is based solely on the fixed costs.', options: ['True', 'False'], answer: 1, explanation: 'Cost is not the only consideration that enters into the "make or buy" decision.' },
            { id: 493, chapter: 5, text: 'Increasing productivity and also quality will result in increased capacity.', options: ['True', 'False'], answer: 0, explanation: 'Effective capacity can be increased over time by these and similar factors.' },
            { id: 494, chapter: 5, text: 'Utilization is defined as the ratio of effective capacity to design capacity.', options: ['True', 'False'], answer: 1, explanation: 'Utilization is the ratio of output to design capacity.' },
            { id: 495, chapter: 5, text: 'Increasing capacity just before a bottleneck operation will improve the output of the process.', options: ['True', 'False'], answer: 1, explanation: 'If the bottleneck isn\'t increased, the capacity of the process remains unchanged.' },
            { id: 496, chapter: 5, text: 'An example of an external factor that influences effective capacity is government safety regulations.', options: ['True', 'False'], answer: 0, explanation: 'Stricter safety regulations can reduce effective capacity.' },
            { id: 497, chapter: 5, text: 'Cost and competitive priorities reduce effective capacities.', options: ['True', 'False'], answer: 1, explanation: 'Changes in competitive priorities can actually increase effective capacity.' },
            { id: 498, chapter: 5, text: 'Capacity increases are usually acquired in fairly large "chunks" rather than in smooth increments.', options: ['True', 'False'], answer: 0, explanation: 'Hotels and hospitals are among many examples of circumstances in which capacity cannot be added in very small increments.' },
            { id: 499, chapter: 5, text: 'In cost-volume analysis, costs that vary directly with volume of output are referred to as fixed costs because they are a fixed percentage of output levels.', options: ['True', 'False'], answer: 1, explanation: 'Costs that vary directly with volume of output are variable costs.' },
            { id: 500, chapter: 5, text: 'The break-even quantity can be determined by dividing the fixed costs by the difference between the revenue per unit and the variable cost per unit.', options: ['True', 'False'], answer: 0, explanation: 'The difference between the revenue per unit and the variable cost per unit goes toward covering fixed costs.' },
            { id: 501, chapter: 5, text: 'According to the reading on restaurant sourcing practices, only fast-food restaurants are able to \'bring in\' outsourced foods.', options: ['True', 'False'], answer: 1, explanation: 'A wide range of restaurants use outsourced foods.' },
            { id: 502, chapter: 5, text: 'The greater the gap between current and desired capacity the greater the opportunity for profit.', options: ['True', 'False'], answer: 1, explanation: 'A substantial capacity overage reduces the opportunity for profit.' },
            { id: 503, chapter: 5, text: 'The current trend toward global operations has made capacity decisions much easier since we have the whole world in which to consider operations.', options: ['True', 'False'], answer: 1, explanation: 'Global operations increase the complexity of decision-making with regard to capacity.' },
            { id: 504, chapter: 5, text: 'Capacity planning requires an analysis of needs; what kind, how much and when.', options: ['True', 'False'], answer: 0, explanation: 'Type, quantity and timing are essential to capacity decisions.' },
            { id: 505, chapter: 5, text: 'Waiting line analysis can be useful for capacity design, especially for service systems.', options: ['True', 'False'], answer: 0, explanation: 'In service systems waiting lines are symptoms of bottleneck operations.' },
            { id: 506, chapter: 5, text: 'Capacity decisions often involve a long-term commitment of resources which, when implemented, are difficult or impossible to modify without major added costs.', options: ['True', 'False'], answer: 0, explanation: 'The cost to modify capacity decisions, once they\'ve been made, is what makes capacity decisions so consequential.' },
            { id: 507, chapter: 5, text: 'Outsourcing some production is a means of supporting a constraint.', options: ['True', 'False'], answer: 1, explanation: 'Reducing the burden placed on a constraint is an example of overcoming the constraint.' },
            { id: 508, chapter: 5, text: 'Outsourcing some production is a means of _________ a capacity constraint.', options: ['identifying', 'modifying', 'supporting', 'overcoming', 'repeating'], answer: 3, explanation: 'Outsourcing some production reduces the burden placed on the constraint.' },
            { id: 509, chapter: 5, text: 'A basic question in capacity planning is:', options: ['what kind is needed', 'how much is needed', 'when is it needed', 'all of the above', 'none of the above'], answer: 3, explanation: 'Type, quantity and timing are the essential elements of the capacity decision.' },
            { id: 510, chapter: 5, text: 'Which of these factors wouldn\'t be subtracted from design capacity when calculating effective capacity?', options: ['Personal time', 'Maintenance', 'Scrap', 'Operating hours per day', 'All of the above would be subtracted in the calculation'], answer: 3, explanation: 'Effective capacity reflects issues such as required personal time, maintenance issues, scrap and the length of a given workday.' },
            { id: 511, chapter: 5, text: 'A reason for the importance of capacity decisions is that capacity:', options: ['limits the rate of output possible', 'affects operating costs', 'is a major determinant of initial costs', 'is a long-term commitment of resources', 'all of the above'], answer: 4, explanation: 'Capacity is a strategic decision that influences costs and the firm\'s ability to satisfy customers.' },
            { id: 512, chapter: 5, text: 'Which of the following is the case where capacity is measured in terms of inputs?', options: ['Hospital', 'Theater', 'Restaurant', 'All of the above', 'None of the above'], answer: 3, explanation: 'Hospitals, theaters and restaurants measure capacity in terms of customers, which are inputs to service processes.' },
            { id: 513, chapter: 5, text: 'Unbalanced systems are evidenced by …', options: ['Top heavy operations', 'Labor unrest', 'Bottleneck operations', 'Increasing capacities', 'Assembly lines'], answer: 2, explanation: 'Bottleneck operations have capacities that are substantially smaller than non-bottleneck operations.' },
            { id: 514, chapter: 5, text: 'Maximum capacity refers to the upper limit of:', options: ['inventories', 'demand', 'supplies', 'rate of output', 'finances'], answer: 3, explanation: 'Capacity has to do with the rate of output that is possible.' },
            { id: 515, chapter: 5, text: 'The impact that a significant change in capacity will have on a key vendor is a:', options: ['supply chain factor', 'process limiting factor', 'internal factor', 'human resource factor', 'operational process factor'], answer: 0, explanation: 'Vendors and their performance can be critical factors with respect to effective capacity.' },
            { id: 516, chapter: 5, text: 'The maximum possible output given a product mix, scheduling difficulties, quality factors, and so on, is:', options: ['utilization', 'design capacity', 'efficiency', 'effective capacity', 'available capacity'], answer: 3, explanation: 'Effective capacity reflects the realities of the production environment.' },
            { id: 517, chapter: 5, text: 'Efficiency is defined as the ratio of:', options: ['actual output to effective capacity', 'actual output to design capacity', 'design capacity to effective capacity', 'effective capacity to actual output', 'design capacity to actual output'], answer: 0, explanation: 'Efficiency measures the usage of effective capacity.' },
            { id: 518, chapter: 5, text: 'Utilization is defined as the ratio of:', options: ['actual output to effective capacity', 'actual output to design capacity', 'design capacity to effective capacity', 'effective capacity to actual output', 'design capacity to actual output'], answer: 1, explanation: 'Utilization measures the usage of design capacity.' },
            { id: 519, chapter: 5, text: 'Which of the following is a factor that affects service capacity planning?', options: ['The need to be near customers', 'The inability to store services', 'The degree of volatility of demand', 'The customer\'s willingness to wait', 'All of the above'], answer: 4, explanation: 'The capacity question tends to be more customer-focused in service operations.' },
            { id: 520, chapter: 5, text: 'Which of the following is a tactic that helps service capacity management?', options: ['Pricing', 'Promotions', 'Discounts', 'Advertising', 'All of the above'], answer: 4, explanation: 'These tactics help service operations shift demand to create more attractive capacity-demand balances.' },
            { id: 521, chapter: 5, text: 'The ratio of actual output to effective capacity is:', options: ['design capacity', 'effective capacity', 'actual capacity', 'efficiency', 'utilization'], answer: 3, explanation: 'Efficiency measures the usage of effective capacity.' },
            { id: 522, chapter: 5, text: 'The ratio of actual output to design capacity is:', options: ['design capacity', 'effective capacity', 'actual capacity', 'efficiency', 'utilization'], answer: 4, explanation: 'Utilization measures the usage of design capacity.' },
            { id: 523, chapter: 5, text: 'Given the following information, what would efficiency be? Effective capacity = 80 units per day, Design capacity = 100 units per day, Utilization = 48%', options: ['20%', '35%', '48%', '60%', '80%'], answer: 2, explanation: 'If utilization is 48%, then actual output must have been 48 units.' },
            { id: 524, chapter: 5, text: 'Given the following information, what would efficiency be? Effective capacity = 50 units per day, Design capacity = 100 units per day, Actual output = 30 units per day', options: ['40%', '50%', '60%', '80%', '90%'], answer: 2, explanation: 'Efficiency is actual output divided by effective capacity.' },
            { id: 525, chapter: 5, text: 'Given the following information, what would utilization be? Effective capacity = 20 units per day, Design capacity = 60 units per day, Actual output = 15 units per day', options: ['1/4', '1/3', '1/2', '3/4', 'none of these'], answer: 0, explanation: 'Utilization is actual output divided by design capacity.' },
            { id: 526, chapter: 5, text: 'Which of the following is not a strategy to manage service capacity?', options: ['Hiring extra workers', 'Backordering', 'Pricing and promotion', 'Part time workers', 'Subcontracting'], answer: 1, explanation: 'Backordering for services is simply shifting demand to a later period.' },
            { id: 527, chapter: 5, text: 'Which of the following is not a determinant of effective capacity?', options: ['Facilities', 'Product mix', 'Actual output', 'Human factors', 'External factors'], answer: 2, explanation: 'Actual output can be limited by effective capacity.' },
            { id: 528, chapter: 5, text: 'Capacity planning decisions have both long-term and short-term considerations. Which of the following statements are true? (I) Long-term considerations relate to the overall level of capacity. (II) Short-term considerations relate to the probable variations in capacity requirements. (III) Short-term considerations determine the "effective capacity."', options: ['Only one of the three statements is true.', 'I and II', 'II and III', 'I and III', 'All three statements are correct.'], answer: 1, explanation: 'Effective capacity can shift over the long term as the result of a number of factors.' },
            { id: 529, chapter: 5, text: 'Capacity in excess of expected demand that is intended to offset uncertainty is a:', options: ['margin protect', 'line balance', 'capacity cushion', 'timing bubble', 'none of the above'], answer: 2, explanation: 'A capacity cushion reduces short-term imbalances.' },
            { id: 530, chapter: 5, text: 'Short-term considerations in determining capacity requirements include:', options: ['demand trend', 'cyclical demand variations', 'seasonal demand variations', 'mission statements', 'new product development plans'], answer: 2, explanation: 'Trends, cycles and fundamental strategic changes are long-term considerations.' },
            { id: 531, chapter: 5, text: 'Which of the following is not a criterion for developing capacity alternatives?', options: ['Design structured, rigid systems', 'Take a big-picture approach to capacity changes', 'Prepare to deal with capacity in "chunks"', 'Attempt to smooth out capacity requirements', 'Identify the optimal operating level'], answer: 0, explanation: 'The long-term nature of capacity decisions calls for flexibility, not rigidity.' },
            { id: 532, chapter: 5, text: 'Seasonal variations are often easier to deal with in capacity planning than random variations because seasonal variations tend to be:', options: ['smaller', 'larger', 'predictable', 'controllable', 'less frequent'], answer: 2, explanation: 'When variation is predictable, it can be managed.' },
            { id: 533, chapter: 5, text: 'Production units have an optimal rate of output where:', options: ['total costs are minimum', 'average unit costs are minimum', 'marginal costs are minimum', 'rate of output is maximum', 'total revenue is maximum'], answer: 1, explanation: 'Average unit costs reflect both fixed and variable costs.' },
            { id: 534, chapter: 5, text: 'When the output is less than the optimal rate of output, the average unit cost will be:', options: ['lower', 'the same', 'higher', 'either higher or lower', 'either higher, lower or the same'], answer: 2, explanation: 'At too low a volume, fixed costs are too burdensome.' },
            { id: 535, chapter: 5, text: 'When buying component parts, risk does not include:', options: ['loss of control', 'vendor viability', 'interest rate fluctuations', 'need to disclose proprietary information', 'all are risk factors'], answer: 2, explanation: 'Buying component parts is a short-term activity.' },
            { id: 536, chapter: 5, text: 'At the break-even point:', options: ['output equals capacity', 'total cost equals total revenue', 'total cost equals profit', 'variable cost equals fixed cost', 'variable cost equals total revenue'], answer: 1, explanation: 'At the break-even point, total profit (total revenue minus total cost) is zero.' },
            { id: 537, chapter: 5, text: 'What is the break-even quantity for the following situation? FC = $1,200 per week, VC = $2 per unit, Rev = $6 per unit', options: ['100', '200', '600', '1,200', '300'], answer: 4, explanation: 'A volume of 300 units leads to $1,200 in margin to offset fixed costs.' },
            { id: 538, chapter: 5, text: 'An alternative will have fixed costs of $10,000 per month, variable costs of $50 per unit, and revenue of $70 per unit. The break-even point volume is:', options: ['100', '2,000', '500', '1,000', 'none of these'], answer: 2, explanation: 'A volume of 500 units leads to $10,000 in margin to offset fixed costs.' },
            { id: 539, chapter: 5, text: 'For fixed costs of $2,000, revenue per unit of $2, and variable cost per unit of $1.60, the break-even quantity is:', options: ['1,000', '1,250', '2,250', '5,000', 'none of these'], answer: 3, explanation: 'Dividing the fixed costs of $2,000 by the per-unit contribution margin of $0.40 leads to a break-even quantity of 5,000 units.' },
            { id: 540, chapter: 5, text: 'Which of the following are assumptions of the break-even model? I. Only one product is involved. II. Everything that is produced can be sold. III. The revenue per unit will be the same regardless of volume.', options: ['I only', 'I and II only', 'II only', 'II and III only', 'I, II and III'], answer: 4, explanation: 'If all three assumptions are not met, the break-even model is invalid.' },
            { id: 541, chapter: 5, text: 'If the output rate is increased but the average unit costs also increase we are experiencing:', options: ['market share erosion', 'economies of scale', 'diseconomies of scale', 'value added accounting', 'step-function scale up'], answer: 2, explanation: 'Diseconomies of scale involve producing above the optimal production rate.' },
            { id: 542, chapter: 5, text: 'The method of financial analysis which focuses on the length of time it takes to recover the initial cost of an investment is:', options: ['payback', 'net present value', 'internal rate of return', 'queuing', 'cost-volume'], answer: 0, explanation: 'The payback period does not take into account the time value of money.' },
            { id: 543, chapter: 5, text: 'When determining the timing and degree of capacity change, one can use the approach of:', options: ['lead time flexibility strategy', 'expand early strategy', 'wait-and-see strategy', 'backordering', 'delayed differentiation'], answer: 2, explanation: 'The wait-and-see strategy is simply a decision to delay making a decision.' },
            { id: 544, chapter: 5, text: 'The method of financial analysis which results in an equivalent interest rate is:', options: ['payback', 'net present value', 'internal rate of return', 'queuing', 'cost-volume'], answer: 2, explanation: 'The internal rate of return is the discount rate that would make a cash flow stream\'s net present value be equal to zero.' },
            { id: 545, chapter: 5, text: 'The efficiency of a productive unit is 60%. The unit produces an average of 20 forklift trucks per day. Determine the effective capacity of the unit.', options: ['33 units', '34 units', '35 units', '36 units', '37 units'], answer: 0, explanation: 'Divide the output by 0.60 to find the effective capacity.' },
            { id: 546, chapter: 5, text: 'The utilization of a machine is 50%. The machine has a design capacity of 70 units per hour and an effective capacity of 60 units per hour. Find the efficiency of the machine.', options: ['58.3%', '59.3%', '60.3%', '61.3%', '62.3%'], answer: 0, explanation: 'First solve for actual output by multiplying the design capacity (70 per hour) by 0.5. Then, divide the actual output (35 per hour) by effective capacity (60 per hour) to find efficiency.' },

            // === CHƯƠNG 5S: 140 câu ===
            { id: 547, chapter: '5s', text: 'Decision trees, with their predetermined analysis of a situation, are really not useful in making health care decisions since every person is unique.', options: ['True', 'False'], answer: 1, explanation: 'Decision tree analyses can be adjusted to reflect the uniqueness of patients.' },
            { id: 548, chapter: '5s', text: 'Bounded rationality refers to the limits imposed on decision-making because of costs, human abilities, time, technology, and/or availability of information.', options: ['True', 'False'], answer: 0, explanation: 'Bounded rationality can be a cause of poor decision-making.' },
            { id: 549, chapter: '5s', text: 'In reaching a decision, the alternative with the lowest cost should be ranked #1.', options: ['True', 'False'], answer: 1, explanation: 'The lowest cost option might not be the most profitable.' },
            { id: 550, chapter: '5s', text: 'The expected monetary value approach is most appropriate when the decision-maker is risk-neutral.', options: ['True', 'False'], answer: 0, explanation: 'Risk-averse decision-makers might ultimately not choose the option with the highest expected value.' },
            { id: 551, chapter: '5s', text: 'The value of perfect information is inversely related to losses predicted.', options: ['True', 'False'], answer: 1, explanation: 'The value of perfect information increases as the decision-making scenario becomes more risky.' },
            { id: 552, chapter: '5s', text: 'Expected monetary value gives the long-run average payoff if a large number of identical decisions could be made.', options: ['True', 'False'], answer: 0, explanation: 'Use of this approach assumes a large number of iterations of the decision-making game.' },
            { id: 553, chapter: '5s', text: 'Among decision environments, risk implies that certain parameters have probabilistic outcomes.', options: ['True', 'False'], answer: 0, explanation: 'Decision-making under risk assumes that the environments\' likelihood is either known or can be estimated.' },
            { id: 554, chapter: '5s', text: 'Among decision environments, uncertainty implies that states of nature have wide ranging probabilities associated with them.', options: ['True', 'False'], answer: 1, explanation: 'No probabilities are associated with states of nature in decision-making under uncertainty.' },
            { id: 555, chapter: '5s', text: 'In decision theory, states of nature refer to possible future conditions.', options: ['True', 'False'], answer: 0, explanation: 'Possible future conditions are called states of nature.' },
            { id: 556, chapter: '5s', text: 'The maximin approach involves choosing the alternative with the highest payoff.', options: ['True', 'False'], answer: 1, explanation: 'Maximin involves choosing the option whose lowest payout is highest.' },
            { id: 557, chapter: '5s', text: 'The maximin approach involves choosing the alternative that has the "best worst" payoff.', options: ['True', 'False'], answer: 0, explanation: 'Maximin chooses the most attractive worst-case scenario.' },
            { id: 558, chapter: '5s', text: 'The Laplace criterion treats states of nature as being equally likely.', options: ['True', 'False'], answer: 0, explanation: 'The option with the highest average payoff is chosen under Laplace.' },
            { id: 559, chapter: '5s', text: 'The maximax approach is a pessimistic strategy.', options: ['True', 'False'], answer: 1, explanation: 'Maximax is optimistic.' },
            { id: 560, chapter: '5s', text: 'A weakness of the maximin approach is that it loses some information.', options: ['True', 'False'], answer: 0, explanation: 'Maximin ignores the best-case scenarios of each decision option.' },
            { id: 561, chapter: '5s', text: 'The expected value approach applies to decision-making under uncertainty.', options: ['True', 'False'], answer: 1, explanation: 'Expected value approaches are used under risk.' },
            { id: 562, chapter: '5s', text: 'The expected value approach is used for decision-making under risk.', options: ['True', 'False'], answer: 0, explanation: 'Expected value is only workable if the probabilities of states of nature are known.' },
            { id: 563, chapter: '5s', text: 'The EVPI indicates an upper limit on the amount a decision-maker should be willing to spend to obtain additional information.', options: ['True', 'False'], answer: 0, explanation: 'It quantifies the marginal value of additional information.' },
            { id: 564, chapter: '5s', text: 'Graphical sensitivity analysis is limited to cases with no more than two alternatives.', options: ['True', 'False'], answer: 1, explanation: 'Graphical sensitivity analysis can accommodate more than two alternatives.' },
            { id: 565, chapter: '5s', text: 'Graphical sensitivity analysis is used for decision-making under risk.', options: ['True', 'False'], answer: 0, explanation: 'Options are plotted relative to the likelihood of one state of nature or another.' },
            { id: 566, chapter: '5s', text: 'An advantage of decision trees compared to payoff tables is that they permit us to analyze situations involving sequential decisions.', options: ['True', 'False'], answer: 0, explanation: 'Payoff tables aren\'t practical when the decision scenario is sequential.' },
            { id: 567, chapter: '5s', text: 'The term sub-optimization is best described as the:', options: ['result of individual departments making the best decisions for their own areas', 'limitations on decision-making caused by costs and time', 'result of failure to adhere to the steps in the decision process', 'result of ignoring symptoms of the problem', 'none of the above'], answer: 0, explanation: 'Sometimes the best decisions for individual departments do not lead to the best decision overall.' },
            { id: 568, chapter: '5s', text: 'Which phrase best describes the term bounded rationality?', options: ['thinking a problem through clearly before acting', 'taking care not to exhaust limited resources', 'the result of departmentalized decision making', 'limits imposed on decision making by costs, time, and technology', 'the use of extremely structured steps in the decision making process'], answer: 3, explanation: 'Bounded rationality reflects the fact that there are limits to how much information can be incorporated in the decision making process.' },
            { id: 569, chapter: '5s', text: 'Testing how a problem solution reacts to changes in one or more of the model parameters is called:', options: ['simulation', 'sensitivity analysis', 'priority recognition', 'analysis of variance', 'decision analysis'], answer: 1, explanation: 'Sensitivity analysis evaluates how sensitive the decision is to changes in one or more parameters.' },
            { id: 570, chapter: '5s', text: 'Sensitivity analysis is required because _______.', options: ['payoffs and probabilities are estimates', 'most decision will affect employees', 'expected payoffs are sensitive to the time value of money', 'it\'s the second step in the decision model', 'with the passage of time, small decisions get bigger'], answer: 0, explanation: 'Because the solution can be based on estimated values, sensitivity analysis allows for the evaluation of these estimates.' },
            { id: 571, chapter: '5s', text: 'A tabular presentation that shows the outcome for each decision alternative under the various possible states of nature is called a/an:', options: ['payoff table', 'feasible region', 'LaPlace table', 'decision tree', 'payback period matrix'], answer: 0, explanation: 'The payoff table summarizes the decision-making scenario.' },
            { id: 572, chapter: '5s', text: 'Which of the following characterizes decision-making under uncertainty?', options: ['Decision-makers must rely on probabilities in assessing outcomes.', 'The likelihood of possible future events is unknown.', 'Relevant parameters have known values.', 'Certain parameters have probabilistic outcomes.', 'none of the above'], answer: 1, explanation: 'Uncertainty means likelihoods are unknown and cannot be reasonably estimated.' },
            { id: 573, chapter: '5s', text: 'Which of the following is not an approach for decision-making under uncertainty?', options: ['decision trees', 'maximin', 'maximax', 'minimax regret', 'Laplace'], answer: 0, explanation: 'Decision trees are for decision-making under risk.' },
            { id: 574, chapter: '5s', text: 'Determining the worst payoff for each alternative and choosing the alternative with the "best worst" is the approach called:', options: ['minimin', 'maximin', 'maximax', 'minimax regret', 'Laplace'], answer: 1, explanation: 'Maximin seeks out the most attractive worst case scenario.' },
            { id: 575, chapter: '5s', text: 'Determining the average payoff for each alternative and choosing the alternative with the highest average is the approach called:', options: ['minimin', 'maximin', 'maximax', 'minimax regret', 'Laplace'], answer: 4, explanation: 'Laplace assumes that all states of nature are equally likely.' },
            { id: 576, chapter: '5s', text: 'The maximin approach to decision-making refers to:', options: ['minimizing the maximum return', 'maximizing the minimum return', 'maximizing the minimum expected value', 'choosing the alternative with the highest payoff', 'choosing the alternative with the minimum payoff'], answer: 1, explanation: 'Maximin seeks out the most attractive worst case scenario.' },
            { id: 577, chapter: '5s', text: 'Which one of these is not used in decision-making under risk?', options: ['EVPI', 'EMV', 'decision trees', 'minimax regret', 'All are used for risk situations.'], answer: 3, explanation: 'Minimax regret is for decision-making under uncertainty.' },
            { id: 578, chapter: '5s', text: 'The term opportunity loss or regret is most closely associated with:', options: ['minimax regret', 'maximax', 'maximin', 'expected monetary value', 'Laplace'], answer: 0, explanation: 'It involves comparing what actually happened with what could have happened.' },
            { id: 579, chapter: '5s', text: 'The expected monetary value criterion (EMV) is the decision-making approach used with the decision environment of:', options: ['certainty', 'risk', 'uncertainty', 'all of the above', 'none of the above'], answer: 1, explanation: 'Decisions are compared on the basis of EMV under risk.' },
            { id: 580, chapter: '5s', text: 'A decision tree is:', options: ['an algebraic representation of alternatives', 'a behavioral representation of alternatives', 'a matrix representation of alternatives', 'a schematic representation of alternatives', 'limited to a maximum of 12 branches'], answer: 3, explanation: 'It plots out possible sequences of decision-making.' },
            { id: 581, chapter: '5s', text: 'The difference between expected payoff under certainty and expected payoff under risk is the expected:', options: ['monetary value', 'value of perfect information', 'net present value', 'rate of return', 'profit'], answer: 1, explanation: 'When there is no risk, the decision-making has perfect information.' },
            { id: 582, chapter: '5s', text: 'If the minimum expected regret is computed, it indicates to a decision-maker the expected:', options: ['value of perfect information', 'payoff under certainty', 'monetary value', 'payoff under risk', 'none of the above'], answer: 0, explanation: 'With perfect information, expected regret is minimized.' },
            { id: 583, chapter: '5s', text: 'The term sensitivity analysis is most closely associated with:', options: ['maximax', 'maximin', 'decision-making under risk', 'minimax regret', 'Laplace criterion'], answer: 2, explanation: 'Sensitivity analysis can involve checking the attractiveness of a decision if state of nature likelihoods vary from what is estimated.' },

            // === CHƯƠNG 6: 159 câu ===
            { id: 584, chapter: 6, text: 'Continuous processing is the best way to produce customized output.', options: ['True', 'False'], answer: 1, explanation: 'Continuous processing is best for standardized output.' },
            { id: 585, chapter: 6, text: 'As a general rule, continuous processing systems produce products for inventory rather than for customer order.', options: ['True', 'False'], answer: 0, explanation: 'Continuous processing systems tend to be used in make-to-stock scenarios.' },
            { id: 586, chapter: 6, text: 'A Job-Shop processing system generally requires less skilled workers than a continuous processing system.', options: ['True', 'False'], answer: 1, explanation: 'Job shops require greater skill on the part of their workers.' },
            { id: 587, chapter: 6, text: 'Avoiding bottlenecks is the primary goal of product design.', options: ['True', 'False'], answer: 1, explanation: 'Avoiding bottlenecks is a primary consideration in facilities layout.' },
            { id: 588, chapter: 6, text: 'In general, Job-Shop systems have a lower unit cost than continuous systems do because continuous systems use costly specialized equipment.', options: ['True', 'False'], answer: 1, explanation: 'Specialized equipment can lead to lower unit cost.' },
            { id: 589, chapter: 6, text: 'A robot consists of three parts: a power supply, a controller, and a mechanical arm.', options: ['True', 'False'], answer: 0, explanation: 'Robots consist of a few broad components.' },
            { id: 590, chapter: 6, text: 'Continuous production has been a significant factor underpinning the U.S. standard of living over the last century.', options: ['True', 'False'], answer: 0, explanation: 'Continuous production has led to substantial productivity gains.' },
            { id: 591, chapter: 6, text: 'Right-sized equipment tends to be larger than equipment used in traditional process layout.', options: ['True', 'False'], answer: 1, explanation: 'Right-sizing can lead to smaller equipment.' },
            { id: 592, chapter: 6, text: 'Intermittent processing can take the form of batch processing or a job shop.', options: ['True', 'False'], answer: 0, explanation: 'A job shop is a batch processer with a standard batch size of one.' },
            { id: 593, chapter: 6, text: 'The term computer aided manufacturing (CAM) refers primarily to the use of robotics in process control.', options: ['True', 'False'], answer: 1, explanation: 'CAM involves using computer technology to control various facets of the manufacturing process.' },
            { id: 594, chapter: 6, text: 'Flexible manufacturing systems (FMS) bring the benefits of automation to continuous processes.', options: ['True', 'False'], answer: 1, explanation: 'FMS can bring the benefits of flexibility to continuous processes.' },
            { id: 595, chapter: 6, text: 'Repetitive processing systems usually produce goods specifically for customer orders rather than for inventory.', options: ['True', 'False'], answer: 1, explanation: 'Repetitive processing systems usually produce goods for inventory.' },
            { id: 596, chapter: 6, text: 'Morale problems can be a reason for redesign of a facility layout.', options: ['True', 'False'], answer: 0, explanation: 'A layout redesign can lead to improved morale.' },
            { id: 597, chapter: 6, text: 'There are three basic process types - Input, Processing and Output.', options: ['True', 'False'], answer: 1, explanation: 'There are five basic process types: job shop, batch, repetitive, continuous and project.' },
            { id: 598, chapter: 6, text: 'A cafeteria line would be an example of a process focused layout.', options: ['True', 'False'], answer: 1, explanation: 'This would be an example of a product focused layout.' },
            { id: 599, chapter: 6, text: 'A possible disadvantage of a product layout is an inflexible system.', options: ['True', 'False'], answer: 0, explanation: 'Product layouts are inherently inflexible.' },
            { id: 600, chapter: 6, text: 'Product layouts involve high utilization of labor and equipment.', options: ['True', 'False'], answer: 0, explanation: 'They\'re used in high volume, standardized operations.' },
