            { id: 839, chapter: '7s', text: 'A manager wants to analyze the learning curve associated with producing one of his company\'s products. Approximately how long will it take to produce the tenth unit?', options: ['1 hour', '2 hours', '3 hours', '4 hours', '5 hours'], answer: 3, explanation: 'Multiply the time required for the first unit by .477.' },
            { id: 840, chapter: '7s', text: 'A manager wants to analyze the learning curve associated with producing one of his company\'s products. Approximately how long will it take to produce the fifth through tenth units?', options: ['15 hours', '16 hours', '18 hours', '20 hours', '21 hours'], answer: 0, explanation: 'Multiply the time required for the first units by the appropriate factors, then sum these products.' },
            { id: 841, chapter: '7s', text: 'In which of the following scenarios would an 80% learning curve be especially relevant?', options: ['the pursuit of an innovation strategy to stay ahead of competitors', 'the pursuit of a flexibility-based strategy to increase customer satisfaction', 'the pursuit of a customization-based strategy to command premium prices', 'the pursuit of a time-based strategy to gain market share', 'the pursuit of a quality-based strategy to gain customer loyalty'], answer: 3, explanation: 'Gaining market share would enable the firm to exploit its learning curve to the fullest.' },
            { id: 842, chapter: '7s', text: 'To which of the following challenges are learning curves important considerations?', options: ['capacity planning', 'product designs', 'process layouts', 'output-based compensation', 'demand forecasting'], answer: 0, explanation: 'Capacity planners need to factor in learning curves to ensure they don\'t add on too much capacity.' },
            { id: 843, chapter: '7s', text: 'Which of the following is an example of a carryover effect?', options: ['capacity that was used on older products but that can be used on new products', 'previous experience that is relevant to the current scenario', 'existing products that are still in the maturity phase of their life cycle', 'forecasting errors from previous product lines', 'old supplier contracts that must still be honored'], answer: 1, explanation: 'If there is prior experience that is relevant, the learning curve might be shallower than is anticipated.' },
            { id: 844, chapter: '7s', text: 'When are learning curves most relevant to managerial decision making in mass production settings?', options: ['late in product life-cycles', 'in the maturity phase', 'in the decline phase', 'before processes are stabilized', 'never'], answer: 3, explanation: 'Even in mass production learning curves can be relevant before processes are stabilized.' },
            { id: 845, chapter: '7s', text: 'Suppose the first unit required 800 hours and the second unit required only 680. Which of the following times for the fourth unit would be consistent with a true learning curve scenario?', options: ['492', '587', '578', '603', '583'], answer: 2, explanation: 'A fourth-unit requirement of 578 hours is consistent with the reduction experienced from the first to the second unit.' },

            // === CHƯƠNG 8: 86 câu ===
            { id: 846, chapter: 8, text: 'Location decisions are basically one-time decisions usually made by new organizations.', options: ['True', 'False'], answer: 1, explanation: 'Most organizations face location decisions over time.' },
            { id: 847, chapter: 8, text: 'The fact that most types of firms are located in every section of the country suggests that in many cases, location decisions are not overly important; one location typically is as good as another.', options: ['True', 'False'], answer: 1, explanation: 'Many factors make locations relatively more or less attractive.' },
            { id: 848, chapter: 8, text: 'You can\'t make a mistake by locating where labor costs are low.', options: ['True', 'False'], answer: 1, explanation: 'Labor costs are only occasionally a primary consideration in location decisions.' },
            { id: 849, chapter: 8, text: 'Advanced communications has aided globalization.', options: ['True', 'False'], answer: 0, explanation: 'Globalization has been helped along by advances in communication technology.' },
            { id: 850, chapter: 8, text: 'The first step in developing location alternatives is identifying important factors.', options: ['True', 'False'], answer: 1, explanation: 'The first step is deciding on the criteria for evaluating the alternatives.' },
            { id: 851, chapter: 8, text: 'An example of a regional factor in location planning is the location of our markets (either existing or potential).', options: ['True', 'False'], answer: 0, explanation: 'Market location is a regional factor.' },
            { id: 852, chapter: 8, text: 'A strategy that emphasizes convenience for the customers would probably select a single very large facility.', options: ['True', 'False'], answer: 1, explanation: 'Convenience for customers would tend to necessitate small, dispersed facilities.' },
            { id: 853, chapter: 8, text: 'For service organizations, the dominant factors in location analysis usually are market-related.', options: ['True', 'False'], answer: 0, explanation: 'Market considerations are dominant in service location decisions.' },
            { id: 854, chapter: 8, text: 'Global Positioning Systems (GPS) use the Center of Gravity method to establish starting grid co-ordinates.', options: ['True', 'False'], answer: 1, explanation: 'GPS uses satellite transmissions for its grid coordinates.' },
            { id: 855, chapter: 8, text: 'Labor laws are an important site-related factor.', options: ['True', 'False'], answer: 1, explanation: 'Labor laws are country- or region-related factors.' },
            { id: 856, chapter: 8, text: 'Web-based, retail businesses should be located near the customer to reduce their long distance phone charges.', options: ['True', 'False'], answer: 1, explanation: 'Centralized locations are appropriate for web-based retail businesses.' },
            { id: 857, chapter: 8, text: 'For service and retail stores, a prime factor in location analysis is customer access.', options: ['True', 'False'], answer: 0, explanation: 'Customer access is a critical consideration in services and retailing.' },
            { id: 858, chapter: 8, text: 'Retail businesses generally prefer locations that are not near other retailers, as this reduces their competition.', options: ['True', 'False'], answer: 1, explanation: 'Retailers prefer to locate near customers, which means they often locate near one another.' },
            { id: 859, chapter: 8, text: 'Technology has made communication with global operations as easy as local communication.', options: ['True', 'False'], answer: 1, explanation: 'While technology has made some facets of global operations easier, other facets are still difficult.' },
            { id: 860, chapter: 8, text: 'Factor rating is limited to quantitative information concerning location decisions.', options: ['True', 'False'], answer: 1, explanation: 'Qualitative considerations can be brought into factor rating approaches.' },
            { id: 861, chapter: 8, text: 'As a result of the factor rating analysis, a manager may sometimes reject all of the alternatives under consideration when the composite scores are below the minimum threshold value.', options: ['True', 'False'], answer: 0, explanation: 'If a minimum score is necessary, no alternative may be suitable.' },
            { id: 862, chapter: 8, text: 'The lower cost of foreign labor is often offset by lower levels of productivity.', options: ['True', 'False'], answer: 0, explanation: 'Foreign labor often is cheaper but less productive than domestic labor.' },
            { id: 863, chapter: 8, text: 'The center of gravity method is a location planning technique that determines a composite score from weighted factor evaluation.', options: ['True', 'False'], answer: 1, explanation: 'Factor scoring determines a composite score from weighted factor evaluation.' },
            { id: 864, chapter: 8, text: 'The center of gravity method is useful in location planning for the location of a distribution center.', options: ['True', 'False'], answer: 0, explanation: 'It optimizes the location for a distribution center.' },
            { id: 865, chapter: 8, text: 'The center of gravity method of location planning is accurate only when the quantities to be shipped to each location are equal.', options: ['True', 'False'], answer: 1, explanation: 'Center of gravity approaches factor in differences in quantities being shipped.' },
            { id: 866, chapter: 8, text: 'Location decisions are closely tied to an organization\'s strategies.', options: ['True', 'False'], answer: 0, explanation: 'An organization\'s strategy should inform location decisions.' },
            { id: 867, chapter: 8, text: 'A "micro-factory" is a small, automated facility with a narrow product focus located near major markets.', options: ['True', 'False'], answer: 0, explanation: 'Micro-factories serve narrow slices of a market very efficiently.' },
            { id: 868, chapter: 8, text: 'One of the reasons for the importance of location decisions is its strategic importance to the supply chains.', options: ['True', 'False'], answer: 0, explanation: 'A firm\'s supply chain performance is strongly affected by location decisions.' },
            { id: 869, chapter: 8, text: 'Nearness to raw materials would be most important to a …', options: ['grocery store', 'tax preparation service', 'manufacturing company', 'post office', 'hospital'], answer: 2, explanation: 'Manufacturers especially value proximity to raw materials.' },
            { id: 870, chapter: 8, text: 'A one-hour photo processing machine in a Wal-Mart store is an example of a _________.', options: ['micro-factory', 'downsize strategy', 'diversified strategy', 'lean production system', 'falling price strategy'], answer: 0, explanation: 'A micro-factory is a very efficient means of serving a small slice of a broad market.' },
            { id: 871, chapter: 8, text: 'Which statement best characterizes a typical search for location alternatives?', options: ['identify the best location choice', 'minimize cost consequences', 'maximize associated profits', 'locate near markets', 'identify acceptable locations'], answer: 4, explanation: 'Finding alternatives requires that we find which alternatives might be suitable and which might not.' },
            { id: 872, chapter: 8, text: 'Which of the following is not a location option that management can consider in location planning?', options: ['expand an existing facility', 'add a new location', 'relocate from one location to another', 'do nothing', 'All are possible options.'], answer: 4, explanation: 'All of these should or might be considered.' },
            { id: 873, chapter: 8, text: 'Which of the following is the last step in the procedure for making location decisions?', options: ['determine the evaluation criteria', 'identify important factors', 'develop location alternatives', 'evaluate alternatives and make a selection', 'request input regarding alternatives'], answer: 3, explanation: 'When all alternatives have been evaluated it is time to make a decision.' },
            { id: 874, chapter: 8, text: 'When a location evaluation includes both quantitative and qualitative inputs, a technique that can be used is ___________.', options: ['Linear programming', 'Consumer surveys', 'Factor rating', 'Transportation models', 'Center of gravity methods'], answer: 2, explanation: 'Factor rating approaches can incorporate both quantitative and qualitative considerations.' },
            { id: 875, chapter: 8, text: 'The center of gravity method is used to _______ travel time, distance and costs.', options: ['Normalize', 'Eliminate', 'Average', 'Minimize', 'Document'], answer: 3, explanation: 'The center of gravity method minimizes travel time, distance and costs.' },
            { id: 876, chapter: 8, text: 'In location planning, the location of raw materials, the location of markets, and labor factors are:', options: ['regional factors', 'community factors', 'site-related factors', 'national factors', 'minor considerations'], answer: 0, explanation: 'These are regional factors.' },
            { id: 877, chapter: 8, text: 'Software systems known as GIS help in location analysis. The initials GIS stand for _______.', options: ['Graphic Interface Systems', 'Global Integrated Software', 'Graded Information Systems', 'Geo Intensive Software', 'Geographical Information System'], answer: 4, explanation: 'GIS stands for Geographical Information System.' },
            { id: 878, chapter: 8, text: 'Facilities, personnel and operations that are located around the world are called:', options: ['non-domestic', 'diversified operations', 'globalization', 'worldwide presence', 'virtual organization'], answer: 2, explanation: 'Globalization involves facilities, personnel and operations that are located around the world.' },
            { id: 879, chapter: 8, text: 'Some communities offer financial and other incentives to ______ new businesses.', options: ['Tax', 'Attract', 'Marginalize', 'Incorporate', 'Zone'], answer: 1, explanation: 'Businesses often weigh such incentives in their location decision processes.' },
            { id: 880, chapter: 8, text: 'Location options don\'t usually include:', options: ['expansion', 'a contract', 'adding new facilities', 'moving', 'doing nothing'], answer: 1, explanation: 'A contract has little to do with location options.' },
            { id: 881, chapter: 8, text: 'Cultural differences, Customer preferences, Labor and Resources are factors relating to:', options: ['Regional choices', 'Site selection', 'Zoning', 'Product design', 'Foreign locations'], answer: 4, explanation: 'Foreign locations concerns with respect to these issues.' },
            { id: 882, chapter: 8, text: 'The method for evaluating location alternatives which uses their total cost curves is:', options: ['cost-volume analysis', 'transportation model analysis', 'factor rating analysis', 'linear regression analysis', 'MODI analysis'], answer: 0, explanation: 'Cost-volume analysis is based on total cost curves.' },
            { id: 883, chapter: 8, text: 'The method for evaluating location alternatives which minimizes shipping costs between multiple sending and receiving locations is:', options: ['cost-volume analysis', 'transportation model analysis', 'factor rating analysis', 'linear regression analysis', 'MODI analysis'], answer: 1, explanation: 'Transportation model analysis minimizes shipping costs between multiple sending and receiving locations.' },
            { id: 884, chapter: 8, text: 'The method for evaluating location alternatives which uses their composite (weighted-average) scores is:', options: ['cost-volume analysis', 'transportation model analysis', 'factor rating analysis', 'linear regression analysis', 'MODI analysis'], answer: 2, explanation: 'Factor rating analysis evaluates by using their composite (weighted-average) scores.' },
            { id: 885, chapter: 8, text: 'An approach to location analysis that can include both qualitative and quantitative considerations is:', options: ['location cost-volume', 'factor rating', 'transportation model', 'expected value (net present value)', 'financial analysis'], answer: 1, explanation: 'Factor rating can include both qualitative and quantitative considerations.' },
            { id: 886, chapter: 8, text: 'A location analysis has been narrowed down to two locations, Akron and Boston. The main factors in the decision will be the supply of raw materials, which has a weight of .50, transportation cost, which has a weight of .40, and labor cost, which has a weight of .10. The scores for raw materials, transportation, and labor are for Akron 60, 80, and 70, respectively; for Boston 70, 50, and 90, respectively. Given this information and a minimum acceptable composite score of 75, we can say that the manager should:', options: ['be indifferent between these locations', 'choose Akron', 'choose Boston', 'reject both locations', 'build a plant in both cities'], answer: 3, explanation: 'Neither location has the minimum acceptable score.' },
            { id: 887, chapter: 8, text: 'A manager must decide between two location alternatives, Boston and Chicago. Boston would have annual fixed costs of $70,000, transportation costs of $60 per unit, and labor and material costs of $200 per unit. Chicago would have annual fixed costs of $90,000, transportation costs of $40 per unit, and labor and material costs of $170 per unit. Revenue will be $300 per unit. (A) Which alternative would yield the higher profit for an annual demand of 3,000 units? (B) Would the two locations yield the same profit at a certain volume? If so, at what volume would that be?', options: ['(A) Boston; (B) 400 units', '(A) Chicago; (B) 400 units', '(A) Boston; (B) 500 units', '(A) Chicago; (B) 500 units', '(A) Boston; (B) 300 units'], answer: 1, explanation: 'At a volume of 3,000 units, Boston\'s profit would be $50,000 and Chicago\'s profit would be $180,000. At an annual volume of 400 units, both locations would have identical losses of $54,000.' },
            { id: 888, chapter: 8, text: 'A firm is trying to decide between two location alternatives, Albany and Baltimore. Albany would result in annual fixed costs of $60,000, labor costs of $7 per unit, material costs of $10 per unit, transportation costs of $15 per unit, and revenue per unit of $50. Baltimore would have annual fixed costs of $80,000, labor costs of $6 per unit, material costs of $9 per unit, transportation costs of $14 per unit, and revenue per unit of $48. (A) At an annual volume of 9,000, which would yield the higher profit? (B) At what annual volume would management be indifferent between the two alternatives in terms of annual profits?', options: ['(A) Albany; (B) 20,000 units', '(A) Baltimore; (B) 20,000 units', '(A) Albany; (B) 15,000 units', '(A) Baltimore; (B) 15,000 units', '(A) Albany; (B) 25,000 units'], answer: 0, explanation: 'At an annual volume of 9,000, Albany\'s profit of $102,000 is higher than Baltimore\'s profit of $91,000. Profits for these two locations are identical at an annual volume of 20,000 units.' },
            { id: 889, chapter: 8, text: 'The Skulls, a student social organization, has two different locations under consideration for constructing a new chapter house. What would be total annual costs for the Alpha Ave. location with twenty persons living there?', options: ['$5,400', '$4,000', '$5,000', '$7,000', '$9,000'], answer: 0, explanation: 'Multiply the variable cost by the volume, then add that product to the fixed cost.' },
            { id: 890, chapter: 8, text: 'The Skulls, a student social organization, has two different locations under consideration for constructing a new chapter house. What would be total annual costs for either location at the point of indifference?', options: ['$13,000', '$13,350', '$9,000', '$17,000', '$19,200'], answer: 1, explanation: 'Divide the difference in fixed cost by the differed in variable cost. This leads to the point of indifference.' },
            { id: 891, chapter: 8, text: 'The Skulls, a student social organization, has two different locations under consideration for constructing a new chapter house. If it is estimated that thirty persons will be living in this new chapter house, which location should the Skulls select?', options: ['Alpha Ave.', 'Beta Blvd.', 'either Alpha Ave. or Beta Blvd.', 'reject both Alpha Ave. nor Beta Blvd.', 'become a virtual organization'], answer: 0, explanation: 'Multiply the variable cost by the volume, then add that product to the fixed cost.' },
            { id: 892, chapter: 8, text: 'The Skulls, a student social organization, has two different locations under consideration for constructing a new chapter house. If it is estimated that thirty persons will be living in this new chapter house, what would be the Skull\'s annual cost savings by selecting the less costly location, rather than the more costly?', options: ['$0', '$1,500', '$200', '$150', '$350'], answer: 0, explanation: 'Compare total costs to arrive at this answer.' },

            // === CHƯƠNG 8S: 22 câu ===
            { id: 893, chapter: '8s', text: 'The transportation model assumes similar, homogeneous goods.', options: ['True', 'False'], answer: 0, explanation: 'Goods are treated as interchangeable.' },
            { id: 894, chapter: '8s', text: 'The transportation model assumes shipping cost per unit is the same regardless of the number of units shipped (there are no quantity discounts).', options: ['True', 'False'], answer: 0, explanation: 'Shipping costs are assumed to be constant.' },
            { id: 895, chapter: '8s', text: 'The transportation model is a special type of linear regression model.', options: ['True', 'False'], answer: 1, explanation: 'It\'s a special type of linear programming model.' },
            { id: 896, chapter: '8s', text: 'For a transportation model to be used, more than one location must be considered.', options: ['True', 'False'], answer: 0, explanation: 'If there\'s only one location, no decision is necessary.' },
            { id: 897, chapter: '8s', text: 'The linear programming model of a transportation problem has one goal - the maximization of its objective function.', options: ['True', 'False'], answer: 1, explanation: 'Typically it\'s the minimization of the objective function.' },
            { id: 898, chapter: '8s', text: 'Dummy rows or columns to equate supply and demand are available but not required in linear programming models of transportation problems.', options: ['True', 'False'], answer: 0, explanation: 'Dummy rows or columns are only needed if supply and demand are not equal.' },
            { id: 899, chapter: '8s', text: 'The transportation model method for evaluating location alternatives minimizes total:', options: ['sources', 'destinations', 'capacity', 'demand', 'shipping cost'], answer: 4, explanation: 'The goal is to minimize shipping costs.' },
            { id: 900, chapter: '8s', text: 'An automobile manufacturer that has eight assembly plants and thousands of dealers throughout the United States can find the optimal distribution plan by using:', options: ['linear programming model', 'transportation model', 'weighted factor rating', 'either A or B', 'Global Information Systems'], answer: 3, explanation: 'Either the linear programming model or the transportation model can be used to optimize distribution plans.' },
            { id: 901, chapter: '8s', text: 'Which of the following is not information needed to use the transportation model?', options: ['capacity of the sources', 'demand of the destinations', 'unit shipping costs', 'unit shipping distances', 'all of the above are necessary'], answer: 3, explanation: 'Differences in costs should reflect differences in distance.' },
            { id: 902, chapter: '8s', text: 'The transportation method is a linear programming technique. Linearity is present in the following way:', options: ['The cost of goods shipped from any source to any destination is a linear function of quantity shipped.', 'The cost of goods shipped from any source to any destination is a linear function of the cost per unit.', 'The total cost associated with a given plan is a linear function of shipping costs.', 'Cell evaluations require linear horizontal movements through the matrix.', 'Cell evaluations are linear.'], answer: 0, explanation: 'Costs are assumed to rise linearly with the quantity that is shipped.' },
            { id: 903, chapter: '8s', text: 'Which of the following are assumptions or requirements of the transportation method? (I) Goods are the same, regardless of source. (II) There must be multiple sources. (III) Minimum quantities must be shipped from each source. (IV) Shipping costs per unit do not vary with the quantity shipped.', options: ['I and IV', 'II and III', 'I, II, and IV', 'I and III', 'I, II, III, and IV'], answer: 2, explanation: 'If quantity minimums are required, then the linear programming model must be used.' },
            { id: 904, chapter: '8s', text: 'Which of the following is not an assumption of the transportation model?', options: ['Actual supply and demand must be equal.', 'Shipping costs per unit are constant per unit.', 'Items to be shipped are homogeneous.', 'There is only one transportation route between each source and destination.', 'There is only one transportation mode between each source and destination.'], answer: 0, explanation: 'Supply and demand can be imbalanced.' },
            { id: 905, chapter: '8s', text: 'Which of the following is the information needed to use the transportation model?', options: ['A list of the sources and each one\'s capacity', 'A list of the destinations and each one\'s demand', 'The unit cost of shipping items from each source to each destination', 'All of the above', 'None of the above'], answer: 3, explanation: 'All apply' },
            { id: 906, chapter: '8s', text: 'A campaign manager for a political candidate must arrange the shipment of 150 cartons of campaign buttons from three button producers to three campaign headquarters. The supplies and demands, and the per-carton transportation costs, are shown below. Which of the following is an objective function for the problem?', options: ['Min 2X11 + 9X12 + X13 + 5X21 + 3X22 + 8X23 + 4X31 + 7X32 + 6X33', 'Max 2X11 + 9X12 + X13 + 5X21 + 3X22 + 8X23 + 4X31 + 7X32 + 6X33', 'Min 2X11 + 5X12 + 4X13 + 9X21 + 3X22 + 7X23 + X31 + 8X32 + 6X33', 'Max 2X11 + 5X12 + 4X13 + 9X21 + 3X22 + 7X23 + X31 + 8X32 + 6X33', 'None of the above.'], answer: 2, explanation: 'Match up the coefficients in the objective function with the coefficients in the matrix, and remember this is a minimization problem.' },
            { id: 907, chapter: '8s', text: 'A campaign manager for a political candidate must arrange the shipment of 150 cartons of campaign buttons from three button producers to three campaign headquarters. Which of the following is a constraint for the suppliers (button producers)?', options: ['2X11 + 9X12 + X13 ≤ 50', '5X21 + 3X22 + 8X23 ≤ 50', '4X31 + 7X32 + 6X33 ≤ 50', 'all of the above', 'none of the above'], answer: 3, explanation: 'The suppliers can ship no more than they can produce.' },
            { id: 908, chapter: '8s', text: 'A campaign manager for a political candidate must arrange the shipment of 150 cartons of campaign buttons from three button producers to three campaign headquarters. Which of the following is a constraint for the customer (campaign headquarters)?', options: ['2X11 + 5X21 + 4X31 = 20', '9X12 + 3X22 + 7X32 = 70', 'X11 + X12 + X13 = 50', 'X12 + X22 + X32 = 70', 'all of the above'], answer: 3, explanation: 'The customer can\'t be shipped more than it wants.' },
            { id: 909, chapter: '8s', text: 'In a transportation problem with three locations and two destinations, the objective function is as follows: Min 20X11 + 18X21 + 23X31 + 16X12 + 14X22 + 12X32. How much does it cost to ship one unit from location 2 to destination 1?', options: ['18', '12', '23', '16', 'None of the above.'], answer: 0, explanation: 'The first three coefficients involve shipments to destination 1.' },
            { id: 910, chapter: '8s', text: 'In a transportation problem with three locations and two destinations, the objective function is as follows: Min 20X11 + 18X21 + 23X31 + 16X12 + 14X22 + 12X32. How much does it cost to ship one unit from location 1 to destination 2?', options: ['18', '12', '23', '16', '14'], answer: 3, explanation: 'The second three coefficients involve shipments to destination 2.' },
            { id: 911, chapter: '8s', text: 'This model indicates that it costs ________ dollars to ship one unit from location(s) _______ to location(s) ___.', options: ['60; I; A, B & C', '30; I, II & III; A', '5; II; B', '9; II; A', '7; III; C'], answer: 3, explanation: 'It costs 9 dollars to ship one unit from location II to location A.' },
            { id: 912, chapter: '8s', text: 'Suppose the output from the above formulation is as follows. How many units are shipped from location II to location C?', options: ['0', '60', '70', '80', 'None of the above'], answer: 0, explanation: 'The final value for units shipped from location II to location C is 0.' },

            // === CHƯƠNG 9: 102 câu ===
            { id: 913, chapter: 9, text: 'Broadly defined, quality refers to the ability of a product or service to occasionally meet or exceed customer expectations.', options: ['True', 'False'], answer: 1, explanation: 'Quality refers to consistently meeting or exceeding customer expectations.' },
            { id: 914, chapter: 9, text: 'An organization achieves quality by consistently meeting their competitor\'s standards.', options: ['True', 'False'], answer: 1, explanation: 'An organization achieves quality by meeting or exceeding customer expectations.' },
            { id: 915, chapter: 9, text: 'Because \'courtesy\' is subjective, it can\'t be considered a factor in service quality.', options: ['True', 'False'], answer: 1, explanation: 'Many dimensions of quality are subjective.' },
            { id: 916, chapter: 9, text: 'Recent changes to ISO guidelines stress continuous improvement regardless of how good you currently are.', options: ['True', 'False'], answer: 0, explanation: 'ISO guidelines stress continuous improvement.' },
            { id: 917, chapter: 9, text: 'The seven dimensions of quality are important for products but are not applicable in service organizations.', options: ['True', 'False'], answer: 1, explanation: 'Dimensions of quality are often similar across products and services.' },
            { id: 918, chapter: 9, text: 'Regardless of superior quality, consumers won\'t pay premium prices.', options: ['True', 'False'], answer: 1, explanation: 'Customer will often pay premium process for superior quality.' },
            { id: 919, chapter: 9, text: 'High Quality and low prices are both considered to be dimensions of quality.', options: ['True', 'False'], answer: 1, explanation: 'Price is not considered a dimension of quality.' },
            { id: 920, chapter: 9, text: 'The Baldrige award can only be won by manufacturing organizations.', options: ['True', 'False'], answer: 1, explanation: 'It can and has been won by service organizations.' },
            { id: 921, chapter: 9, text: 'Quality of conformance refers to the degree to which goods and services conform to the intent of the designers as documented in the specifications.', options: ['True', 'False'], answer: 0, explanation: 'High conformance to designer intent leads to high quality of conformance.' },
            { id: 922, chapter: 9, text: 'Quality of design refers to the degree to which goods and services achieve the intent of the designers.', options: ['True', 'False'], answer: 1, explanation: 'Quality of design refers directly to the intent of the designers.' },
            { id: 923, chapter: 9, text: 'In market research, a group of consumers who express their opinions about a product or service is called a steering committee.', options: ['True', 'False'], answer: 1, explanation: 'This would be called a focus group.' },
            { id: 924, chapter: 9, text: 'Business organizations achieving good quality benefit in a variety of ways, including a positive reputation for quality, increased customer loyalty, and lower production costs.', options: ['True', 'False'], answer: 0, explanation: 'Good quality conveys a wide variety of benefits.' },
            { id: 925, chapter: 9, text: 'User instructions and follow-up services after delivery are important elements of overall product or service quality.', options: ['True', 'False'], answer: 0, explanation: 'Overall product or service quality includes user instructions and follow-up services.' },
            { id: 926, chapter: 9, text: 'Reducing the variations in our product or service is an important key to perceived quality.', options: ['True', 'False'], answer: 0, explanation: 'Variability reduction is a key means by which quality can be improved.' },
            { id: 927, chapter: 9, text: 'Product design choices are usually the result of inputs from accounting and human resources.', options: ['True', 'False'], answer: 1, explanation: 'Design choices usually result from marketing and engineering inputs.' },
            { id: 928, chapter: 9, text: 'The dimensions of product and service quality are too abstract to be applied operationally.', options: ['True', 'False'], answer: 0, explanation: 'Determinants of quality are more readily applied operationally.' },
            { id: 929, chapter: 9, text: 'The degree to which a product or service satisfies its intended purpose is determined by design, conformance to design, cost, and reputation of the producer.', options: ['True', 'False'], answer: 1, explanation: 'Neither cost nor reputation influences this.' },
            { id: 930, chapter: 9, text: 'The degree to which a product or service satisfies its intended purpose is determined by service after delivery, ease of use, design, and conformance to design.', options: ['True', 'False'], answer: 0, explanation: 'These are determinants of quality.' },
            { id: 931, chapter: 9, text: 'Medical malpractice claims are an example of how poor quality can affect an organization through liability.', options: ['True', 'False'], answer: 0, explanation: 'Poor quality can have serious financial effects.' },
            { id: 932, chapter: 9, text: 'Convenience, Reliability and Assurance are dimensions of service quality.', options: ['True', 'False'], answer: 0, explanation: 'These are dimensions of service quality.' },
            { id: 933, chapter: 9, text: 'Poor quality has a positive effect on productivity because it usually takes longer to produce a good part.', options: ['True', 'False'], answer: 1, explanation: 'Poor quality has a negative effect on productivity.' },
            { id: 934, chapter: 9, text: 'If the majority of service customers are satisfied, it is likely that all service customers will be satisfied.', options: ['True', 'False'], answer: 1, explanation: 'Different customers tend to have different expectations.' },
            { id: 935, chapter: 9, text: 'The primary difference between internal failures and external failures is time and place of discovery of the failure.', options: ['True', 'False'], answer: 0, explanation: 'When the failure is discovered typically determines whether it is an internal or an external failure.' },
            { id: 936, chapter: 9, text: 'Customer expectations tend to change over time affecting their perception of service quality.', options: ['True', 'False'], answer: 0, explanation: 'Customer expectations do change over time.' },
            { id: 937, chapter: 9, text: 'Cost of inspectors, testing, test equipment, and labs are examples of prevention costs.', options: ['True', 'False'], answer: 1, explanation: 'These are appraisal costs.' },
            { id: 938, chapter: 9, text: 'Cost of inspectors, testing, test equipment, and labs are examples of appraisal costs.', options: ['True', 'False'], answer: 0, explanation: 'These are appraisal costs.' },
            { id: 939, chapter: 9, text: 'Modern quality management emphasizes finding and correcting mistakes before they reach the customer - catching the errors before they are shipped.', options: ['True', 'False'], answer: 1, explanation: 'Modern quality management emphasizes avoiding mistakes before they ever happen.' },
            { id: 940, chapter: 9, text: 'Deming stresses that workers are primarily responsible for poor quality because very often they fail to follow instructions.', options: ['True', 'False'], answer: 1, explanation: 'Deming stressed that systems rather than workers were primarily responsible for poor quality.' },
            { id: 941, chapter: 9, text: 'According to Deming, it is the systems that management puts into place that are primarily responsible for poor quality, not employees.', options: ['True', 'False'], answer: 0, explanation: 'Deming focused on systems as determinants of quality.' },
            { id: 942, chapter: 9, text: 'Juran describes quality management as a trilogy that consists of quality planning, quality control, and quality improvement.', options: ['True', 'False'], answer: 0, explanation: 'Juran focused on planning, control and improvement.' },
            { id: 943, chapter: 9, text: 'Juran describes quality management as a trilogy that consists of quality planning, control of quality costs, and quality improvement.', options: ['True', 'False'], answer: 1, explanation: 'Juran focused on quality planning, quality control, and quality improvement.' },
            { id: 944, chapter: 9, text: 'Quality at the source means returning all defects to the source - our vendors.', options: ['True', 'False'], answer: 1, explanation: 'Quality at the source refers to making each worker responsible for the quality of his or her own work.' },
            { id: 945, chapter: 9, text: 'Six sigma programs have both management and technical components.', options: ['True', 'False'], answer: 0, explanation: 'Both management and technical components are part of six sigma programs.' },
            { id: 946, chapter: 9, text: 'Crosby\'s concept of "quality is free" means that it is less expensive to do it right initially than to do it over.', options: ['True', 'False'], answer: 0, explanation: 'Crosby believes quality pays for itself.' },
            { id: 947, chapter: 9, text: 'The causes of variation in any process can be identified through the general categories of people, procedures, education and age.', options: ['True', 'False'], answer: 1, explanation: 'The general categories are people, procedures and processes.' },
            { id: 948, chapter: 9, text: 'Quality certification refers to a process of 100 percent inspection to catch all defective products before they leave the company; this allows every item to be certified defect free.', options: ['True', 'False'], answer: 1, explanation: 'Quality certification refers to the process of certifying that quality processes are in place.' },
            { id: 949, chapter: 9, text: 'The customer is the focal point and customer satisfaction is the driving force in quality management.', options: ['True', 'False'], answer: 0, explanation: 'The customer and his or her satisfaction are central to quality management.' },
            { id: 950, chapter: 9, text: 'When considering service quality, convenience often is a major factor.', options: ['True', 'False'], answer: 0, explanation: 'Convenience is often a major dimension of service quality.' },
            { id: 951, chapter: 9, text: 'Serviceability, Conformance and Reliability are dimensions of product quality.', options: ['True', 'False'], answer: 0, explanation: 'These are common dimensions of product quality.' },
            { id: 952, chapter: 9, text: 'Firms that wish to do business with the European Community can benefit from having a quality management system that meets ISO 9000 standards.', options: ['True', 'False'], answer: 0, explanation: 'ISO 9000 certification is critical for doing business in Europe.' },
            { id: 953, chapter: 9, text: 'Continuous improvement attempts to achieve major breakthroughs in product or service quality.', options: ['True', 'False'], answer: 1, explanation: 'Continuous improvement attempts to achieve ongoing improvements in product or service quality.' },
            { id: 954, chapter: 9, text: 'So long as quality input resources are used to make a product, we can expect quality output from the process.', options: ['True', 'False'], answer: 1, explanation: 'Quality inputs help with quality but they do not guarantee it.' },
            { id: 955, chapter: 9, text: 'Three key philosophies in TQM are continuous improvement, involvement of everyone in the organization, and customer satisfaction.', options: ['True', 'False'], answer: 0, explanation: 'These are the three key philosophies.' },
            { id: 956, chapter: 9, text: 'Suppliers are not included in quality assurance and quality improvement efforts in TQM; they should worry about their own problems.', options: ['True', 'False'], answer: 1, explanation: 'Suppliers are critical in TQM.' },
            { id: 957, chapter: 9, text: 'Zero defects requires 100% inspection of the final product.', options: ['True', 'False'], answer: 1, explanation: 'Zero defects can be achieved through quality at the source.' },
            { id: 958, chapter: 9, text: 'The PDSA cycle forms the conceptual basis for continuous improvement.', options: ['True', 'False'], answer: 0, explanation: 'It reflects some of the primary ideas behind continuous improvement.' },
            { id: 959, chapter: 9, text: 'A control chart is a visual representation of the various states in a process.', options: ['True', 'False'], answer: 1, explanation: 'A control is a visual representation of the output of a process.' },
            { id: 960, chapter: 9, text: 'The purpose of benchmarking is to establish a standard against which the organization\'s performance can be judged, and to identify a model for possible improvement.', options: ['True', 'False'], answer: 0, explanation: 'Benchmarking is used to establish a standard against which performance can be judged.' },
            { id: 961, chapter: 9, text: 'TQM expands the traditional view of quality beyond looking only at the quality of the final product or service to looking at the quality of every aspect of the process.', options: ['True', 'False'], answer: 0, explanation: 'TQM focuses on what leads to the outcome rather than the outcome itself.' },
            { id: 962, chapter: 9, text: 'The benchmark organization must be chosen from the same industry in order for its methods to be applicable.', options: ['True', 'False'], answer: 1, explanation: 'The benchmarked organization should be best in class, regardless of industry.' },
            { id: 963, chapter: 9, text: 'A quality circle is a cross-functional team focused on quality.', options: ['True', 'False'], answer: 1, explanation: 'Quality circles typically aren\'t cross-functional.' },
            { id: 964, chapter: 9, text: 'Total quality management attempts to involve everyone in an organization in the effort to achieve quality.', options: ['True', 'False'], answer: 0, explanation: 'TQM is an organization-wide initiative.' },
            { id: 965, chapter: 9, text: 'There is a positive link between quality and productivity.', options: ['True', 'False'], answer: 0, explanation: 'Higher quality leads to higher productivity.' },
            { id: 966, chapter: 9, text: 'The term "quality at the source" refers primarily to the practice of requiring each of our vendors to provide quality parts and materials.', options: ['True', 'False'], answer: 1, explanation: 'Quality at the source refers to each worker being responsible for the quality of his or her work.' },
            { id: 967, chapter: 9, text: 'ISO standards aid in transferring technology to developing countries.', options: ['True', 'False'], answer: 0, explanation: 'ISO facilitates the transfer of quality expertise to developing countries.' },
            { id: 968, chapter: 9, text: 'TQM is not just a collection of techniques. It is rather a whole new attitude toward quality.', options: ['True', 'False'], answer: 0, explanation: 'TQM is a philosophy.' },
            { id: 969, chapter: 9, text: 'The PDSA cycles is also referred to as the Baldrige Wheel.', options: ['True', 'False'], answer: 1, explanation: 'It\'s also referred to as the Deming wheel or Shewhart cycle.' },
            { id: 970, chapter: 9, text: 'When problems arise in a total quality managed organization, it is important to assign blame and punish the worker responsible for causing the problem.', options: ['True', 'False'], answer: 1, explanation: 'Blame and punishment have little place in a TQM organization.' },
            { id: 971, chapter: 9, text: 'ISO standards apply only to manufacturing organizations.', options: ['True', 'False'], answer: 1, explanation: 'ISO standards can apply to service organizations.' },
            { id: 972, chapter: 9, text: 'A major obstacle to implementing TQM can be an emphasis on long-term financial results.', options: ['True', 'False'], answer: 1, explanation: 'Short-term financial focus can be an obstacle to implementing TQM.' },
            { id: 973, chapter: 9, text: 'One criticism of total quality management is that it may produce blind pursuit of quality to the neglect of other priority considerations.', options: ['True', 'False'], answer: 0, explanation: 'Considerations other than quality sometimes can be neglected.' },
            { id: 974, chapter: 9, text: 'Process mapping is part of process improvement.', options: ['True', 'False'], answer: 0, explanation: 'Mapping the process is a first step in process improvement.' },
            { id: 975, chapter: 9, text: 'Total quality management is a collection of techniques, such as quality control charts, ISO 9000, and quality function deployment.', options: ['True', 'False'], answer: 1, explanation: 'TQM is a philosophy.' },
            { id: 976, chapter: 9, text: 'A tool that is not used for quality management is ________.', options: ['Flowchart', 'Histogram', 'Perato Analysis', 'Redesign', 'Check sheets'], answer: 3, explanation: 'Redesigns aren\'t part of quality management.' },
            { id: 977, chapter: 9, text: 'The four dimensions of quality that are sometimes used to determine fitness for use of a product are ______.', options: ['performance, special features, durability, and service after sale', 'performance, special features, conformance, and reliability', 'special features, conformance, reliability, and durability', 'performance, conformance, reliability, and durability', 'special features, conformance, durability, and service after sale'], answer: 3, explanation: 'These are the four dimensions of quality that are sometimes used to determine fitness for use of a product.' },
            { id: 978, chapter: 9, text: 'A tool that depicts process variation graphically is a(n) _________.', options: ['Affinity diagram', 'Check list', 'Control Chart', 'Flow Chart', 'Relationship diagram'], answer: 2, explanation: 'Control charts depict process variation.' },
            { id: 979, chapter: 9, text: 'Which isn\'t a cost of quality?', options: ['Prevention cost', 'External failure', 'Extended Service Contracts', 'Internal failure', 'Appraisal costs'], answer: 2, explanation: 'Extend service contracts are quality costs.' },
            { id: 980, chapter: 9, text: 'The Deming Prize was established by the _________.', options: ['American Statistical Association', 'Japanese', 'North American Free Trade Association', 'American Quality Society', 'World Trade Organization'], answer: 1, explanation: 'The Deming Prize is a prominent Japanese quality award.' },
            { id: 981, chapter: 9, text: 'Lost production time, scrap, and rework are examples of ________.', options: ['internal failure costs', 'external failure costs', 'appraisal costs', 'prevention costs', 'replacement costs'], answer: 0, explanation: 'These are internal failure costs.' },
            { id: 982, chapter: 9, text: 'Warranty service, processing of complaints, and costs of litigation are examples of ________.', options: ['internal failure costs', 'external failure costs', 'appraisal costs', 'prevention costs', 'replacement costs'], answer: 1, explanation: 'These are external failure costs.' },
            { id: 983, chapter: 9, text: 'Costs of inspectors, testing, test equipment, and labs are examples of ________.', options: ['internal failure costs', 'external failure costs', 'appraisal costs', 'prevention costs', 'replacement costs'], answer: 2, explanation: 'These are appraisal costs.' },
            { id: 984, chapter: 9, text: 'Loss of business, liability, productivity and costs are consequences of _______.', options: ['Labor Unions', 'Globalization', 'Poor Quality', 'Robotics', 'Micro-factories'], answer: 2, explanation: 'Poor quality increases these costs.' },
            { id: 985, chapter: 9, text: 'Quality planning and administration, quality training, and quality control procedures are examples of _______.', options: ['internal failure costs', 'external failure costs', 'appraisal costs', 'prevention costs', 'replacement costs'], answer: 3, explanation: 'These are prevention costs.' },
            { id: 986, chapter: 9, text: 'The purpose of the Malcolm Baldrige National Quality Award is to _______.', options: ['stimulate efforts to improve quality', 'recognize quality achievements of U.S. companies', 'publicize successful quality programs', 'all of the above', 'distribute the grant money available for improved quality'], answer: 3, explanation: 'All of these are goals of the Baldrige award.' },
            { id: 987, chapter: 9, text: 'Fixing a problem will often cost money; to minimize these costs it is best to find and fix the problem _______.', options: ['just before shipping our product to the customer', 'immediately after we complete the last operation', 'during the design phase', 'just before we begin the first production operation', 'regardless of when you fix the problem, costs are about the same'], answer: 2, explanation: 'Fixing a problem during the design phase prevents a failure from ever occurring.' },
            { id: 988, chapter: 9, text: 'Deciding how much to invest in the prevention of defects can be analyzed using ________.', options: ['EVPI', 'Net Present Value', 'Weighted Factor Analysis', 'Return on Quality', 'Breakeven Analysis'], answer: 3, explanation: 'ROQ focuses on the economics of quality efforts.' },
            { id: 989, chapter: 9, text: 'The Baldrige award is based on seven categories. Which is not one of those?', options: ['Relative profitability', 'Strategic planning', 'Human resource focus', 'Information and Analysis', 'Leadership'], answer: 0, explanation: 'Relative profitability is not a Baldrige category.' },
            { id: 990, chapter: 9, text: 'ISO 9000 standards do not have a requirement for ________.', options: ['resource', 'remedial', 'systems', 'training', 'management'], answer: 1, explanation: 'Training isn\'t a part of ISO 9000 standards.' },
            { id: 991, chapter: 9, text: 'A quality circle is ________.', options: ['responsible for quality', 'total quality control', 'an inspection stamp found on meat', 'a voluntary group of employees', 'none of the above'], answer: 3, explanation: 'Quality circles are composed of volunteers.' },
            { id: 992, chapter: 9, text: 'ISO 9000 currently requires _____ of a certified organization.', options: ['Quarterly reporting', 'Product diversity', 'Annual audits', 'A minimum of four supervisory levels', 'Continuous improvement'], answer: 4, explanation: 'Continuous improvement is emphasized in ISO certification.' },
            { id: 993, chapter: 9, text: 'The quality control improvement tool which distinguishes between the "important few" and the "trivial many" is __________.', options: ['brainstorming', 'check sheets', 'Pareto analysis', 'cause-and-effect diagrams', 'fail-safe methods'], answer: 2, explanation: 'Pareto analysis focused on the 80/20 phenomenon.' },
            { id: 994, chapter: 9, text: 'The quality control improvement tool that resembles a "fishbone" is ________.', options: ['brainstorming', 'check sheets', 'Pareto analysis', 'cause-and-effect diagrams', 'fail-safe methods'], answer: 3, explanation: 'These are also known as Ishikawa diagrams.' },
            { id: 995, chapter: 9, text: 'TQM stands for:', options: ['Taguchie Quality Methods', 'Tactical Quality Measurements', 'The Quality Matrix', 'Total Quality Management', 'Total Quantity Measurement'], answer: 3, explanation: 'TQM stands for Total Quality Management.' },
            { id: 996, chapter: 9, text: 'Which of the following is an element of TQM?', options: ['continuous improvement', 'competitive benchmarking', 'employee empowerment', 'team approach', 'all of the above'], answer: 4, explanation: 'All of these are elements of TQM.' },
            { id: 997, chapter: 9, text: 'Management behaviors supporting an organizational culture that encourages continuous improvement include which of the following? (I) develop a vision statement for the organization (II) develop a reward system that promotes the philosophy (III) institute continuous training programs (IV) make decisions that adhere to the philosophy', options: ['I, II, and IV', 'I, II, III, and IV', 'I and III', 'II, III, and IV', 'II and IV'], answer: 1, explanation: 'All of these would reflect management focused on continuous improvement.' },
            { id: 998, chapter: 9, text: 'The tool that is useful in documenting the current process is:', options: ['a control chart', 'a Pareto chart', 'a check sheet', 'a flow chart', 'a simo chart'], answer: 3, explanation: 'The flow chart graphically depicts how a process works.' },
            { id: 999, chapter: 9, text: 'The tool that is useful in the collection and organization of data is:', options: ['a control chart', 'a Pareto chart', 'a check sheet', 'a flow chart', 'none of the above'], answer: 2, explanation: 'Check sheets help in the collection and organization of data.' },
            { id: 1000, chapter: 9, text: 'A quality improvement technique that involves the sharing of thoughts and ideas in a way that encourages unrestrained collective thinking is:', options: ['Pareto analysis', 'benchmarking', 'brainstorming', 'a control chart', 'a check sheet'], answer: 2, explanation: 'Brainstorming involves the sharing of thoughts and ideas in a way that encourages unrestrained collective thinking.' },
            { id: 1001, chapter: 9, text: 'In order for TQM to be successful, it is essential that most of the organization be _________.', options: ['members of quality circles', 'under contract', 'ISO certified', 'trained in error detection techniques', 'in agreement with the philosophy and its goals'], answer: 4, explanation: 'TQM won\'t work without substantial buy-in.' },
            { id: 1002, chapter: 9, text: 'Which of the following raises quality risks?', options: ['currency fluctuations', 'outsourcing to less-developed countries', 'empowering employees', 'benchmarking', 'streamlining the supplier base'], answer: 1, explanation: 'Quality risks increase when outsourcing to less-developed countries.' },
            { id: 1003, chapter: 9, text: 'Focusing attention on the most important problem areas is referred to as:', options: ['quality circles', 'quality assurance', 'brainstorming', 'Pareto analysis', 'cause-and-effect analysis'], answer: 3, explanation: 'Pareto analysis directs attention to the most important areas.' },
            { id: 1004, chapter: 9, text: 'A chart showing the number of occurrences by category would be used in:', options: ['Pareto analysis', 'interviewing', 'cause-and-effect diagrams', 'benchmarking', 'none of the above'], answer: 0, explanation: 'We would look for root causes to the most frequently occurring quality failures.' },
            { id: 1005, chapter: 9, text: 'Cause-and-effect diagrams are sometimes called:', options: ['Pareto diagrams', 'fishbone (Ishikawa) diagrams', 'run charts', 'control charts', 'none of the above'], answer: 1, explanation: 'These help in thinking through what might be causing a quality program.' },
            { id: 1006, chapter: 9, text: 'The process of identifying other organizations that are best at some facet of your operations, and then modeling your organization after them is known as:', options: ['continuous improvement', 'employee empowerment', 'benchmarking', 'copycatting', 'industrial espionage'], answer: 2, explanation: 'It is important to benchmark against best-in-class processes.' },
            { id: 1007, chapter: 9, text: 'Giving workers responsibility for quality improvements and authority to make changes is known as:', options: ['continuous improvement', 'passing the buck', 'benchmarking', 'employee empowerment', 'employee involvement'], answer: 3, explanation: 'Empowered employees are often very effective in improving quality.' },
            { id: 1008, chapter: 9, text: 'The typical difference between "quality circles" and "continuous improvement teams" is ________.', options: ['Quality circles work on product design only', 'Continuous improvement teams work on product and process design', 'Continuous improvement teams use only engineers while quality circles use just the workers doing the work', 'the amount of employee empowerment', 'There is no difference-they are just the same'], answer: 3, explanation: 'Quality circles often work with processes over which they have little authority.' },
            { id: 1009, chapter: 9, text: 'Which of the following is not a goal of process improvement?', options: ['increasing customer satisfaction', 'reducing waste', 'achieving higher quality', 'identifying the cause of a problem', 'All are the goals.'], answer: 4, explanation: 'Identifying the cause of a problem is an input into the effort to improve the process.' },
            { id: 1010, chapter: 9, text: 'Managers have obligations to a wide variety of stakeholders such as shareholders, employees and customers. When considering outsourcing production to offshore suppliers, managers have to weigh __. I) Cost benefits that might make shareholders wealthier II) Quality issues that might make firms less productive and/or products riskier III) The investments already tied up in relationships with existing suppliers', options: ['I', 'II', 'III', 'I and II only', 'I, II and III'], answer: 4, explanation: 'All of these are considerations that must be taken into account.' },
            { id: 1011, chapter: 9, text: 'Focusing a supply chain on ________________ is a modern way of ensuring high quality inputs and a ready supply of process-improvement ideas.', options: ['lowest cost-per unit sourced', 'close, collaborative ties with suppliers', 'suppliers that emphasized continuous-flow production', 'ISO 14000 customers', 'partners pursuing similar strategies'], answer: 1, explanation: 'Collaborative relationships with suppliers often lead to higher quality.' },
            { id: 1012, chapter: 9, text: 'As regards quality risks, which of the following would be least likely to involve outsourcing to less-developed countries?', options: ['rubber processing', 'repetitive assembly', 'packaging', 'pharmaceuticals', 'steel manufacturing'], answer: 3, explanation: 'Pharmaceutical firms incur substantial quality risks when they outsource to less-developed countries.' },
            { id: 1013, chapter: 9, text: 'If customer satisfaction doesn\'t always lead to customer loyalty, firms may need to focus additional effort on __________ strategies.', options: ['remediation', 'retention', 'rework', 'repatriation', 'reprocessing'], answer: 1, explanation: 'Increasing customer satisfaction doesn\'t necessarily increase customer loyalty.' },
            { id: 1014, chapter: 9, text: 'Before a dimension of quality can be made operationally useful, it must be restated in some ___________ form.', options: ['qualitative', 'manipulative', 'certifiable', 'measurable', 'marketable'], answer: 3, explanation: 'Dimensions of quality have to be translated into measurable characteristics.' },

            // === CHƯƠNG 10: 151 câu ===
            { id: 1015, chapter: 10, text: 'Approving the effort that occurs during the production process is known as acceptance sampling.', options: ['True', 'False'], answer: 1, explanation: 'Acceptance sampling occurs before or after the production process.' },
            { id: 1016, chapter: 10, text: 'Statistical Process Control is the measurement of rejects in the final product.', options: ['True', 'False'], answer: 1, explanation: 'SPC is the evaluation of the process.' },
            { id: 1017, chapter: 10, text: 'The optimum level of inspection occurs when we catch at least 98.6 percent of the defects.', options: ['True', 'False'], answer: 1, explanation: 'The optimum level of inspection is when the sum of inspection costs and the cost of passing defectives are equal.' },
            { id: 1018, chapter: 10, text: 'The optimum level of inspection minimizes the sum of inspection costs and the cost of passing defectives.', options: ['True', 'False'], answer: 0, explanation: 'This represents the optimum balance between inspection and failure costs.' },
            { id: 1019, chapter: 10, text: 'Processes that are in control eliminate variations.', options: ['True', 'False'], answer: 1, explanation: 'In control, processes are free of non-random variation.' },
            { id: 1020, chapter: 10, text: 'High-cost, low-volume items often require careful inspection since we make them so infrequently.', options: ['True', 'False'], answer: 0, explanation: 'These are good candidates for inspection.' },
            { id: 1021, chapter: 10, text: 'Low-cost, high-volume items often require more intensive inspection.', options: ['True', 'False'], answer: 1, explanation: 'These are not good candidates for inspection.' },
            { id: 1022, chapter: 10, text: 'A lower control limit must by definition be a value less than an upper control limit.', options: ['True', 'False'], answer: 0, explanation: 'The lower limit must be smaller than the upper limit.' },
            { id: 1023, chapter: 10, text: 'Attributes need to be measured, variable data can be counted.', options: ['True', 'False'], answer: 1, explanation: 'Attributes need to be counted, variable data is measured.' },
            { id: 1024, chapter: 10, text: 'The amount of inspection we choose can range from no inspection at all to inspecting each item numerous times.', options: ['True', 'False'], answer: 0, explanation: 'These are the extremes of inspection.' },
            { id: 1025, chapter: 10, text: 'The amount of inspection needed is governed by the costs of inspection and the expected costs of passing defective items.', options: ['True', 'False'], answer: 0, explanation: 'These interact to set the optimum amount of inspection.' },
            { id: 1026, chapter: 10, text: 'The purpose of statistical process control is to ensure that historical output is random.', options: ['True', 'False'], answer: 1, explanation: 'It is to ensure that non-random variation is detected and corrected.' },
            { id: 1027, chapter: 10, text: 'A process that exhibits random variability would be judged to be out of control.', options: ['True', 'False'], answer: 1, explanation: 'All processes exhibit random variability.' },
            { id: 1028, chapter: 10, text: 'If a point on a control chart falls outside one of the control limits, this suggests that the process output is non-random and should be investigated.', options: ['True', 'False'], answer: 0, explanation: 'A point outside the control limits suggests non-random variation.' },
            { id: 1029, chapter: 10, text: 'An x-bar control chart can only be valid if the underlying population it measures is a normal distribution.', options: ['True', 'False'], answer: 1, explanation: 'The sample average typically is normally distributed regardless of the underlying distribution of the process.' },
            { id: 1030, chapter: 10, text: 'Concluding a process is out of control when it is not is known as a Type I error.', options: ['True', 'False'], answer: 0, explanation: 'A Type I error involves erroneously concluding that a process is out of control.' },
            { id: 1031, chapter: 10, text: 'An R value of zero (on a range chart) means that the process must be in control since all sample values are equal.', options: ['True', 'False'], answer: 1, explanation: 'If the sample size is sufficiently large, an R of zero could indicate an out of control process.' },
            { id: 1032, chapter: 10, text: 'Range charts are used mainly with attribute data.', options: ['True', 'False'], answer: 1, explanation: 'Range charts are used with variable data.' },
            { id: 1033, chapter: 10, text: 'Range charts and p-charts are both used for variable data.', options: ['True', 'False'], answer: 1, explanation: 'P-charts are used with attribute data.' },
            { id: 1034, chapter: 10, text: 'A p-chart is used to monitor the fraction of defectives in the output of a process.', options: ['True', 'False'], answer: 0, explanation: 'P-charts involve the fraction of defectives.' },
            { id: 1035, chapter: 10, text: 'A c-chart is used to monitor the total number of defectives in the output of a process.', options: ['True', 'False'], answer: 1, explanation: 'A c-chart is used to monitor the number of defects per unit, not defective units.' },
            { id: 1036, chapter: 10, text: 'A c-chart is used to monitor the number of defects per unit for process output.', options: ['True', 'False'], answer: 0, explanation: 'A c-chart monitors the number of defects per unit for process output.' },
            { id: 1037, chapter: 10, text: 'Tolerances represent the control limits we use on the charts.', options: ['True', 'False'], answer: 1, explanation: 'Tolerances are specification limits, not control limits.' },
            { id: 1038, chapter: 10, text: '"Process capability" compares "process variability" to the "tolerances."', options: ['True', 'False'], answer: 0, explanation: 'Process variability influences how much output falls outside of tolerances.' },
            { id: 1039, chapter: 10, text: 'Control limits used on process control charts are specifications established by design or customers.', options: ['True', 'False'], answer: 1, explanation: 'Control limits are independent of specifications.' },
            { id: 1040, chapter: 10, text: 'Control limits tend to be wider for more variable processes.', options: ['True', 'False'], answer: 0, explanation: 'Process with inherently more variability will naturally have wider control limits.' },
            { id: 1041, chapter: 10, text: 'Patterns of data on a control chart suggest that the process may have non-random variation.', options: ['True', 'False'], answer: 0, explanation: 'Ideally, the data on a control chart will have no pattern.' },
            { id: 1042, chapter: 10, text: 'The output of a process may not conform to specifications even though the process may be statistically "in control."', options: ['True', 'False'], answer: 0, explanation: 'A process can be free of non-random variation and still not meet specifications.' },
            { id: 1043, chapter: 10, text: 'Run tests are useful in helping to identify nonrandom variations in a process.', options: ['True', 'False'], answer: 0, explanation: 'Runs tests are useful to identify non-randomness in patterns.' },
            { id: 1044, chapter: 10, text: 'Run tests give managers an alternative to control charts; they are quicker and cost less.', options: ['True', 'False'], answer: 1, explanation: 'Runs tests are not alternatives to control charts.' },
            { id: 1045, chapter: 10, text: 'Statistical process control focuses on the acceptability of process output.', options: ['True', 'False'], answer: 1, explanation: 'Statistical process control focuses on the variability of processes.' },
            { id: 1046, chapter: 10, text: 'A run test checks a sequence of observations for randomness.', options: ['True', 'False'], answer: 0, explanation: 'Runs tests can be used to detect nonrandomness in sequences of observations.' },
            { id: 1047, chapter: 10, text: 'Even if the process is not centered, the process capability index (indicated by Cpk) is very useful.', options: ['True', 'False'], answer: 1, explanation: 'If the process is not centered, Cpk is not useful.' },
            { id: 1048, chapter: 10, text: 'The process capability index (indicated by Cpk) can be used only when the process is centered.', options: ['True', 'False'], answer: 1, explanation: 'Cpk can be used whether or not the process is centered.' },
            { id: 1049, chapter: 10, text: 'Quality control is assuring that processes are performing in an acceptable manner.', options: ['True', 'False'], answer: 0, explanation: 'Control is used to monitor the performance of processes.' },
            { id: 1050, chapter: 10, text: 'The primary purpose of statistical process control is to detect a defective product before it is shipped to a customer.', options: ['True', 'False'], answer: 1, explanation: 'The primary purpose of SPC is to detect nonrandomness.' },
            { id: 1051, chapter: 10, text: 'The Taguchi Cost Function suggests that the capability ratio can be improved by extending the spread between LCL and UCL.', options: ['True', 'False'], answer: 1, explanation: 'The Taguchi cost function suggests that reducing variation is key.' },
            { id: 1052, chapter: 10, text: 'The variation of a sampling distribution is tighter than the variation of the underlying process distribution.', options: ['True', 'False'], answer: 0, explanation: 'The sampling distribution exhibits less variation than the underlying process.' },
            { id: 1053, chapter: 10, text: 'The sampling distribution can be assumed to be approximately normal even when the underlying process distribution is not normally distributed.', options: ['True', 'False'], answer: 0, explanation: 'This is especially true as the sample size grows.' },
            { id: 1054, chapter: 10, text: 'Approximately 99.7% of sample means will fall within ± two standard deviations of the process mean if the process is under control.', options: ['True', 'False'], answer: 1, explanation: 'Approximately 99.7% of sample means will fall within ± three standard deviations of the process mean.' },
            { id: 1055, chapter: 10, text: 'The best way to assure quality is to use extensive inspection and control charts.', options: ['True', 'False'], answer: 1, explanation: 'The best way to assure quality is to make sure processes are highly capable.' },
            { id: 1056, chapter: 10, text: 'Control limits are based on multiples of the process standard deviation.', options: ['True', 'False'], answer: 1, explanation: 'Control limits are based on multiples of the standard deviation of the sample statistic.' },
            { id: 1057, chapter: 10, text: 'Attribute data are counted, variable data are measured.', options: ['True', 'False'], answer: 0, explanation: 'These distinguish attribute from variable data.' },
            { id: 1058, chapter: 10, text: 'The number of defective parts in a sample is an example of variable data because it will "vary" from one sample to another.', options: ['True', 'False'], answer: 1, explanation: 'The number of defective parts in a sample is an example of attribute data.' },
            { id: 1059, chapter: 10, text: 'Larger samples will require wider x-bar control limits because there is more data.', options: ['True', 'False'], answer: 1, explanation: 'Large samples will lead to narrower control limits.' },
            { id: 1060, chapter: 10, text: 'When a process is not centered, its capability is measured in a slightly different way. The symbol for this case is Cpk.', options: ['True', 'False'], answer: 0, explanation: 'Cpk is used when the process is not centered.' },
            { id: 1061, chapter: 10, text: 'Range control charts are used to monitor process central tendency.', options: ['True', 'False'], answer: 1, explanation: 'Ranger charts monitor variability.' },
            { id: 1062, chapter: 10, text: 'An "up and down" run test uses the median as a reference point and measures the percentage above and below the median.', options: ['True', 'False'], answer: 1, explanation: 'An up-and-down runs test looks only at runs of increasing or decreasing values.' },
            { id: 1063, chapter: 10, text: '"Assignable variation" is variation due to a specific cause, such as tool wear.', options: ['True', 'False'], answer: 0, explanation: 'Assignable variation is specific cause variation.' },
            { id: 1064, chapter: 10, text: 'Variation in a sample statistic collected from a process may be either random variation or assignable variation - or both.', options: ['True', 'False'], answer: 0, explanation: 'Total variation can consist of both random and assignable variation.' },
            { id: 1065, chapter: 10, text: '"Quality of conformance" is concerned with whether a product or service conforms to its specifications.', options: ['True', 'False'], answer: 0, explanation: 'Specification conformance is quality of conformance.' },
            { id: 1066, chapter: 10, text: 'The larger the process variation, the tighter the specifications should be.', options: ['True', 'False'], answer: 1, explanation: 'Greater variation would lead to wider specifications.' },
            { id: 1067, chapter: 10, text: 'Type I and Type II errors refer to the magnitude of variation from the standard.', options: ['True', 'False'], answer: 1, explanation: 'These refer to decisions regarding whether the process is in or out of control.' },
            { id: 1068, chapter: 10, text: 'The greater the capability ratio, the higher the rejects.', options: ['True', 'False'], answer: 1, explanation: 'Greater capability reduces rejects.' },
            { id: 1069, chapter: 10, text: 'Non-random variation is likely whenever all observations are between the LCL and UCL.', options: ['True', 'False'], answer: 1, explanation: 'If all observations are between the LCL and UCL, then the process would be considered in control.' },
            { id: 1070, chapter: 10, text: 'Which of the following quality control sample statistics indicates a quality characteristic that is an attribute?', options: ['mean', 'variance', 'standard deviation', 'range', 'proportion'], answer: 4, explanation: 'Proportions would be control with attribute control charts.' },
            { id: 1071, chapter: 10, text: 'A time-ordered plot of representative sample statistics is called a:', options: ['Gantt chart', 'SIMO-chart', 'Control Chart', 'Up-Down Matrix', 'Standard deviation table'], answer: 2, explanation: 'Control charts are time-ordered plots of sample statistics.' },
            { id: 1072, chapter: 10, text: 'A control chart used to monitor the process mean is the:', options: ['p-chart', 'R-chart', 'x-bar chart', 'c-chart', 'Gantt chart'], answer: 2, explanation: 'The x-bar chart monitors the process mean.' },
            { id: 1073, chapter: 10, text: 'A control chart used to monitor the fraction of defectives generated by a process is the:', options: ['p-chart', 'R-chart', 'x-bar chart', 'c-chart', 'Gantt chart'], answer: 0, explanation: 'The p-chart monitors the fraction defective.' },
            { id: 1074, chapter: 10, text: 'A p-chart would be used to monitor _______.', options: ['average shrinkage', 'dispersion in sample data', 'the fraction defective', 'the number of defects per unit', 'the range of values'], answer: 2, explanation: 'The p-chart monitors the fraction defective.' },
            { id: 1075, chapter: 10, text: 'A c-chart is used for:', options: ['means', 'ranges', 'percent defective', 'fraction defective per unit', 'number of defects per unit'], answer: 4, explanation: 'C-charts monitor the number of defects per unit.' },
            { id: 1076, chapter: 10, text: 'A control chart used to monitor the number of defects per unit is the:', options: ['p-chart', 'R-chart', 'x-bar chart', 'c-chart', 'Gantt chart'], answer: 3, explanation: 'C-charts monitor the number of defects per unit.' },
            { id: 1077, chapter: 10, text: 'A point which is outside of the lower control limit on an R-chart:', options: ['is an indication that no cause of variation is present', 'should be ignored because it signifies better than average quality', 'should be investigated because an assignable cause of variation might be present', 'should be ignored unless another point is outside that limit', 'is impossible since the lower limit is always zero'], answer: 2, explanation: 'Points outside of the control limits should be investigated as signals of non-random variation being present.' },
            { id: 1078, chapter: 10, text: 'If a process is performing as it should, it is still possible to obtain observations which are outside of which limits? (I) tolerances (II) control limits (III) process variability', options: ['I', 'II', 'I and II', 'II and III', 'I, II, and III'], answer: 2, explanation: 'Even capable, in control processes can have observations outside of control limits or tolerances.' },
            { id: 1079, chapter: 10, text: 'Which of the following relationships must always be incorrect?', options: ['Tolerances > process variability > control limits', 'Process variability > tolerances > control limits', 'Tolerances > control limits > process variability', 'Process variability > control limits > tolerances', 'Process variability < Tolerances < control limits'], answer: 3, explanation: 'Process variability will always be greater than control limits.' },
            { id: 1080, chapter: 10, text: 'Which of the following is not a step in the quality control process?', options: ['define what is to be controlled', 'compare measurements to a standard', 'eliminate each of the defects as they are identified', 'take corrective action if necessary', 'evaluate corrective action'], answer: 2, explanation: 'Eliminating defects is not part of quality control.' },
            { id: 1081, chapter: 10, text: 'The probability of concluding that assignable variation exists when only random variation is present is: (I) the probability of a Type I error (II) known as the alpha risk (III) highly unlikely (IV) the sum of probabilities in the two tails of the normal distribution', options: ['I and II', 'I and IV', 'II and III', 'I, II, and IV', 'I, III, and IV'], answer: 3, explanation: 'Incorrect signals can be on either side of the distribution.' },
            { id: 1082, chapter: 10, text: '_______ variation is a variation whose cause can be identified.', options: ['Assignable', 'Controllable', 'Random', 'Statistical', 'Theoretical'], answer: 0, explanation: 'Assignable variation has a special cause.' },
            { id: 1083, chapter: 10, text: 'A plot below the lower control limit on the range chart: (I) should be ignored since lower variation is desirable (II) may be an indication that process variation has decreased (III) should be investigated for assignable cause', options: ['I and II', 'I and III', 'II and III', 'II only', 'I, II, and III'], answer: 2, explanation: 'Plots outside of control limits should be investigated.' },
            { id: 1084, chapter: 10, text: 'A shift in the process mean for a measured characteristic would most likely be detected by a:', options: ['p-chart', 'x-bar chart', 'c-chart', 'R-chart', 's-chart'], answer: 1, explanation: 'X-bar charts monitor the process mean.' },
            { id: 1085, chapter: 10, text: 'The range chart (R-chart) is most likely to detect a change in:', options: ['proportion', 'mean', 'number defective', 'variability', 'sample size'], answer: 3, explanation: 'The range chart monitors variability.' },
