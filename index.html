            { id: 1344, chapter: 14, text: 'Lean systems typically require that suppliers be able to provide large lots at periodic intervals.', options: ['True', 'False'], answer: 1, explanation: 'Lean systems need suppliers making frequent deliveries of small lots.' },
            { id: 1345, chapter: 14, text: 'Lean purchasing requires frequent contract bidding by multiple sources to ensure the buyer of competitive prices.', options: ['True', 'False'], answer: 1, explanation: 'Lean purchasing requires collaborative relationships with a relatively small number of suppliers.' },
            { id: 1346, chapter: 14, text: 'One way of reducing the number of suppliers to the organization is to limit contacts to only one or two tiers of suppliers.', options: ['True', 'False'], answer: 1, explanation: 'Lean operations limit contact to only a first tier of suppliers. These are then responsible for sourcing at the second tier and beyond.' },
            { id: 1347, chapter: 14, text: 'One major difference between the use of kanban and MRP II in scheduling the products to be built is that kanban is primarily a manual system while MRP II uses computers.', options: ['True', 'False'], answer: 0, explanation: 'Kanban can be implemented quite well without computers.' },
            { id: 1348, chapter: 14, text: 'A benefit of the lean philosophy is the flexibility to respond quickly to changing customer requirements.', options: ['True', 'False'], answer: 0, explanation: 'Lean systems can be more responsive to changing customer requirements.' },
            { id: 1349, chapter: 14, text: 'A benefit of lean systems is that lead times are increased allowing more time for processing.', options: ['True', 'False'], answer: 1, explanation: 'Lead times are reduced in lean systems.' },
            { id: 1350, chapter: 14, text: 'A successful conversion to a lean system requires that every vendor use lean approaches prior to the organization\'s implementation.', options: ['True', 'False'], answer: 1, explanation: 'Successful conversion to a lean system tends to require a more cooperative relationship with vendors.' },
            { id: 1351, chapter: 14, text: 'The single-minute exchange of die is a system for reducing defective product.', options: ['True', 'False'], answer: 1, explanation: 'Single-minute exchange of die reduces setup costs and therefore lot sizes.' },
            { id: 1352, chapter: 14, text: 'In a balanced system, cycle time is equal to Takt time.', options: ['True', 'False'], answer: 0, explanation: 'Takt time is equal to cycle time in a balanced system.' },
            { id: 1353, chapter: 14, text: 'It is important to lower the water (inventory) completely to expose all the rocks (problems).', options: ['True', 'False'], answer: 1, explanation: 'Inventory only needs to be lowered modestly to expose the most pressing problems. Over time, with subsequent reductions, all problems will be uncovered.' },
            { id: 1354, chapter: 14, text: 'Successful lean implementation requires much more than slogans and idealistic goals such as zero inventories and zero defects.', options: ['True', 'False'], answer: 0, explanation: 'Lean represents a fundamental shift in the philosophy of the organization, requiring changes in a wide variety of areas.' },
            { id: 1355, chapter: 14, text: 'Lean concepts include large lots to take advantage of the economies of scale.', options: ['True', 'False'], answer: 1, explanation: 'Lean concepts include small lots to avoid holding costs and associated wastes.' },
            { id: 1356, chapter: 14, text: 'Value-stream mapping is concerned strictly with the flow of materials through a production system.', options: ['True', 'False'], answer: 1, explanation: 'Value-stream mapping also looks at information flows.' },
            { id: 1357, chapter: 14, text: 'For a company with a product mix of 40% of product A and 30% each of products B and C, which of the following mixed-model sequences most reflects the lean philosophy?', options: ['AABBCCAABC', 'ABCABCABCA', 'AAAABBBCCC', 'BCABCABCAB', 'BBBAACCCAA'], answer: 1, explanation: 'This sequence matches the demand rate most closely.' },
            { id: 1358, chapter: 14, text: 'The lean philosophy suggests that workers are _________.', options: ['Assets', 'Liabilities', 'Interchangeable', 'Replaceable', 'To be phased out'], answer: 0, explanation: 'This is a fundamental tenet of the lean philosophy.' },
            { id: 1359, chapter: 14, text: 'The ultimate goal of lean operations is to have:', options: ['no in-process inventories', 'cross-trained workers capable of handling every process', 'a smooth, rapid flow of materials through the system', 'no setup times', 'all of the above'], answer: 2, explanation: 'This flow should be perfectly balanced with the demand rate.' },
            { id: 1360, chapter: 14, text: 'Which one of the following is not one of the building blocks that is the foundation of the lean philosophy?', options: ['product design', 'process design', 'personnel/organizational elements', 'manufacturing planning and control', 'kanban'], answer: 4, explanation: 'Kanban is not a philosophical building block but a tool whose usage often reflects the lean philosophy.' },
            { id: 1361, chapter: 14, text: 'Building up an inventory of standard parts or modules instead of immediately producing the finished end items is the essence of:', options: ['delayed differentiation', 'kanban', 'autonomation', 'andon', 'matrix management'], answer: 0, explanation: 'Delayed differentiation reduces setup costs with respect to the finished item.' },
            { id: 1362, chapter: 14, text: 'Which of the following would you not expect to see in a lean environment?', options: ['a flexible system', 'minimum inventory', 'little waste', 'reduced setup times', 'a significant number of daily schedule changes'], answer: 4, explanation: 'Daily schedule changes would interrupt the smooth flow that is central to lean production.' },
            { id: 1363, chapter: 14, text: 'The comprehensive approach used in lean systems to deal with quality includes:', options: ['designing quality into products and processes', 'insisting vendors provide high quality materials', 'making workers responsible for producing high quality', 'A, B and C', '100% inspection of raw materials, work-in-process and finished goods'], answer: 3, explanation: 'Complete inspection would be wasteful in the lean philosophy.' },
            { id: 1364, chapter: 14, text: 'Which of the following is not a benefit of small lot sizes in lean systems?', options: ['In-process inventory is considerably less.', 'Each product is produced less frequently.', 'Carrying costs are reduced.', 'There is less clutter in the workplace.', 'Inspection and rework costs are less.'], answer: 1, explanation: 'Each product is produced more frequently with small lot sizes.' },
            { id: 1365, chapter: 14, text: 'In the lean philosophy, the ideal lot size is:', options: ['the economic order quantity', 'the economic run size', 'one unit', 'the capacity of the standard container', 'N= (DT(1+X))/C'], answer: 2, explanation: 'A lot size of one unit is ideal in a lean environment.' },
            { id: 1366, chapter: 14, text: 'Which of the following does not contribute to reduced setup time and cost?', options: ['standardized setup tools', 'standardized setup equipment', 'custom setup procedures for each product', 'use of multipurpose equipment or attachments', 'use of group technology'], answer: 2, explanation: 'Custom setups would increase complexity and therefore setup time and cost.' },
            { id: 1367, chapter: 14, text: 'A conveyance __________ signals parts movement.', options: ['Request', 'Routing', 'Bar code', 'Kanban', 'Kazian'], answer: 3, explanation: 'A conveyance kanban would authorize a batch of parts to be moved.' },
            { id: 1368, chapter: 14, text: 'The term that refers to the automatic detection of defects is:', options: ['kaizen', 'kanban', 'autonomation', 'automation', '100% inspection'], answer: 2, explanation: 'Automatically detecting defects is key to reducing waste.' },
            { id: 1369, chapter: 14, text: 'A basic requirement for operating with the low inventories present in lean systems is:', options: ['Inventory space must be increased.', 'Inventory investment must be increased.', 'Major problems must be identified.', 'Major problems must have been solved.', 'Inventories must be reduced rapidly.'], answer: 3, explanation: 'Identifying problems does not facilitate low-inventory operations. Solving problems does.' },
            { id: 1370, chapter: 14, text: 'Which of the following is not characteristic of preventive maintenance in lean systems?', options: ['maintaining equipment in good operating condition', 'replacing parts when they are worn but before they fail', 'workers maintaining their own equipment', 'eliminating supplies of spare parts to reduce capital investment', 'perceiving breakdowns as an opportunity for improvement'], answer: 3, explanation: 'Reducing spare parts supplies makes the system more vulnerable to a breakdown.' },
            { id: 1371, chapter: 14, text: 'The Five S\'s don\'t include _______.', options: ['Sort', 'Straighten', 'Sanitize', 'Sweep', 'Standardize'], answer: 2, explanation: 'Sanitize is not one of the five S\'s.' },
            { id: 1372, chapter: 14, text: 'The Kaizen philosophy applies to ________.', options: ['Employee development', 'Safety stock', 'Waste', 'Supply Chain Management', 'MRP III'], answer: 2, explanation: 'Through continuous improvement, more and more problems are overcome and the system can be made leaner and leaner.' },
            { id: 1373, chapter: 14, text: 'A kanban card is used to signal that:', options: ['work is needed at the work center', 'work is ready to be moved to the next station', 'a worker has run out of parts needed for further processing', 'a machine has broken down and needs immediate attention', 'a machine is ready for preventive maintenance'], answer: 0, explanation: 'Kanban cards signal authorization from downstream work centers.' },
            { id: 1374, chapter: 14, text: 'With regard to suppliers, lean systems typically require:', options: ['delivery of large lots at regular intervals', 'buyer inspection of goods and materials', 'multiple sources from which to purchase', 'long-term relationships and commitments', 'the lowest price possible'], answer: 3, explanation: 'Long-term relationships help ensure that suppliers become partners in the lean firm\'s waste-reduction efforts.' },
            { id: 1375, chapter: 14, text: 'Which of the following is characteristic of the lean philosophy?', options: ['Inventories are an asset.', 'Lot sizes are optimized by formula.', 'Vendors are co-workers, essentially other departments of our organization.', 'Queues are a necessary investment.', 'all of the above'], answer: 2, explanation: 'Long-term relationships help ensure that suppliers become partners in the lean firm\'s waste-reduction efforts.' },
            { id: 1376, chapter: 14, text: 'The activities controlled in the same way by kanban and MRP II is the determination of:', options: ['rates of output', 'products to be built', 'materials required', 'capacity required', 'feedback information'], answer: 1, explanation: 'Both kanban and MRPII are used to signal production.' },
            { id: 1377, chapter: 14, text: 'Process design supporting lean doesn\'t include ______.', options: ['Production flexibility', 'Duplicate facilities', 'Setup time reduction', 'Minimal inventory storage', 'Small lot sizes'], answer: 1, explanation: 'Facilities duplication would be inherently wasteful.' },
            { id: 1378, chapter: 14, text: 'Which of the following questions is not answered by value stream mapping?', options: ['Where does waste occur?', 'Which processes or sub-processes exhibit the most variability?', 'Where are the best opportunities to extract more value from customers?', 'Where are process bottlenecks?', 'Where do errors occur?'], answer: 2, explanation: 'Value-stream mapping is a process-focused tool.' },
            { id: 1379, chapter: 14, text: 'A successful conversion to a lean system requires that the conversion:', options: ['be done as quickly as possible', 'begin at the start of the process and work forward', 'convert vendors to lean as one of the last steps', 'reduce setup times as one of the last steps', 'all of the above'], answer: 2, explanation: 'A firm can become leaner and leaner with its vendors doing so. Only in the last stages does it become important for vendors themselves to become lean.' },
            { id: 1380, chapter: 14, text: 'A potential obstacle to conversion to a lean system is:', options: ['lack of management commitment', 'lack of worker cooperation', 'supplier resistance', 'all of the above', 'insufficient space to store the increased inventories'], answer: 3, explanation: 'Inventories will not increase in a lean conversion.' },
            { id: 1381, chapter: 14, text: 'A system of lights used at each workstation to signal problems or slowdowns is:', options: ['command and control center', 'automation', 'andon', 'pull system', 'kanban'], answer: 2, explanation: 'Andon focuses attention on where in the process problems are.' },
            { id: 1382, chapter: 14, text: 'Which of the following contributes to the competitive advantage enjoyed by firms using lean production?', options: ['Backup employees to cover for absenteeism', '100% inspection to remove defects', 'Dedicated equipment to reduce unit costs', 'Safety stocks to prevent stock-outs', 'Greater flexibility to cope with change'], answer: 4, explanation: 'Firms that use lean production can become more flexible relative to their competitors.' },
            { id: 1383, chapter: 14, text: 'An operations strategy reflecting the lean philosophy of production should recognize that lean:', options: ['is most suited for non-repetitive manufacturing', 'cannot be implemented sequentially', 'requires a wholesale commitment from the outset', 'may provide a competitive advantage', 'all of the above'], answer: 3, explanation: 'Lean is not for every firm and every strategy.' },
            { id: 1384, chapter: 14, text: 'With regard to suppliers, lean systems typically involve:', options: ['delivery of large lots on short notice', 'the highest quality at the lowest price', 'long-term relationships', 'multiple suppliers to assure continuous availability', 'dedicated staging areas for material'], answer: 2, explanation: 'Long-term relationships typically are necessary to make the vendor a partner in the leaning effort.' },
            { id: 1385, chapter: 14, text: 'A common objective of both MRP and the lean philosophy is to:', options: ['smooth production', 'minimize inventory', 'obtain high quality', 'reduce overhead', 'eliminate inventory'], answer: 1, explanation: 'MRP and the lean philosophy are similar in this objective. They differ substantially in how they pursue it.' },
            { id: 1386, chapter: 14, text: 'The ultimate objective in a lean system is:', options: ['low to moderate levels of inventory', 'high quality, zero defects', 'minimal waste (less than 6%)', 'balanced and rapid flow', 'all of the above'], answer: 3, explanation: 'Balanced and rapid flow is key to being a waste-free system.' },
            { id: 1387, chapter: 14, text: 'The All Seasonings Company uses 3,200 glass jars at one of its jar-filling workstations each eight hours of production. The cycle time for a standard container, which holds 90 jars, averages 45 minutes. If management uses an efficiency factor of twenty percent, how many containers should be used?', options: ['4 containers', '5 containers', '3 containers', '6 containers', '2 containers'], answer: 0, explanation: 'Given D = 3200/8 = 400 jars per hour, T = 45/60 = .75 hour, X = .20, C = 90 jars, N = 400(.75)(1.2)/90 = 4.' },
            { id: 1388, chapter: 14, text: 'The Four Star Publishing Company uses sixty reams of paper each hour at one of its high speed printing stations. The cycle time for a standard container, which holds 15 reams of paper, averages forty minutes. If management has decided to use three containers, what efficiency factor was applied?', options: ['12.5%', '15%', '10%', '20%', '25%'], answer: 0, explanation: 'Given N = 3 containers, D = 60 reams per hour, T = 40/60 = 2/3 hour, C = 15 reams, X = NC/DT - 1 = 3(15)/(60)(2/3) - 1 = .125 = 12.5%.' },
            { id: 1389, chapter: 14, text: 'A production system uses kanban cards to control production and movement of parts. One work center uses an average of 40 pieces per hour of a certain part. Standard containers hold 10 parts. The cycle time for parts containers is about 36 minutes. Management has assigned an efficiency factor of .20 to this work center. How many containers should be used to support this operation?', options: ['3 containers', '4 containers', '2 containers', '5 containers', '6 containers'], answer: 0, explanation: 'Given D = 40/hour, T = 0.6 hours, X = 0.20 and C = 10, N = 40(0.6)(1.2)/10 = 2.88 ≈ 3.' },
            { id: 1390, chapter: 14, text: 'A production cell uses 240 pounds of plastic resin each 8-hour day. Resin is transported in drums that hold 100 pounds each. The material is obtained from a nearby supplier, and has a 12-hour cycle time. An efficiency factor of .15 has been assigned to this cell. What is the optimum number of containers to support this operation?', options: ['5 containers', '4 containers', '6 containers', '3 containers', '7 containers'], answer: 0, explanation: 'Given D = 240/8 = 30 pounds/hour, T = 12 hours, C = 100 pounds, X = 0.15, N = 30(12)(1.15)/100 = 4.14 ≈ 5.' },
            { id: 1391, chapter: 14, text: 'When lean is used in the context of services, which of the following is most often the focus?', options: ['the labor content of the service', 'the time needed to perform a service', 'the inventory tied up in the service', 'the equipment used in the service', 'suppliers of inputs to the service'], answer: 1, explanation: 'This is because speed is often an important order winner for services.' },
            { id: 1392, chapter: 14, text: 'Which of the following would not contribute to the leaning of services?', options: ['improve the reliability of vendors', 'increase the flexibility of the service system', 'have service workers handle multiple tasks', 'standardize the service output', 'improve the service process'], answer: 2, explanation: 'Having service workers handle multiple tasks often makes the system less lean.' },
            { id: 1393, chapter: 14, text: 'Having a vendor be responsible for managing the restocking of inventory is what is meant by the term ___________.', options: ['JIT II', 'MRP II', 'SCM I', 'EOQ III', 'POQ II'], answer: 0, explanation: 'JIT II is also known as vendor-managed inventory.' },
            { id: 1394, chapter: 14, text: 'Because the lean philosophy is so consequential competitively, firms are often advised to adopt it ________.', options: ['with products in the introduction phase of their life-cycle', 'with their vendors first', 'completely all at once', 'sequentially over time', 'globally before locally'], answer: 3, explanation: 'A gradual adoption of lean often gives a clearer picture of its benefits and drawbacks.' },
            { id: 1395, chapter: 14, text: 'Previously management calculated the number of kanban cards allowed by using a value of 1.3 for X. Assuming nothing else (e.g., usage rates, container capacities, etc.) which of the following values for X would indicate management\'s believing that the system has become more efficient?', options: ['2.6', '2.3', '1.5', '1.4', '1.2'], answer: 4, explanation: 'Decreasing values for X indicate, everything else being equal, a system that is improving in efficiency.' },

            // === CHƯƠNG 14S: 38 câu ===
            { id: 1396, chapter: '14s', text: 'The goal of maintenance is to minimize cost.', options: ['True', 'False'], answer: 1, explanation: 'The goal of maintenance is to keep the production system in good working order at minimal cost.' },
            { id: 1397, chapter: '14s', text: 'The goal of maintenance is to maintain the productive system in good working order while minimizing or eliminating the cost of preventive maintenance.', options: ['True', 'False'], answer: 1, explanation: 'The goal of maintenance is to keep the production system in good working order at minimal cost.' },
            { id: 1398, chapter: '14s', text: 'Breakdown maintenance includes activities such as equipment inspection and adjustment.', options: ['True', 'False'], answer: 1, explanation: 'Breakdown maintenance occurs after a problem has occurred.' },
            { id: 1399, chapter: '14s', text: 'Degree of technology is a factor affecting the decision of how much preventive maintenance is desirable.', options: ['True', 'False'], answer: 0, explanation: 'The age and condition of facilities and equipment, the degree of technology involved, the type of production process, and similar factors enter into the decision of how much preventive maintenance is desirable.' },
            { id: 1400, chapter: '14s', text: 'Breakdown maintenance is best performed on a regularly scheduled basis.', options: ['True', 'False'], answer: 1, explanation: 'Breakdown maintenance occurs only after a breakdown.' },
            { id: 1401, chapter: '14s', text: 'One basis for scheduling preventive maintenance is passage of time.', options: ['True', 'False'], answer: 0, explanation: 'Preventative maintenance can be scheduled simply by the passage of time.' },
            { id: 1402, chapter: '14s', text: 'Ideally, preventive maintenance will be performed before a breakdown or failure.', options: ['True', 'False'], answer: 0, explanation: 'This will result in the longest possible use of facilities or equipment without a breakdown.' },
            { id: 1403, chapter: '14s', text: 'In the broadest sense, preventive maintenance extends back to the installation stage of equipment and facilities.', options: ['True', 'False'], answer: 1, explanation: 'In the broadest sense, preventive maintenance extends back to the design and selection stage of equipment and facilities.' },
            { id: 1404, chapter: '14s', text: 'Pareto analysis (using the 80/20 rule) is one method of determining when preventive maintenance activities should be performed.', options: ['True', 'False'], answer: 1, explanation: 'Pareto analysis is a method for prioritizing breakdown programs.' },
            { id: 1405, chapter: '14s', text: 'In the area of maintenance, the Pareto phenomenon is reflected in the fact that, regardless of problem classification, all equipment will justify about the same expense.', options: ['True', 'False'], answer: 1, explanation: 'A Pareto phenomenon in such situations would imply that a relatively few pieces of equipment will be extremely important to the functioning of the system, thereby justifying considerable effort and/or expense.' },
            { id: 1406, chapter: '14s', text: 'Proactive maintenance is periodic.', options: ['True', 'False'], answer: 0, explanation: 'Periodic maintenance occurs before problems do.' },
            { id: 1407, chapter: '14s', text: 'It is best to replace a failing piece of equipment with one that will have identical capabilities as the equipment being replaced since we are already familiar with that machine.', options: ['True', 'False'], answer: 1, explanation: 'Sometimes it is the case that new equipment means that employees must be retrained, but this doesn\'t necessarily mean that newer equipment should be passed over.' },
            { id: 1408, chapter: '14s', text: 'Cutting preventive maintenance in half will probably double the number of breakdowns.', options: ['True', 'False'], answer: 1, explanation: 'Breakdowns may become more likely, but they wouldn\'t necessarily double.' },
            { id: 1409, chapter: '14s', text: 'If one operator performing preventive maintenance requires two hours to complete the job, then two operators working together should complete the preventive maintenance in one hour.', options: ['True', 'False'], answer: 1, explanation: 'Two operators are not necessarily twice as productive as one. Space limitations, for example, can reduce the value-add of the second operator.' },
            { id: 1410, chapter: '14s', text: 'Maintenance activities are often organized into the two groups:', options: ['breakdown maintenance and preventive maintenance', 'breakdown maintenance and predictive maintenance', 'preventive maintenance and predictive maintenance', 'equipment maintenance and breakdown maintenance', 'equipment maintenance and buildings maintenance'], answer: 0, explanation: 'These are the two groups into which maintenance is often organized.' },
            { id: 1411, chapter: '14s', text: 'Breakdown maintenance is _____________; preventative maintenance is _________.', options: ['reactive; proactive', 'proactive; reactive', 'expensive; inexpensive', 'inexpensive; expensive', 'easy; hard'], answer: 0, explanation: 'Proactive maintenance is preventative maintenance.' },
            { id: 1412, chapter: '14s', text: 'The goal of maintenance is to maintain the productive system in good working order while minimizing:', options: ['total preventive maintenance costs', 'total breakdown maintenance costs', 'total maintenance costs', 'the difference between preventive and breakdown costs', 'the ratio of breakdown to preventive maintenance costs'], answer: 2, explanation: 'The cost of maintenance includes the cost of maintaining equipment as well as the cost of breakdowns.' },
            { id: 1413, chapter: '14s', text: '___________ is most closely associated with breakdown maintenance.', options: ['equipment adjustments', 'equipment cleaning', 'equipment inspection', 'repair of broken parts', 'replacement of worn parts'], answer: 3, explanation: 'Repairing broken parts is primarily part of breakdown maintenance.' },
            { id: 1414, chapter: '14s', text: 'Factors affecting the decision of how much preventive maintenance is desirable typically include all of the following except:', options: ['age of equipment', 'type of product', 'degree of technology', 'type of production process', 'how critical to the production process'], answer: 1, explanation: 'The type of product does not typically enter into this question.' },
            { id: 1415, chapter: '14s', text: 'Cost of equipment breakdown doesn\'t include:', options: ['loss of output', 'cost of idle workers', 'damage to other equipment', 'replacement costs', 'potential safety hazard'], answer: 3, explanation: 'The breakdown cost basically involves the cost of restoring a machine to production.' },
            { id: 1416, chapter: '14s', text: 'The optimum amount of preventive maintenance is where:', options: ['Total breakdown costs are a minimum.', 'Total preventive maintenance costs are a minimum.', 'Each maintenance component cost is a minimum.', 'Total maintenance costs are a maximum.', 'Total maintenance costs are a minimum.'], answer: 4, explanation: 'Total maintenance costs include preventative maintenance costs as well as breakdown and repair costs.' },
            { id: 1417, chapter: '14s', text: 'The type of maintenance which is periodic in nature is:', options: ['breakdown maintenance', 'predictive maintenance', 'preventive maintenance', 'corrective maintenance', 'all of the above'], answer: 2, explanation: 'Preventative maintenance is routine.' },
            { id: 1418, chapter: '14s', text: 'Preventive maintenance is generally scheduled on the basis of:', options: ['planned inspections', 'passage of time', 'number of operating hours', 'all of the above', 'none of the above'], answer: 3, explanation: 'Preventative maintenance is routine.' },
            { id: 1419, chapter: '14s', text: 'Ideally, preventive maintenance will be performed:', options: ['after a planned inspection', 'after the passage of a specified period of time', 'after a predetermined number of operating hours', 'just prior to the start of the workday', 'just prior to a breakdown or failure'], answer: 4, explanation: 'This will result in the longest possible use of facilities or equipment without a breakdown.' },
            { id: 1420, chapter: '14s', text: 'Attempting to determine when preventive maintenance activities should be performed is called:', options: ['breakdown maintenance', 'forecastive maintenance', 'preventive maintenance', 'predictive maintenance', 'corrective maintenance'], answer: 3, explanation: 'Predictive maintenance is an attempt to determine when to perform preventive maintenance activities.' },
            { id: 1421, chapter: '14s', text: '"Total productive maintenance" is best described as:', options: ['avoiding all breakdown maintenance', 'doing a great deal of preventative maintenance to try to avoid breakdown maintenance', 'a JIT approach taking advantage of cross-training', 'extending preventative maintenance back to design', 'none of the above'], answer: 3, explanation: 'This approach is consistent with JIT systems and lean operations, where employees are given greater responsibility for quality, productivity, and the general functioning of the system.' },
            { id: 1422, chapter: '14s', text: 'In the broadest sense, equipment and facilities preventive maintenance extends back to the:', options: ['design and selection stage', 'procurement stage', 'installation stage', 'pilot-testing stage', 'implementation stage'], answer: 0, explanation: 'Maintenance problems are sometimes designed into a system.' },
            { id: 1423, chapter: '14s', text: 'The major approaches used in plans to deal with breakdowns include all of the following except:', options: ['standby equipment', 'inventories of spare parts', 'operator repair of minor problems', 'readily available repair personnel', 'All of these are major approaches.'], answer: 4, explanation: 'All of these are major approaches in breakdown programs.' },
            { id: 1424, chapter: '14s', text: 'In the area of maintenance, the Pareto phenomenon is reflected in the fact that:', options: ['All equipment justifies about the same expense.', 'A majority of equipment will justify considerable expense.', 'A few pieces of equipment will justify little expense.', 'A few pieces of equipment will justify considerable expense.', 'No piece of equipment will justify major expense; it\'s better to replace.'], answer: 3, explanation: 'In such a Pareto phenomenon, many pieces of equipment will justify little effort or expense.' },
            { id: 1425, chapter: '14s', text: 'Reactive maintenance is _____________ maintenance.', options: ['Planned', 'After the event', 'Proactive', 'Predictive', 'Preventive'], answer: 1, explanation: 'The event would be a breakdown.' },
            { id: 1426, chapter: '14s', text: 'The total maintenance curve (preventive maintenance cost plus breakdown and repair cost):', options: ['slopes up as the number of preventive maintenances increase', 'slopes down as the number of preventive maintenances increase', 'starts low, increases rapidly and then drops back down as the number of preventive maintenances increase', 'starts high, drops gradually but then goes back up as the number of preventive maintenances increase', 'remains relatively flat as the number of preventive maintenances increase'], answer: 3, explanation: 'For a while, expenditures in preventative maintenance are more than offset by reductions in breakdown costs.' },
            { id: 1427, chapter: '14s', text: 'The frequency of breakdown of a piece of equipment per month is shown in the table. The cost of a breakdown is $1,000 and the cost of preventive maintenance is $2,000 per month. Assume that the equipment breakdown can be avoided if preventive maintenance is performed. Should the manager use preventive maintenance, or would it be better to fix the equipment when it breaks down?', options: ['Preventative maintenance would offer a monthly savings of $550', 'Preventative maintenance would offer a monthly savings of $450', 'Preventative maintenance would offer a monthly savings of $650', 'Preventative maintenance would offer a monthly savings of $350', 'Preventative maintenance would offer a monthly savings of $500'], answer: 0, explanation: 'The expected number of breakdowns without preventive maintenance is: (0 x 0.1) + (1 x 0.15) + (2 x 0.20) + (3 x 0.30) + (4 x 0.15) + (5 x 0.10) = 2.55. Expected monthly breakdown cost is therefore 2.55 * $1,000 = $2,550. As preventive maintenance will cost only $2,000 per month, it offers a monthly savings of $550.' },
            { id: 1428, chapter: '14s', text: 'The average time before breakdown of a machine is normally distributed and has a mean of 7 weeks and a standard deviation of 1.5 weeks. If breakdown cost averages $2,500 and preventive maintenance costs $500, what is the optimal preventive maintenance interval?', options: ['Approximately every 5½ weeks', 'Approximately every 6 weeks', 'Approximately every 5 weeks', 'Approximately every 4½ weeks', 'Approximately every 7 weeks'], answer: 0, explanation: 'The ratio of preventive cost to the sum of preventive and breakdown cost is: 500/(500+2500) = .1667. The Z-value associated with this ratio (treated as a cumulative probability) is -0.97. This can be used to find the optimal maintenance interval: 7 - 0.97(1.5) = 5.545 ≈ 5.5 weeks.' },

            // === CHƯƠNG 15: 89 câu ===
            { id: 1429, chapter: 15, text: 'A company\'s supply chain involves the flow of materials and information from suppliers, through production, to the end users.', options: ['True', 'False'], answer: 0, explanation: 'Flow of materials and information are the central focus of supply chain management.' },
            { id: 1430, chapter: 15, text: 'In supply chain organizations, functions must operate independently of each other.', options: ['True', 'False'], answer: 1, explanation: 'Functions should be integrated.' },
            { id: 1431, chapter: 15, text: 'In purchasing, one\'s only ethical obligation is to one\'s suppliers.', options: ['True', 'False'], answer: 1, explanation: 'Purchasing personnel have ethical obligations with regard to a variety of stakeholders, primarily the organizations that employ them.' },
            { id: 1432, chapter: 15, text: 'Using third-party logistics involves using your organization\'s logistics function to ship to customers that aren\'t officially part of the supply chain.', options: ['True', 'False'], answer: 1, explanation: 'Using third-party logistics involves outsourcing the logistics function.' },
            { id: 1433, chapter: 15, text: 'Every business organization is part of at least one supply chain.', options: ['True', 'False'], answer: 0, explanation: 'Either the business organization is a complete supply chain or it is a player in a supply chain.' },
            { id: 1434, chapter: 15, text: 'Frequent deliveries of small shipments can reduce inventory but also result in an increase in the transportation cost per unit.', options: ['True', 'False'], answer: 0, explanation: 'This is one of the tradeoffs inherent in supply chain management.' },
            { id: 1435, chapter: 15, text: 'The materials in the supply chain flow toward the end of the chain, while the information and the dollars move toward the beginning of the chain.', options: ['True', 'False'], answer: 1, explanation: 'Material flows toward the final consumer and information and dollars flow upstream.' },
            { id: 1436, chapter: 15, text: 'Managing supply chain visibility involves making sure that potential supply chain partners are aware of your organization\'s needs.', options: ['True', 'False'], answer: 1, explanation: 'Supply chain visibility has to do with making sure that current trading partners have access to needed data in real time.' },
            { id: 1437, chapter: 15, text: 'The goal of supply chain management is to synchronize supply and demand of all of the organizations that are part of the chain.', options: ['True', 'False'], answer: 0, explanation: 'Synchronizing multiple organizations is one of the difficulties of supply chain management.' },
            { id: 1438, chapter: 15, text: 'The need for supply chain management increases as globalization increases.', options: ['True', 'False'], answer: 0, explanation: 'As globalization increases supply chain management is becoming more important.' },
            { id: 1439, chapter: 15, text: 'The design of the supply chain and establishing partnerships with vendors and distributors are examples of operating issues in a supply chain.', options: ['True', 'False'], answer: 1, explanation: 'These are tactical responsibilities.' },
            { id: 1440, chapter: 15, text: 'Traffic management refers to truck movement within our parking areas.', options: ['True', 'False'], answer: 1, explanation: 'Traffic management is the management of the shipment of incoming and outgoing goods.' },
            { id: 1441, chapter: 15, text: 'One of the major reasons for a company to adopt third-party logistics is to concentrate on one\'s core business.', options: ['True', 'False'], answer: 0, explanation: 'Outsourcing logistics to third parties enables a company to focus on its core business.' },
            { id: 1442, chapter: 15, text: 'E-commerce refers to the use of electronic technology to facilitate business transactions.', options: ['True', 'False'], answer: 0, explanation: 'E-commerce is a growing trend in supply chain management.' },
            { id: 1443, chapter: 15, text: 'E-commerce involves business-to-business (B2B) interaction only.', options: ['True', 'False'], answer: 1, explanation: 'E-commerce can also involve business-to-consumer (B2C) interactions.' },
            { id: 1444, chapter: 15, text: 'Disintermediation refers to the phenomenon that the traditional retailer or service provider is reduced or eliminated in a supply chain.', options: ['True', 'False'], answer: 0, explanation: 'Disintermediation involves reducing one or more steps in a supply chain by cutting out intermediaries.' },
            { id: 1445, chapter: 15, text: 'Most people working for a business organization are somehow involved with the supply chain of that business.', options: ['True', 'False'], answer: 0, explanation: 'Most people working for a business organization are involved in the flow of materials, money or information.' },
            { id: 1446, chapter: 15, text: 'Strategic partnering is encouraged when two or more business organizations have complementary products or services that would benefit the others.', options: ['True', 'False'], answer: 0, explanation: 'Complementarity is key to successful strategic partnering.' },
            { id: 1447, chapter: 15, text: 'Forming strategic partnerships is beneficial for two or more business organizations that have the same products or services.', options: ['True', 'False'], answer: 1, explanation: 'Complementarity is key to successful strategic partnering.' },
            { id: 1448, chapter: 15, text: 'Inventory velocity refers to the average speed (in miles/hour) of material handling equipment in a warehouse.', options: ['True', 'False'], answer: 1, explanation: 'Velocity refers to the rate at which goods pass through a supply chain.' },
            { id: 1449, chapter: 15, text: 'Global supply chains make purchasing easier because of more options.', options: ['True', 'False'], answer: 1, explanation: 'Global purchasing is more complex because of the variety of issues and risks that must be considered.' },
            { id: 1450, chapter: 15, text: 'Centralized or decentralized purchasing is directly related to the size of an organization.', options: ['True', 'False'], answer: 1, explanation: 'The use of centralized or decentralized purchasing is independent of organization size.' },
            { id: 1451, chapter: 15, text: 'The optimization of the supply chain uses a mathematical model to determine the optimal number of business organizations to be included in the chain.', options: ['True', 'False'], answer: 1, explanation: 'Optimizing a supply chain through mathematical models is typically not feasible.' },
            { id: 1452, chapter: 15, text: 'Information technology is the key to success of global supply chains.', options: ['True', 'False'], answer: 0, explanation: 'Global supply chains are made possible by the use of information technology.' },
            { id: 1453, chapter: 15, text: 'Bullwhip effect refers to a phenomenon that demand variations that exist at the customer end of the supply chain are magnified as orders are generated back through the supply chain.', options: ['True', 'False'], answer: 0, explanation: 'The effect of demand variations grows as it works its way back through the supply chain.' },
            { id: 1454, chapter: 15, text: 'Starting with the final customer and moving backward through the supply chain, batch sizes and the level of safety stock tend to decrease.', options: ['True', 'False'], answer: 1, explanation: 'Safety stock might increase, but batch sizes won\'t.' },
            { id: 1455, chapter: 15, text: 'Scheduling and maintaining equipment are operational decisions.', options: ['True', 'False'], answer: 0, explanation: 'Maintenance would be a form of corrective or preventative action to ensure the continued availability of capacity.' },
            { id: 1456, chapter: 15, text: 'To prevent temporary storage in a warehouse, cross docking can be used.', options: ['True', 'False'], answer: 0, explanation: 'In cross-docking, inbound goods are moved directly onto outbound trucks.' },
            { id: 1457, chapter: 15, text: 'Delayed differentiation is a means of increasing product variety without building the customized product from scratch or keeping large inventories of custom products.', options: ['True', 'False'], answer: 0, explanation: 'Delayed differentiation is used to create customized output without large inventories.' },
            { id: 1458, chapter: 15, text: 'Returned goods are part of reverse logistics.', options: ['True', 'False'], answer: 0, explanation: 'Reverse logistics involves managing the flow of goods back up the supply chain.' },
            { id: 1459, chapter: 15, text: 'A 30% reduction in product and service variety won\'t really affect the efficiency of a supply chain.', options: ['True', 'False'], answer: 1, explanation: 'Reducing variety is a prominent means of increasing efficiency.' },
            { id: 1460, chapter: 15, text: 'The service function of purchasing interfaces with many area including legal, accounting, and engineering functions.', options: ['True', 'False'], answer: 0, explanation: 'Purchasing interfaces with a wide variety of areas.' },
            { id: 1461, chapter: 15, text: 'Gate keeping manages the cost of shipping returned goods.', options: ['True', 'False'], answer: 1, explanation: 'Gate keeping manages the cost of dealing with inappropriately returned goods.' },
            { id: 1462, chapter: 15, text: 'Outsourcing logistics gives a company less flexibility because it forces them to focus more on core businesses.', options: ['True', 'False'], answer: 1, explanation: 'Outsourcing logistics can lead to more flexibility.' },
            { id: 1463, chapter: 15, text: 'Vendor analysis examines the function of purchased parts and materials with a view towards improvement or cost reduction.', options: ['True', 'False'], answer: 1, explanation: 'Vendor analysis evaluates sources of supply with respect to price, quality, reputation and service.' },
            { id: 1464, chapter: 15, text: 'Using third-party fulfillment means losing control of fulfillment.', options: ['True', 'False'], answer: 0, explanation: 'Outsource this key function means a loss of control.' },
            { id: 1465, chapter: 15, text: 'Price is the primary determining factor in choosing a vendor since most products are essentially the same.', options: ['True', 'False'], answer: 1, explanation: 'With vendor analysis, price is just one of many considerations.' },
            { id: 1466, chapter: 15, text: 'RFID eliminates the need for counting and bar-code scanning.', options: ['True', 'False'], answer: 0, explanation: 'RFID does away with the need for counting and bar-code scanning.' },
            { id: 1467, chapter: 15, text: 'The importance of purchasing relates only to the cost of parts and materials purchased, which is often 60% or more of the cost of finished goods.', options: ['True', 'False'], answer: 1, explanation: 'Purchasing is important because other costs resulting from the purchase of parts and materials are highly consequential.' },
            { id: 1468, chapter: 15, text: 'The importance of purchasing is the cost of goods purchased, the quality of goods and services, and the timing of deliveries of goods or services.', options: ['True', 'False'], answer: 0, explanation: 'These costs resulting from the purchase of parts and materials are highly consequential.' },
            { id: 1469, chapter: 15, text: 'Vendor analysis is the process that evaluates the source of supply in terms of price, quality, reputation, and service.', options: ['True', 'False'], answer: 0, explanation: 'Evaluating sources of terms of price, quality, reputation, and service is vendor analysis.' },
            { id: 1470, chapter: 15, text: 'In e-commerce, the front-end design is significantly more important than the back-end design.', options: ['True', 'False'], answer: 1, explanation: 'Back-end design is often more consequential in e-commerce.' },
            { id: 1471, chapter: 15, text: 'One disadvantage to RFID is that they require a \'line of sight\' for reading.', options: ['True', 'False'], answer: 1, explanation: 'RFID doesn\'t need a \'line of sight\' reading.' },
            { id: 1472, chapter: 15, text: 'Decentralized purchasing can usually offer quicker response than centralized purchasing.', options: ['True', 'False'], answer: 0, explanation: 'Centralized purchasing can be more efficient, but decentralized purchasing can offer faster response.' },
            { id: 1473, chapter: 15, text: 'Some firms have structured their procurement function to include both centralized and decentralized purchasing.', options: ['True', 'False'], answer: 0, explanation: 'Good purchasing can involve both centralized and decentralized elements.' },
            { id: 1474, chapter: 15, text: 'Creating an effective supply chain requires linking the marketing, distribution, and supplier channels.', options: ['True', 'False'], answer: 0, explanation: 'These need to be synchronized if the supply chain is to be effective.' },
            { id: 1475, chapter: 15, text: 'An advantage of decentralized purchasing is the attention given to local needs.', options: ['True', 'False'], answer: 0, explanation: 'Decentralized purchasing is more responsive to specific needs.' },
            { id: 1476, chapter: 15, text: 'Event management is the advanced planning required for major performances such as concerts or conferences.', options: ['True', 'False'], answer: 1, explanation: 'Event management involves detecting and responding to unplanned events.' },
            { id: 1477, chapter: 15, text: 'Supplier certification is the first step required in a supplier audit program.', options: ['True', 'False'], answer: 1, explanation: 'Even uncertified suppliers are potential targets in a supplier audit program.' },
            { id: 1478, chapter: 15, text: 'Design and purchasing people should work closely because changes in design, specifications, or materials can impact future purchase requirements.', options: ['True', 'False'], answer: 0, explanation: 'Purchasing interfaces with a wide variety of functional areas.' },
            { id: 1479, chapter: 15, text: 'The purchasing cycle ends when the purchasing department is notified that the supplier has shipped the items.', options: ['True', 'False'], answer: 1, explanation: 'The purchasing cycle ends when the shipment has been received in satisfactory condition.' },
            { id: 1480, chapter: 15, text: 'Producing and shipping in large lots may reduce costs but increase lead times.', options: ['True', 'False'], answer: 0, explanation: 'This is one of the tradeoffs in supply chain management.' },
            { id: 1481, chapter: 15, text: 'Variations create uncertainty, thereby causing inefficiencies in a supply chain.', options: ['True', 'False'], answer: 0, explanation: 'Reductions in disruptions helps improve supply chain efficiencies.' },
            { id: 1482, chapter: 15, text: 'Disintermediation is the refusal of one party to use mediators for price negotiation.', options: ['True', 'False'], answer: 1, explanation: 'Disintermediation involves reducing one or more steps in a supply chain by cutting out intermediaries.' },
            { id: 1483, chapter: 15, text: 'Which of the following is not a goal of supply chain management?', options: ['fewer suppliers and long-term relationship', 'small lot sizes', 'on time deliveries', 'lowest possible transportation costs', 'delivery often to the place of use'], answer: 3, explanation: 'Minimizing transportation costs might lead to an unacceptable tradeoff elsewhere.' },
            { id: 1484, chapter: 15, text: 'Logistics includes all of these except:', options: ['the movement of materials within a production facility', 'incoming shipments of goods or materials', 'outgoing shipments of goods or materials', 'customer selection', 'returned goods processing'], answer: 3, explanation: 'Logistics involves moving goods.' },
            { id: 1485, chapter: 15, text: 'Small changes in consumer demand can result in large variations in orders placed because of the …', options: ['Supply chain', 'Safety stock requirement', 'Lead time effect', 'Bullwhip effect', 'FCFS scheduling'], answer: 3, explanation: 'Variations are amplified as they move backwards in the supply chain.' },
            { id: 1486, chapter: 15, text: 'RFID chips: (I) are used to track goods in distribution (II) are used to track job progress in production (III) are used to provide special instructions to operators (IV) can be used in inventory record keeping', options: ['II and III only', 'I and II only', 'II, III, and IV', 'I, II, and IV', 'IV only'], answer: 3, explanation: 'RFID chips do not contain special instructions.' },
            { id: 1487, chapter: 15, text: 'Which of the following is not a benefit of RFID?', options: ['increased productivity', 'elimination of paper work', 'frequent deliveries of smaller shipments', 'reduction in clerical labor', 'increased accuracy'], answer: 2, explanation: 'RFID does little to facilitate the cost reductions required to make frequent, small deliveries feasible.' },
            { id: 1488, chapter: 15, text: 'A factor that makes it desirable for business organizations to actively manage their supply chains is:', options: ['more potential vendors', 'increasing globalization', 'downsizing', 'the internet', 'RFID\'s'], answer: 1, explanation: 'Globalization is making supply chain management more important.' },
            { id: 1489, chapter: 15, text: 'Which of the following is not a benefit of effective supply chain management?', options: ['lower inventory costs', 'higher productivity', 'shorter lead times', 'greater customer loyalty', 'larger number of suppliers'], answer: 4, explanation: 'Supply chain management often results in fewer suppliers.' },
            { id: 1490, chapter: 15, text: 'Which of the following is not a measure of the reliability of the supply chain?', options: ['supply chain response time', 'on-time delivery', 'fill rate', 'lead time variability', 'improving e-fulfillment statistics'], answer: 0, explanation: 'Response time is a measure of supply chain effectiveness.' },
            { id: 1491, chapter: 15, text: 'The automatic identification of material is part of/facilitated by:', options: ['holding costs', 'RFID', 'working capital reduction', 'net present value calculations', 'vendor analysis'], answer: 1, explanation: 'RFID facilitates the automatic identification of material.' },
            { id: 1492, chapter: 15, text: 'Which of the following is not an application of E-business?', options: ['internet buying and selling', 'e-mail', 'order and shipment tracking', 'electronic data interchange (EDI)', 'universal product codes'], answer: 4, explanation: 'Universal product codes are not part of E-business.' },
            { id: 1493, chapter: 15, text: 'Which of the following is an advantage of E-business? (I) reduction of transaction costs (II) shortened supply chain response time (III) greater customer loyalty', options: ['I', 'II', 'I and II', 'II and III', 'I, II, and III'], answer: 2, explanation: 'Gaining and maintaining customer loyalty is even more difficult once a firm is involved in E-business.' },
            { id: 1494, chapter: 15, text: 'Which of the following is a barrier to integration of separate organizations in the supply chain? (I) conflicting objectives of the companies in the chain. (II) different level of capacity of the companies in the chain. (III) reluctance of the organizations in the chain to allow other organizations access to their data.', options: ['I only', 'I and II', 'II and III', 'I and III', 'I, II and III'], answer: 3, explanation: 'Capacity imbalances can be overcome, but conflicting objectives and mistrust are substantial barriers.' },
            { id: 1495, chapter: 15, text: '_________ has helped business concentrate on their core business.', options: ['Supply Chains', 'Scheduling', 'Outsourcing', 'ERP', 'Lean Production'], answer: 2, explanation: 'Outsourcing enables firms to focus on what they do, or should do, best.' },
            { id: 1496, chapter: 15, text: 'Outsourcing followed by __________ is not simple.', options: ['Integration', 'Unionization', 'Backsourcing', 'Computerization', 'Just-in-time'], answer: 2, explanation: 'Backsourcing is difficult to implement effectively if outsourcing has been done.' },
            { id: 1497, chapter: 15, text: 'The interface between the firm and its suppliers is:', options: ['purchasing', 'production', 'distribution', 'engineering', 'accounting'], answer: 0, explanation: 'The purchasing function bridges the organization and its suppliers.' },
            { id: 1498, chapter: 15, text: 'The two types of decisions that are relevant to supply chain management are:', options: ['Short, long term', 'Domestic, international', 'Location, layout', 'In-source, out-source', 'Tactical, operational'], answer: 4, explanation: 'Decision-making in supply chain management falls into either tactical or operational areas.' },
            { id: 1499, chapter: 15, text: 'One important objective of purchasing is to:', options: ['set quality standards for purchased items', 'be knowledgeable about new products', 'maintain numerous sources of supply', 'obtain the lowest prices on all purchased items', 'determine the processes that should be used'], answer: 1, explanation: 'Purchasing can play a crucial role by helping solidify the supplier base for a new product.' },
            { id: 1500, chapter: 15, text: 'The purchasing cycle begins with:', options: ['selecting a supplier', 'placing an order', 'evaluating potential vendors', 'conducting a value analysis', 'receiving a requisition'], answer: 4, explanation: 'The requisition notes what is needed, in what quantity, and when it is needed.' },
            { id: 1501, chapter: 15, text: 'Examination of the sources of supply for purchased parts or materials in order to improve performance is called:', options: ['vendor analysis', 'value analysis', 'negotiated purchasing', 'reverse engineering', 'disintegration'], answer: 0, explanation: 'Performance can be evaluated with respect to price, quality, reputation or service.' },
            { id: 1502, chapter: 15, text: 'Vendor analysis has the greatest potential for savings for items which have:', options: ['low cost per unit', 'low annual cost-volume', 'high cost per unit', 'high annual usage', 'high annual cost-volume'], answer: 4, explanation: 'These represent the bulk of purchasing costs.' },
            { id: 1503, chapter: 15, text: 'Which of the following is not true of vendor analysis?', options: ['It involves an examination of the function of purchased parts or raw materials.', 'Its purpose is to reduce costs and/or improve performance of purchased goods or services.', 'It is usually performed only periodically.', 'Representatives from design and operations may work with purchasing.', 'If improvements are identified, purchasing implements those that purchasing agrees are justified.'], answer: 0, explanation: 'The function of purchased parts or raw materials would be done by the procuring department.' },
            { id: 1504, chapter: 15, text: 'Which of the following is not a performance driver?', options: ['Quality', 'Cost', 'Stability', 'Velocity', 'Flexibility'], answer: 2, explanation: 'Stability is not a performance driver.' },
            { id: 1505, chapter: 15, text: 'Which of the following would not usually be a main factor in selecting a vendor?', options: ['location', 'price', 'quality', 'inventory turnover', 'vendor services'], answer: 3, explanation: 'Turnover would only rarely be associated with the vendor that is selected.' },
            { id: 1506, chapter: 15, text: 'Which of the following is part of the purchasing cycle? (I) Purchasing selects a supplier. (II) Orders from vendors are received. (III) Purchasing receives a requisition.', options: ['II and III', 'I, II, and III', 'I only', 'I and II', 'I and III'], answer: 1, explanation: 'These are all part of the purchasing cycle.' },
            { id: 1507, chapter: 15, text: 'Which of the following is least likely to be a key consideration when a company chooses a supplier?', options: ['lead time and on-time delivery', 'reputation and financial stability', 'value analysis', 'quality and Quality assurance', 'flexibility of design change'], answer: 2, explanation: 'All the others are highly likely to be considered in supplier selection.' },
            { id: 1508, chapter: 15, text: 'Which of the following is not a benefit of centralized purchasing?', options: ['potential for quantity discounts', 'better service from suppliers', 'quick response to local needs', 'potential for use of purchasing specialists', 'supplier research'], answer: 2, explanation: 'Quick response to local needs is a benefit of decentralized purchasing.' },
            { id: 1509, chapter: 15, text: 'The purchasing perspective of the supplier as a partner is characterized by:', options: ['an emphasis on low prices', 'one or a few suppliers', 'low flexibility', '100% inspection for quality', 'low volume'], answer: 1, explanation: 'Fewer suppliers enhance the chances of building real partnerships.' },
            { id: 1510, chapter: 15, text: 'Vendor Analysis is the examination of the _________ of purchased materials.', options: ['Function', 'Source', 'Quality', 'Cycle', 'Quantity'], answer: 1, explanation: 'Sources of supply are evaluated in vendor analysis.' },
            { id: 1511, chapter: 15, text: 'Last quarter, a retailer sold 8,000 t-shirts, 7,000 of which were sold directly from on-hand inventory. This retailer\'s ________ was 88%.', options: ['fill rate', 'inventory yield', 'profit margin', 'inventory turnover', 'none of the above'], answer: 0, explanation: 'This retailer\'s fill rate was 88%.' },
            { id: 1512, chapter: 15, text: 'Which of the following is a principle required for ethical behavior in purchasing?', options: ['loyalty to employer', 'justice to those you deal with', 'faith in your profession', 'all of the above', 'none of the above'], answer: 3, explanation: 'All of these are ethical principles in purchasing.' },
            { id: 1513, chapter: 15, text: 'The activity which begins with a request from within the organization is:', options: ['Outsourcing search', 'Purchasing cycle', 'Supplier selection', 'Order receipt', 'Supply chain management'], answer: 1, explanation: 'The purchasing cycle begins with a requisition.' },
            { id: 1514, chapter: 15, text: 'Our organization can obtain visibility to potential trading partners on the internet by using:', options: ['C2C', 'B2C', 'B2B', 'C2B', 'None of the above'], answer: 2, explanation: 'B2B helps the organization let the market know of the organization\'s needs.' },
            { id: 1515, chapter: 15, text: 'Real time information about product movement on store shelves could benefit from the use of:', options: ['batch processing', 'economic order quantities', 'statistical process control', 'radio frequency identification tags', 'infrared remote scanners'], answer: 3, explanation: 'RFID facilitates real-time data gathering.' },
            { id: 1516, chapter: 15, text: 'The website and order fulfillment are essential features of:', options: ['delayed differentiation', 'e-commerce', 'internet service providers', 'inventory balancing', 'market segmentation'], answer: 1, explanation: 'These are front-end and back-end facets of e-commerce.' },
            { id: 1517, chapter: 15, text: 'A given inventory item has a per-year holding cost of $500. One method of shipping this item is three days faster than the other, but it is $2.50 more per unit. Using the slower method would be __________ more expensive overall than using the faster method.', options: ['$1.08', '$1.16', '$2.37', '$2.73', '$1.61'], answer: 2, explanation: 'Multiply the holding cost by the speed differential, then divide by 365. Compare this to the actual shipping cost difference. The faster method saves 500*3/365 = $4.11 in holding costs. The slower method costs $2.50 less in shipping, so it is $2.50 - $4.11 = -$1.61 less expensive (i.e., the slower method is $1.61 more expensive).' },

            // === CHƯƠNG 16: 144 câu ===
            { id: 1518, chapter: 16, text: '"Flow-shop scheduling" is used in high volume systems.', options: ['True', 'False'], answer: 0, explanation: 'Flows shops are high volume operations.' },
            { id: 1519, chapter: 16, text: 'Line balancing is a major factor in the design and scheduling of low volume systems because of batch processing.', options: ['True', 'False'], answer: 1, explanation: 'Line balancing is used in high volume operations.' },
            { id: 1520, chapter: 16, text: 'Scheduling in intermediate-volume systems has three basic issues: run size, timing, and sequence.', options: ['True', 'False'], answer: 0, explanation: 'These are the basic issues in scheduling in intermediate-volume systems.' },
            { id: 1521, chapter: 16, text: 'When operations are often bottlenecked, additional planned idle time will improve the throughput in those areas.', options: ['True', 'False'], answer: 1, explanation: 'Additional planned idle time would reduce throughput in bottlenecked operations.' },
            { id: 1522, chapter: 16, text: 'When orders exceed our capacity, priority rules are used to select which orders will be accepted.', options: ['True', 'False'], answer: 1, explanation: 'Priority rules are used to determine the sequence in which orders will be processed.' },
            { id: 1523, chapter: 16, text: 'The term loading, as used in scheduling, refers to choosing the order in which jobs will be processed in low-volume systems.', options: ['True', 'False'], answer: 1, explanation: 'Loading refers to which jobs will be assigned to which resources or blocks of time.' },
            { id: 1524, chapter: 16, text: 'Loading is the determination of which work centers should perform which jobs.', options: ['True', 'False'], answer: 0, explanation: 'Loading refers to which jobs will be assigned to which resources or blocks of time.' },
            { id: 1525, chapter: 16, text: 'A Gantt chart is a basic scheduling tool but works best for high-volume systems.', options: ['True', 'False'], answer: 1, explanation: 'A Gantt chart works best for low volume systems.' },
            { id: 1526, chapter: 16, text: 'A Gantt chart is a basic scheduling tool that is most useful in low-volume systems.', options: ['True', 'False'], answer: 0, explanation: 'A Gantt chart is most useful in low-volume systems.' },
            { id: 1527, chapter: 16, text: 'A schedule chart depicts the loading and idle times for a group of machines or departments.', options: ['True', 'False'], answer: 1, explanation: 'A schedule chart depicts the progress of jobs.' },
            { id: 1528, chapter: 16, text: 'The output of the system cannot exceed the output of the bottleneck operation(s).', options: ['True', 'False'], answer: 0, explanation: 'The bottleneck limits the system\'s potential output.' },
            { id: 1529, chapter: 16, text: 'The elimination of idle time on both bottleneck and non-bottleneck operations must be accomplished to optimize output.', options: ['True', 'False'], answer: 1, explanation: 'Eliminating idle time on non-bottleneck operations might actually decrease output.' },
            { id: 1530, chapter: 16, text: 'As long as the bottleneck operations are used effectively idle time in non-bottleneck operations will not affect the overall productivity of the system.', options: ['True', 'False'], answer: 0, explanation: 'Idle time in non-bottleneck operations doesn\'t necessarily affect system productivity.' },
            { id: 1531, chapter: 16, text: 'The quantity sent to a bottleneck operation could be split into two or more process batches to better utilize a bottleneck resource rather than process the entire batch.', options: ['True', 'False'], answer: 1, explanation: 'At a bottleneck smaller batches likely would reduce utilization.' },
            { id: 1532, chapter: 16, text: 'Splitting a large lot after one operation beyond a bottleneck operation would reduce the overall waiting time of the bottleneck operation.', options: ['True', 'False'], answer: 1, explanation: 'This would have no effect on the waiting time of the bottleneck operation.' },
            { id: 1533, chapter: 16, text: 'Input/output (I/O) control refers to monitoring the productivity changes since productivity is determined by the ratio of Output to Input.', options: ['True', 'False'], answer: 1, explanation: 'I/O control refers to monitoring output and waiting times at work centers.' },
            { id: 1534, chapter: 16, text: 'Infinite loading and finite loading are two major approaches used to load work centers.', options: ['True', 'False'], answer: 0, explanation: 'These are the two major loading approaches.' },
            { id: 1535, chapter: 16, text: 'A schedule chart can be used to monitor job progress.', options: ['True', 'False'], answer: 0, explanation: 'A schedule chart monitors job progress.' },
            { id: 1536, chapter: 16, text: 'The assignment model seeks an optimum matching of tasks and resources.', options: ['True', 'False'], answer: 0, explanation: 'Matching jobs with resources can be done with the assignment model.' },
            { id: 1537, chapter: 16, text: 'Sequencing is concerned with the order in which jobs are done, while loading is concerned with assigning jobs to work centers or workstations.', options: ['True', 'False'], answer: 0, explanation: 'Sequencing concerns order, loading concerns assignment.' },
            { id: 1538, chapter: 16, text: 'Priority rules are widely used to sequence jobs in high-volume systems.', options: ['True', 'False'], answer: 1, explanation: 'Priority rules are used in low-volume systems.' },
            { id: 1539, chapter: 16, text: 'The assignment method is limited to a maximum of two jobs per resource.', options: ['True', 'False'], answer: 1, explanation: 'There are no such limits in the use of the assignment method.' },
            { id: 1540, chapter: 16, text: 'Priority rules generally assume that job setup cost is independent of processing sequence of jobs.', options: ['True', 'False'], answer: 0, explanation: 'If setup cost isn\'t sequence-independent, certain assignment rules might not perform as anticipated.' },
            { id: 1541, chapter: 16, text: 'In a single work center, makespan improvement can be accomplished by selecting the optimal sequencing rule.', options: ['True', 'False'], answer: 1, explanation: 'Makespan remains constant regardless of the sequencing rule in this situation.' },
            { id: 1542, chapter: 16, text: 'Priority rules are used in low-volume systems to identify an optimal processing sequence.', options: ['True', 'False'], answer: 1, explanation: 'What is optimal depends on what facet of performance is critical in low-volume systems.' },
            { id: 1543, chapter: 16, text: 'The SPT priority rule always results in the lowest average completion time.', options: ['True', 'False'], answer: 0, explanation: 'SPT minimizes average flow time.' },
            { id: 1544, chapter: 16, text: 'Bottlenecks may shift with the passage of time, so that different operations become bottleneck operations at different times.', options: ['True', 'False'], answer: 0, explanation: 'As systems become more balanced, bottlenecks can shift across operations.' },
            { id: 1545, chapter: 16, text: 'If optimal sequencing through three work centers is desired, Johnson\'s Rule II is used rather than Johnson\'s Rule.', options: ['True', 'False'], answer: 1, explanation: 'No simple rule is available for optimal scheduling across more than two work centers.' },
            { id: 1546, chapter: 16, text: 'In the decision-making hierarchy, scheduling decisions are the final step in the transformation process before actual output occurs.', options: ['True', 'False'], answer: 0, explanation: 'Scheduling is the last phase of the coordination-and-control hierarchy.' },
            { id: 1547, chapter: 16, text: 'Makespan is the total time needed to complete a group of jobs.', options: ['True', 'False'], answer: 0, explanation: 'It is the sum of processing times plus any wait times that might be necessary.' },
            { id: 1548, chapter: 16, text: 'The theory of constraints has a goal of maximizing flow through the entire system.', options: ['True', 'False'], answer: 0, explanation: 'The theory of constraints is focused on maximizing throughput.' },
            { id: 1549, chapter: 16, text: 'A major disadvantage of the SPT rule is that it tends to make very short jobs wait for a long time while longer, more important jobs are processed.', options: ['True', 'False'], answer: 1, explanation: 'SPT\'s disadvantage is that very long jobs might wait much longer than is appropriate.' },
            { id: 1550, chapter: 16, text: 'The SPT rule minimizes idle time for subsequent operations.', options: ['True', 'False'], answer: 0, explanation: 'Because it minimizes average flow time, downstream operations are less likely to be starved.' },
            { id: 1551, chapter: 16, text: 'Johnson\'s rule is a technique used to sequence jobs through a two-step work sequence.', options: ['True', 'False'], answer: 0, explanation: 'Johnson\'s rule is for two work centers.' },
            { id: 1552, chapter: 16, text: 'A basic difference between scheduling in service systems and scheduling in manufacturing systems is the random nature of requests in manufacturing systems as opposed to more uniform requests in service systems.', options: ['True', 'False'], answer: 1, explanation: 'Services tend to experience less uniform demand.' },
            { id: 1553, chapter: 16, text: 'Batch process helps maximize worker efficiency.', options: ['True', 'False'], answer: 0, explanation: 'Setup times can be economized on in a batch process.' },
            { id: 1554, chapter: 16, text: 'Because scheduling is a matter of detailed execution, it has little impact on the operations strategy of an organization.', options: ['True', 'False'], answer: 1, explanation: 'Scheduling has significant strategic aspects.' },
            { id: 1555, chapter: 16, text: 'Scheduling pertains to:', options: ['hiring workers', 'process selection', 'buying machinery', 'timing the use of specific resources', 'determining the lowest cost'], answer: 3, explanation: 'Scheduling involves the timing of the use of specific resources.' },
            { id: 1556, chapter: 16, text: 'Which of the following is the last step in the capacity/scheduling chain?', options: ['product planning', 'process planning', 'capacity planning', 'aggregate planning', 'scheduling'], answer: 4, explanation: 'Scheduling is the lowest step in this hierarchy.' },
            { id: 1557, chapter: 16, text: 'Which of the following is not an example of a high-volume system?', options: ['aircraft manufacturing', 'magazine printing', 'petroleum refining', 'waste treatment', 'commercial donut baking'], answer: 0, explanation: 'Aircraft manufacturing is an example of low-volume production.' },
            { id: 1558, chapter: 16, text: 'Which of the following is not usually a characteristic of successful high-volume systems?', options: ['smooth workflow through the system', 'customized output', 'rapid repair of breakdowns', 'minimal quality problems', 'reliable supply schedules'], answer: 1, explanation: 'High-volume systems rarely provide customized output.' },
            { id: 1559, chapter: 16, text: 'Primary considerations in scheduling high-volume systems involve: (I) coordinating the flow of inputs (II) overcoming the disruptions to planned outputs (III) assigning workers to work centers', options: ['I and III', 'I and II', 'II and III', 'I, II, and III', 'II only'], answer: 1, explanation: 'Work assignments are not typically an issue in high-volume systems.' },
            { id: 1560, chapter: 16, text: 'Organizations with fixed, perishable capacity can benefit from _______.', options: ['Yield Management', 'Price increases', 'Constraints', 'Sub-optimization', 'Waiting lines'], answer: 0, explanation: 'Yield management helps optimize profits when fixed, perishable capacity is present.' },
            { id: 1561, chapter: 16, text: 'A work center can be a ___________.', options: ['machine', 'group of machines', 'department', 'facility', 'all of the above'], answer: 4, explanation: 'Any of these could be considered a work center.' },
            { id: 1562, chapter: 16, text: 'The EDD priority rule usually does well with regard to _______.', options: ['Cost', 'Lateness', 'Overtime', 'Waste', 'Makespan'], answer: 1, explanation: 'EDD is useful when due date performance is important.' },
            { id: 1563, chapter: 16, text: 'Which of the following is not an assumption of priority rules?', options: ['The set of jobs is known: no new jobs arrive after processing begins.', 'Setup time is independent of processing sequence.', 'Finite loading is assumed.', 'Processing times are deterministic.', 'No machine breakdowns are assumed.'], answer: 2, explanation: 'Priority rules do not assume finite loading.' },
            { id: 1564, chapter: 16, text: 'The two different approaches to load work centers in job-shop scheduling are:', options: ['load charts and schedule charts', 'Gantt charts and assignment method', 'infinite loading and finite loading', 'linear programming and makespan', 'none of the above'], answer: 2, explanation: 'These are the two approaches.' },
            { id: 1565, chapter: 16, text: 'The priority rule which will sequence jobs in the order they are received is _________.', options: ['EDD', 'LIFO', 'SPT', 'CR', 'FCFS'], answer: 4, explanation: 'This is the same as first-in-first-out.' },
            { id: 1566, chapter: 16, text: 'A scheduling technique used to achieve an optimum, one-to-one matching of tasks and resources is:', options: ['the assignment method', 'Johnson\'s rule', 'the optimum production technology method (OPT)', 'the appointment method', 'the reservation method'], answer: 0, explanation: 'The assignment method matches tasks with resources optimally.' },
            { id: 1567, chapter: 16, text: 'In a task assignment situation, in how many different ways can five jobs be assigned to five machines?', options: ['1', '5', '25', '120', '3,125'], answer: 3, explanation: 'This is simply calculated as 5! = 120.' },
            { id: 1568, chapter: 16, text: 'In an assignment method problem, if it takes Abe 3 hours to build a birdhouse and 4 hours for a doghouse, while Betty takes 4 hours for a birdhouse and 3 hours for a doghouse, what is the reduced cost (in hours) of assigning Abe to build the doghouse?', options: ['0 hours', '1 hour', '2 hours', '3 hours', '4 hours'], answer: 0, explanation: 'Abe is one hour slower at building the doghouse.' },
            { id: 1569, chapter: 16, text: 'The matrix below shows relative costs for various job-machine combinations. Which set of pairs constitutes the minimum-cost solution using the Assignment method?', options: ['1-B, 2-C, 3-A', '1-B, 2-A, 3-C', '1-A, 2-C, 3-B', '1-A, 2-B, 3-C', '1-C, 2-A, 3-B'], answer: 0, explanation: 'These are the minimum-cost pairings.' },
            { id: 1570, chapter: 16, text: 'Based on the cost information given in the table below, which set of job-machine pairs reflects the minimum-cost solution using the Assignment method?', options: ['1-B, 2-A, 3-C', '1-A, 2-B, 3-C', '1-C, 2-A, 3-B', '1-B, 2-C, 3-A', '1-C, 2-B, 3-A'], answer: 0, explanation: 'These are the minimum-cost pairs.' },
            { id: 1571, chapter: 16, text: 'Effective scheduling cannot:', options: ['yield cost savings and improved productivity', 'reduce the need for expansion of facilities', 'improve customer service', 'eliminate the need to train employees', 'improve patient care in medical settings'], answer: 3, explanation: 'Effective scheduling is only a part of organizational effectiveness.' },
            { id: 1572, chapter: 16, text: 'The priority rule where jobs are processed according to the smallest ratio of due date to processing time is:', options: ['CR', 'EEDD', 'FCFS', 'S/O', 'SPT'], answer: 0, explanation: 'The CR ratio schedules jobs in increasing order of this ratio.' },
            { id: 1573, chapter: 16, text: 'Scheduled due dates are the result of:', options: ['promises to customers', 'MRP processing', 'managerial decisions', 'all of the above', 'our competitor\'s promises'], answer: 3, explanation: 'Scheduled due dates can result from a number of influences.' },
            { id: 1574, chapter: 16, text: 'Which of the following is not a measure for judging the effectiveness of a schedule sequence?', options: ['average number of jobs at the work center', 'total number of jobs at the work center', 'average completion (flow) time', 'average job tardiness', 'none of the above'], answer: 1, explanation: 'The total number of jobs is not a typical evaluation measure.' },
            { id: 1575, chapter: 16, text: 'The purpose of cyclical scheduling is to:', options: ['eliminate weekends and holidays', 'rotate schedules', 'add flexible hours', 'incorporate overtime', 'observe work patterns'], answer: 1, explanation: 'Cyclical scheduling is used to rotate schedules across a service workforce.' },
