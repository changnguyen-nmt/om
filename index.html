            { id: 601, chapter: 6, text: 'A manufacturing cell allows the production of a wide-range of very different products.', options: ['True', 'False'], answer: 1, explanation: 'A cell is for a modest variety of output within a product family.' },
            { id: 602, chapter: 6, text: 'Product layouts can more easily adapt to variations in product requirements than process layouts can.', options: ['True', 'False'], answer: 1, explanation: 'Process layouts are more adaptable.' },
            { id: 603, chapter: 6, text: 'Process layouts feature departments or other functional groupings of personnel or equipment.', options: ['True', 'False'], answer: 0, explanation: 'Departmental or functional grouping is an example of process layout.' },
            { id: 604, chapter: 6, text: 'Information technology refers to competitive data.', options: ['True', 'False'], answer: 1, explanation: 'Information technology refers to both data and systems.' },
            { id: 605, chapter: 6, text: 'A process layout is more susceptible to shutdowns caused by equipment breakdowns than a product layout.', options: ['True', 'False'], answer: 1, explanation: 'A product layout is more susceptible to these.' },
            { id: 606, chapter: 6, text: 'Accounting, purchasing, and inventory control are fairly routine with process layouts.', options: ['True', 'False'], answer: 1, explanation: 'They are more routine in product layouts.' },
            { id: 607, chapter: 6, text: 'A disadvantage of a product layout can be high in-process inventory costs.', options: ['True', 'False'], answer: 1, explanation: 'In-process inventory is low with a product layout.' },
            { id: 608, chapter: 6, text: 'In cellular manufacturing, machines and equipment are grouped by type (e.g., all grinders are grouped into a cell).', options: ['True', 'False'], answer: 1, explanation: 'In cellular layouts, machines and equipment are grouped by the needs of the product family.' },
            { id: 609, chapter: 6, text: 'Among the benefits claimed for cellular manufacturing are less material handling and reduced setup time.', options: ['True', 'False'], answer: 0, explanation: 'These are lower in cellular manufacturing.' },
            { id: 610, chapter: 6, text: 'Group technology is closely connected to cellular manufacturing.', options: ['True', 'False'], answer: 0, explanation: 'Both require a systematic analysis of parts to identify the part families.' },
            { id: 611, chapter: 6, text: 'The percentage of idle time in an assembly line is called cycle time.', options: ['True', 'False'], answer: 1, explanation: 'This is called balance delay.' },
            { id: 612, chapter: 6, text: 'Mismatches between operational capabilities and market demand can have a negative impact on an organization.', options: ['True', 'False'], answer: 0, explanation: 'These can lead to changes in processes.' },
            { id: 613, chapter: 6, text: 'Service layouts must be visually pleasing as well as functional.', options: ['True', 'False'], answer: 0, explanation: 'The service layout is often perceived by the customer.' },
            { id: 614, chapter: 6, text: '"Balance delay" is another name for the percentage of idle time in a product layout.', options: ['True', 'False'], answer: 0, explanation: 'Greater utilization implies a smaller balance delay.' },
            { id: 615, chapter: 6, text: '"Balance delay" is another name for the percentage of idle time in a process layout.', options: ['True', 'False'], answer: 1, explanation: 'Balance delay is applicable in product layouts.' },
            { id: 616, chapter: 6, text: 'For a production line, daily capacity can be determined by dividing the daily operating time by the line\'s cycle time.', options: ['True', 'False'], answer: 0, explanation: 'The line\'s cycle time represents the time between units. Thus, dividing the time available by the cycle time gives the daily capacity.' },
            { id: 617, chapter: 6, text: 'The minimum number of workstations for a production line is determined in part by the desired output rate.', options: ['True', 'False'], answer: 0, explanation: 'The desired output rate is used to find the required cycle time.' },
            { id: 618, chapter: 6, text: 'The goal of line balancing is to assign tasks to workstations in such a way that the workstations have approximately equal time requirements.', options: ['True', 'False'], answer: 0, explanation: 'This is why it is called line balancing.' },
            { id: 619, chapter: 6, text: 'An idle percentage of zero means a line is perfectly balanced.', options: ['True', 'False'], answer: 0, explanation: 'All workstations would be occupied 100% of the time.' },
            { id: 620, chapter: 6, text: 'None of the approaches to line balancing, manual or computerized, guarantees an optimal solution.', options: ['True', 'False'], answer: 0, explanation: 'Optimal solutions cannot be guaranteed through the use of heuristics.' },
            { id: 621, chapter: 6, text: 'Heuristic approaches to line balancing are the only approach that will guarantee an optimal solution.', options: ['True', 'False'], answer: 1, explanation: 'Heuristic approaches cannot guarantee an optimal solution.' },
            { id: 622, chapter: 6, text: 'The main issue in the design of process layouts concerns the relative positioning of the departments involved.', options: ['True', 'False'], answer: 0, explanation: 'Designing process layouts involves the relative positioning of the departments involved.' },
            { id: 623, chapter: 6, text: 'An advantage of a U-shaped production line is that it facilitates teamwork and flexibility in work assignments.', options: ['True', 'False'], answer: 0, explanation: 'These are key factors in favor of U-shaped layouts.' },
            { id: 624, chapter: 6, text: 'The goal in line balancing is to obtain a reasonable allocation of work to each station.', options: ['True', 'False'], answer: 1, explanation: 'The goal in line balancing is to arrive at a reasonable balance of work across the stations.' },
            { id: 625, chapter: 6, text: 'Cycle time is the maximum time allowed for each workstation to complete its work on each unit.', options: ['True', 'False'], answer: 0, explanation: 'Cycle time paces the production line.' },
            { id: 626, chapter: 6, text: 'The design of service layouts, e.g., warehouse and supermarket layouts, focuses on cost minimization and product flow.', options: ['True', 'False'], answer: 1, explanation: 'Often these are low-priority considerations.' },
            { id: 627, chapter: 6, text: 'Process layouts allow greater flexibility in processing than product layouts.', options: ['True', 'False'], answer: 0, explanation: 'Process layouts are more flexible.' },
            { id: 628, chapter: 6, text: 'Process layouts tend to have low in-process inventories.', options: ['True', 'False'], answer: 1, explanation: 'In-process inventories are relatively high in process layouts.' },
            { id: 629, chapter: 6, text: 'Flexibility can be used as a competitive strategy.', options: ['True', 'False'], answer: 0, explanation: 'Flexibility is a key competitive dimension.' },
            { id: 630, chapter: 6, text: 'Poor layouts are found in both manufacturing and service organizations.', options: ['True', 'False'], answer: 0, explanation: 'Both manufacturers and service firms benefit from improved layouts.' },
            { id: 631, chapter: 6, text: 'Numerically controlled (N/C) machine and some robots are applications of programmable automation.', options: ['True', 'False'], answer: 0, explanation: 'N/C machines and robots can be used in flexible manufacturing systems (FMS).' },
            { id: 632, chapter: 6, text: 'Which of the following is not a process commonly considered in making products or delivering services?', options: ['continuous', 'batch', 'repetitive', 'job shop', 'subcontracting'], answer: 4, explanation: 'Subcontracting isn\'t a process type.' },
            { id: 633, chapter: 6, text: 'The type of processing system which is used for highly standardized products is:', options: ['continuous', 'intermittent', 'project', 'batch', 'unit'], answer: 0, explanation: 'Continuous processing is for highly standardized products.' },
            { id: 634, chapter: 6, text: 'Cellular layout is a term associated with:', options: ['wireless telecommunication', 'part families', 'functional (or process) layouts', 'assembly lines', 'job shops'], answer: 1, explanation: 'Part families are produced on cells.' },
            { id: 635, chapter: 6, text: 'The substitution of machinery that has sensing and control devices for human labor is best described by the term:', options: ['automation', 'feedback control', 'computer-aided manufacturing', 'computer-integrated manufacturing', 'flexible manufacturing system'], answer: 0, explanation: 'Automation involves the substitution of machinery that has sensing and control devices for human labor.' },
            { id: 636, chapter: 6, text: 'Computer-aided manufacturing (CAM) refers to the use of computers in:', options: ['product design', 'decision making', 'data analysis', 'quality control', 'process control'], answer: 4, explanation: 'CAM automates process control.' },
            { id: 637, chapter: 6, text: 'A group of machines including supervisory computer control, automatic material handling, and possibly robots is called:', options: ['computer aided design', 'a manufacturing cell', 'computer-aided manufacturing', 'computer-integrated manufacturing', 'a flexible manufacturing system'], answer: 4, explanation: 'FMS involve all these things.' },
            { id: 638, chapter: 6, text: 'In which type of operations are you likely to see, at most, only minor variations in the product or service being produced using the same process and the same equipment?', options: ['a project', 'a job shop', 'repetitive production', 'batch processing', 'continuous production'], answer: 4, explanation: 'In continuous production there is no variation in the product or service being produced.' },
            { id: 639, chapter: 6, text: 'The process of assigning tasks to workstations in such a way that the workstations have approximately equal time requirements is called:', options: ['fair employment practices', 'idle time analysis', 'line balancing', 'cycle time optimization', 'none of the above'], answer: 2, explanation: 'The goal is to reasonably balance work across the workstations.' },
            { id: 640, chapter: 6, text: 'An operations strategy for process selection should recognize that:', options: ['process selection seldom requires technical expertise', 'engineering "white elephants" are uncommon', 'there is little need to manage technology', 'flexibility is not always the best choice', 'most technical skills can be contracted out to consultants'], answer: 3, explanation: 'Flexibility isn\'t so valuable if efficiency is at a premium.' },
            { id: 641, chapter: 6, text: 'Layout planning is required because of: (I) Efficient operations (II) Accidents or safety hazards (III) New products or services (IV) Morale problems', options: ['I and II', 'II and IV', 'I and III', 'II, III, and IV', 'I, II, III, and IV'], answer: 4, explanation: 'A number of factors affect layout planning.' },
            { id: 642, chapter: 6, text: 'The advantages of automation include: (I) Reduced output variability. (II) Reduced variable costs. (III) Machines don\'t strike or file grievances. (IV) Machines are always less expensive than human labor.', options: ['I and IV', 'II and III', 'I, II, and III', 'I and III', 'II and IV'], answer: 2, explanation: 'Machines can be more expensive than human labor.' },
            { id: 643, chapter: 6, text: 'The benefits of flexible manufacturing systems (FMS) include:', options: ['reduced labor costs', 'higher flexibility than automation', 'quick changeover from part to part', 'significantly lower unit costs', 'all of the above'], answer: 4, explanation: 'Reduced labor costs and consistent quality and quick changeover time provide lower unit costs.' },
            { id: 644, chapter: 6, text: 'Which type of processing system tends to produce the most product variety?', options: ['Assembly', 'Job-Shop', 'Batch', 'Continuous', 'Project'], answer: 1, explanation: 'A Job-Shop provides low volume of high-variety goods.' },
            { id: 645, chapter: 6, text: 'In which type of processing system would gasoline be produced from crude oil?', options: ['Job Shop', 'Batch', 'Assembly', 'Continuous', 'Project'], answer: 3, explanation: 'Oil refining is an example of a continuous process.' },
            { id: 646, chapter: 6, text: 'Which of the following is not a characteristic of layout decisions in system design?', options: ['substantial investment of both money and effort', 'long-term commitment', 'significant impact on short-term efficiency', 'usually well-received by operative personnel', 'all of the above'], answer: 3, explanation: 'Layout decisions can lead to conflict from those who are affected by them.' },
            { id: 647, chapter: 6, text: 'An example of automated services is:', options: ['on-line banking', 'build your own pizza', 'haircuts', 'massage parlors', 'all are examples of automated services'], answer: 0, explanation: 'On-line banking has almost no human to human interaction.' },
            { id: 648, chapter: 6, text: 'Which one of the following is not common to product layouts?', options: ['a high rate of output', 'specialization of labor', 'low unit costs', 'ability to adjust to changes in demand', 'all are common'], answer: 3, explanation: 'Product layouts are not flexible with respect to volume.' },
            { id: 649, chapter: 6, text: 'Which one of the following is not considered an important factor in service layout design?', options: ['cost minimization and product flow', 'frequency of orders', 'customer attitude and image', 'all are important', 'none are important'], answer: 0, explanation: 'Service layout design is generally not all that focused on cost minimization.' },
            { id: 650, chapter: 6, text: 'The type of layout which features departments or other functional groupings in which similar activities are performed is:', options: ['process', 'product', 'fixed-position', 'mass', 'unit'], answer: 0, explanation: 'Process layouts group similar activities.' },
            { id: 651, chapter: 6, text: 'Which of the following is not true about process layouts when they are compared to product layouts?', options: ['higher in-process inventories', 'lower span of supervision', 'lower rates of output', 'more involved cost accounting', 'lower unit costs'], answer: 4, explanation: 'Process layouts are not inherently more efficient that product layouts.' },
            { id: 652, chapter: 6, text: 'The type of layout in which workers, materials, and equipment are moved to the product as needed is:', options: ['process', 'product', 'fixed-position', 'batch', 'mass'], answer: 2, explanation: 'The fixed position layout brings the processes to the product.' },
            { id: 653, chapter: 6, text: 'The grouping of equipment by the operations needed to perform similar work for part families is:', options: ['product layout', 'cellular manufacturing layout', 'functional layout', 'fixed-position layout', 'process layout'], answer: 1, explanation: 'Cellular layouts are organized around part families.' },
            { id: 654, chapter: 6, text: 'Which term is most closely associated with cellular manufacturing?', options: ['part families', 'assembly line', 'robotics', 'CAD', 'CAM'], answer: 0, explanation: 'Part families are central to cellular manufacturing.' },
            { id: 655, chapter: 6, text: 'Laser technology used in surgical procedures is an example of technological advances in:', options: ['Product', 'Service', 'Process', 'Information', 'Reverse Engineering'], answer: 2, explanation: 'Laser technology represents a change in the fundamental surgical process.' },
            { id: 656, chapter: 6, text: 'Product profiling links key product or service requirements to:', options: ['Market conditions', 'Order sizes', 'Pricing strategies', 'Schedule changes', 'Process capabilities'], answer: 4, explanation: 'Product profiling allows firms to match what they should (or must) do with respect to product or service requirements.' },
            { id: 657, chapter: 6, text: 'Layout design has many objectives, one of which is ______.', options: ['reduce bottlenecks', 'move materials and workers simultaneously', 'use workers and space efficiently', 'hold material handling costs to 27% or less', 'install computer terminals every 500 feet'], answer: 2, explanation: 'Layout design is focused on the efficient placement of human and other assets.' },
            { id: 658, chapter: 6, text: 'Which phrase most closely describes flexible manufacturing systems?', options: ['a variation of CAD', 'a more fully automated version of cellular manufacturing', 'manufacturing resource planning', 'a process layout with a manufacturing overlay', 'an approach that allows workers to begin work at a time of their choosing'], answer: 1, explanation: 'Flexible automation allows for greater variety within or across product families.' },
            { id: 659, chapter: 6, text: 'A service organization (for example, a hospital) is likely to use a ________ layout because of variability in customer processing requirements.', options: ['project', 'process', 'flow', 'assembly', 'non-repetitive'], answer: 1, explanation: 'A process layout is capable of providing more variety.' },
            { id: 660, chapter: 6, text: 'In a product layout, the task of deciding how to assign work to specific stations is referred to as:', options: ['process balancing', 'task allocation', 'line balancing', 'work allocation', 'station balancing'], answer: 2, explanation: 'Line balancing allocates work to work stations.' },
            { id: 661, chapter: 6, text: 'The minimum possible cycle time in a product layout is determined by the:', options: ['longest task time', 'shortest task time', 'average task time', 'total task time', 'none of the above'], answer: 0, explanation: 'The longest task time represents the minimum cycle time.' },
            { id: 662, chapter: 6, text: 'A production line is to be designed for a job with three tasks. The task times are 0.4 minutes, 1.2 minutes, and 0.5 minutes. The maximum cycle time in minutes is:', options: ['0.3', '0.7', '1.4', '2.1', '0.8'], answer: 3, explanation: 'This assumes only one workstation.' },
            { id: 663, chapter: 6, text: 'A production line is to be designed for a job with three tasks. The task times are 0.3 minutes, 1.4 minutes, and 0.7 minutes. The minimum cycle time in minutes is:', options: ['0.3', '0.7', '1.4', '2.4', '0.8'], answer: 2, explanation: 'The longest task time equals the minimum cycle time.' },
            { id: 664, chapter: 6, text: 'Daily capacity of a product layout is determined by:', options: ['cycle time divided by operating time', 'operating time divided by cycle time', 'operating time divided by total task time', 'total task time divided by cycle time', 'cycle time divided by total task time'], answer: 1, explanation: 'This represents how many units are possible per day.' },
            { id: 665, chapter: 6, text: 'The maximum allowable cycle time is computed as:', options: ['daily operating time divided by the desired output', 'desired output divided by the daily operating time', 'daily operating time divided by the product of the desired output and the sum of job times', 'the product of desired output and the sum of job times divided by daily operating time', '1.00 minus station time'], answer: 0, explanation: 'If this is smaller than the minimum cycle time, extra workstations will be necessary.' },
            { id: 666, chapter: 6, text: 'If a line is balanced with 80 percent efficiency, the "balance delay" would be:', options: ['20 percent', '80 percent', '100 percent', 'unknown, since balance delay isn\'t related to efficiency', 'depends on the next operation'], answer: 0, explanation: 'Efficiency equals 100% minus balance delay.' },
            { id: 667, chapter: 6, text: 'The main issue in the design of process layouts for service operations concerns the relative positioning of:', options: ['workstations', 'processing components', 'departments', 'entrances, loading docks, etc.', 'manufacturing cells'], answer: 2, explanation: 'In process layouts, departments and their relative locations are of primary concern.' },
            { id: 668, chapter: 6, text: 'Which of the following is not an information requirement for the design of a process layout?', options: ['a list of departments or work centers', 'a projection of work flows between the work centers', 'the distance between locations', 'the cost per unit of distance to move loads', 'a list of product cycle times for every product manufactured'], answer: 4, explanation: 'Cycle times do not enter into the design of process layouts.' },
            { id: 669, chapter: 6, text: 'Which of the following is not an approach that companies use to achieve a smooth flow of production?', options: ['line balancing heuristics', 'parallel workstations', 'dynamic line balancing (Cross train workers)', 'mixed model line', 'Companies use all of these.'], answer: 4, explanation: 'Any of these is a means to achieve smooth flow.' },
            { id: 670, chapter: 6, text: 'A common goal in designing process layouts is:', options: ['minimizing the number of workers', 'minimizing idle time', 'minimizing transportation costs', 'maximizing work-station productive time', 'maximizing transportation distances'], answer: 2, explanation: 'An efficient process layout minimizes transportation costs.' },
            { id: 671, chapter: 6, text: 'In the use of closeness ratings for process layouts, the code "U" means the closeness between two departments is:', options: ['(U)nknown', '(U)nusually important', 'of (U)sual importance', '(U)nimportant', '(U)ndesirable'], answer: 3, explanation: 'Close department pairings denoted "U" should be avoided.' },
            { id: 672, chapter: 6, text: 'Which closeness rating reflects the undesirability of having two departments located near each other?', options: ['A', 'E', 'I', 'U', 'X'], answer: 4, explanation: 'Close department pairings denoted "U" should be avoided.' },
            { id: 673, chapter: 6, text: 'Which closeness rating reflects the highest importance for two departments being close to each other?', options: ['A', 'E', 'I', 'U', 'X'], answer: 0, explanation: 'Closeness ratings denoted "A" should be encouraged.' },
            { id: 674, chapter: 6, text: 'Which closeness rating reflects indifference on the nearness or lack of nearness of two departments?', options: ['A', 'E', 'I', 'U', 'X'], answer: 3, explanation: 'Closeness ratings denoted "U" are neither desirable nor undesirable.' },
            { id: 675, chapter: 6, text: 'Heuristic rules are used primarily in which of these types of layouts? (I) Product (II) Process (III) Fixed-position', options: ['I', 'II', 'I and III', 'I and II', 'II and III'], answer: 3, explanation: 'Heuristics help in formulating reasonably good product and process layouts.' },
            { id: 676, chapter: 6, text: 'Heuristic rules are usually applied when:', options: ['an optimum is necessary', 'a computer program isn\'t available', 'a problem has a small number of alternatives', 'a problem has a large number of alternatives', 'other approaches have failed'], answer: 3, explanation: 'As the number of alternatives grows, the use of heuristics becomes more attractive.' },
            { id: 677, chapter: 6, text: 'An advantage of a U-shaped production line is that it:', options: ['is more compact', 'permits better communication among employees', 'facilitates teamwork among workers', 'increases flexibility of work assignments', 'all of the above'], answer: 4, explanation: 'All of these are advantages of U-shaped lines.' },
            { id: 678, chapter: 6, text: 'Which of these items would be most likely to be made with a fixed position layout?', options: ['a Boeing 777 jet aircraft', 'applesauce', 'a computer chip', 'toothpaste', 'all of these'], answer: 0, explanation: 'A fixed position layout brings the process to the product.' },
            { id: 679, chapter: 6, text: 'A product focused, single piece flow, pull production system would be called a:', options: ['cellular layout', 'job shop', 'assembly line', 'non-repetitive process', 'continuous flow'], answer: 0, explanation: 'These are characteristics of cellular layouts.' },
            { id: 680, chapter: 6, text: 'Which one of these is a tool used to tell a machine the details of the operations to be performed?', options: ['CNC', 'CIM', 'CAD', 'CAM', 'automation'], answer: 0, explanation: 'CNC stores and transmits instructions on operations that are to be performed.' },
            { id: 681, chapter: 6, text: 'Which of the following is a primary concern for process selection?', options: ['variety in products/services', 'flexibility of equipment', 'volume of output', 'all of the above', 'none of the above'], answer: 3, explanation: 'All of these enter into the process selection decision.' },

            // === CHƯƠNG 7: 160 câu ===
            { id: 682, chapter: 7, text: 'Ergonomics is the use of computers and robots in the workplace.', options: ['True', 'False'], answer: 1, explanation: 'This is the discipline focused on the understanding of interactions among humans and other elements of a work system.' },
            { id: 683, chapter: 7, text: 'Specialization is one of the sources of disagreement between the efficiency and behavioral approaches to job design.', options: ['True', 'False'], answer: 0, explanation: 'Specialization is the primary area of disagreement between these two schools.' },
            { id: 684, chapter: 7, text: 'One disadvantage of specialization is worker dissatisfaction.', options: ['True', 'False'], answer: 0, explanation: 'Efficiency gains can come at the expense of more dissatisfied workers.' },
            { id: 685, chapter: 7, text: 'The quickest, most effective way to improve an employee\'s job satisfaction is increase his or her compensation.', options: ['True', 'False'], answer: 1, explanation: 'Improved work life can sometimes increase satisfaction with no increase in compensation.' },
            { id: 686, chapter: 7, text: 'Job enrichment involves giving a workers a greater share of the total task which is why they feel enriched.', options: ['True', 'False'], answer: 1, explanation: 'Job enrichment involves increasing the level of responsibility.' },
            { id: 687, chapter: 7, text: 'Trust is a factor influencing productivity.', options: ['True', 'False'], answer: 0, explanation: 'With greater trust, workers are more likely to respond to managers positively.' },
            { id: 688, chapter: 7, text: 'Many lower level jobs are monotonous and boring.', options: ['True', 'False'], answer: 0, explanation: 'Jobs at the lowest levels often involve heavy standardization.' },
            { id: 689, chapter: 7, text: 'Job enrichment involves an increase in the level of responsibility for planning and coordinating tasks.', options: ['True', 'False'], answer: 0, explanation: 'Job enrichment leads to workers with greater levels of responsibility.' },
            { id: 690, chapter: 7, text: '"Self-directed teams" are allowed to make changes in the work processes under their control.', options: ['True', 'False'], answer: 0, explanation: 'Self-directed teams often are great sources of information regarding improvements to work processes.' },
            { id: 691, chapter: 7, text: '"Self-directed teams" help other work groups make changes to their processes.', options: ['True', 'False'], answer: 1, explanation: 'Self-directed teams tend to be given responsibility only for their processes.' },
            { id: 692, chapter: 7, text: 'Motivation influences quality and productivity, but not the work environment.', options: ['True', 'False'], answer: 1, explanation: 'More motivated employees are more likely to suggest improvements in the work environment.' },
            { id: 693, chapter: 7, text: 'One important factor that influences productivity is trust between workers and managers.', options: ['True', 'False'], answer: 0, explanation: 'Greater trust in the relationship works both ways to improve productivity.' },
            { id: 694, chapter: 7, text: 'Ergonomics is an important part of job design to consider when we automate the system.', options: ['True', 'False'], answer: 1, explanation: 'Automation is reducing human interaction with the system, therefore ergonomics becomes a lesser concern.' },
            { id: 695, chapter: 7, text: 'One of the potential benefits of "self-directed teams" is higher productivity and greater worker satisfaction.', options: ['True', 'False'], answer: 0, explanation: 'Self-directed teams can be both more satisfied and more productive.' },
            { id: 696, chapter: 7, text: 'One of the potential benefits of "self-directed teams" is higher quality.', options: ['True', 'False'], answer: 0, explanation: 'Quality is a frequent target of self-directed teams.' },
            { id: 697, chapter: 7, text: 'One potential disadvantage of "self-directed teams" is higher training costs.', options: ['True', 'False'], answer: 1, explanation: 'Training costs might be in different areas, but they won\'t necessarily be higher.' },
            { id: 698, chapter: 7, text: 'Job design relates to people therefore technology has little impact.', options: ['True', 'False'], answer: 1, explanation: 'Job design must take into consideration technology.' },
            { id: 699, chapter: 7, text: 'Methods analysis cannot be done for new jobs (ones that do not yet exist) since it requires observation of the process.', options: ['True', 'False'], answer: 1, explanation: 'Methods analysis establishes the method for new jobs.' },
            { id: 700, chapter: 7, text: 'One therblig is the equivalent of one hour of sustained work by one average person.', options: ['True', 'False'], answer: 1, explanation: 'A therblig is a basic elemental motion.' },
            { id: 701, chapter: 7, text: 'A flow process chart is helpful for visualizing the portions of a work cycle during which the operator and equipment are busy or idle.', options: ['True', 'False'], answer: 1, explanation: 'A flow process chart is helpful for visualizing the flow of work through the system.' },
            { id: 702, chapter: 7, text: 'Predetermined time standards are usually based on observing one very efficient worker performing the task.', options: ['True', 'False'], answer: 1, explanation: 'Predetermined time standards are based on an average worker working under typical conditions.' },
            { id: 703, chapter: 7, text: 'Therbligs are basic elemental motions.', options: ['True', 'False'], answer: 0, explanation: 'Basic elemental motions include grasping, selecting, searching, etc.' },
            { id: 704, chapter: 7, text: 'We incorporate the average seriousness of accidents by measuring the number of lost-time accidents per million labor-hours worked.', options: ['True', 'False'], answer: 1, explanation: 'Measuring lost-time accidents does not account for the seriousness of accidents.' },
            { id: 705, chapter: 7, text: 'Work measurement concentrates on how long the tasks take to accomplish.', options: ['True', 'False'], answer: 0, explanation: 'Work measurement is concerned with how long it should take to complete a task.' },
            { id: 706, chapter: 7, text: 'Ergonomics is important for preventing common workplace injuries such as back injuries and repetitive-motion injuries.', options: ['True', 'False'], answer: 0, explanation: 'Ergonomics is a discipline that focuses on interactions of humans with non-human elements of a work system.' },
            { id: 707, chapter: 7, text: 'The most widely used method of work measurement is work sampling.', options: ['True', 'False'], answer: 1, explanation: 'The stopwatch time study is the most widely used method of work measurement.' },
            { id: 708, chapter: 7, text: 'For purposes of obtaining good time standards using a stopwatch time study, the analyst should try to avoid having the worker discover he or she is being observed.', options: ['True', 'False'], answer: 1, explanation: 'The analyst should be familiar with the job and discuss what is being done with the worker being observed.' },
            { id: 709, chapter: 7, text: 'One factor in determining how many cycles to time in a time study is the degree of variation that is present in the observed times.', options: ['True', 'False'], answer: 0, explanation: 'Greater variation increases the number of cycles that should be studied.' },
            { id: 710, chapter: 7, text: 'The normal time in time study is obtained by multiplying the observed time by the performance rating.', options: ['True', 'False'], answer: 0, explanation: 'The normal time adjusts for the relative skill of the worker being observed.' },
            { id: 711, chapter: 7, text: 'Studies on worker efficiency and time of day suggest the greatest efficiency is at the end of the day when workers are \'warmed up\'.', options: ['True', 'False'], answer: 1, explanation: 'Workers will tend to be more fatigued at the end of the day.' },
            { id: 712, chapter: 7, text: 'The normal time for a job is multiplied by the performance rating to obtain the standard time for the job.', options: ['True', 'False'], answer: 1, explanation: 'The standard time is the normal time multiplied by the allowance factor.' },
            { id: 713, chapter: 7, text: 'The design of work systems, because objective standards are used, avoids most ethical issues.', options: ['True', 'False'], answer: 1, explanation: 'Many subjective standards enter into the design of work systems.' },
            { id: 714, chapter: 7, text: 'The standard time for a job can be obtained by multiplying the normal time by an appropriate allowance factor.', options: ['True', 'False'], answer: 0, explanation: 'ST = NT x AF' },
            { id: 715, chapter: 7, text: 'Predetermined time standards use historical data from a company\'s own files.', options: ['True', 'False'], answer: 1, explanation: 'Predetermined time standards involve the use of published data on standard elemental times.' },
            { id: 716, chapter: 7, text: 'A performance rating of less than 1.0 means that the observed worker was judged to be working at a faster than normal rate - doing the job quicker than normal.', options: ['True', 'False'], answer: 1, explanation: 'A performance rating of 1.0 means the job was being done at a normal pace.' },
            { id: 717, chapter: 7, text: 'Predetermined time standards involve the use of published data regarding how long various activities are expected to take.', options: ['True', 'False'], answer: 0, explanation: 'These are presented in time measurement units.' },
            { id: 718, chapter: 7, text: 'Work sampling can be used to estimate the proportion of time a machine is idle.', options: ['True', 'False'], answer: 0, explanation: 'Work sampling deals with how a given resource is used in various tasks.' },
            { id: 719, chapter: 7, text: 'Work sampling involves the use of some method of randomizing the observations.', options: ['True', 'False'], answer: 0, explanation: 'Randomization reduces the chance for bias.' },
            { id: 720, chapter: 7, text: 'An advantage of work sampling, compared to a stopwatch time study, is that observations are spread out over a period of time in work sampling.', options: ['True', 'False'], answer: 0, explanation: 'This reduces the chance that measurement will be inadvertently biased.' },
            { id: 721, chapter: 7, text: 'No stopwatch is required in a work sampling study.', options: ['True', 'False'], answer: 0, explanation: 'In a work sampling study, observations are made at random points in time and what the worker was doing is recorded.' },
            { id: 722, chapter: 7, text: 'Work sampling provides a detailed elemental breakdown of a task for purposes of establishing reliable time standards.', options: ['True', 'False'], answer: 1, explanation: 'Work sampling is used to see which tasks a worker engages in over time, not how long each task takes.' },
            { id: 723, chapter: 7, text: 'Measured day work refers to an output-based system.', options: ['True', 'False'], answer: 1, explanation: 'Measured day work refers to a time-based system.' },
            { id: 724, chapter: 7, text: 'It would be acceptable to use a group incentive plan for an assembly line operation.', options: ['True', 'False'], answer: 0, explanation: 'The line operation is dependent on all workers\' performance.' },
            { id: 725, chapter: 7, text: 'Work sampling provides both quick and accurate estimates of activity times.', options: ['True', 'False'], answer: 1, explanation: 'Work sampling does not involve activity times.' },
            { id: 726, chapter: 7, text: 'Methods analysis and motion study techniques do not directly consider behavioral aspects of jobs.', options: ['True', 'False'], answer: 0, explanation: 'Behavioral aspects are treated as "givens" in methods analysis and motion study techniques.' },
            { id: 727, chapter: 7, text: '"Time-based systems" compensate employees according to the time the employee has worked and the amount of output they produce.', options: ['True', 'False'], answer: 1, explanation: 'Time-based systems do not consider the amount of output.' },
            { id: 728, chapter: 7, text: '"Output-based systems" compensate employees according to the amount of output they produce, thereby tying pay directly to performance.', options: ['True', 'False'], answer: 0, explanation: 'Output-based systems tie pay directly to performance.' },
            { id: 729, chapter: 7, text: 'A pay system that rewards workers who undergo training that increases their skills is called a "knowledge-based pay system."', options: ['True', 'False'], answer: 0, explanation: 'Knowledge-based pay systems increase compensation for workers who increase their skills.' },
            { id: 730, chapter: 7, text: '"Knowledge-based pay systems" pay higher wages or salaries to workers who have completed college than to those who just finished high school.', options: ['True', 'False'], answer: 1, explanation: 'Knowledge-based pay systems focus on rewarding the development of skills, regardless of educational levels.' },
            { id: 731, chapter: 7, text: 'Increasing compensation is always a way to improve worker satisfaction.', options: ['True', 'False'], answer: 1, explanation: 'Worker satisfaction can be increased without increasing compensation by focusing on other aspects of workers\' work lives.' },
            { id: 732, chapter: 7, text: 'A worker-machine chart can help identify non-productive parts of a process.', options: ['True', 'False'], answer: 1, explanation: 'A worker-machine chart simply charts the interactions between the worker and the machine.' },
            { id: 733, chapter: 7, text: 'A worker-machine chart can be used to determine how many machines an operator can manage.', options: ['True', 'False'], answer: 0, explanation: 'Worker-machine charts highlight when the worker and machine are simultaneously occupied.' },
            { id: 734, chapter: 7, text: 'Micromotion studies should be limited to periodic activities where breakthrough improvements are possible.', options: ['True', 'False'], answer: 1, explanation: 'Micromotion studies should be used to repetitive activities.' },
            { id: 735, chapter: 7, text: 'The Occupational Safety and Health Act (OSHA) is a regulatory burden that has been proven to have little impact on the safety and welfare of workers.', options: ['True', 'False'], answer: 1, explanation: 'OSHA has been associated with great improvements in the safety and welfare of workers.' },
            { id: 736, chapter: 7, text: 'Management compensation should be based primarily on organizational output.', options: ['True', 'False'], answer: 1, explanation: 'Quality and customer service also can factor into management compensation.' },
            { id: 737, chapter: 7, text: 'Many management compensation systems are being revised to reflect increased emphasis on quality and customer service.', options: ['True', 'False'], answer: 0, explanation: 'Management compensation often should not be based strictly on organizational output.' },
            { id: 738, chapter: 7, text: 'Behavioral approaches to job design include:', options: ['Specialization', 'Ergonomics', 'Job Rotation', 'Flow Process Charts', 'SIMO Charts'], answer: 2, explanation: 'Job rotation addresses a behavioral aspect of a job.' },
            { id: 739, chapter: 7, text: 'A major advantage of job specialization in business is increased _________.', options: ['motivation', 'opportunity for advancement', 'opportunity for self-fulfillment', 'productivity', 'job enrichment'], answer: 3, explanation: 'Specialization can greatly increase productivity.' },
            { id: 740, chapter: 7, text: 'Which of the following is not generally considered an advantage of specialization?', options: ['high productivity', 'low wage costs', 'ease of training employees', 'low equipment costs', 'all are advantages'], answer: 3, explanation: 'Equipment costs are independent of specialization.' },
            { id: 741, chapter: 7, text: 'Process chart symbols don\'t include ________.', options: ['Delay', 'Inspection', 'Operation', 'Rejection', 'Storage'], answer: 3, explanation: 'Rejection is a decision that results from inspection.' },
            { id: 742, chapter: 7, text: 'Which of the following most closely describes job enlargement?', options: ['horizontal loading', 'increasing the level of responsibility associated with a job', 'transferring workers through a series of jobs to increase their scope of experience', 'increasing the amount of workspace assigned to a worker', 'assigning two jobs to the same worker'], answer: 0, explanation: 'With job enlargement the worker becomes responsible for more tasks.' },
            { id: 743, chapter: 7, text: 'A behavioral approach to job design which increases responsibility for planning and coordinating tasks is job:', options: ['enlargement', 'rotation', 'enrichment', 'involvement', 'enhancement'], answer: 2, explanation: 'Greater authority accompanies job enrichment.' },
            { id: 744, chapter: 7, text: 'Which of the following concerns is not one that job designers focus on?', options: ['what will be done in a job', 'who will do the job', 'how the job will be done', 'when should the job be completed', 'where the job will be done'], answer: 3, explanation: 'Job designers focus on the what, the who, the how, not the when.' },
            { id: 745, chapter: 7, text: 'Which of the following is not a potential benefit of the use of self-directed teams?', options: ['higher quality', 'higher productivity', 'greater worker satisfaction', 'greater satisfaction for middle managers', 'lower turnover'], answer: 3, explanation: 'Middle managers\' authority is reduced when self-directed teams are adopted.' },
            { id: 746, chapter: 7, text: 'A SIMO chart includes:', options: ['Delay', 'Storage', 'Transportation', 'Left/Right hand movements', 'Inspection'], answer: 3, explanation: 'SIMO charts focus on the simultaneous movement of the hands.' },
            { id: 747, chapter: 7, text: 'Determining the number of cycles to observe is an element of ________.', options: ['Stop watch time study', 'Standard elemental times', 'Predetermined time standards', 'Work sampling', 'MTM tables'], answer: 0, explanation: 'In a stopwatch time study the number of cycles that should be observed is an important consideration.' },
            { id: 748, chapter: 7, text: 'The chart used to review the overall sequence of an operation by focusing on either the movements of the operator or materials is called a _________.', options: ['SIMO-chart', 'Gantt chart', 'Worker-materials chart', 'Flow process chart', 'Multi-activity chart'], answer: 3, explanation: 'Flow process charts focus on the overall sequence of operations.' },
            { id: 749, chapter: 7, text: 'The methods analysis chart which describes the overall sequence of operations, transportation, storage, delays, and inspection is a:', options: ['flow process chart', 'worker-machine chart', 'gang process chart', 'simultaneous-motion (SIMO) chart', 'time/efficiency chart'], answer: 0, explanation: 'Flow process charts focus on the overall sequence of operations.' },
            { id: 750, chapter: 7, text: 'The symbols for operation, storage, transportation, inspection, and delay would usually be found on which type of chart?', options: ['Flow process', 'Gantt', 'Simultaneous motion', 'Worker-machine', 'Delay analysis'], answer: 0, explanation: 'Flow process charts focus on the sequence of the entire operation.' },
            { id: 751, chapter: 7, text: 'The chart used to focus on busy and idle portions of a work cycle is a:', options: ['Worker-machine chart', 'Gantt chart', 'SIMO-chart', 'Idle chart', 'Flow process chart'], answer: 0, explanation: 'This is used to determine how many tasks to assign to a worker.' },
            { id: 752, chapter: 7, text: 'The methods analysis chart which describes the portions of a work cycle during which an operator and equipment are busy or idle is a:', options: ['flow process chart', 'worker-machine chart', 'gang process chart', 'simultaneous-motion (SIMO) chart', 'time/efficiency chart'], answer: 1, explanation: 'Work can be assigned to a worker during idle periods.' },
            { id: 753, chapter: 7, text: 'In methods analysis, a "therblig" is a:', options: ['charting method of analysis', 'job enrichment technique', 'dummy task', 'basic elemental motion', 'fraction (.0006) of a minute'], answer: 3, explanation: 'Therbligs are named after Frankl Gilbreth.' },
            { id: 754, chapter: 7, text: 'The methods analysis chart which describes the movements of both hands at the same time is a:', options: ['flow process chart', 'worker-machine chart', 'gang process chart', 'simultaneous-motion (SIMO) chart', 'time/efficiency chart'], answer: 3, explanation: 'SIMO charts focus on the simultaneous movement of the hands.' },
            { id: 755, chapter: 7, text: 'One form of long term team that is increasingly being used, especially in lean production settings, is:', options: ['Quality circle', 'Product Design', 'Self-directed', 'Self-improvement', 'Mandatory'], answer: 2, explanation: 'Self-directed teams can be very effective at suggesting process improvements.' },
            { id: 756, chapter: 7, text: 'In a stopwatch time study, the number of cycles that must be timed is a function of:', options: ['the variability of observed times', 'the desired accuracy for the estimated job time', 'the desired confidence for the estimated job time', 'all of the above', 'none of the above'], answer: 3, explanation: 'The required number of cycles reflects all three considerations - variability, desired accuracy and desired confidence.' },
            { id: 757, chapter: 7, text: 'What is the effect of an increase in the desired confidence level on the number of observations necessary in a time study?', options: ['increases', 'decreases', 'unaffected', 'may increase or decrease, depending on the sample standard deviation', 'impossible to say without additional information'], answer: 0, explanation: 'Greater confidence requires a large number of cycles.' },
            { id: 758, chapter: 7, text: 'In a stopwatch time study, the average time it takes a given worker to perform a task a certain number of times is the:', options: ['observed time', 'normal time', 'standard time', 'allowance time', 'performance rating time'], answer: 0, explanation: 'The observed time is adjusted to get the normal time.' },
            { id: 759, chapter: 7, text: 'Which is not a requirement for an effective team?', options: ['talent and skills to meet goals', 'one or more members representing supervision', 'a system of reinforcement and celebration', 'clearly stated and commonly held vision and goals', 'effective and skilled interpersonal relations'], answer: 1, explanation: 'Supervisor representation is not part of self-directed teams.' },
            { id: 760, chapter: 7, text: 'A job had an observed cycle time of four minutes, a performance rating of 80 percent, and an allowance factor that was 20 percent of job time. Normal time for the job in minutes is:', options: ['3.20', '3.84', '4.00', '4.80', '5.00'], answer: 0, explanation: 'NT = OT x PR = 4 x 0.8 = 3.2' },
            { id: 761, chapter: 7, text: 'When performing a time study, the analyst converts the observed time into the time an "average" worker would require working at an acceptable pace by using which of the following?', options: ['allowance factors', 'MTM', 'methods analysis', 'performance rating', 'analysis of therbligs'], answer: 3, explanation: 'The performance rating adjusts the observed time to reflect a typical worker.' },
            { id: 762, chapter: 7, text: 'In stopwatch time study, adjusting the normal time by an allowance factor for normal delays and interruptions results in the:', options: ['observed time', 'normal time', 'standard time', 'allowance time', 'performance rating time'], answer: 2, explanation: 'The standard time is the normal time adjusted for typical delays and interruptions.' },
            { id: 763, chapter: 7, text: 'A job had an observed time of 10 minutes, a performance rating of .90, and an allowance factor of 20 percent of job time. Twenty-five cycles were timed. Standard time for the job in minutes is:', options: ['10.0', '10.8', '12.5', '15.0', 'depends on the number of cycles observed'], answer: 1, explanation: 'ST = OT x PR x AF = 10 x 0.9 x 1.2 = 10.8' },
            { id: 764, chapter: 7, text: 'A job has a normal time of 12 minutes, a performance rating of .80, and an allowance factor of 20 percent of job time. The standard time for this job in minutes is:', options: ['11.52', '12', '14.4', '15', 'depends on the number of cycles observed'], answer: 2, explanation: 'ST = NT x AF = 12 x 1.2 = 14.4' },
            { id: 765, chapter: 7, text: 'Standard times derived from a firm\'s historical data are known as:', options: ['predetermined times', 'MTM', 'work sampling times', 'judgmental times', 'standard elemental times'], answer: 4, explanation: 'Standard elemental times are used as building blocks for normal times.' },
            { id: 766, chapter: 7, text: 'Allowance percentages normally would not include:', options: ['noise levels', 'monotony', 'personal phone calls', 'weight lifted', 'rest room allowances'], answer: 2, explanation: 'Allowance factors allow for normal interruptions and delays that are part of the process.' },
            { id: 767, chapter: 7, text: 'A technique for estimating the proportion of time a worker spends on various activities is:', options: ['stopwatch time study', 'standard elemental (historical) times', 'simultaneous motion study', 'predetermined (published) time standards', 'work sampling'], answer: 4, explanation: 'Work sampling estimates the proportion of time that a given resource is engaged in a particular activity.' },
            { id: 768, chapter: 7, text: 'The technique which can be used to estimate the percentage of time a worker or piece of equipment is idle is known as:', options: ['MTM', 'work sampling', 'methods analysis', 'micro motion study', 'none of these'], answer: 1, explanation: 'Work sampling estimates the proportion of time that a given resource is engaged in a particular activity.' },
            { id: 769, chapter: 7, text: 'Which sample proportion will require the largest number of work sampling observations?', options: ['.05', '.25', '.50', '.75', '.95'], answer: 2, explanation: 'Variability is largest when the proportion equals 0.5.' },
            { id: 770, chapter: 7, text: 'What will be the effect on sample size in work sampling of increasing the permissible maximum error?', options: ['increase the number of observations needed', 'decrease the number of observations needed', 'no effect on sample size', 'sometimes increase and sometimes decrease the sample size, depending on the analyst', 'impossible to say without additional information'], answer: 1, explanation: 'Increasing the permissible maximum error reduces the number of observations that are needed.' },
            { id: 771, chapter: 7, text: 'In work sampling, observations should be taken:', options: ['at the same time each day', 'within a short period of time', 'at randomly determined times', 'once every hour', 'once every day'], answer: 2, explanation: 'Random sampling reduces bias.' },
            { id: 772, chapter: 7, text: 'Which of the following is not an advantage of work sampling compared to stopwatch time study?', options: ['There is little or no disruption of work.', 'It is less susceptible to short-term fluctuations.', 'Workers are less resentful.', 'It is less costly and less time-consuming.', 'It is better suited for short, repetitive tasks.'], answer: 4, explanation: 'Stopwatch time study is better for short, repetitive tasks.' },
            { id: 773, chapter: 7, text: 'Which of the following is not characteristic of time-based compensation plans?', options: ['stable labor costs', 'easier to administer than output-based plans', 'stable pay for workers', 'simpler wage computations than output-based plans', 'lower cost per unit than output-based plans'], answer: 4, explanation: 'Time-based plans do not typically result in lower cost per unit.' },
            { id: 774, chapter: 7, text: 'Which of the following statements should not characterize an operations strategy toward the design of work systems?', options: ['Manufacturing technology is the heart of a business.', 'Workers can make or break a business.', 'Workers can be a valuable source of insights.', 'A spirit of cooperation can contribute to success.', 'Workers can be proud and respected.'], answer: 0, explanation: 'Technology is not necessarily the heart of a business.' },
            { id: 775, chapter: 7, text: 'The design of work systems involves:', options: ['work measurement', 'job design', 'compensation', 'all of the above', 'use of outside human resource consultants'], answer: 3, explanation: 'All three considerations are important in designing work systems.' },
            { id: 776, chapter: 7, text: 'Methods analysis and motion study techniques develop which aspect of jobs?', options: ['behavioral aspects', 'efficiency aspects', 'pay levels', 'all of the above', 'none of the above'], answer: 1, explanation: 'These help optimize how work is done from an efficiency standpoint.' },
            { id: 777, chapter: 7, text: 'A disadvantage of teams is:', options: ['higher quality', 'higher productivity', 'greater worker satisfaction', 'team member conflict', 'lower turnover'], answer: 3, explanation: 'Conflict must be navigated successfully for teams to be successful.' },

            // === CHƯƠNG 7S: 70 câu ===
            { id: 778, chapter: '7s', text: 'If the elapsed time for the task is short and the activity is somewhat routine, a modest amount of improvement occurs during the first few repetitions.', options: ['True', 'False'], answer: 0, explanation: 'Improvement is noticeable in the first few repetitions.' },
            { id: 779, chapter: '7s', text: 'When the task is fairly complex and has a longer duration, it will take a larger number of repetitions before improvement is observed.', options: ['True', 'False'], answer: 0, explanation: 'Complexity and long durations dampen the learning curve effect.' },
            { id: 780, chapter: '7s', text: 'Negotiated purchasing results in lower unit costs for smaller quantities.', options: ['True', 'False'], answer: 1, explanation: 'Negotiated purchasing results in more accurate costs when quantities are larger.' },
            { id: 781, chapter: '7s', text: 'Learning curves generally apply to situations in which there is a high degree of human involvement and tasks are fairly repetitive.', options: ['True', 'False'], answer: 0, explanation: 'Human involvement and repetition are commonly present in learning curve scenarios.' },
            { id: 782, chapter: '7s', text: 'Learning curves are mostly relevant for complex, new activities that have not been done often.', options: ['True', 'False'], answer: 0, explanation: 'Complex, new activities are prime opportunities for learning curve phenomena.' },
            { id: 783, chapter: '7s', text: 'According to learning curve theory, every doubling of total output will produce a constant percentage decrease in time per unit.', options: ['True', 'False'], answer: 0, explanation: 'Time decreases predictably with each doubling of total output.' },
            { id: 784, chapter: '7s', text: 'The decrease in time between the second and fourth units will be equal to the decrease in time between the first and second units.', options: ['True', 'False'], answer: 1, explanation: 'The percentage decreases will be equal, but the actual decreases will differ.' },
            { id: 785, chapter: '7s', text: 'According to learning curve theory, for certain kinds of tasks the cost per unit decreases as the number of repetitions increases.', options: ['True', 'False'], answer: 1, explanation: 'Learning curve theory suggests that time per unit decreases.' },
            { id: 786, chapter: '7s', text: 'According to learning curve theory, the time reduction per unit decreases (improves) as the number of units increase.', options: ['True', 'False'], answer: 0, explanation: 'Cumulative experience leads to reductions in time required.' },
            { id: 787, chapter: '7s', text: 'A learning percentage of 95% indicates greater learning than a percentage of 90%.', options: ['True', 'False'], answer: 1, explanation: 'The large the learning percentage the slower the pace of learning.' },
            { id: 788, chapter: '7s', text: 'A learning curve for an overqualified worker is higher than an average worker.', options: ['True', 'False'], answer: 0, explanation: 'The more qualified worker has more capacity to exploit learning opportunities.' },
            { id: 789, chapter: '7s', text: 'An 80 percent learning curve means that with each doubling of repetitions there will be a 20 percent decrease in time per unit.', options: ['True', 'False'], answer: 0, explanation: 'At each doubling of volume there is a reduction equal to 100% minus the learning rate.' },
            { id: 790, chapter: '7s', text: 'For an 80% learning curve, if the first unit requires 10 hours, the second unit will require 8 hours and the third 6.4 hours.', options: ['True', 'False'], answer: 1, explanation: 'The fourth unit will require 6.4 hours.' },
            { id: 791, chapter: '7s', text: 'If an 80% curve is appropriate for a task and the first unit takes ten hours, the average time for the first two units would be eight hours.', options: ['True', 'False'], answer: 1, explanation: 'The average time would be nine hours.' },
            { id: 792, chapter: '7s', text: 'If we have never made the first unit but only think we know how much the labor time will be, we cannot draw a learning curve.', options: ['True', 'False'], answer: 1, explanation: 'We can use learning curves to anticipate future reductions.' },
            { id: 793, chapter: '7s', text: 'The learning curve principal would apply to the number of students in a class - a class twice as large will learn 80% faster.', options: ['True', 'False'], answer: 1, explanation: 'Each student would be taking the class for the first time, so no learning curve would be possible.' },
            { id: 794, chapter: '7s', text: 'The learning curve principle would apply to a baseball pitcher learning to throw a curve ball.', options: ['True', 'False'], answer: 0, explanation: 'So long as the pitcher accumulates experience, the learning curve might apply.' },
            { id: 795, chapter: '7s', text: 'The learning curve is a basic tool for mass production type activities because it can deal with large volumes of output.', options: ['True', 'False'], answer: 1, explanation: 'In mass production, learning curves aren\'t relevant beyond a point, since cumulative volume must increase so much for the reduction to be noticeable.' },
            { id: 796, chapter: '7s', text: 'Learning curves are used primarily for mass production applications.', options: ['True', 'False'], answer: 1, explanation: 'Learning curves are not very useful in mass production settings.' },
            { id: 797, chapter: '7s', text: 'A learning rate of 98% implies an exceptionally rapid rate of improvement.', options: ['True', 'False'], answer: 1, explanation: 'The higher the learning rate, the slower the improvement.' },
            { id: 798, chapter: '7s', text: 'A learning rate of 77% will produce relatively minor decreases in completion times of the first few repetitions.', options: ['True', 'False'], answer: 1, explanation: 'The greatest reductions will be in the first few repetitions.' },
            { id: 799, chapter: '7s', text: 'One use of learning curves is for negotiated purchasing anticipating lower costs at the vendor with increasing volumes.', options: ['True', 'False'], answer: 0, explanation: 'The vendor would be able to use learning curves to price later production more accurately.' },
            { id: 800, chapter: '7s', text: 'A learning rate of 97% will produce minor decreases in completion times of the first few repetitions.', options: ['True', 'False'], answer: 0, explanation: 'With a large learning rate, reductions are relative small even early in the production window.' },
            { id: 801, chapter: '7s', text: 'The fact that human activities typically improve when they are done on a repetitive basis is described by a/an:', options: ['normal distribution curve', 'learning curve', 'binomial distribution curve', 'exponential curve', 'fatigue factor allowance'], answer: 1, explanation: 'Repetition facilitates improvements through learning.' },
            { id: 802, chapter: '7s', text: 'To which worker would learning curves be most applicable?', options: ['bus driver', 'printing press operator', 'assembly-line worker', 'auto service mechanic', 'baker or cook'], answer: 3, explanation: 'For the mechanic, increased experience leads to refinements in repair procedures.' },
            { id: 803, chapter: '7s', text: 'Once production is underway and the learning curve effect is occurring, successive changes made to the production process will cause the time per unit to:', options: ['continue following the original learning curve without any impact', 'cause a scallop effect', 'increase the unit time and result in a higher percentage learning curve', 'decrease the unit time and result in a higher percentage learning curve', 'decrease the unit time and result in a lower percentage learning curve'], answer: 1, explanation: 'A scallop effect is when the learning curve resets after the changes in the process.' },
            { id: 804, chapter: '7s', text: 'On a log-log graph, learning curves appear as:', options: ['upward-curving lines', 'downward-curving lines', 'straight lines', 'lines which increase at a decreasing rate', 'lines which decrease at a decreasing rate'], answer: 2, explanation: 'The log-log transformation straightens out the learning curve.' },
            { id: 805, chapter: '7s', text: 'Increasing volumes result in ___________ the learning curve.', options: ['moving up', 'moving down', 'moving off', 'moving away from', 'stabilization of'], answer: 1, explanation: 'Growing market share might facilitate greater learning and efficiency.' },
            { id: 806, chapter: '7s', text: 'It took exactly 10 hours to perform the first kidney transplant on a 100 percent learning curve. The second kidney transplant will take how many hours to perform?', options: ['8.0 hours', '10.0 hours', '12.0 hours', 'A 100 percent learning curve cannot exist.', '5 hours'], answer: 1, explanation: 'With a 100% learning rate, there is no learning.' },
            { id: 807, chapter: '7s', text: 'A job is expected to have a 70 percent learning curve. The first unit has been completed in 20 hours. Accordingly, the second unit can be expected to take approximately how many hours?', options: ['6', '9.8', '14', '20', '34'], answer: 2, explanation: 'The second unit is a doubling of volume, so its time would be 20 x .7 = 14.' },
            { id: 808, chapter: '7s', text: 'A job with a 70 percent learning curve required 20 hours for the initial unit. The fourth unit should require approximately how many hours?', options: ['6', '9.8', '14', '20', '34'], answer: 1, explanation: 'The time for the fourth unit would be 20 x .7 x .7 = 9.8.' },
            { id: 809, chapter: '7s', text: 'How long would a job with a 70 percent learning curve and a time of 20 hours for the first unit require (approximately, in hours) for the third unit?', options: ['14.1', '11.5', '10.0', '7.8', '4.3'], answer: 0, explanation: 'The time for the third unit would be 20 x .568 from Table 7S.1 = 11.36 ≈ 11.4.' },
            { id: 810, chapter: '7s', text: 'A job is expected to have a learning curve of 90 percent. The third unit required 16 hours. The twelfth unit should take approximately how many hours?', options: ['2.67', '4.83', '7.94', '10.31', '12.95'], answer: 3, explanation: 'The time would be 16 x .9 x .9 (from the third to the sixth to the 12th unit).' },
            { id: 811, chapter: '7s', text: 'A job has an 80 percent learning curve. The second unit required 12 hours to complete. Approximately how many hours will be devoted to the first five units (including those already completed)?', options: ['26', '36', '46', '56', '66'], answer: 2, explanation: 'The first unit was 12 divided by .8 = 15. The total time would be 15 x 3.738 = 56.07.' },
            { id: 812, chapter: '7s', text: 'A manager is trying to estimate the appropriate learning curve for a certain job. The manager notes that the first four units had a total time of 30 minutes. Which learning curve would yield approximately this result if the first unit took 10 minutes?', options: ['.70', '.75', '.80', '.85', '.90'], answer: 1, explanation: 'If the total time for four units was approximately 3 times that of the first, this could correspond to roughly a 75% learning rate.' },
            { id: 813, chapter: '7s', text: 'In which of the following managerial activities would learning curves probably be the least useful?', options: ['negotiated purchasing', 'manpower planning', 'location analysis', 'budgeting', 'pricing new products'], answer: 2, explanation: 'Location analysis is generally a one-time activity, so learning curves wouldn\'t apply.' },
            { id: 814, chapter: '7s', text: 'Which of the following is not a major caution or criticism of learning curves?', options: ['Learning rates may differ between organizations.', 'Projections should be regarded as approximations.', 'The base time must be carefully determined.', 'The curve may eventually tip upwards.', 'Carryover effects may alter the learning rate.'], answer: 4, explanation: 'Carryover effects don\'t alter the learning rate, but they should be taken into consideration with regard to the estimation of how much learning is possible.' },
            { id: 815, chapter: '7s', text: 'A job has a 70% learning curve. If the first unit took 10 hours to complete, the third unit should take roughly how many hours?', options: ['7', '5.5', '5', '3.5', '4.9'], answer: 0, explanation: 'Multiply 10 by .568 = 5.68 ≈ 5.7.' },
            { id: 816, chapter: '7s', text: 'A job has an 80% learning curve. If the first unit took 40 hours to complete, the fourth unit should take roughly how many hours?', options: ['20', '25', '31', '35', '40'], answer: 0, explanation: 'Multiply 40 by .640 = 25.6 ≈ 26.' },
            { id: 817, chapter: '7s', text: 'Which one of the following would learning curves probably affect the least?', options: ['pricing new products', 'negotiated purchasing', 'layout analysis', 'scheduling', 'capacity planning'], answer: 2, explanation: 'Layout analysis is generally a one-time activity, so learning curves would not typically apply.' },
            { id: 818, chapter: '7s', text: 'A job has an 80% learning curve. If the first unit took 50 hours to complete, the third unit should take roughly how many hours?', options: ['40', '36', '35', '32', '10'], answer: 2, explanation: 'Multiply 50 by .702 = 35.1.' },
            { id: 819, chapter: '7s', text: 'Unit times for a job exhibit a learning effect. If the 2nd unit took 30 hours, and the 4th unit took 21 hours, roughly how many hours would you estimate the 3rd unit took?', options: ['29', '27', '25', '24', '21'], answer: 2, explanation: 'The learning rate is 70%, so the first unit must have been approximately 43 hours. Multiply this by .568 to get the time required for the third unit.' },
            { id: 820, chapter: '7s', text: 'A manager is trying to estimate the learning rate for a new job. The first unit took 16 hours and the fourth unit required about 13 hours. The learning rate is:', options: ['70%', '75%', '80%', '85%', '90%'], answer: 3, explanation: 'Divide 13 by 16 to get .8125. This factor for the fourth unit suggests a learning rate of approximately 85%.' },
            { id: 821, chapter: '7s', text: 'A job will have a learning rate of 75 percent. If the 3rd unit requires 10 hours, the 12th unit should require about this many hours:', options: ['5.6', '6.5', '7.4', '8.3', '9.2'], answer: 0, explanation: 'Multiply 10 by .75 squared to get the time for the 12th unit.' },
            { id: 822, chapter: '7s', text: 'Assembly of a model airplane has a learning curve of 80 percent. The estimated time to assemble a second identical model airplane is 40 hours. Determine approximately how much time will be required for: (A) the eighth unit (B) the first ten units', options: ['(A) 25.6 hours; (B) 315.75 hours', '(A) 30 hours; (B) 350 hours', '(A) 20 hours; (B) 280 hours', '(A) 35 hours; (B) 400 hours', '(A) 15 hours; (B) 250 hours'], answer: 0, explanation: 'Determine the time for the initial unit: 40/.8 = 50 hours, then proceed.' },
            { id: 823, chapter: '7s', text: 'Developing work assignments in a job shop in a certain firm has a learning curve of 80 percent. If the second set of assignments takes 12 minutes, determine the length of time required for: (A) the fifth set (B) sets 3, 4, and 5 together', options: ['(A) 8.94 minutes; (B) 29.07 minutes', '(A) 10 minutes; (B) 30 minutes', '(A) 9 minutes; (B) 28 minutes', '(A) 8 minutes; (B) 27 minutes', '(A) 7 minutes; (B) 26 minutes'], answer: 0, explanation: 'Determine the time for the initial unit: .80(x) = 12, x = 15, then proceed.' },
            { id: 824, chapter: '7s', text: 'An order we just received has a 90 percent learning curve associated with it. The second unit of the total 25-unit order had a unit time of 36 minutes. What will the total time be for the entire order (all 25 units)?', options: ['708.52 minutes', '700 minutes', '720 minutes', '690 minutes', '710 minutes'], answer: 0, explanation: 'The total time will be 40(17.713) = 708.52 minutes.' },
            { id: 825, chapter: '7s', text: 'Sally suspects strongly that there is a learning curve associated with solving problems assigned for operations management. She notes that it took her approximately 33 minutes to solve the first problem and 17 minutes to solve the fifth problem. (A) Estimate Sally\'s learning percentage. (B) Using your answer from Part A, estimate how long it will take Sally to finish the three remaining problems.', options: ['(A) 75%; (B) 44.319 minutes', '(A) 80%; (B) 40 minutes', '(A) 70%; (B) 50 minutes', '(A) 85%; (B) 35 minutes', '(A) 90%; (B) 30 minutes'], answer: 0, explanation: 'Since T1 and T5 are known, solve for the unit factor: 17 min./33 min. = .515. This equates to a learning percentage of approximately 75%.' },
            { id: 826, chapter: '7s', text: 'Ron has noted that the first accounting problem he did in a set of similar problems took him one hour, and the ninth problem took 24 minutes. (A) Estimate Ron\'s learning curve. (B) About how long did it take Ron to do his set of 10 problems?', options: ['(A) 75%; (B) 335.34 minutes', '(A) 80%; (B) 300 minutes', '(A) 70%; (B) 350 minutes', '(A) 85%; (B) 280 minutes', '(A) 90%; (B) 250 minutes'], answer: 0, explanation: 'T1 (unit factor 9) = T9. Hence unit factor 9 = T9/T1 = 24 min./60 min. = .4. This corresponds to a learning curve rate of approximately 75%.' },
            { id: 827, chapter: '7s', text: 'It takes a worker with a 90 percent learning curve 72.9 minutes to complete the fourth unit of a seven-unit job. Estimate the amount of time the worker spent on the first two units.', options: ['171 minutes', '180 minutes', '160 minutes', '190 minutes', '150 minutes'], answer: 0, explanation: 'Time for the fourth unit is 81 percent of the first. Hence, time for the first is 90 minutes, and time for the second is 81 minutes.' },
            { id: 828, chapter: '7s', text: 'The 3rd unit of a ten-unit job required 7.3 hours to complete. The 4th unit has been worked on for two hours, but it is not yet finished. Estimate the remaining amount of time that will be needed to finish this ten-unit job if the work has an 80% learning curve.', options: ['37.66 hours', '40 hours', '35 hours', '38 hours', '36 hours'], answer: 0, explanation: 'Given that T3 = 7.3 hours, with an 80% learning curve this means that T1 = 7.3/.702 = 10.4. Given T1 equals 10.4 and an 80% learning curve, it took 26.02 hours to finish jobs 1 through 3. We would anticipate needing 65.68 hours to finish all 10 jobs. When we started job 4, therefore, we had 65.68-26.02 = 39.66 hours of work remaining.' },
            { id: 829, chapter: '7s', text: 'A company is preparing a bid on a government contract for 40 units of a certain product. The operations manager estimates the assembly time required for the first two units to be 10.4 hours and 8.8 hours respectively. What is the appropriate learning curve?', options: ['70 percent', '75 percent', '80 percent', '85 percent', '90 percent'], answer: 2, explanation: 'Divide 8.8 by 10.4 to estimate the learning curve: 8.8/10.4 = 0.846 ≈ 85%.' },
            { id: 830, chapter: '7s', text: 'A company is preparing a bid on a government contract for 40 units of a certain product. The operations manager estimates the assembly time required for the first two units to be 10.4 hours and 8.8 hours respectively. What is the expected time required to produce the 40th unit?', options: ['3.2 hours', '4.4 hours', '5.9 hours', '3.7 hours', '2.2 hours'], answer: 1, explanation: 'The 20th should take approximately 10.4 x .495 = 5.15. Therefore, the 40th should take approximately 5.15 x .85 = 4.4.' },
            { id: 831, chapter: '7s', text: 'A company is preparing a bid on a government contract for 40 units of a certain product. The operations manager estimates the assembly time required for the first two units to be 10.4 hours and 8.8 hours respectively. What is the average time per unit for the first 30 units?', options: ['4.7 hours', '5.9 hours', '5.6 hours', '4.5 hours', '3.6 hours'], answer: 1, explanation: 'The average time per unit would be 10.4 x 17.091 divided by 30 = 5.92 ≈ 5.9.' },
            { id: 832, chapter: '7s', text: 'A company is preparing a bid on a government contract for 40 units of a certain product. The operations manager estimates the assembly time required for the first two units to be 10.4 hours and 8.8 hours respectively. If a contract for 30 units is canceled after the first 20 units, approximately how much of the expected total direct labor will have been expended to that point?', options: ['73%', '55%', '61%', '50%', 'It is impossible to say without additional information.'], answer: 0, explanation: 'A total of 129 hours would be expected for the first 20 units. A total of 177 would have been needed for 30 units. Therefore, approximately 73% of the direct labor hours would have been expended.' },
            { id: 833, chapter: '7s', text: 'A company is preparing a bid on a government contract for 40 units of a certain product. The operations manager estimates the assembly time required for the first two units to be 10.4 hours and 8.8 hours respectively. Approximately how long will it take to produce the 15th unit?', options: ['4.3 hours', '5.5 hours', '4.7 hours', '6.9 hours', '3.4 hours'], answer: 1, explanation: 'Multiply 10.4 by .530 = 5.51 ≈ 5.5.' },
            { id: 834, chapter: '7s', text: 'A company is preparing a bid on a government contract for 40 units of a certain product. The operations manager estimates the assembly time required for the first two units to be 10.4 hours and 8.8 hours respectively. Which unit, if any, will require approximately one-half the time of the first unit?', options: ['18th unit', '19th unit', '20th unit', '21st unit', '22nd unit'], answer: 1, explanation: 'The factor for the 19th unit is approximately .5.' },
            { id: 835, chapter: '7s', text: 'A company is preparing a bid on a government contract for 40 units of a certain product. The operations manager estimates the assembly time required for the first two units to be 10.4 hours and 8.8 hours respectively. Approximately how long will it take to produce the 25th through the 30th units?', options: ['23 hours', '49 hours', '29 hours', '38 hours', 'It is impossible to say without additional information.'], answer: 0, explanation: 'Multiply the factors for the 25th through the 30th unit by 10.4, then sum the products up.' },
            { id: 836, chapter: '7s', text: 'A manager wants to analyze the learning curve associated with producing one of his company\'s products. Accordingly, he has gathered the following data. What is the learning curve percentage?', options: ['40%', '50%', '75%', '80%', '90%'], answer: 3, explanation: 'Divide the time required for the fourth unit by that required for the second unit.' },
            { id: 837, chapter: '7s', text: 'A manager wants to analyze the learning curve associated with producing one of his company\'s products. How long did it take to produce the first unit?', options: ['5 hours', '6 hours', '6.25 hours', '6.33 hours', '6.5 hours'], answer: 2, explanation: 'Divide the time required for the second unit by .80.' },
            { id: 838, chapter: '7s', text: 'A manager wants to analyze the learning curve associated with producing one of his company\'s products. Approximately how long did it take to produce the first four units?', options: ['15 hours', '16 hours', '18 hours', '20 hours', '21 hours'], answer: 3, explanation: 'Multiply the time required for the first unit by 3.142.' },
