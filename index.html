            { id: 1576, chapter: 16, text: 'Average completion (flow) time for a schedule sequence at a work center is:', options: ['the sum of processing time divided by the number of jobs', 'the sum of jobs\' flow times divided by the number of jobs', 'overall flow time divided by total processing time', 'total processing time plus total late time divided by number of jobs', 'the sum of flow time plus total late time divided by number of jobs'], answer: 1, explanation: 'Jobs\' individual flow times are averaged for average flow time.' },
            { id: 1577, chapter: 16, text: 'The scheduling sequencing rule which always results in the lowest average completion (flow) time is the:', options: ['first come, first served (FCFS) rule', 'shortest processing time first (SPT) rule', 'earliest due date first (EDD) rule', 'least slack per operation first (S/O) rule', 'run until slack happens (RUSH) rule'], answer: 1, explanation: 'SPT minimizes flow time.' },
            { id: 1578, chapter: 16, text: 'Which sequencing rule is designed specifically to minimize job tardiness?', options: ['S/O', 'EDD', 'FCFS', 'SPT', 'LPT'], answer: 1, explanation: 'EDD is a tardiness-oriented sequencing rule.' },
            { id: 1579, chapter: 16, text: 'A scheduling rule used for sequencing jobs through two work centers is:', options: ['critical ratio rule', 'Johnson\'s rule', 'slack per operation rule', 'shortest processing time rule', 'Pareto rule'], answer: 1, explanation: 'Johnson\'s rule is for two work centers.' },
            { id: 1580, chapter: 16, text: 'For the jobs listed below, which processing sequence would result using Johnson\'s Rule?', options: ['c-a-d-b', 'b-d-a-c', 'a-b-c-d', 'd-c-b-a', 'c-a-b-d'], answer: 0, explanation: 'This is the Johnson\'s Rule sequence.' },
            { id: 1581, chapter: 16, text: 'What is the optimum job sequence for the jobs listed below using Johnson\'s Rule?', options: ['e-g-f-d', 'd-g-f-e', 'd-f-g-e', 'e-d-f-g', 'f-e-d-g'], answer: 2, explanation: 'This is the Johnson\'s Rule sequence.' },
            { id: 1582, chapter: 16, text: 'A major difference between manufacturing and service systems in terms of scheduling is:', options: ['variability in arrival and service rates', 'processing cost per unit', 'the number of units to be processed', 'length of processing time', 'output rate'], answer: 0, explanation: 'Services experience greater variability.' },
            { id: 1583, chapter: 16, text: 'Scheduling in service systems often takes the form of:', options: ['appointment systems', 'reservation systems', '(A) and (B)', 'makespan systems', 'all of the above'], answer: 2, explanation: 'Appointment and reservation systems are frequently used in service settings.' },
            { id: 1584, chapter: 16, text: 'Scheduling in service systems may involve scheduling:', options: ['the workforce', 'the equipment', '(a) and (b)', 'customers', 'all of the above'], answer: 4, explanation: 'Service scheduling can involve workers, equipment and customers.' },
            { id: 1585, chapter: 16, text: 'One disadvantage of appointment systems is:', options: ['Capacity can be adjusted by varying hours.', 'The customer\'s desired time may be already taken.', 'People generally accept it as fair.', 'It can reduce customer waiting time.', 'Appointments do not have to be all the same length.'], answer: 1, explanation: 'In a given time slot, only one customer can be scheduled.' },
            { id: 1586, chapter: 16, text: 'In an assignment model where there are fewer jobs than resources:', options: ['Dummy jobs are needed to solve the problem.', 'Dummy resources are needed to solve the problem.', 'The problem can\'t be solved using an assignment model.', 'The problem will have multiple optimum solutions.', 'The simplex method must be used to solve the problem.'], answer: 0, explanation: 'Dummy jobs make the assignment model workable in this situation.' },

            // === CHƯƠNG 17: 146 câu ===
            { id: 1587, chapter: 17, text: 'Good project management is especially important with virtual teams.', options: ['True', 'False'], answer: 0, explanation: 'Virtual teams face challenges that make project management especially important.' },
            { id: 1588, chapter: 17, text: 'One way that project management differs from management of more traditional activities is because of the limited lifetime of projects.', options: ['True', 'False'], answer: 0, explanation: 'Projects have lifetimes that are typically shorter than other business endeavors.' },
            { id: 1589, chapter: 17, text: 'Once a project is approved and underway, project managers are only responsible for effectively managing time and costs which, if done well, will assure project completion on time and on budget.', options: ['True', 'False'], answer: 1, explanation: 'Managers also are responsible for assuring performance targets are met.' },
            { id: 1590, chapter: 17, text: 'Matrix organizations transfer control of workers to project managers for the duration of the project.', options: ['True', 'False'], answer: 1, explanation: 'In matrix organizations, workers are shared by functional and project managers.' },
            { id: 1591, chapter: 17, text: 'Some organizations use a matrix organization to integrate the activities of specialists within a functional framework.', options: ['True', 'False'], answer: 0, explanation: 'The matrix organization is useful in integrating specialists into projects.' },
            { id: 1592, chapter: 17, text: 'The project computing algorithm requires both a forward and backward pass.', options: ['True', 'False'], answer: 0, explanation: 'Both passes are necessary to find critical path activities.' },
            { id: 1593, chapter: 17, text: 'A hierarchical (vertical) listing of what must be done during a project is called matrix.', options: ['True', 'False'], answer: 1, explanation: 'This is called the work breakdown structure.' },
            { id: 1594, chapter: 17, text: 'An advantage of Gantt charts in project management is that they identify which activities can be delayed without delaying the overall project.', options: ['True', 'False'], answer: 1, explanation: 'Gantt charts cannot show sequential relationships.' },
            { id: 1595, chapter: 17, text: 'A Gantt chart is built using established precedence relationships.', options: ['True', 'False'], answer: 1, explanation: 'Gantt charts cannot show sequential relationships.' },
            { id: 1596, chapter: 17, text: 'The higher the node number, the longer the activity will take.', options: ['True', 'False'], answer: 1, explanation: 'The higher the node number, the later the activity will occur.' },
            { id: 1597, chapter: 17, text: 'The probability of occurrence of risk events is lower near the beginning of a project and higher near the end of the project since very few activities remain.', options: ['True', 'False'], answer: 1, explanation: 'The probability of occurrence of risk events is higher near the beginning of a project.' },
            { id: 1598, chapter: 17, text: 'The costs associated with risk events tend to be lower near the beginning of a project, and higher near the end of the project.', options: ['True', 'False'], answer: 0, explanation: 'This is true even though the probability of occurrence of risk events is higher near the beginning of a project.' },
            { id: 1599, chapter: 17, text: 'Although PERT and CPM were originally developed for somewhat different types of projects, they are now nearly identical in terms of analysis and procedures.', options: ['True', 'False'], answer: 0, explanation: 'PERT and CPM are commonly used to refer to the same approaches.' },
            { id: 1600, chapter: 17, text: 'The network diagram describes sequential relationships among major activities on a project.', options: ['True', 'False'], answer: 0, explanation: 'Network diagrams depict sequential relationships.' },
            { id: 1601, chapter: 17, text: 'The path in a network with the average length of time to completion is called the critical path.', options: ['True', 'False'], answer: 1, explanation: 'The critical path is the path that has the largest duration.' },
            { id: 1602, chapter: 17, text: 'The sum of times of the longest path in a network indicates expected project completion time, and the activities represent the critical activities.', options: ['True', 'False'], answer: 0, explanation: 'These are definitions of the critical path and the critical activities.' },
            { id: 1603, chapter: 17, text: 'Path probabilities are calculated by dividing path mean by path standard deviations.', options: ['True', 'False'], answer: 1, explanation: 'Path probabilities are calculated by subtracting the path mean from the specified time, dividing by the pat standard deviation, then referring the resulting z-score to the standard normal distribution.' },
            { id: 1604, chapter: 17, text: 'The main function of dummy activities is to clarify relationships in network diagrams.', options: ['True', 'False'], answer: 0, explanation: 'Dummy variables are used to ensure that precedence relationships are maintained.' },
            { id: 1605, chapter: 17, text: 'The earliest finish time for an activity is equal to the latest finish time minus the activity time.', options: ['True', 'False'], answer: 1, explanation: 'Early finish is equal to the early start plus the activity time.' },
            { id: 1606, chapter: 17, text: 'The latest starting time for an activity is equal to the latest finish time minus the activity time.', options: ['True', 'False'], answer: 0, explanation: 'This is how late start times are computed.' },
            { id: 1607, chapter: 17, text: 'The earliest finish time for an activity is equal to the latest finish time minus the activity slack.', options: ['True', 'False'], answer: 0, explanation: 'The difference between late finish and early finish is the activity slack.' },
            { id: 1608, chapter: 17, text: 'Many activities have slack time; if we add these slack times together, this represents the potential improvement in early completion for the project.', options: ['True', 'False'], answer: 1, explanation: 'Not all slack times are independent of one another.' },
            { id: 1609, chapter: 17, text: 'If two consecutive activities on the same path each have two days of activity slack, this means that each of them can be delayed by two days without delaying the project.', options: ['True', 'False'], answer: 1, explanation: 'Likely only two days total slack are available for these two activities.' },
            { id: 1610, chapter: 17, text: 'The task of identifying risks should involve everyone associated with the project.', options: ['True', 'False'], answer: 0, explanation: 'A clearer picture of risk is gained with broad inputs.' },
            { id: 1611, chapter: 17, text: 'Most likely time generally is more than optimistic time.', options: ['True', 'False'], answer: 0, explanation: 'Most likely time is never less than the optimistic time, but it can be equal to the optimistic time.' },
            { id: 1612, chapter: 17, text: 'Activities not on the critical path have a slack time equal to zero.', options: ['True', 'False'], answer: 1, explanation: 'Critical path activities have slack time equal to zero.' },
            { id: 1613, chapter: 17, text: 'If two consecutive activities have shared slack, this means that each of them can use only half of the slack without delaying completion of the project.', options: ['True', 'False'], answer: 1, explanation: 'This means that between them only the total amount of shared slack can be used.' },
            { id: 1614, chapter: 17, text: 'Deterministic networks use three time estimates - shortest, most likely and longest - for each activity in order to best determine the activity\'s estimated time.', options: ['True', 'False'], answer: 1, explanation: 'Probabilistic networks use these time estimates.' },
            { id: 1615, chapter: 17, text: 'Slack time is equal to LS-ES or LF-EF.', options: ['True', 'False'], answer: 0, explanation: 'This is how slack time is computed.' },
            { id: 1616, chapter: 17, text: 'Project management software eliminates conflicts when there are shared resources.', options: ['True', 'False'], answer: 1, explanation: 'Project management software simply points to conflicts, it does not eliminate them.' },
            { id: 1617, chapter: 17, text: 'The standard deviation of the critical path is equal to the sum of the standard deviations of all of the activities on the critical path.', options: ['True', 'False'], answer: 1, explanation: 'The standard deviation of the critical path is equal to the square root of the sum of the variances of all of the activities on the critical path.' },
            { id: 1618, chapter: 17, text: 'The total cost of crashing any one activity should never exceed 20% of the total cost of the original project.', options: ['True', 'False'], answer: 1, explanation: 'The total cost of crashing any one activity should not exceed the value gained by shortening that activity\'s duration.' },
            { id: 1619, chapter: 17, text: 'If the expected length of a path is more than 2.5 standard deviations less than a desired project completion time, the path would not be a factor in assessing the probability of finishing the project on time.', options: ['True', 'False'], answer: 1, explanation: 'Usually a path is not considered a factor unless its expected length is more than 3 standard deviations less.' },
            { id: 1620, chapter: 17, text: 'In order to determine the probability of timely project completion, it is sometimes necessary to take into account paths other than the critical path.', options: ['True', 'False'], answer: 0, explanation: 'This is especially true of non-critical paths have relatively large standard deviations.' },
            { id: 1621, chapter: 17, text: 'The probability that the project will go beyond the desired time is equal to one minus the joint probability that all paths will be completed within the desired time.', options: ['True', 'False'], answer: 0, explanation: 'This is how this value is calculated.' },
            { id: 1622, chapter: 17, text: 'A disadvantage of activity-on-node diagrams is the occasional need for dummy activities.', options: ['True', 'False'], answer: 1, explanation: 'Dummy activities are not needed in activity-on-node diagrams.' },
            { id: 1623, chapter: 17, text: 'Simulation can be used for cases in which network activity times are dependent.', options: ['True', 'False'], answer: 0, explanation: 'Simulation is valuable in these circumstances.' },
            { id: 1624, chapter: 17, text: 'Project managers are sometimes able to reduce indirect project costs by increasing direct costs.', options: ['True', 'False'], answer: 0, explanation: 'Speeding up project activities might be more costly, but the indirect cost savings might be worth it.' },
            { id: 1625, chapter: 17, text: 'Only activities on the critical path are initial candidates for crashing.', options: ['True', 'False'], answer: 0, explanation: 'The first activity to be crashed must be on the critical path.' },
            { id: 1626, chapter: 17, text: 'The optimum project length in crashing occurs where the cumulative cost of crashing equals savings in the indirect costs.', options: ['True', 'False'], answer: 0, explanation: 'Beyond this point, additional crashing is not worth it.' },
            { id: 1627, chapter: 17, text: 'In PERT, the expected project duration will never exceed the expected duration of the critical path.', options: ['True', 'False'], answer: 0, explanation: 'In PERT, the expected project duration is found by calculating the expected duration of the critical path.' },
            { id: 1628, chapter: 17, text: 'In PERT, the path with the fewest activities is referred to as the critical path.', options: ['True', 'False'], answer: 1, explanation: 'In PERT, the path with the longest expected project duration is the critical path.' },
            { id: 1629, chapter: 17, text: 'Project management differs from management of more traditional activities mainly because of:', options: ['its limited time frame', 'its unique, defined set of activities', '(a) and (b)', 'the requirement for use of the appropriate resources', 'the need for planning and execution'], answer: 2, explanation: 'These are the primary reasons that project management differs from the management of more traditional tasks.' },
            { id: 1630, chapter: 17, text: 'Which of the following would probably not involve the use of PERT?', options: ['planning and constructing a new city hall', 'developing an advertising campaign for a new product', 'designing and constructing a subway system', 'writing a poem', 'preparing for the visit of a foreign dignitary'], answer: 3, explanation: 'Developing a work breakdown structure would be next to impossible.' },
            { id: 1631, chapter: 17, text: 'Once a project is underway, the project manager usually is not responsible for effectively managing:', options: ['the people', 'costs', 'resources', 'time', 'project priority'], answer: 4, explanation: 'The project\'s priority is not the project manager\'s responsibility.' },
            { id: 1632, chapter: 17, text: 'Which of the following is not a form of risk reduction in project management?', options: ['backup system', 'outsourcing', 'risk-sharing', 'scenario analysis', 'all of the above are risk reduction methods'], answer: 3, explanation: 'Scenario analysis can be used to fashion risk reduction approaches, but it doesn\'t actually reduce risks.' },
            { id: 1633, chapter: 17, text: 'A sequence of activities that leads from the starting node to the finishing node is called a _______.', options: ['Path', 'Sequel', 'Trail', 'Critical sequence', 'Time line'], answer: 0, explanation: 'This is called a path.' },
            { id: 1634, chapter: 17, text: 'Which of the following is not typically treated as part of a project life cycle?', options: ['feasibility analysis', 'planning', 'maturity', 'incubation', 'alternative generation'], answer: 2, explanation: 'Projects do not have maturities as in product life-cycles.' },
            { id: 1635, chapter: 17, text: 'A hierarchical listing of what must be done in a project is called:', options: ['work breakdown structure (WBS)', 'PERT', 'planning matrix', 'crashing', 'critical path'], answer: 0, explanation: 'The WBS is a hierarchical listing of what must be done in a project.' },
            { id: 1636, chapter: 17, text: 'A method used for establishing a logical framework for identifying the required activities for the project is called:', options: ['Work breakdown structure', 'PERT', 'planning matrix', 'crashing', 'critical path analysis'], answer: 0, explanation: 'The WBS is a hierarchical listing of what must be done in a project.' },
            { id: 1637, chapter: 17, text: 'A popular tool for planning and scheduling simple projects, and for initial planning on more complex projects, is the:', options: ['activity-on-arrows network', 'activity-on-nodes network', 'Gantt chart', 'critical path method', 'program evaluation and review technique'], answer: 2, explanation: 'Gantt charts are useful for simply projects.' },
            { id: 1638, chapter: 17, text: 'To _____ an activity means to shorten the time it will take.', options: ['Speed', 'Fund', 'Crash', 'Aggregate', 'Matrix'], answer: 2, explanation: 'Crashing an activity means speeding it up.' },
            { id: 1639, chapter: 17, text: 'Concerning PERT and CPM:', options: ['These are two different names for essentially the same technique.', 'CPM tends to focus more on the critical path; PERT focuses on the parallel paths.', 'PERT gives a clearer indication of activity slack, while CPM gives a better picture of path slack.', 'Because of its recent discovery, much less is known about CPM than PERT.', 'All of the above are true.'], answer: 0, explanation: 'PERT and CPM have grown to be largely interchangeable terms.' },
            { id: 1640, chapter: 17, text: 'The advantage(s) a precedence diagram has over a Gantt chart is(are):', options: ['its ability to reveal relationships among activities.', 'it can easily show networks.', '(a) and (b).', 'its simplicity.', 'all of the above.'], answer: 2, explanation: 'Precedence diagrams reveal activity relationships and clarify networks.' },
            { id: 1641, chapter: 17, text: 'In a project network the critical path is the sequence of activities which has the:', options: ['most activities', 'most nodes', 'most events', 'longest time', 'greatest variance'], answer: 3, explanation: 'The critical path is the longest path in the project network.' },
            { id: 1642, chapter: 17, text: 'Which of the following is not true about the use of dummy activities in project networking?', options: ['They preserve the separate identities of activities.', 'They clarify precedence relationships among activities.', 'They have an activity time equal to zero.', 'They have an activity time variance equal to zero.', 'They are used in activities-on-nodes (AON) network diagrams.'], answer: 4, explanation: 'Dummy activities are not used in AON networks.' },
            { id: 1643, chapter: 17, text: 'Shortening activity durations is called:', options: ['Expediting', 'Crashing', 'Vendor management', 'Null nodes', 'Trade-off analysis'], answer: 1, explanation: 'Crashing an activity shortens its duration.' },
            { id: 1644, chapter: 17, text: 'Consider the portion of a project depicted by this graph. What is the earliest finish time for activity 10-11 (far right hand side), if the earliest start time of 8-10 (upper left hand side) is 12, and the earliest start time of 9-10 (lower left hand side) is 13?', options: ['22', '23', '24', '25', '26'], answer: 1, explanation: 'Use the computing algorithm.' },
            { id: 1645, chapter: 17, text: 'Activity 7-8 is directly preceded by two activities—activity 5-7 and activity 6-7. Activity 5-7 has an expected time of five and an ES time of six. Activity 6-7 has an expected time of seven and an ES time of seven. Activity 7-8 has an expected time of 10. The ES for activity 7-8 is:', options: ['11', '14', '21', '24', '25'], answer: 1, explanation: 'Use the computing algorithm. The ES of 7-8 is max(6+5, 7+7) = 14.' },
            { id: 1646, chapter: 17, text: 'Which of the following is determined as a direct result of computing the earliest starting and finishing times for the activities of a project network?', options: ['expected project duration', 'activity slack time', 'which activities are on the critical path', 'variance in project duration', 'maximum project duration'], answer: 0, explanation: 'The largest value in the EF column is the project\'s expected duration.' },
            { id: 1647, chapter: 17, text: 'Consider the portion of a project depicted by this graph. What is the latest start time of activity 6-7 if the latest finish of activity 7-8 is 26, and the latest finish of activity 7-9 is 23?', options: ['18', '17', '13', '12', '10'], answer: 3, explanation: 'Use the computing algorithm.' },
            { id: 1648, chapter: 17, text: 'A node has one entering activity, a, and two leaving activities, b and c. Given the following information, determine the latest starting time for activity a: EFb = 15, EFc = 17, LFb = 24, LFc = 27; activity times are a = 4, b = 6, c = 8.', options: ['14', '15', '16', '17', '18'], answer: 2, explanation: 'Use the computing algorithm.' },
            { id: 1649, chapter: 17, text: 'In project network analysis, "slack" refers to the difference between:', options: ['observed and predicted times', 'optimistic and pessimistic times', 'mean and modal times', 'finish and start times', 'latest and earliest times'], answer: 4, explanation: 'Slack is the difference between latest and earliest times.' },
            { id: 1650, chapter: 17, text: 'Activity C has an early start time of 8, an early finish time of 12, a latest start time of 13, and a latest finish time of 17. Its slack is:', options: ['0', '1', '4', '5', '9'], answer: 3, explanation: 'Slack = LS - ES = 13 - 8 = 5.' },
            { id: 1651, chapter: 17, text: 'Given this information about activity 3-4: ES = 10, EF = 15, LS = 16, and LF = 21, we can determine that the amount of slack associated with the activity is:', options: ['0', '1', '5', '6', '11'], answer: 3, explanation: 'Slack = LS - ES = 16 - 10 = 6.' },
            { id: 1652, chapter: 17, text: 'In the probabilistic approach to project network analysis, the time estimate annotated "tm" for any activity is the:', options: ['mean time', 'median time', 'most likely time', 'mode time', 'marginal time'], answer: 2, explanation: 'The most likely time is denoted tm.' },
            { id: 1653, chapter: 17, text: 'The basis for use of the beta distribution in PERT is:', options: ['essentially theoretical', 'its adaptability', 'its symmetry', 'It is bimodal', 'It can easily be converted to a normal distribution'], answer: 1, explanation: 'The beta distribution works well across a variety of circumstances in project management.' },
            { id: 1654, chapter: 17, text: 'When developing probabilistic estimates of project duration, it is necessary to know which of the following?', options: ['the mean and variance of every activity', 'the mean and variance of activities on the critical path', 'the standard deviation of activities on the critical path', 'each activity\'s probability of completion', 'the distribution of activity times'], answer: 0, explanation: 'Even non-critical path activities can shape a project\'s duration if they have large variance.' },
            { id: 1655, chapter: 17, text: 'A PERT/CPM activity has an optimistic time estimate of three days, a most likely time estimate of eight days, and a pessimistic time estimate of 10 days. The expected time (in days) of this activity is:', options: ['7.0', '7.5', '8.0', '8.5', '10.0'], answer: 1, explanation: 'Use the weighted time estimates formula: (3 + 4*8 + 10)/6 = 45/6 = 7.5.' },
            { id: 1656, chapter: 17, text: 'Activity 4-5 in a network diagram has an optimistic time estimate of five days, a most likely time estimate of seven days, and a pessimistic time estimate of 10 days. Its expected time is approximately:', options: ['5', '6', '7', '8', '9'], answer: 2, explanation: 'Use the weighted time estimates formula: (5 + 4*7 + 10)/6 = 43/6 = 7.17 ≈ 7.' },
            { id: 1657, chapter: 17, text: 'There are four activities on the critical path, and they have standard deviations of 1, 2, 4, and 2 days. The standard deviation of the critical path is:', options: ['3', '5', '9', '16', '25'], answer: 1, explanation: 'Square the standard deviations, add them up, and then take the square root: sqrt(1+4+16+4) = sqrt(25) = 5.' },
            { id: 1658, chapter: 17, text: 'There are four activities on the critical path. Coincidentally, their standard deviations are all equal to 4. The standard deviation of the critical path is therefore equal to:', options: ['2', '4', '8', '16', '64'], answer: 2, explanation: 'Square the standard deviations, add them up, and then take the square root: sqrt(16+16+16+16) = sqrt(64) = 8.' },
            { id: 1659, chapter: 17, text: 'The project management strategy of injecting additional resources in order to reduce the length of the project is called:', options: ['expediting', 'rushing', 'panicking', 'crashing', 'loading'], answer: 3, explanation: 'Crashing a project reduces its duration.' },
            { id: 1660, chapter: 17, text: 'In "crashing" a project, a manager will generally focus on activities which:', options: ['are not on the critical path', 'are the least costly to crash', 'are costly to crash and are on the critical path', 'are on the critical path and are the least costly to crash', 'are the easiest to crash'], answer: 3, explanation: 'The manager must take care to consider critical paths that emerge as the project is shortened.' },
            { id: 1661, chapter: 17, text: 'At which point does crashing of a project cease?', options: ['when the project is completed', 'when no additional crashing is possible', 'when the cost to crash equals or exceeds the benefit of crashing', 'when the project is one-half completed', 'none of the above'], answer: 2, explanation: 'At that point, additional expenditures do not pay off.' },
            { id: 1662, chapter: 17, text: 'Which of the following are advantages of PERT? (I) It is visual. (II) It is automatically updated. (III) Activities that need to be watched closely can be identified.', options: ['I and II', 'II and III', 'III only', 'I and III', 'I, II, and III'], answer: 3, explanation: 'PERT provides valuable information regarding which activities need to be closely watched.' },
            { id: 1663, chapter: 17, text: 'Which of the following are limitations of PERT? (I) Time estimates may include a fudge factor. (II) Important activities may be overlooked. (III) It is an after-the-fact analysis.', options: ['I and II', 'I, II, and III', 'I and III', 'II and III', 'I only'], answer: 0, explanation: 'PERT analysis is done before the project is begun.' },
            { id: 1664, chapter: 17, text: 'Which of the following is not a limitation of PERT and similar project-scheduling techniques?', options: ['They force the manager to organize and quantify information.', 'One or more important activities may be omitted from the network.', 'Precedence relationships may not all be correct as shown.', 'Time estimates may contain a "fudge factor."', 'The use of a computer is essential for large projects.'], answer: 0, explanation: 'Forcing the manager to organize and quantify information is a benefit, not a limitation.' },
            { id: 1665, chapter: 17, text: 'Gantt charts are most closely associated with:', options: ['JIT', 'PERT', 'MRP', 'MRPII', 'Six Sigma'], answer: 1, explanation: 'Gantt charts can be useful in project management.' },
            { id: 1666, chapter: 17, text: 'Consider the project depicted by the following A-O-A diagram. What is the probability that this project\'s duration will exceed 8.5 weeks?', options: ['Multiply the two probabilities to get the joint probability.', 'Add the two probabilities.', 'Subtract the two probabilities.', 'Divide the two probabilities.', 'None of the above'], answer: 0, explanation: 'Multiply the two probabilities to get the joint probability.' },

            // === CHƯƠNG 18: 85 câu ===
            { id: 1667, chapter: 18, text: 'Waiting lines occur even in under loaded systems because of variability in service rates and/or arrival rates.', options: ['True', 'False'], answer: 0, explanation: 'Variability leads to short-term mismatches that lead to waiting lines.' },
            { id: 1668, chapter: 18, text: 'A system has one service facility that can service 10 customers per hour. The customers arrive at a variable rate, which averages 6 per hour. Since there is excess capacity, no waiting lines will form.', options: ['True', 'False'], answer: 1, explanation: 'Even if service times don\'t vary at all, variability in arrivals could lead to waiting lines.' },
            { id: 1669, chapter: 18, text: 'The goal of waiting line management is to eliminate customer waiting lines.', options: ['True', 'False'], answer: 1, explanation: 'The goal of waiting line management is to minimize the total of service costs and waiting costs.' },
            { id: 1670, chapter: 18, text: 'The cost of customer waiting is easy to estimate, the number waiting multiplied by the wait cost per minute.', options: ['True', 'False'], answer: 1, explanation: 'The wait cost per minute is very difficult to estimate.' },
            { id: 1671, chapter: 18, text: 'In a theme park like Disney world, reservation systems are a win-lose situation since only those holding reservations are satisfied.', options: ['True', 'False'], answer: 1, explanation: 'Others who don\'t get reservations can also be somewhat satisfied, since at least they didn\'t have to wait in excessively long lines.' },
            { id: 1672, chapter: 18, text: 'The point that minimizes total queuing system costs is that point where waiting costs and capacity costs are equal.', options: ['True', 'False'], answer: 1, explanation: 'The minimum total cost point is usually not at the point at which waiting cost and capacity cost curves intersect.' },
            { id: 1673, chapter: 18, text: 'A multiple channel system assumes that each server will have its own waiting line and line changing is not permitted.', options: ['True', 'False'], answer: 1, explanation: 'In many cases there is only one waiting line so line changing isn\'t an issue.' },
            { id: 1674, chapter: 18, text: 'A dental office with two professionals (one dentist, one hygienist) who work together as a team would be an example of a multiple channel system.', options: ['True', 'False'], answer: 1, explanation: 'This would be a multiple phase system.' },
            { id: 1675, chapter: 18, text: 'A Single Server, Variable Service Time is known as an M/D/1 system.', options: ['True', 'False'], answer: 1, explanation: 'An M/D/1 system would be a single server, constant service time system.' },
            { id: 1676, chapter: 18, text: 'The most commonly used queuing models assume that the arrival rate can be described by a Poisson distribution.', options: ['True', 'False'], answer: 0, explanation: 'Poisson arrivals are assumed in the most commonly used queuing models.' },
            { id: 1677, chapter: 18, text: 'The goal of queuing analysis is to balance the cost of providing a level of service capacity with the possible loss of business due to customers leaving the line or refusing to wait.', options: ['True', 'False'], answer: 1, explanation: 'The goal is to balance capacity cost with waiting cost.' },
            { id: 1678, chapter: 18, text: 'According to Little\'s Law, the number of people in line depends on the time of day that they arrive.', options: ['True', 'False'], answer: 1, explanation: 'According to Little\'s Law, for stable systems the average number of customers in line or in the system is equal to the average customer arrival rate multiplied by the average time in line or in the system.' },
            { id: 1679, chapter: 18, text: 'For a system that has a low utilization ratio, decreasing service capacity slightly will have only negligible effect on customer waiting time.', options: ['True', 'False'], answer: 0, explanation: 'In lightly utilized systems, slight changes to capacity have little effect on waiting times.' },
            { id: 1680, chapter: 18, text: 'An approach to reducing the variability in processing times might include greater standardization.', options: ['True', 'False'], answer: 0, explanation: 'The more service can be standardized, the greater the impact on waiting lines.' },
            { id: 1681, chapter: 18, text: 'The queuing models discussed in the text apply only to "steady state" conditions. Steady state exists only when customers arrive at a steady rate; that is, without any variability.', options: ['True', 'False'], answer: 1, explanation: 'Steady state means that the average arrival and service rates are stable.' },
            { id: 1682, chapter: 18, text: 'In an infinite source model, the average number being served is equal to the ratio of the arrival rate to the service rate.', options: ['True', 'False'], answer: 0, explanation: 'Divide the arrival rate by the service rate.' },
            { id: 1683, chapter: 18, text: 'In an infinite source model, the average time in line is equal to the average number in line divided by the arrival rate.', options: ['True', 'False'], answer: 0, explanation: 'This is the average time spent in the queue.' },
            { id: 1684, chapter: 18, text: 'In an infinite source model, the system utilization is the ratio of the arrival rate to the service capacity.', options: ['True', 'False'], answer: 0, explanation: 'This is the way to calculate system utilization.' },
            { id: 1685, chapter: 18, text: 'To reduce the average number waiting in line, it is important to increase utilization.', options: ['True', 'False'], answer: 1, explanation: 'Increasing utilization will increase the average number waiting in line.' },
            { id: 1686, chapter: 18, text: 'All infinite source queuing models require the system utilization to be less than 1.0.', options: ['True', 'False'], answer: 0, explanation: 'All queuing models must have system utilization to be less than 1.0.' },
            { id: 1687, chapter: 18, text: 'Queue discipline requires a security presence to maintain order.', options: ['True', 'False'], answer: 1, explanation: 'Queue discipline is simply the manner in which customers or jobs are selected for processing.' },
            { id: 1688, chapter: 18, text: 'Compared to a single channel a system with exponential service time, a single channel system with a constant service time causes a reduction of 50 percent in the average number waiting in line.', options: ['True', 'False'], answer: 0, explanation: 'Reducing service variability has a tremendous impact on waiting time.' },
            { id: 1689, chapter: 18, text: 'Compared to a single channel system with exponential service time, the same system with a constant service time will have an average of one-half the number of customers waiting in the system.', options: ['True', 'False'], answer: 1, explanation: 'There will be half as many customers waiting in line, not half as many waiting in the system.' },
            { id: 1690, chapter: 18, text: 'If variation in arrival and service rates can be reduced, waiting lines will be shortened.', options: ['True', 'False'], answer: 0, explanation: 'Reducing variability shortens waiting lines.' },
            { id: 1691, chapter: 18, text: 'The finite-source queuing model is appropriate when the potential calling population is relatively large.', options: ['True', 'False'], answer: 1, explanation: 'The finite-source model is appropriate when the potential calling population is relatively small.' },
            { id: 1692, chapter: 18, text: 'Balking is when customers grow impatient and leave a line.', options: ['True', 'False'], answer: 1, explanation: 'Balking is when customers refuse to enter a line.' },
            { id: 1693, chapter: 18, text: 'In a single-channel system, the utilization is equal to the arrival rate divided by the service rate.', options: ['True', 'False'], answer: 0, explanation: 'This is how utilization is calculated in such a system.' },
            { id: 1694, chapter: 18, text: 'The goal of waiting line management is to minimize waiting time.', options: ['True', 'False'], answer: 1, explanation: 'The goal is to minimize total cost (capacity plus waiting).' },
            { id: 1695, chapter: 18, text: 'Why is there waiting in an infinite source queuing system?', options: ['poor scheduling of servers', 'slow service', 'low utilization', 'variability in arrival and service rates', 'multiple phase processing'], answer: 3, explanation: 'Variability leads to waiting lines.' },
            { id: 1696, chapter: 18, text: 'The goal of queuing analysis is to minimize:', options: ['the sum of customer waiting costs and capacity costs', 'the sum of customer waiting time and service time', 'capacity costs', 'customer waiting time', 'idle servers'], answer: 0, explanation: 'Minimizing the sum of these is the goal of waiting line analysis.' },
            { id: 1697, chapter: 18, text: 'A basic difference between infinite source and finite source queuing models is:', options: ['the number of servers', 'the average waiting time', 'the arrival distribution', 'size of potential calling population', 'processing rate'], answer: 3, explanation: 'The finite source model is based on the idea of a relatively small potential calling population.' },
            { id: 1698, chapter: 18, text: 'If a manager increases system utilization (assuming no change in the customer arrival rate) what happens to the customer waiting time?', options: ['It increases exponentially.', 'It increases proportionally.', 'It decreases proportionally.', 'It decreases exponentially.', 'no change'], answer: 0, explanation: 'Increasing utilization increases waiting time.' },
            { id: 1699, chapter: 18, text: 'A single phase queuing system is one which has a single:', options: ['channel', 'server', 'customer being served', 'operation', 'waiting line'], answer: 3, explanation: 'A single phase system has one operation.' },
            { id: 1700, chapter: 18, text: 'A single channel queuing system has an average service time of eight minutes and an average time between arrivals of 10 minutes. The arrival rate is:', options: ['6 per hour', '7.5 per hour', '8 per hour', '10 per hour', '12.5 per hour'], answer: 0, explanation: 'The inverse of the time between arrivals is the arrival rate. 60/10 = 6 per hour.' },
            { id: 1701, chapter: 18, text: 'In a _______ system, customers enter the waiting line, receive service and leave.', options: ['Fast-track', 'Simulated', 'Queuing', 'Random', 'Non-random'], answer: 2, explanation: 'This is the basic definition of a queuing system.' },
            { id: 1702, chapter: 18, text: 'Which of the following is not generally considered as a measure of system performance in a queuing analysis?', options: ['the average number waiting in line', 'the average number in the system', 'system utilization', 'the cost of servers plus customer waiting cost', 'average serving time'], answer: 4, explanation: 'Service time is a system parameter rather than a measure of system performance.' },
            { id: 1703, chapter: 18, text: 'The total cost curve:', options: ['Starts at zero and increases as service capacity increases.', 'Begins high and decreases as service capacity increases.', 'Starts high, declines, then increases again.', 'Remains relatively flat regardless of service capacity.', 'Starts at zero, increases rapidly, then declines slowly back to zero.'], answer: 2, explanation: 'It declines and then rises as one cost is traded off the other.' },
            { id: 1704, chapter: 18, text: 'Little\'s Law states that the number of people in a waiting line is the average customer arrival rate multiplied by the ________.', options: ['average time in the system', 'average waiting time', 'service time minus the waiting time', 'average number in line', 'waiting time'], answer: 1, explanation: 'This is the definition of Little\'s Law.' },
            { id: 1705, chapter: 18, text: 'As the ratio of arrival rate to service rate is increased, which of the following is likely?', options: ['Customers move through the system in less time because utilization is increased.', 'Customers move through the system more slowly because utilization is increased.', 'Utilization is decreased because of the added strain on the system.', 'The average number in the system decreases.', 'There really is no change since arrival rates are offset by service rates.'], answer: 1, explanation: 'Increasing utilization increases average wait time.' },
            { id: 1706, chapter: 18, text: 'Servers, channels are described with many acronyms except _________.', options: ['M/P/S', 'M/M/1', 'M/D/1', 'M/M/S'], answer: 0, explanation: 'M/P/S is not an acronym for a service system.' },
            { id: 1707, chapter: 18, text: 'A single bay car wash with a Poisson arrival rate and an exponential service time has cars arriving an average of 10 minutes apart, and an average service time of four minutes. The system utilization is:', options: ['.24', '.40', '.67', '2.50', 'none of these'], answer: 1, explanation: 'Divide the arrival rate (6 per hour) by the service rate (15 per hour). 6/15 = .40.' },
            { id: 1708, chapter: 18, text: 'A multiple channel queuing system with a Poisson arrival rate and exponential service time has an average arrival rate of 4 customers per hour and an average service time of 18 minutes per customer. The minimum number of servers required to avoid an overloaded system is:', options: ['1', '2', '3', '4', '5'], answer: 1, explanation: 'If the arrival rate is 4 per hour, with only one server the capacity of the system is less than 4 per hour.' },
            { id: 1709, chapter: 18, text: 'Which one of the following measures of system performance is a key measure with respect to customer satisfaction?', options: ['average number of customers waiting in line', 'system utilization', 'average number of customer in the calling population', 'probability of a server being busy', 'capacity costs per hour'], answer: 0, explanation: 'The average number of customers waiting in line is most closely tied to customer satisfaction.' },
            { id: 1710, chapter: 18, text: 'A single channel queuing system has an average service time of 16 minutes per customer, which is exponentially distributed. The manager is thinking of converting to a system with a constant service time of 16 minutes. The arrival rate will remain the same. The effect will be to:', options: ['increase utilization', 'decrease utilization', 'increase the average waiting time', 'decrease the average waiting time', 'not have any effect since the service time is unchanged'], answer: 3, explanation: 'Reducing variability will reduce waiting time.' },
            { id: 1711, chapter: 18, text: 'When the waiting cost incurred by customers likely varies, an appropriate queuing model is:', options: ['single channel, single phase', 'single channel, multiple phase', 'multiple channel, single priority', 'multiple channel, multiple phase', 'multiple channel, multiple priority'], answer: 4, explanation: 'Customers who incur high waiting costs are given higher priority.' },
            { id: 1712, chapter: 18, text: 'A ________ is one way of reducing perceived waiting time.', options: ['Bonus', 'Gatekeeper', 'Reservation', 'Diversion', 'Number calling system'], answer: 3, explanation: 'Diversions reduce perceived waiting time.' },
            { id: 1713, chapter: 18, text: 'An alternative strategy to increase the capacity of a service system is:', options: ['Reducing the number of arrivals.', 'Increasing variability.', 'Increasing the processing rate.', 'Reducing the number of servers.', 'All of the above are viable options.'], answer: 2, explanation: 'Reducing processing time increases the capacity of the system.' },
            { id: 1714, chapter: 18, text: 'A queuing system has four crews with three members each. The number of "servers" is:', options: ['3', '4', '7', '12', '1'], answer: 1, explanation: 'Each crew is a server.' },
            { id: 1715, chapter: 18, text: 'A multiple channel system has customers arriving at an average rate of five per hour and an average service time of forty minutes. The minimum number of servers for this system to be under loaded is:', options: ['2', '3', '4', '5', 'none of these'], answer: 2, explanation: 'Each server has a capacity of 1.5 customers per hour. At least four such servers would be necessary for this demand rate.' },
            { id: 1716, chapter: 18, text: 'Customers arrive at a suburban ticket outlet at the rate of 14 per hour on Monday mornings. This can be described by a Poisson distribution. Selling the tickets and providing general information takes an average of 3 minutes per customer, and varies exponentially. There is 1 ticket agent on duty on Mondays. Determine each of the following: (A) system utilization (B) average number in line (C) average time in line (D) average time in the system', options: ['(A) .70, (B) 1.63, (C) .1167 hr, (D) .1667 hr', '(A) .60, (B) 1.23, (C) .1000 hr, (D) .1500 hr', '(A) .80, (B) 2.03, (C) .1300 hr, (D) .1800 hr', '(A) .50, (B) 0.93, (C) .0900 hr, (D) .1400 hr', '(A) .75, (B) 1.83, (C) .1200 hr, (D) .1700 hr'], answer: 0, explanation: 'Use appropriate system performance equations.' },

            // === CHƯƠNG 19: 113 câu ===
            { id: 1717, chapter: 19, text: 'Linear programming techniques will always produce an optimal solution to an LP problem.', options: ['True', 'False'], answer: 1, explanation: 'Some problems do not have optimal solutions.' },
            { id: 1718, chapter: 19, text: 'LP problems must have a single goal or objective specified.', options: ['True', 'False'], answer: 0, explanation: 'An LP problem must have a specified objection function.' },
            { id: 1719, chapter: 19, text: 'Constraints limit the alternatives available to a decision-maker, removing constraints adds viable alternative solutions.', options: ['True', 'False'], answer: 0, explanation: 'Increasing constraints narrows the feasible alternatives.' },
            { id: 1720, chapter: 19, text: 'An example of a decision variable in an LP problem is profit maximization.', options: ['True', 'False'], answer: 1, explanation: 'Cost minimization would be another LP decision variable.' },
            { id: 1721, chapter: 19, text: 'The feasible solution space only contains points that satisfy all constraints.', options: ['True', 'False'], answer: 0, explanation: 'A solution is only feasible if it satisfies all constraints.' },
            { id: 1722, chapter: 19, text: 'The equation 5x + 7y = 10 is linear.', options: ['True', 'False'], answer: 0, explanation: 'This is a linear equation.' },
            { id: 1723, chapter: 19, text: 'The equation 3xy = 9 is linear.', options: ['True', 'False'], answer: 1, explanation: 'This is a non-linear equation.' },
            { id: 1724, chapter: 19, text: 'Graphical linear programming can handle problems that involve any number of decision variables.', options: ['True', 'False'], answer: 1, explanation: 'Graphical solutions typically can only handle two decision variables.' },
            { id: 1725, chapter: 19, text: 'An objective function represents a family of parallel lines.', options: ['True', 'False'], answer: 0, explanation: 'These lines intersect with solution space corners defined by the constraints.' },
            { id: 1726, chapter: 19, text: 'The term "iso-profit" line means that all points on the line will yield the same profit.', options: ['True', 'False'], answer: 0, explanation: 'Iso-profit means equal profit.' },
            { id: 1727, chapter: 19, text: 'The feasible solution space is the set of all feasible combinations of decision variables as defined by only binding constraints.', options: ['True', 'False'], answer: 1, explanation: 'Even non-binding constraints shape the solution space.' },
            { id: 1728, chapter: 19, text: 'The value of an objective function decreases as it is moved away from the origin.', options: ['True', 'False'], answer: 1, explanation: 'The value increases as the function moves away from the origin.' },
            { id: 1729, chapter: 19, text: 'A linear programming problem can have multiple optimal solutions.', options: ['True', 'False'], answer: 0, explanation: 'This can happen if the objective function has the same slope as a binding constraint.' },
            { id: 1730, chapter: 19, text: 'A maximization problem may be characterized by all greater than or equal to constraints.', options: ['True', 'False'], answer: 1, explanation: 'Greater than or equal to constraints are more frequently seen in minimization problems.' },
            { id: 1731, chapter: 19, text: 'If a single optimal solution exists to a graphical LP problem, it will exist at a corner point.', options: ['True', 'False'], answer: 0, explanation: 'The corners of the feasible space are where optimal solutions tend to reside.' },
            { id: 1732, chapter: 19, text: 'The simplex method is a general-purpose LP algorithm that can be used for solving only problems with more than six variables.', options: ['True', 'False'], answer: 1, explanation: 'The simplex method can handle virtually unlimited numbers of decision variables.' },
            { id: 1733, chapter: 19, text: 'A change in the value of an objective function coefficient does not change the optimal solution.', options: ['True', 'False'], answer: 1, explanation: 'There are limits as to how much objective function coefficients can change without affecting the optimal solution.' },
            { id: 1734, chapter: 19, text: 'The term "range of optimality" refers to a constraint\'s right-hand side quantity.', options: ['True', 'False'], answer: 0, explanation: 'This is range over which the right-hand side quantity can change without affecting the optimal solution.' },
            { id: 1735, chapter: 19, text: 'A shadow price indicates how much a one-unit decrease/increase in the right-hand side value of a constraint will decrease/increase the optimal value of the objective function.', options: ['True', 'False'], answer: 0, explanation: 'The shadow price represents the marginal value of an additional unit of the constrained resource.' },
            { id: 1736, chapter: 19, text: 'The term "range of feasibility" refers to coefficients of the objective function.', options: ['True', 'False'], answer: 1, explanation: 'The range of feasibility deals with how much the right-hand side values can change without affecting the optimal solution.' },
            { id: 1737, chapter: 19, text: 'Non-zero slack or surplus is associated with a binding constraint.', options: ['True', 'False'], answer: 1, explanation: 'This would be associated with non-binding constraints.' },
            { id: 1738, chapter: 19, text: 'In the range of feasibility, the value of the shadow price remains constant.', options: ['True', 'False'], answer: 0, explanation: 'This would be because the optimal values for the decision variables remain constant.' },
            { id: 1739, chapter: 19, text: 'Every change in the value of an objective function coefficient will lead to changes in the optimal solution.', options: ['True', 'False'], answer: 1, explanation: 'Objective function coefficient changes do not necessarily lead to changes in the optimal solution.' },
            { id: 1740, chapter: 19, text: 'Non-binding constraints are not associated with the feasible solution space; i.e., they are redundant and can be eliminated from the matrix.', options: ['True', 'False'], answer: 1, explanation: 'Non-binding constraints do shape the feasible solution space.' },
            { id: 1741, chapter: 19, text: 'When a change in the value of an objective function coefficient remains within the range of optimality, the optimal solution would also remain the same.', options: ['True', 'False'], answer: 0, explanation: 'The range of optimality specifies how much the value can change.' },
            { id: 1742, chapter: 19, text: 'Using the enumeration approach, optimality is obtained by evaluating every coordinate.', options: ['True', 'False'], answer: 1, explanation: 'In the enumeration approach every corner of the feasible space is evaluated.' },
            { id: 1743, chapter: 19, text: 'The linear optimization technique for allocating constrained resources among different products is:', options: ['linear regression analysis', 'linear disaggregation', 'linear decomposition', 'linear programming', 'linear tracking analysis'], answer: 3, explanation: 'Allocating resources is a common use of linear programming.' },
            { id: 1744, chapter: 19, text: 'Which of the following is not a component of the structure of a linear programming model?', options: ['Constraints', 'Decision variables', 'Parameters', 'A goal or objective', 'Environmental uncertainty'], answer: 4, explanation: 'Facets of the environment are assumed to be known with certainty.' },
            { id: 1745, chapter: 19, text: 'Coordinates of all corner points are substituted into the objective function when we use the approach called:', options: ['Least Squares', 'Regression', 'Enumeration', 'Graphical Linear Programming', 'Constraint Assignment'], answer: 2, explanation: 'We compare all of these solutions to find the optimal one.' },
            { id: 1746, chapter: 19, text: 'Which of the following could not be a linear programming problem constraint?', options: ['1A + 2B ≤ 3', '1A + 2B ≥ 3', '1A + 2B = 3', '1A + 2B + 3C + 4D ≤ 5', '1 A + 2B'], answer: 4, explanation: 'There is no right-hand value.' },
            { id: 1747, chapter: 19, text: 'For the products A, B, C and D, which of the following could be a linear programming objective function?', options: ['Z = 1A + 2B + 3C + 4D', 'Z = 1A + 2BC + 3D', 'Z = 1A + 2AB + 3ABC + 4ABCD', 'Z = 1A + 2B/C + 3D', 'all of the above'], answer: 0, explanation: 'This is the only linear function among all of these functions.' },

            { id: 1749, chapter: 19, text: 'The region which satisfies all of the constraints in graphical linear programming is called the:', options: ['optimum solution space', 'region of optimality', 'lower left hand quadrant', 'region of non-negativity', 'feasible solution space'], answer: 4, explanation: 'This is the feasible region.' },
            { id: 1750, chapter: 19, text: 'In graphical linear programming the objective function is:', options: ['linear', 'a family of parallel lines', 'a family of iso-profit lines', 'all of the above', 'none of the above'], answer: 3, explanation: 'All of these are valid.' },
            { id: 1751, chapter: 19, text: 'Which objective function has the same slope as this one: $4x + $2y = $20?', options: ['$4x + $2y = $10', '$2x + $4y = $20', '$2x - $4y = $20', '$4x - $2y = $20', '$8x + $8y = $20'], answer: 0, explanation: 'Although the right-hand side is different, the slope is the same.' },

            { id: 1753, chapter: 19, text: 'Which of the choices below constitutes a simultaneous solution to these equations?', options: ['x = 2, y = .5', 'x = 4, y = -.5', 'x = 2, y = 1', 'x = y', 'y = 2x'], answer: 0, explanation: 'These points satisfy both equations.' },
            { id: 1754, chapter: 19, text: 'Which of the choices below constitutes a simultaneous solution to these equations?', options: ['x = 1, y = 1.5', 'x = .5, y = 2', 'x = 0, y = 3', 'x = 2, y = 0', 'x = 0, y = 0'], answer: 0, explanation: 'These points satisfy both equations.' },
            { id: 1755, chapter: 19, text: 'What combination of x and y will yield the optimum for this problem?', options: ['x = 2, y = 0', 'x = 0, y = 0', 'x = 0, y = 3', 'x = 1, y = 5', 'none of the above'], answer: 3, explanation: 'This is the optimum solution.' },
            { id: 1756, chapter: 19, text: 'In graphical linear programming, when the objective function is parallel to one of the binding constraints, then:', options: ['the solution is sub-optimal', 'multiple optimal solutions exist', 'a single corner point solution exists', 'no feasible solution exists', 'the constraint must be changed or eliminated'], answer: 1, explanation: 'Multiple optima exist when the objective function parallels a binding constraint.' }
        ];

        // ============================================================
        // LOGIC CHÍNH
        // ============================================================
        let currentQuestions = [];
        let questionState = {};

        function initState() {
            QUESTION_DATA.forEach(q => {
                questionState[q.id] = {
                    selected: null,
                    status: 'unanswered'
                };
            });
        }
        initState();

        function getQuestionsByChapter(chapter) {
            if (chapter === 'all') {
                return QUESTION_DATA;
            }
            return QUESTION_DATA.filter(q => String(q.chapter) === String(chapter));
        }

        function loadChapter() {
            const select = document.getElementById('chapter-select');
            const chapter = select.value;
            const chapterName = select.options[select.selectedIndex].text;
            document.getElementById('chapter-info').textContent = `Đã chọn: ${chapterName}`;

            currentQuestions = getQuestionsByChapter(chapter);
            renderQuiz();
            updateStats();
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            if (currentQuestions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>📭 Không có câu hỏi</h2>
                        <p>Chương này chưa có câu hỏi nào hoặc dữ liệu đang được cập nhật.</p>
                    </div>
                `;
                return;
            }

            // Progress bar
            const answered = currentQuestions.filter(q => questionState[q.id]?.status !== 'unanswered').length;
            const total = currentQuestions.length;
            const progressPercent = total > 0 ? (answered / total) * 100 : 0;

            const progressDiv = document.createElement('div');
            progressDiv.className = 'chapter-progress';
            progressDiv.innerHTML = `
                <span class="progress-label">📊 Tiến độ:</span>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progressPercent}%"></div>
                </div>
                <span class="progress-text">${answered}/${total} câu đã trả lời</span>
            `;
            container.appendChild(progressDiv);

            currentQuestions.forEach((q, index) => {
                const state = questionState[q.id] || { selected: null, status: 'unanswered' };
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-${q.id}`;

                // Header
                const header = document.createElement('div');
                header.className = 'question-header';

                const textDiv = document.createElement('div');
                textDiv.className = 'question-text';
                textDiv.textContent = `Câu ${index + 1}: ${q.text}`;
                header.appendChild(textDiv);

                // Badge
                const badge = document.createElement('span');
                badge.className = 'result-badge result-unanswered';
                badge.textContent = '⏳ Chưa làm';
                if (state.status === 'correct') {
                    badge.className = 'result-badge result-correct';
                    badge.textContent = '✅ Đúng';
                } else if (state.status === 'wrong') {
                    badge.className = 'result-badge result-wrong';
                    badge.textContent = '❌ Sai';
                }
                header.appendChild(badge);
                card.appendChild(header);

                // Options
                const optionsList = document.createElement('div');
                optionsList.className = 'options-list';

                const labels = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                q.options.forEach((opt, optIndex) => {
                    const optLetter = labels[optIndex];
                    const isSelected = state.selected === optIndex;
                    const isCorrect = state.status === 'correct' && optIndex === q.answer;
                    const isWrong = state.status === 'wrong' && isSelected && optIndex !== q.answer;

                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'option';
                    if (isSelected && state.status === 'unanswered') optionDiv.classList.add('selected');
                    if (isCorrect) optionDiv.classList.add('correct');
                    if (isWrong) optionDiv.classList.add('wrong');
                    if (state.status !== 'unanswered') optionDiv.classList.add('disabled');

                    optionDiv.innerHTML = `<strong>${optLetter}.</strong> ${opt}`;
                    optionDiv.onclick = () => handleSelect(q.id, optIndex);

                    optionsList.appendChild(optionDiv);
                });
                card.appendChild(optionsList);

                // Correct answer hint
                const correctHint = document.createElement('div');
                correctHint.className = 'correct-answer-hint';
                if (state.status === 'wrong') {
                    const correctLetter = labels[q.answer];
                    correctHint.textContent = `✅ Đáp án đúng là: ${correctLetter}`;
                    correctHint.style.display = 'block';
                } else {
                    correctHint.style.display = 'none';
                }
                card.appendChild(correctHint);

                // Explanation
                if (q.explanation) {
                    const expDiv = document.createElement('div');
                    expDiv.className = 'explanation';
                    expDiv.id = `exp-${q.id}`;
                    expDiv.innerHTML = `<strong>💡 Giải thích:</strong><br>${q.explanation}`;
                    if (state.status === 'correct' || state.status === 'wrong') {
                        expDiv.style.display = 'block';
                    } else {
                        expDiv.style.display = 'none';
                    }
                    card.appendChild(expDiv);
                }

                container.appendChild(card);
            });

            updateStats();
        }

        function handleSelect(qId, optIndex) {
            const state = questionState[qId];
            if (!state) return;

            if (state.status !== 'unanswered') return;

            const q = QUESTION_DATA.find(item => item.id === qId);
            if (!q) return;

            state.selected = optIndex;
            const isCorrect = (optIndex === q.answer);
            state.status = isCorrect ? 'correct' : 'wrong';

            updateCardUI(qId);
            updateStats();

            if (isCorrect) {
                showToast('✅ Chính xác!', 'correct');
            } else {
                const labels = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                showToast(`❌ Sai! Đáp án đúng là ${labels[q.answer]}.`, 'wrong');
            }
        }

        function updateCardUI(qId) {
            const q = QUESTION_DATA.find(item => item.id === qId);
            if (!q) return;

            const state = questionState[qId];
            if (!state) return;

            const card = document.getElementById(`q-${qId}`);
            if (!card) return;

            // Update badge
            const badge = card.querySelector('.result-badge');
            if (badge) {
                badge.className = 'result-badge';
                if (state.status === 'correct') {
                    badge.className += ' result-correct';
                    badge.textContent = '✅ Đúng';
                } else if (state.status === 'wrong') {
                    badge.className += ' result-wrong';
                    badge.textContent = '❌ Sai';
                } else {
                    badge.className += ' result-unanswered';
                    badge.textContent = '⏳ Chưa làm';
                }
            }

            // Update options
            const options = card.querySelectorAll('.option');
            const labels = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            options.forEach((optDiv, idx) => {
                const isSelected = state.selected === idx;
                const isCorrect = state.status === 'correct' && idx === q.answer;
                const isWrong = state.status === 'wrong' && isSelected && idx !== q.answer;

                optDiv.className = 'option';
                if (isCorrect) optDiv.classList.add('correct');
                if (isWrong) optDiv.classList.add('wrong');
                if (state.status !== 'unanswered') optDiv.classList.add('disabled');
            });

            // Update correct answer hint
            const correctHint = card.querySelector('.correct-answer-hint');
            if (correctHint) {
                if (state.status === 'wrong') {
                    const correctLetter = labels[q.answer];
                    correctHint.textContent = `✅ Đáp án đúng là: ${correctLetter}`;
                    correctHint.style.display = 'block';
                } else {
                    correctHint.style.display = 'none';
                }
            }

            // Update explanation
            const expDiv = document.getElementById(`exp-${qId}`);
            if (expDiv) {
                if (state.status === 'correct' || state.status === 'wrong') {
                    expDiv.style.display = 'block';
                } else {
                    expDiv.style.display = 'none';
                }
            }

            // Update progress bar
            updateProgressBar();
        }

        function updateProgressBar() {
            const container = document.getElementById('quiz-container');
            const progressDiv = container.querySelector('.chapter-progress');
            if (!progressDiv) return;

            const answered = currentQuestions.filter(q => questionState[q.id]?.status !== 'unanswered').length;
            const total = currentQuestions.length;
            const progressPercent = total > 0 ? (answered / total) * 100 : 0;

            const fill = progressDiv.querySelector('.progress-fill');
            if (fill) fill.style.width = `${progressPercent}%`;

            const text = progressDiv.querySelector('.progress-text');
            if (text) text.textContent = `${answered}/${total} câu đã trả lời`;
        }

        function resetProgress() {
            if (!confirm('Bạn có chắc muốn làm lại tất cả câu hỏi trong chương này?')) return;

            currentQuestions.forEach(q => {
                questionState[q.id] = {
                    selected: null,
                    status: 'unanswered'
                };
            });

            renderQuiz();
            updateStats();
            showToast('🔄 Đã làm lại tất cả câu hỏi!', 'info');
        }

        function updateStats() {
            const total = currentQuestions.length;
            const correct = currentQuestions.filter(q => questionState[q.id]?.status === 'correct').length;
            const wrong = currentQuestions.filter(q => questionState[q.id]?.status === 'wrong').length;

            document.getElementById('val-correct').textContent = correct;
            document.getElementById('val-wrong').textContent = wrong;
            document.getElementById('val-total').textContent = total;
        }

        function showToast(message, type) {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('toast-hidden');
                setTimeout(() => toast.remove(), 500);
            }, 2500);
        }

        // Load mặc định
        document.addEventListener('DOMContentLoaded', () => {
            loadChapter();
        });
    </script>
