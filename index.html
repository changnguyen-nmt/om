<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Quản trị Vận hành - Quiz (Đầy đủ các chương)</title>
    <style>
        :root {
            --primary: #1e40af;
            --secondary: #3b82f6;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --correct-bg: #dcfce7;
            --correct-text: #166534;
            --correct-border: #22c55e;
            --wrong-bg: #fee2e2;
            --wrong-text: #991b1b;
            --wrong-border: #ef4444;
            --selected-bg: #dbeafe;
            --selected-border: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        .navbar {
            position: sticky;
            top: 0;
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.3rem;
        }

        .nav-right {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
        }

        .stats {
            display: flex;
            gap: 15px;
            font-weight: bold;
            background: rgba(255,255,255,0.15);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: white;
        }

        .stat-item span { margin-left: 5px; }

        .container {
            max-width: 850px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .chapter-selector {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
        }

        .chapter-selector label {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .chapter-selector select {
            padding: 10px 18px;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            min-width: 220px;
            font-weight: 500;
            transition: 0.2s;
        }

        .chapter-selector select:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .chapter-selector .chapter-info {
            font-size: 0.95rem;
            color: #64748b;
            margin-left: auto;
        }

        .btn-reset {
            padding: 10px 25px;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .btn-reset:hover {
            background: #cbd5e1;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            flex: 1;
        }

        .result-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .result-correct {
            background: #dcfce7;
            color: #166534;
        }

        .result-wrong {
            background: #fee2e2;
            color: #991b1b;
        }

        .result-unanswered {
            background: #f1f5f9;
            color: #64748b;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            padding: 12px 16px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            display: flex;
            align-items: flex-start;
        }

        .option:hover:not(.disabled) {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option strong {
            margin-right: 10px;
            flex-shrink: 0;
        }

        .option.selected {
            background: var(--selected-bg);
            border-color: var(--selected-border);
        }

        .option.correct {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option.wrong {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
            text-decoration: line-through;
        }

        .option.disabled {
            pointer-events: none;
            opacity: 0.85;
        }

        .explanation {
            margin-top: 18px;
            padding: 15px 18px;
            background: #fef3c7;
            border-left: 5px solid #f59e0b;
            color: #92400e;
            border-radius: 6px;
            font-size: 0.98rem;
            animation: fadeIn 0.4s ease;
            display: none;
        }

        .explanation strong {
            color: #b45309;
        }

        .correct-answer-hint {
            margin-top: 12px;
            padding: 10px 16px;
            background: #dcfce7;
            border-left: 4px solid #22c55e;
            border-radius: 4px;
            color: #166534;
            font-weight: 500;
            animation: fadeIn 0.4s ease;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #64748b;
        }

        .empty-state p {
            font-size: 1.05rem;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 600;
            color: white;
            z-index: 9999;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
            animation: fadeIn 0.35s ease;
            max-width: 400px;
        }

        .toast-correct { background: #22c55e; }
        .toast-wrong { background: #ef4444; }
        .toast-info { background: #3b82f6; }

        .toast-hidden {
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .chapter-progress {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            align-items: center;
        }

        .chapter-progress .progress-label {
            font-weight: 600;
            color: var(--text-main);
        }

        .chapter-progress .progress-bar {
            flex: 1;
            min-width: 150px;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .chapter-progress .progress-bar .progress-fill {
            height: 100%;
            background: var(--secondary);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .chapter-progress .progress-text {
            font-size: 0.9rem;
            color: #64748b;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .nav-right {
                justify-content: space-between;
            }
            .stats {
                padding: 6px 12px;
                font-size: 0.8rem;
                gap: 10px;
            }
            .chapter-selector {
                flex-direction: column;
                align-items: stretch;
            }
            .chapter-selector .chapter-info {
                margin-left: 0;
                text-align: center;
            }
            .question-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .question-text {
                font-size: 1rem;
            }
            .option {
                font-size: 0.95rem;
                padding: 10px 14px;
            }
            .chapter-progress {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <h1>📚 Quản trị Vận hành - Quiz</h1>
        <div class="nav-right">
            <div class="stats">
                <span>✅ Đúng: <span id="val-correct">0</span></span>
                <span>❌ Sai: <span id="val-wrong">0</span></span>
                <span>📊 Tổng: <span id="val-total">0</span></span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="chapter-selector">
            <label for="chapter-select">📖 Chọn chương:</label>
            <select id="chapter-select" onchange="loadChapter()">
                <option value="all">📚 Tất cả các chương</option>
                <option value="1">Chương 1: Giới thiệu về Quản trị Vận hành</option>
                <option value="2">Chương 2: Năng lực cạnh tranh, Chiến lược và Năng suất</option>
                <option value="3">Chương 3: Dự báo</option>
                <option value="4">Chương 4: Thiết kế Sản phẩm và Dịch vụ</option>
                <option value="4s">Chương 4S: Độ tin cậy</option>
                <option value="5">Chương 5: Lập kế hoạch Năng lực</option>
                <option value="5s">Chương 5S: Cây quyết định</option>
                <option value="6">Chương 6: Thiết kế quy trình và Bố trí mặt bằng</option>
                <option value="7">Chương 7: Thiết kế công việc và Đo lường công việc</option>
                <option value="7s">Chương 7S: Đường cong học tập</option>
                <option value="8">Chương 8: Định vị cơ sở</option>
                <option value="8s">Chương 8S: Mô hình vận tải</option>
                <option value="9">Chương 9: Quản lý chất lượng</option>
                <option value="10">Chương 10: Kiểm soát chất lượng</option>
                <option value="10s">Chương 10S: Lấy mẫu chấp nhận</option>
                <option value="11">Chương 11: Lập kế hoạch tổng hợp</option>
                <option value="12">Chương 12: Hoạch định Nhu cầu Vật tư (MRP)</option>
                <option value="13">Chương 13: Quản lý Hàng tồn kho</option>
                <option value="14">Chương 14: Hệ thống Sản xuất Tinh gọn (Lean)</option>
                <option value="14s">Chương 14S: Bảo trì</option>
                <option value="15">Chương 15: Quản lý Chuỗi Cung ứng</option>
                <option value="16">Chương 16: Lập lịch trình</option>
                <option value="17">Chương 17: Quản lý Dự án</option>
                <option value="18">Chương 18: Mô hình Hàng đợi</option>
                <option value="19">Chương 19: Quy hoạch Tuyến tính</option>
            </select>
            <button class="btn-reset" onclick="resetProgress()">🔄 Làm lại</button>
            <span class="chapter-info" id="chapter-info">Đã chọn: Tất cả</span>
        </div>

        <div id="quiz-container"></div>
    </div>

    <script>
        // ============================================================
        // DỮ LIỆU CÂU HỎI TỪ CHƯƠNG 1 ĐẾN 19 (ĐẦY ĐỦ)
        // ============================================================
        const QUESTION_DATA = [
            // === CHƯƠNG 1: 70 câu ===
            { id: 1, chapter: 1, text: 'Operations managers are responsible for assessing consumer wants and needs and selling and promoting the organization\'s goods or services.', options: ['True', 'False'], answer: 1, explanation: 'Operation managers are not responsible for promoting goods/services.' },
            { id: 2, chapter: 1, text: 'Often, the collective success or failure of companies\' operations functions will impact the ability of a nation to compete with other nations.', options: ['True', 'False'], answer: 0, explanation: 'A nation is often only as competitive as its companies.' },
            { id: 3, chapter: 1, text: 'Companies are either producing goods or delivering services. This means that only one of the two types of operations management strategies are used.', options: ['True', 'False'], answer: 1, explanation: 'Most systems involve a blend of goods and services.' },
            { id: 4, chapter: 1, text: 'Operations, marketing, and finance function independently of each other in most organizations.', options: ['True', 'False'], answer: 1, explanation: 'Operations, marketing and finance are naturally dependent upon one another.' },
            { id: 5, chapter: 1, text: 'The greater the degree of customer involvement, the more challenging the design and management of operations.', options: ['True', 'False'], answer: 0, explanation: 'Greater customer involvement leads to more complexity in the design and management of operations.' },
            { id: 6, chapter: 1, text: 'Goods producing organizations are not involved in service activities.', options: ['True', 'False'], answer: 1, explanation: 'Most systems involve a blend of goods and services.' },
            { id: 7, chapter: 1, text: 'Service operations require additional inventory because of the unpredictability of consumer demand.', options: ['True', 'False'], answer: 1, explanation: 'Service operations cannot use inventory as a hedge against unpredictable demand.' },
            { id: 8, chapter: 1, text: 'The value of outputs is measured by the prices customers are willing to pay for goods or services.', options: ['True', 'False'], answer: 0, explanation: 'Customers\' willingness to pay for goods or services sets the value of these outputs.' },
            { id: 9, chapter: 1, text: 'The use of models will guarantee the best possible decisions.', options: ['True', 'False'], answer: 1, explanation: 'Models are useful, but their use does not guarantee the best decisions.' },
            { id: 10, chapter: 1, text: 'People who work in the field of operations should have skills that include both knowledge and people skills.', options: ['True', 'False'], answer: 0, explanation: 'Operations management requires a blend of knowledge and people skills.' },
            { id: 11, chapter: 1, text: 'Assembly lines achieved productivity but at the expense of standard of living.', options: ['True', 'False'], answer: 1, explanation: 'Productivity and standard of living go hand in hand.' },
            { id: 12, chapter: 1, text: 'The operations manager has primary responsibility for making operations system design decisions, such as system capacity and location of facilities.', options: ['True', 'False'], answer: 1, explanation: 'The operations manager plays a role in these decisions but is not primarily responsible for them.' },
            { id: 13, chapter: 1, text: 'The word "technology" is used only to refer to "information technology".', options: ['True', 'False'], answer: 1, explanation: 'Technology also refers to the technology involved in resource transformations.' },
            { id: 14, chapter: 1, text: 'Value added\' by definition is always a positive number since \'added\' implies increases.', options: ['True', 'False'], answer: 1, explanation: 'Some transformations result in the output being worth less than the inputs.' },
            { id: 15, chapter: 1, text: 'Service often requires greater labor content, whereas manufacturing is more capital intensive.', options: ['True', 'False'], answer: 0, explanation: 'Service operations tend to be more labor-intensive than manufacturing.' },
            { id: 16, chapter: 1, text: 'Measurement of productivity in service is more straightforward than in manufacturing since it is not necessary to take into account the cost of materials.', options: ['True', 'False'], answer: 1, explanation: 'Materials cost must be considered in services as well.' },
            { id: 17, chapter: 1, text: 'Special-purpose technology is a common way of offering increased customization in manufacturing or services without taking on additional labor costs.', options: ['True', 'False'], answer: 1, explanation: 'Special-purpose technology typically reduces costs through standardization.' },
            { id: 18, chapter: 1, text: 'One concern in the design of production systems is the degree of standardization.', options: ['True', 'False'], answer: 0, explanation: 'How standardized outputs will be is a critical consideration in the system design question.' },
            { id: 19, chapter: 1, text: 'Most people encounter operations only in profit-making organizations.', options: ['True', 'False'], answer: 1, explanation: 'Operations are also relevant to not-for-profit organizations such as the Red Cross.' },
            { id: 20, chapter: 1, text: 'Service involves a much higher degree of customer contact than manufacturing.', options: ['True', 'False'], answer: 0, explanation: 'Customer contact tends to be much higher in services.' },
            { id: 21, chapter: 1, text: 'A systems approach emphasizes interrelationships among subsystems, but its main theme is that the whole is greater than the sum of its individual parts.', options: ['True', 'False'], answer: 0, explanation: 'Optimizing the performance of individual subsystems does not guarantee optimal performance from the overall system.' },
            { id: 22, chapter: 1, text: 'The Pareto phenomenon is one of the most important and pervasive concepts that can be applied at all levels of management.', options: ['True', 'False'], answer: 0, explanation: 'Pareto phenomena can be observed in a wide variety of organization situations.' },
            { id: 23, chapter: 1, text: 'Operations managers, who usually use quantitative approaches, are not really concerned with ethical decision-making.', options: ['True', 'False'], answer: 1, explanation: 'Ethics issues are touching on all areas of management, including operations.' },
            { id: 24, chapter: 1, text: 'The optimal solutions produced by quantitative techniques should always be evaluated in terms of the larger framework.', options: ['True', 'False'], answer: 0, explanation: 'Quantitative techniques have limitations that must be considered.' },
            { id: 25, chapter: 1, text: 'Managers should most often rely on quantitative techniques for important decisions since quantitative approaches result in more accurate decisions.', options: ['True', 'False'], answer: 1, explanation: 'Just as other techniques do, quantitative techniques have limitations.' },
            { id: 26, chapter: 1, text: 'Many operations management decisions can be described as tradeoffs.', options: ['True', 'False'], answer: 0, explanation: 'Managing tradeoffs is the essence of operations management.' },
            { id: 27, chapter: 1, text: 'A systems approach means that we concentrate on efficiency within a subsystem and thereby assure overall efficiency.', options: ['True', 'False'], answer: 1, explanation: 'Subsystem efficiency doesn\'t necessarily translate into overall efficiency.' },
            { id: 28, chapter: 1, text: 'Prior to the Industrial Revolution, goods were produced primarily by craftsmen or their apprentices using custom made parts.', options: ['True', 'False'], answer: 0, explanation: 'After the Industrial Revolution, more standardized approaches became common.' },
            { id: 29, chapter: 1, text: 'Elton Mayo\'s "Hawthorne Experiment" was the focal point of the Human Relations Movement, which emphasized the importance of the human element in job design.', options: ['True', 'False'], answer: 0, explanation: 'The Hawthorne Experiments were the beginning of the Human Relations Movement.' },
            { id: 30, chapter: 1, text: 'Among Ford\'s many contributions was the introduction of mass production, using the concept of interchangeable parts and division of labor.', options: ['True', 'False'], answer: 0, explanation: 'Ford made mass production a practical success.' },
            { id: 31, chapter: 1, text: 'Operations management and marketing are the two functional areas that exist to support activities in other functions such as accounting, finance, IT and human resources.', options: ['True', 'False'], answer: 1, explanation: 'Operations management and marketing are supported by these functions.' },
            { id: 32, chapter: 1, text: 'Lean production systems incorporate the advantages of both mass production and craft production.', options: ['True', 'False'], answer: 0, explanation: 'Lean production blends the best of both worlds.' },
            { id: 33, chapter: 1, text: 'As an abstraction of reality, a model is a simplified version of a real phenomenon.', options: ['True', 'False'], answer: 0, explanation: 'Models are valuable abstractions and simplifications of real, complex phenomena.' },
            { id: 34, chapter: 1, text: 'Lean production systems use a highly skilled work force and flexible equipment.', options: ['True', 'False'], answer: 0, explanation: 'Lean depends on a skilled workforce.' },
            { id: 35, chapter: 1, text: 'The lean production philosophy has been slow to be adopted in service industries.', options: ['True', 'False'], answer: 1, explanation: 'Lean concepts apply very well in service industries.' },
            { id: 36, chapter: 1, text: 'Operations Management activities will be less important in the future because many firms are becoming service-oriented operations rather than goods producing operations.', options: ['True', 'False'], answer: 1, explanation: 'Operations management is just as important for service firms.' },
            { id: 37, chapter: 1, text: 'A modern firm has two supply chain considerations - external links with suppliers and customers, and an internal network of flows to and between the operations function itself.', options: ['True', 'False'], answer: 0, explanation: 'Supply chain considerations are at play both in and beyond the modern firm.' },
            { id: 38, chapter: 1, text: 'Operations management involves continuous decision-making; hopefully most decisions made will be:', options: ['redundant', 'minor in nature', 'informed', 'quantitative', 'none of the above'], answer: 2, explanation: 'Informed decisions incorporate all relevant issues.' },
            { id: 39, chapter: 1, text: 'A \'product package\' consists of:', options: ['the exterior wrapping', 'the shipping container', 'a combination of goods and services', 'goods if a manufacturing organization', 'customer relations if a service organization'], answer: 2, explanation: 'Most firms are not pure service or manufacturing firms; they produce combinations of goods and services.' },
            { id: 40, chapter: 1, text: 'Business organizations consist of three major functions which, ideally:', options: ['support one another', 'are mutually exclusive', 'exist independently of each other', 'function independently of each other', 'do not interface with each other'], answer: 0, explanation: 'Finance, Marketing and Operations are these major functions.' },
            { id: 41, chapter: 1, text: 'Which of the following is not a type of operations?', options: ['goods production', 'storage/transportation', 'entertainment', 'communication', 'all the above involve operations'], answer: 4, explanation: 'All of these involve taking inputs and transforming them.' },
            { id: 42, chapter: 1, text: 'Technology choices seldom affect:', options: ['costs', 'productivity', 'union activity', 'quality', 'flexibility'], answer: 2, explanation: 'Union activity can affect a firm\'s technology choices, but not the other way around.' },
            { id: 43, chapter: 1, text: 'Measurements taken at various points in the transformation process for control purposes are called:', options: ['plans', 'directions', 'controls', 'feedback', 'budgets'], answer: 3, explanation: 'Feedback is used to monitor and improve processes.' },
            { id: 44, chapter: 1, text: 'Budgeting, analysis of investment proposals, and provision of funds are activities associated with the _____ function.', options: ['operation', 'marketing', 'purchasing', 'finance', 'internal audit'], answer: 3, explanation: 'These are the primary tasks for the finance function.' },
            { id: 45, chapter: 1, text: 'Which one of the following would not generally be classified under the heading of transformation?', options: ['assembling', 'teaching', 'staffing', 'farming', 'consulting'], answer: 2, explanation: 'Staffing doesn\'t involve transforming resources so much as it involves acquiring them.' },
            { id: 46, chapter: 1, text: 'Manufacturing work sent to other countries is called:', options: ['downsized', 'outsourced', 'internationalization', 'vertical integration', 'entrepreneurial ship'], answer: 1, explanation: 'Outsourcing is increasingly a part of operations management.' },
            { id: 47, chapter: 1, text: 'Product design and process selection are examples of _____ decisions.', options: ['financial', 'tactical', 'system design', 'system operation', 'forecasting'], answer: 2, explanation: 'These major decisions affect decisions made at lower levels.' },
            { id: 48, chapter: 1, text: 'The responsibilities of the operations manager are:', options: ['planning, organizing, staffing, procuring, and reviewing', 'planning, organizing, staffing, directing, and controlling', 'forecasting, designing, planning, organizing, and controlling', 'forecasting, designing, operating, procuring, and reviewing', 'designing and operating'], answer: 1, explanation: 'The scope of operations management ranges across the organization.' },
            { id: 49, chapter: 1, text: 'Knowledge skills usually don\'t include:', options: ['process knowledge', 'accounting skills', 'communication skills', 'global knowledge', 'all of the above'], answer: 2, explanation: 'Communication skills generally are considered to be people skills.' },
            { id: 50, chapter: 1, text: 'Which of the following is not true about systems approach?', options: ['A systems viewpoint is almost always beneficial in decision making.', 'A systems approach emphasizes interrelationships among subsystems.', 'A systems approach concentrates on efficiency within subsystems.', 'A systems approach is essential whenever something is being redesigned or improved.', 'All of the above are true.'], answer: 2, explanation: 'Subsystem efficiency doesn\'t necessarily translate into overall system efficiency.' },
            { id: 51, chapter: 1, text: 'What is credited with gains in industrial productivity, increased standards of living and affordable products?', options: ['personal computers', 'the internet', 'mass transportation', 'assembly lines', 'multi-level marketing'], answer: 3, explanation: 'Mass production has played a prominent role in increasing standards of living.' },
            { id: 52, chapter: 1, text: 'Production systems with customized outputs typically have relatively:', options: ['high volumes of output', 'low unit costs', 'high amount of specialized equipment', 'fast work movement', 'skilled workers'], answer: 4, explanation: 'Skilled workers are necessary to accommodate the variation inherent in customized outputs.' },
            { id: 53, chapter: 1, text: 'Which is not a significant difference between manufacturing and service operations?', options: ['cost per unit', 'uniformity of output', 'labor content of jobs', 'customer contact', 'measurement of productivity'], answer: 0, explanation: 'Manufacturing operations aren\'t necessarily more or less efficient than service operations.' },
            { id: 54, chapter: 1, text: 'Which of the following is not a characteristic of service operations?', options: ['intangible output', 'high customer contact', 'high labor content', 'easy measurement of productivity', 'low uniformity of output'], answer: 3, explanation: 'The productivity of service operations is often hard to measure.' },
            { id: 55, chapter: 1, text: 'Which of the following is a recent trend in business?', options: ['pollution control', 'total quality management', 'supply chain management', 'competition from foreign manufacturers', 'technological change'], answer: 2, explanation: 'Supply chain management involves a broader systemic view of operations.' },
            { id: 56, chapter: 1, text: 'Farming is an example of:', options: ['an obsolete activity', 'a virtual organization', 'non-manufactured goods', 'a growth industry', 'customized manufacturing'], answer: 2, explanation: 'Farm operations are not manufacturing operations.' },
            { id: 57, chapter: 1, text: 'Dealing with the fact that certain aspects of any management situation are more important than others is called:', options: ['analysis of tradeoffs', 'sensitivity analysis', 'recognition of priorities', 'analysis of variance', 'decision table analysis'], answer: 2, explanation: 'Solutions tend to be targeted toward higher priority aspects of a situation.' },
            { id: 58, chapter: 1, text: 'The fact that a few improvements in a few key areas of operations will have more impact than many improvements in many other areas is consistent with the:', options: ['Irwin phenomenon', 'Pareto phenomenon', 'Stevenson phenomenon', 'Tellier phenomenon', 'Adam Smith phenomenon'], answer: 1, explanation: 'Pareto phenomena direct our attention to the difference between the "important few" and the "trivial many."' },
            { id: 59, chapter: 1, text: 'The process of comparing outputs to previously established standards to determine if corrective action is needed is called:', options: ['planning', 'directing', 'controlling', 'budgetting', 'disciplining'], answer: 2, explanation: 'Controls are used to maintain performance.' },
            { id: 60, chapter: 1, text: 'Which of the following does not relate to system design?', options: ['altering the system capacity', 'location of facilities', 'inventory management', 'selection and acquisition of equipment', 'physical arrangement of departments'], answer: 2, explanation: 'Inventory management is a system operation decision area.' },
            { id: 61, chapter: 1, text: 'Taking a systems viewpoint with regard to operations in today\'s environment increasingly leads decision-makers to consider _____ in response to the _____.', options: ['flexibility; pressure to be more efficient', 'offshoring; need to promote domestic production', 'sustainability; threat of global warming', 'technology; impact of random variation', 'forecasting; stabilization of demand'], answer: 2, explanation: 'Sustainability is a relatively recent operations management consideration.' },
            { id: 62, chapter: 1, text: 'Some companies attempt to maximize the revenue they receive from fixed operating capacity by influencing demands through price manipulation. This is an example of:', options: ['Illegal price discrimination', 'Collusion', 'Volume analysis', 'Revenue management', 'Outsourcing'], answer: 3, explanation: 'Revenue management is used to ensure that as much perishable capacity as possible is sold.' },
            { id: 63, chapter: 1, text: 'Which of the following is not an ongoing trend in manufacturing?', options: ['globalization', 'quality improvement', 'flexibility and agility', 'mass production for greater economies of scale', 'technological advances'], answer: 3, explanation: 'Manufacturers are moving away from mass production for economies of scale.' },
            { id: 64, chapter: 1, text: 'Which of the following is not a benefit of using models in decision making?', options: ['They provide a standardized format for analyzing a problem.', 'They serve as a consistent tool for evaluation.', 'They are easy to use and less expensive than dealing with the actual situation.', 'All of the above are benefits.', 'None of the above is a benefit.'], answer: 3, explanation: 'Models are useful tools for making decisions without confronting the actual situation with all of its complexity.' },
            { id: 65, chapter: 1, text: 'Modern firms increasingly rely on other firms to supply goods and services instead of doing these tasks themselves. This increased level of _____ is leading to increased emphasis on _____ management.', options: ['outsourcing; supply chain', 'offshoring; lean', 'downsizing; total quality', 'optimizing; inventory', 'internationalization; intercultural'], answer: 0, explanation: 'Supply chain management takes a more systemic view of the firm, its operations, and its suppliers.' },
            { id: 66, chapter: 1, text: 'Operations and sales are the two _____ functions in businesses.', options: ['strategic', 'tactical', 'support', 'value-adding', 'line'], answer: 3, explanation: 'Others are support functions.' },
            { id: 67, chapter: 1, text: 'Marketing depends on operations for information regarding:', options: ['productivity', 'lead time', 'cash flow', 'budgeting', 'corporate intelligence'], answer: 1, explanation: 'Marketing uses lead time information to make promises to customers.' },
            { id: 68, chapter: 1, text: 'Two widely used metrics of variation are the _____ and the _____.', options: ['mean; standard deviation', 'productivity ratio; correlation', 'standardized mean; assignable deviation', 'randomized mean; standardized deviation', 'normal distribution; random variation'], answer: 0, explanation: 'The mean and standard deviation summarize important facets regarding the variation in a process.' },
            { id: 69, chapter: 1, text: 'Which of the following statements about variation is FALSE?', options: ['Variation prevents a production process from being as efficient as it can be.', 'Some variation can be prevented.', 'Variation can either be assignable or random.', 'Any variation makes a production process less productive.', 'Random variation generally cannot be influenced by managers.'], answer: 3, explanation: 'The choice to offer customers greater variety might increase variation but increase productivity even more.' },
            { id: 70, chapter: 1, text: 'Which of the following is essential to consider with respect to managing a process to meet demand?', options: ['strategy', 'demand forecasts', 'capacity', 'random variability', 'all of the above'], answer: 4, explanation: 'All of these play a role in determining whether a process can meet demand.' },

            // === CHƯƠNG 2: 70 câu ===
            { id: 101, chapter: 2, text: 'An example of a strategic operations management decision is the choice of where to locate.', options: ['True', 'False'], answer: 0, explanation: 'Location decisions are strategic in nature.' },
            { id: 102, chapter: 2, text: 'An example of an operational operations management decision is inventory level management.', options: ['True', 'False'], answer: 0, explanation: 'Inventory management is an operational decision.' },
            { id: 103, chapter: 2, text: 'Government statistics are a good source of data about productivity trends in the service sector.', options: ['True', 'False'], answer: 1, explanation: 'The service sector is often omitted in government statistics.' },
            { id: 104, chapter: 2, text: 'An example of a tactical operations management decision is determining employment levels.', options: ['True', 'False'], answer: 0, explanation: 'Staffing is an ongoing, tactical decision.' },
            { id: 105, chapter: 2, text: 'Productivity is defined as the ratio of output to input.', options: ['True', 'False'], answer: 0, explanation: 'Divide outputs by inputs to get productivity.' },
            { id: 106, chapter: 2, text: 'Productivity is defined as the ratio of input to output.', options: ['True', 'False'], answer: 1, explanation: 'Productivity is the ratio of outputs to inputs.' },
            { id: 107, chapter: 2, text: 'Competitiveness relates to the profitability of an organization in the marketplace.', options: ['True', 'False'], answer: 1, explanation: 'Competitiveness relates to how effectively an organization meets the wants and needs of customers relative to other organizations that offer similar goods or services.' },
            { id: 108, chapter: 2, text: 'If people would only work harder, productivity would increase.', options: ['True', 'False'], answer: 1, explanation: 'Working harder can actually reduce productivity in some cases.' },
            { id: 109, chapter: 2, text: 'Tracking productivity measures over time enables managers to judge organizational performance and decide where improvements are needed.', options: ['True', 'False'], answer: 0, explanation: 'Productivity trends direct attention toward problems and opportunities.' },
            { id: 110, chapter: 2, text: 'Productivity is directly related to the ability of an organization to compete.', options: ['True', 'False'], answer: 0, explanation: 'A more productive organization is a more competitive organization.' },
            { id: 111, chapter: 2, text: 'A characteristic that was once an order winner may become an order qualifier, and vice versa.', options: ['True', 'False'], answer: 0, explanation: 'Order qualifiers and order winners are shaped by the environment.' },
            { id: 112, chapter: 2, text: 'Outsourcing tends to improve quality but at the cost of lowered productivity.', options: ['True', 'False'], answer: 1, explanation: 'Outsourcing can lead to both quality and productivity improvements.' },
            { id: 113, chapter: 2, text: 'Productivity tends to be only a very minor factor in an organization\'s ability to compete.', options: ['True', 'False'], answer: 1, explanation: 'An organization\'s ability to compete is directly affected by its productivity.' },
            { id: 114, chapter: 2, text: 'An organization that is twice as productive as its competitor will be twice as profitable.', options: ['True', 'False'], answer: 1, explanation: 'Productivity advantages don\'t necessarily translate into profitability advantages.' },
            { id: 115, chapter: 2, text: 'National productivity is determined by averaging the productivity measures of various companies or industries.', options: ['True', 'False'], answer: 1, explanation: 'National productivity is determined by dividing inputs by outputs across a national economy; averaging industry measures would lead to a distorted estimate.' },
            { id: 116, chapter: 2, text: 'Wage and salary increases that are not accompanied by productivity increases tend to exert inflationary pressures on a nation\'s economy.', options: ['True', 'False'], answer: 0, explanation: 'True increases in standards of living come about through productivity improvements.' },
            { id: 117, chapter: 2, text: 'Global competition really only applies to multi-national organizations.', options: ['True', 'False'], answer: 1, explanation: 'Domestic-only organizations experience competition from organizations in other countries.' },
            { id: 118, chapter: 2, text: 'A business that is rated highly by its customers for service quality will tend to be more profitable than a business that is rated poorly.', options: ['True', 'False'], answer: 0, explanation: 'Service quality is a powerful tool for improving profitability.' },
            { id: 119, chapter: 2, text: 'Services often don\'t fit simple yield measurements.', options: ['True', 'False'], answer: 0, explanation: 'Comparing one service output to another is difficult to do accurately.' },
            { id: 120, chapter: 2, text: 'A mission statement should provide a guide for the formulation of strategies for the organization.', options: ['True', 'False'], answer: 0, explanation: 'Strategy-making is constrained by the mission statement.' },
            { id: 121, chapter: 2, text: 'The hierarchy and sequence of planning and decision-making is: mission, organizational strategy, tactics, and operational decisions.', options: ['True', 'False'], answer: 0, explanation: 'Mission is at the highest level of the hierarchy, while operation decisions are at the lowest.' },
            { id: 122, chapter: 2, text: 'Strategy includes both organizational and functional strategies.', options: ['True', 'False'], answer: 0, explanation: 'Organizational strategies shape functional strategies.' },
            { id: 123, chapter: 2, text: 'Organizational strategy should be determined without considering the realities of functional area strengths and weaknesses since they can be changed to meet our strategy.', options: ['True', 'False'], answer: 1, explanation: 'Functional strengths and weaknesses serve as the building blocks of organizational strategy.' },
            { id: 124, chapter: 2, text: 'Mission statements should be as specific as possible regarding exactly how they will be accomplished.', options: ['True', 'False'], answer: 1, explanation: 'Mission statements are very long-term and should provide enough room to accommodate major changes in direction.' },
            { id: 125, chapter: 2, text: 'Improving efficiency will guarantee a similar improvement in productivity.', options: ['True', 'False'], answer: 1, explanation: 'Efficiency is narrower than productivity.' },
            { id: 126, chapter: 2, text: 'As long as we match a competitor on quality and price we will gain market share.', options: ['True', 'False'], answer: 1, explanation: 'We usually have to better a competitor to win market share.' },
            { id: 127, chapter: 2, text: 'Environmental scanning is a search for events or trends that present either threats or opportunities to the organization.', options: ['True', 'False'], answer: 0, explanation: 'These events or trends should be taken into account when strategy is being formulated.' },
            { id: 128, chapter: 2, text: 'Standardization has the advantage of reducing variability.', options: ['True', 'False'], answer: 0, explanation: 'Standardization leads to reduced variability.' },
            { id: 129, chapter: 2, text: 'Traditional strategies of business organizations have tended to emphasize cost minimization or product differentiation.', options: ['True', 'False'], answer: 0, explanation: 'Time- and quality-based strategies are more recent developments.' },
            { id: 130, chapter: 2, text: 'The majority of our textbook deals with tactical operations that support established functional strategies.', options: ['True', 'False'], answer: 0, explanation: 'This represents the majority of on-going decision-making in operations.' },
            { id: 131, chapter: 2, text: 'Quality-based strategies focus on customer satisfaction by ensuring that each product is carefully and thoroughly inspected prior to delivery to prevent sending out bad product.', options: ['True', 'False'], answer: 1, explanation: 'Quality strategies are based on avoiding quality problems.' },
            { id: 132, chapter: 2, text: 'Time-based strategies focus on reducing the time required to accomplish certain activities, such as new product development or delivery to the customer.', options: ['True', 'False'], answer: 0, explanation: 'Being first to market or responding quickest to customer wants can be attractive strategies.' },
            { id: 133, chapter: 2, text: 'Functional strategies should be designed to directly support a firm\'s mission.', options: ['True', 'False'], answer: 1, explanation: 'Functional strategies should support organizational strategy.' },
            { id: 134, chapter: 2, text: 'Companies are required to use environmental scanning because of both federal and state regulations regarding environmental pollution control.', options: ['True', 'False'], answer: 1, explanation: 'Companies are not required to use scanning, but not using scanning is risky.' },
            { id: 135, chapter: 2, text: 'The Balanced Scorecard is an attractive tool to use in the formation of strategy.', options: ['True', 'False'], answer: 1, explanation: 'The Balanced Scorecard is used for the implementation of strategy.' },
            { id: 136, chapter: 2, text: 'One major shortcoming of the Balanced Scorecard is that it doesn\'t tend to take into account sustainability issues.', options: ['True', 'False'], answer: 0, explanation: 'Companies need to be aware of the impact they are having in these areas and respond accordingly.' },
            { id: 137, chapter: 2, text: 'Competitiveness doesn\'t include:', options: ['Productivity', 'Effectiveness', 'Profitability', 'Operations Strategy', 'Operations Management'], answer: 2, explanation: 'A company can be competitive relative to similar companies and still be unprofitable if the competitive environment is inherently unprofitable.' },
            { id: 138, chapter: 2, text: 'Product design and choice of location are examples of _____ decisions.', options: ['strategic', 'tactical', 'operational', 'customer focused', 'design'], answer: 0, explanation: 'These decisions are made high in the hierarchy.' },
            { id: 139, chapter: 2, text: 'Scheduling personnel is an example of an operations management:', options: ['mission implementation', 'operational decision', 'organizational strategy', 'functional strategy', 'tactical decision'], answer: 4, explanation: 'Staffing level decisions are made low in the hierarchy.' },
            { id: 140, chapter: 2, text: 'Productivity is expressed as:', options: ['output plus input', 'output minus input', 'output times input', 'output divided by input', 'input divided by output'], answer: 3, explanation: 'Productivity is the ratio of outputs to inputs.' },
            { id: 141, chapter: 2, text: 'In the 1970\'s and 1980\'s in the USA, organizations concentrated on:', options: ['operations strategies', 'improving quality', 'marketing and financial strategies', 'revising mission statements', 'environmental issues'], answer: 2, explanation: 'This led to U.S. firms being not very competitive with regard to their operations.' },
            { id: 142, chapter: 2, text: 'In the past, a significant reason why U.S. productivity was the highest in the world was high:', options: ['agricultural productivity', 'manufacturing productivity', 'labor productivity', 'savings productivity', 'governmental productivity'], answer: 0, explanation: 'This freed up resources for productivity improvements in a wide variety of non-agricultural sectors.' },
            { id: 143, chapter: 2, text: 'Which of the following is not a factor that affects productivity?', options: ['computer viruses', 'design of the workspace', 'use of the Internet', 'standardizing processes', 'wireless cellular phones'], answer: 0, explanation: 'These don\'t lead to fundamental changes in operations.' },
            { id: 144, chapter: 2, text: 'Which of these factors affects productivity?', options: ['methods and technology', 'workers', 'management', 'a and b only', 'all of the above'], answer: 4, explanation: 'All of these affect productivity.' },
            { id: 145, chapter: 2, text: 'Which of the following is not a key step toward improving productivity?', options: ['developing productivity measures for all operations', 'improving the bottleneck operations', 'establishing reasonable goals for improvement', 'considering incentives to reward workers', 'converting bond debt to stock ownership'], answer: 4, explanation: 'A firm\'s productivity is independent of its capital structure.' },
            { id: 146, chapter: 2, text: 'For an organization to grow its market share, it must:', options: ['advertise using multimedia', 'lower prices', 'exceed minimum standards of acceptability for its products or services', 'establish an internet website', 'broaden its mission statement'], answer: 2, explanation: 'Only by exceeding standards can an organization grow its market share.' },
            { id: 147, chapter: 2, text: 'The ratio of good output to quantity of raw material input is called:', options: ['non-defective productivity', 'process yield', 'worker quality measurement', 'total quality productivity', 'quantity/quality ratio'], answer: 1, explanation: 'This is sometimes a useful productivity measure in service industries.' },
            { id: 148, chapter: 2, text: 'The fundamental purpose for the existence of any organization is described by its:', options: ['policies', 'procedures', 'corporate charter', 'mission statement', 'bylaws'], answer: 3, explanation: 'A mission statement is the organization\'s attempt to justify its existence.' },
            { id: 149, chapter: 2, text: 'A productivity increase in one operation that doesn\'t improve overall productivity of the business isn\'t:', options: ['worthwhile', 'trivial', 'competence-destroying', 'an order winner', 'an order qualifier'], answer: 0, explanation: 'Only system-wide productivity improvement makes the organization more productive.' },
            { id: 150, chapter: 2, text: 'Value added can be calculated by:', options: ['average productivity gains over time', 'inputs divided by the outputs', 'outputs divided by the inputs', 'input plus output divided by two', 'outputs minus inputs'], answer: 4, explanation: 'Value added represents the change in value of the original inputs.' },
            { id: 151, chapter: 2, text: 'Which of the following is true?', options: ['Corporate strategy is shaped by functional strategies.', 'Corporate mission is shaped by corporate strategy.', 'Functional strategies are shaped by corporate strategy.', 'External conditions are shaped by corporate mission.', 'Corporate mission is shaped by functional strategies.'], answer: 2, explanation: 'Corporate strategy shapes strategies at lower levels.' },
            { id: 152, chapter: 2, text: 'Core competencies in organizations generally relate to:', options: ['cost', 'quality', 'time', 'flexibility', 'all of the above'], answer: 4, explanation: 'These are all representative of core competencies.' },
            { id: 153, chapter: 2, text: 'Which of the following is considered to be a cause of poor U.S. global competitiveness?', options: ['the tendency to view labor as a cost factor to be minimized', 'decision-making based on short-term horizons', 'weaknesses in technological practice', 'powerful trading partners', 'all of the above'], answer: 4, explanation: 'A number of factors can negatively shape a country\'s competitiveness.' },
            { id: 154, chapter: 2, text: 'Which of the following is not typically considered a cure for poor competitiveness?', options: ['remove communications barriers within organizations', 'minimize attention to the operations function', 'put less emphasis on short-term financial results', 'recognize labor as a valuable asset and act to develop it', 'improve quality'], answer: 1, explanation: 'Operations is a prime area for improving competitiveness.' },
            { id: 155, chapter: 2, text: 'Time-based approaches of business organizations focus on reducing the time to accomplish certain necessary activities. Time reductions seldom apply to:', options: ['product/service design time', 'processing time', 'delivery time', 'response time for complaints', 'internal audits'], answer: 4, explanation: 'Internal audits have little to do with core value-adding efforts.' },
            { id: 156, chapter: 2, text: 'The external elements of SWOT analysis are:', options: ['strengths and weaknesses', 'strengths and threats', 'opportunities and threats', 'weaknesses and opportunities', 'strengths and opportunities'], answer: 2, explanation: 'Opportunities and threats relate to the organization and its external environment.' },
            { id: 157, chapter: 2, text: 'In an assembly operation at a furniture factory, six employees assembled an average of 450 standard dining chairs per 5-day week. What is the labor productivity of this operation?', options: ['90 chairs/worker/day', '20 chairs/worker/day', '15 chairs/worker/day', '75 chairs/worker/day', 'none of the above'], answer: 2, explanation: 'Divide the output of 450 chairs by the inputs of 30 worker-days.' },
            { id: 158, chapter: 2, text: 'Which of the following is not a reason for poor performance of our organization in the marketplace?', options: ['placing too much emphasis on product/service design and too little on process design', 'failing to take into account customer wants and needs', 'putting too much emphasis on short-term financial performance', 'taking advantage of strengths/opportunities, and recognizing competitive threats', 'none of the above'], answer: 3, explanation: 'Taking advantage of strengths/opportunities and recognizing competitive threats would enable good performance.' },
            { id: 159, chapter: 2, text: 'The manager of a carpet store is trying to determine the best installation crew size. He has tried various crew sizes with the results shown below. Based on productivity, what crew size do you recommend?', options: ['2', '3', '4'], answer: 0, explanation: 'Crews of two workers are most productive.' },
            { id: 160, chapter: 2, text: 'Which of the following is not a key factor of competitiveness?', options: ['price', 'product differentiation', 'flexibility', 'after-sale service', 'size of organization'], answer: 4, explanation: 'Competitiveness often has nothing to do with organization size.' },
            { id: 161, chapter: 2, text: 'Gourmet Pretzels bakes soft pretzels on an assembly line. It currently bakes 800 pretzels each 8-hour shift. If the production is increased to 1,200 pretzels each shift, then productivity will have increased by:', options: ['50%', '33%', '25%', '67%'], answer: 0, explanation: 'Divide the difference in productivity by the original productivity.' },
            { id: 162, chapter: 2, text: 'The Balanced Scorecard is a useful tool for helping managers translate their strategy into action in the following areas:', options: ['Sustainability; Flexibility; Efficiency; Technology', 'Customers; Financial; Internal Business Processes; Learning and Growth', 'Customization; Standardization; Efficiency; Effectiveness', 'The Environment; The Community; Suppliers; Other Stakeholders', 'Strategy; Tactics; Productivity; Profitability'], answer: 1, explanation: 'These are the four core areas addressed by the Balanced Scorecard.' },
            { id: 163, chapter: 2, text: 'A firm pursuing a strategy based on customization and variety will tend to structure and manage its supply chain to accommodate more _____ than a firm pursuing a strategy based on low-cost and high-volume.', options: ['Variation', 'Streamlined flow', 'Quality', 'Capacity', 'Productivity'], answer: 0, explanation: 'Customization and variety lead to variation that must be accommodated.' },
            { id: 164, chapter: 2, text: 'Unique attributes of firms that give them a competitive edge are called:', options: ['Functional strategies', 'Balanced scorecards', 'Supply chains', 'Core competencies', 'Sustainable initiatives'], answer: 3, explanation: 'Core competencies can be translated into competitive advantage.' },
            { id: 165, chapter: 2, text: 'Years ago in the overnight delivery business, providing package tracking capability gave some firms a competitive advantage. Now, all firms must offer this capability simply to be in this line of business. This is an example of _____ becoming _____ over time.', options: ['Tactical implications; strategic', 'Strategic implications; tactical', 'Order winners; order qualifiers', 'Profitability factors; productivity factors', 'Order qualifiers; order winners'], answer: 2, explanation: 'What is an order qualifier and what is an order winner changes over time.' },
            { id: 166, chapter: 2, text: 'For firms competing in worldwide markets, conducting _____ is more complex, since what works in one country or region might not work in another.', options: ['Productivity analysis', 'Environmental analysis', 'Strategy implementation', 'Sustainability analysis', 'Growth forecasting'], answer: 1, explanation: 'Environmental analysis takes into account the relevant factors in the environment; there are more of these if there are more markets to consider.' },
            { id: 167, chapter: 2, text: 'Increasing the service offered to the customer makes it more difficult to compete on the basis of:', options: ['order qualifiers', 'customization', 'quality', 'price', 'flexibility'], answer: 3, explanation: 'More extensive service can be more costly, and more costly outputs make price-based strategies more difficult.' },
            { id: 168, chapter: 2, text: '_____ is generally used to facilitate an organization strategy that emphasizes low cost.', options: ['Speed to market', 'Flexibility', 'Customization', 'Sustainability', 'None of the above'], answer: 4, explanation: 'All of these would actually lead to higher costs.' },
            { id: 169, chapter: 2, text: 'Which of the following factors would tend to reduce productivity?', options: ['improvements in workplace safety', 'reductions in labor turnover', 'more inexperienced workers', 'reductions in the scrap rate', 'none of the above'], answer: 2, explanation: 'More inexperienced workers tend to be less productive.' },
            { id: 170, chapter: 2, text: 'Suppose a country\'s productivity last year was 84. If this country\'s productivity growth rate of 5% is to be maintained, this means that this year\'s productivity will have to be ______.', options: ['88.2', '79.8', '82.8', '78.9', '4.2'], answer: 0, explanation: 'Multiply 84 by 1.05 to get 88.2.' },

            // === CHƯƠNG 3: 100 câu ===
            { id: 201, chapter: 3, text: 'Forecasting techniques generally assume an existing causal system that will continue to exist in the future.', options: ['True', 'False'], answer: 0, explanation: 'Forecasts depend on the rules of the game remaining reasonably constant.' },
            { id: 202, chapter: 3, text: 'For new products in a strong growth mode, a low alpha will minimize forecast errors when using exponential smoothing techniques.', options: ['True', 'False'], answer: 1, explanation: 'If growth is strong, alpha should be large so that the model will catch up more quickly.' },
            { id: 203, chapter: 3, text: 'Once accepted by managers, forecasts should be held firm regardless of new input since many plans have been made using the original forecast.', options: ['True', 'False'], answer: 1, explanation: 'Flexibility to accommodate major changes is important to good forecasting.' },
            { id: 204, chapter: 3, text: 'Forecasts for groups of items tend to be less accurate than forecasts for individual items because forecasts for individual items don\'t include as many influencing factors.', options: ['True', 'False'], answer: 1, explanation: 'Forecasting for an individual item is more difficult than forecasting for a number of items.' },
            { id: 205, chapter: 3, text: 'Forecasts help managers plan both the system itself and provide valuable information for using the system.', options: ['True', 'False'], answer: 0, explanation: 'Both planning and use are shaped by forecasts.' },
            { id: 206, chapter: 3, text: 'Organizations that are capable of responding quickly to changing requirements can use a shorter forecast horizon and therefore benefit from more accurate forecasts.', options: ['True', 'False'], answer: 0, explanation: 'If an organization can react quicker, its forecasts need not be so long term.' },
            { id: 207, chapter: 3, text: 'When new products or services are introduced, focus forecasting models are an attractive option.', options: ['True', 'False'], answer: 1, explanation: 'Because focus forecasting models depend on historical data, they\'re not so attractive for newly introduced products or services.' },
            { id: 208, chapter: 3, text: 'The purpose of the forecast should be established first so that the level of detail, amount of resources, and accuracy level can be understood.', options: ['True', 'False'], answer: 0, explanation: 'All of these considerations are shaped by what the forecast will be used for.' },
            { id: 209, chapter: 3, text: 'Forecasts based on time series (historical) data are referred to as associative forecasts.', options: ['True', 'False'], answer: 1, explanation: 'Forecasts based on time series data are referred to as time-series forecasts.' },
            { id: 210, chapter: 3, text: 'Time series techniques involve identification of explanatory variables that can be used to predict future demand.', options: ['True', 'False'], answer: 1, explanation: 'Associative forecasts involve identifying explanatory variables.' },
            { id: 211, chapter: 3, text: 'A consumer survey is an easy and sure way to obtain accurate input from future customers since most people enjoy participating in surveys.', options: ['True', 'False'], answer: 1, explanation: 'Most people do not enjoy participating in surveys.' },
            { id: 212, chapter: 3, text: 'The Delphi approach involves the use of a series of questionnaires to achieve a consensus forecast.', options: ['True', 'False'], answer: 0, explanation: 'A consensus among divergent perspectives is developed using questionnaires.' },
            { id: 213, chapter: 3, text: 'Exponential smoothing adds a percentage (called alpha) of last period\'s forecast to estimate next period\'s demand.', options: ['True', 'False'], answer: 1, explanation: 'Exponential smoothing adds a percentage to the last period\'s forecast error.' },
            { id: 214, chapter: 3, text: 'The shorter the forecast period, the more accurately the forecasts tend to track what actually happens.', options: ['True', 'False'], answer: 0, explanation: 'Long-term forecasting is much more difficult to do accurately.' },
            { id: 215, chapter: 3, text: 'Forecasting techniques that are based on time series data assume that future values of the series will duplicate past values.', options: ['True', 'False'], answer: 1, explanation: 'Time-series forecasts assume that future patterns in the series will mimic past patterns in the series.' },
            { id: 216, chapter: 3, text: 'Trend adjusted exponential smoothing uses double smoothing to add twice the forecast error to last period\'s actual demand.', options: ['True', 'False'], answer: 1, explanation: 'Trend adjusted smoothing smoothes both random and trend-related variation.' },
            { id: 217, chapter: 3, text: 'Forecasts based on an average tend to exhibit less variability than the original data.', options: ['True', 'False'], answer: 0, explanation: 'Averaging is a way of smoothing out random variability.' },
            { id: 218, chapter: 3, text: 'The naive approach to forecasting requires a linear trend line.', options: ['True', 'False'], answer: 1, explanation: 'The naive approach is useful in a wider variety of settings.' },
            { id: 219, chapter: 3, text: 'The naive forecast is limited in its application to series that reflect no trend or seasonality.', options: ['True', 'False'], answer: 1, explanation: 'When a trend or seasonality is present, the naive forecast is more limited in its application.' },
            { id: 220, chapter: 3, text: 'The naive forecast can serve as a quick and easy standard of comparison against which to judge the cost and accuracy of other techniques.', options: ['True', 'False'], answer: 0, explanation: 'Often the naive forecast performs reasonably well when compared to more complex techniques.' },
            { id: 221, chapter: 3, text: 'A moving average forecast tends to be more responsive to changes in the data series when more data points are included in the average.', options: ['True', 'False'], answer: 1, explanation: 'More data points reduce a moving average forecast\'s responsiveness.' },
            { id: 222, chapter: 3, text: 'In order to update a moving average forecast, the values of each data point in the average must be known.', options: ['True', 'False'], answer: 0, explanation: 'The moving average cannot be updated until the most recent value is known.' },
            { id: 223, chapter: 3, text: 'Forecasts of future demand are used by operations people to plan capacity.', options: ['True', 'False'], answer: 0, explanation: 'Capacity decisions are made for the future and therefore depend on forecasts.' },
            { id: 224, chapter: 3, text: 'An advantage of a weighted moving average is that recent actual results can be given more importance than what occurred a while ago.', options: ['True', 'False'], answer: 0, explanation: 'Weighted moving averages can be adjusted to make more recent data more important in setting the forecast.' },
            { id: 225, chapter: 3, text: 'Exponential smoothing is a form of weighted averaging.', options: ['True', 'False'], answer: 0, explanation: 'The most recent period is given the most weight, but prior periods also factor in.' },
            { id: 226, chapter: 3, text: 'A smoothing constant of .1 will cause an exponential smoothing forecast to react more quickly to a sudden change than a smoothing constant value of .3.', options: ['True', 'False'], answer: 1, explanation: 'Smaller smoothing constants result in less reactive forecast models.' },
            { id: 227, chapter: 3, text: 'The T in the model TAF = S + T represents the time dimension (which is usually expressed in weeks or months).', options: ['True', 'False'], answer: 1, explanation: 'The T represents the trend dimension.' },
            { id: 228, chapter: 3, text: 'Trend adjusted exponential smoothing requires selection of two smoothing constants.', options: ['True', 'False'], answer: 0, explanation: 'One is for the trend and one is for the random error.' },
            { id: 229, chapter: 3, text: 'An advantage of "trend adjusted exponential smoothing" over the "linear trend equation" is its ability to adjust over time to changes in the trend.', options: ['True', 'False'], answer: 0, explanation: 'A linear trend equation assumes a constant trend; trend adjusted smoothing allows for changes in the underlying trend.' },
            { id: 230, chapter: 3, text: 'A seasonal relative (or seasonal indexes) is expressed as a percentage of average or trend.', options: ['True', 'False'], answer: 0, explanation: 'Seasonal relatives are used when the seasonal effect is multiplicative rather than additive.' },
            { id: 231, chapter: 3, text: 'In order to compute seasonal relatives, the trend of past data must be computed or known which means that for brand new products this approach can\'t be used.', options: ['True', 'False'], answer: 0, explanation: 'Computing seasonal relatives depends on past data being available.' },
            { id: 232, chapter: 3, text: 'Removing the seasonal component from a data series (de-seasonalizing) can be accomplished by dividing each data point by its appropriate seasonal relative.', options: ['True', 'False'], answer: 0, explanation: 'Deseasonalized data points have been adjusted for seasonal influences.' },
            { id: 233, chapter: 3, text: 'If a pattern appears when a dependent variable is plotted against time, one should use time series analysis instead of regression analysis.', options: ['True', 'False'], answer: 0, explanation: 'Patterns reflect influences such as trends or seasonality that go against regression analysis assumptions.' },
            { id: 234, chapter: 3, text: 'Curvilinear and multiple regression procedures permit us to extend associative models to relationships that are non-linear or involve more than one predictor variable.', options: ['True', 'False'], answer: 0, explanation: 'Regression analysis can be used in a variety of settings.' },
            { id: 235, chapter: 3, text: 'The sample standard deviation of forecast error is equal to the square root of MSE.', options: ['True', 'False'], answer: 0, explanation: 'The MSE is equal to the sample variance of the forecast error.' },
            { id: 236, chapter: 3, text: 'Correlation measures the strength and direction of a relationship between variables.', options: ['True', 'False'], answer: 0, explanation: 'The association between two variations is summarized in the correlation coefficient.' },
            { id: 237, chapter: 3, text: 'MAD is equal to the square root of MSE which is why we calculate the easier MSE and then calculate the more difficult MAD.', options: ['True', 'False'], answer: 1, explanation: 'MAD is the mean absolute deviation.' },
            { id: 238, chapter: 3, text: 'In exponential smoothing, an alpha of 1.0 will generate the same forecast that a naive forecast would yield.', options: ['True', 'False'], answer: 0, explanation: 'With alpha equal to 1 we are using a naive forecasting method.' },
            { id: 239, chapter: 3, text: 'A forecast method is generally deemed to perform adequately when the errors exhibit an identifiable pattern.', options: ['True', 'False'], answer: 1, explanation: 'Forecast methods are generally considered to be performing adequately when the errors appear to be randomly distributed.' },
            { id: 240, chapter: 3, text: 'A control chart involves setting action limits for cumulative forecast error.', options: ['True', 'False'], answer: 1, explanation: 'Control charts set action limits for the tracking signal.' },
            { id: 241, chapter: 3, text: 'A tracking signal focuses on the ratio of cumulative forecast error to the corresponding value of MAD.', options: ['True', 'False'], answer: 0, explanation: 'Large absolute values of the tracking signal suggest a fundamental change in the forecast model\'s performance.' },
            { id: 242, chapter: 3, text: 'The use of a control chart assumes that errors are normally distributed about a mean of zero.', options: ['True', 'False'], answer: 0, explanation: 'Over time, a forecast model\'s tracking signal should fluctuate randomly about a mean of zero.' },
            { id: 243, chapter: 3, text: 'Bias exists when forecasts tend to be greater or less than the actual values of time series.', options: ['True', 'False'], answer: 0, explanation: 'A tendency in one direction is defined as bias.' },
            { id: 244, chapter: 3, text: 'Bias is measured by the cumulative sum of forecast errors.', options: ['True', 'False'], answer: 0, explanation: 'Bias would result in the cumulative sum of forecast errors being large in absolute value.' },
            { id: 245, chapter: 3, text: 'Seasonal relatives can be used to de-seasonalize data or incorporate seasonality in a forecast.', options: ['True', 'False'], answer: 0, explanation: 'Seasonal relatives are used to de-seasonalize data to forecast future values of the underlying trend, and they are also used to re-seasonalize de-seasonalized forecasts.' },
            { id: 246, chapter: 3, text: 'The best forecast is not necessarily the most accurate.', options: ['True', 'False'], answer: 0, explanation: 'More accuracy often comes at too high a cost to be worthwhile.' },
            { id: 247, chapter: 3, text: 'A proactive approach to forecasting views forecasts as probable descriptions of future demand, and requires action to be taken to meet that demand.', options: ['True', 'False'], answer: 1, explanation: 'Proactive approaches involve taking action to influence demand.' },
            { id: 248, chapter: 3, text: 'Simple linear regression applies to linear relationships with no more than three independent variables.', options: ['True', 'False'], answer: 1, explanation: 'Simple linear regression involves only one independent variable.' },
            { id: 249, chapter: 3, text: 'An important goal of forecasting is to minimize the average forecast error.', options: ['True', 'False'], answer: 1, explanation: 'Regardless of the model chosen, so long as there is no fundamental bias average forecast error will be zero.' },
            { id: 250, chapter: 3, text: 'Forecasting techniques such as moving averages, exponential smoothing, and the naive approach all represent smoothed (averaged) values of time series data.', options: ['True', 'False'], answer: 1, explanation: 'The naive approach involves no smoothing.' },
            { id: 251, chapter: 3, text: 'In exponential smoothing, an alpha of .30 will cause a forecast to react more quickly to a large error than will an alpha of .20.', options: ['True', 'False'], answer: 0, explanation: 'Larger values for alpha result in more responsive models.' },
            { id: 252, chapter: 3, text: 'Forecasts based on judgment and opinion don\'t include:', options: ['executive opinion', 'salesperson opinion', 'second opinions', 'customer surveys', 'Delphi methods'], answer: 2, explanation: 'Second opinions generally refer to medical diagnoses, not demand forecasting.' },
            { id: 253, chapter: 3, text: 'In business, forecasts are the basis for:', options: ['capacity planning', 'budgeting', 'sales planning', 'production planning', 'all of the above'], answer: 4, explanation: 'A wide variety of areas depend on forecasting.' },
            { id: 254, chapter: 3, text: 'Which of the following features would not generally be considered common to all forecasts?', options: ['Assumption of a stable underlying causal system.', 'Actual results will differ somewhat from predicted values.', 'Historical data is available on which to base the forecast.', 'Forecasts for groups of items tend to be more accurate than forecasts for individual items.', 'Accuracy decreases as the time horizon increases.'], answer: 2, explanation: 'In some forecasting situations historical data are not available.' },
            { id: 255, chapter: 3, text: 'Which of the following is not a step in the forecasting process?', options: ['determine the purpose and level of detail required', 'eliminate all assumptions', 'establish a time horizon', 'select a forecasting model', 'monitor the forecast'], answer: 1, explanation: 'We cannot eliminate all assumptions.' },
            { id: 256, chapter: 3, text: 'Minimizing the sum of the squared deviations around the line is called:', options: ['mean squared error technique', 'mean absolute deviation', 'double smoothing', 'least squares estimation', 'predictor regression'], answer: 3, explanation: 'Least squares estimations minimizes the sum of squared deviations around the estimated regression function.' },
            { id: 257, chapter: 3, text: 'The two general approaches to forecasting are:', options: ['mathematical and statistical', 'qualitative and quantitative', 'judgmental and qualitative', 'historical and associative', 'precise and approximation'], answer: 1, explanation: 'Forecast approaches are either quantitative or qualitative.' },
            { id: 258, chapter: 3, text: 'Which of the following is not a type of judgmental forecasting?', options: ['executive opinions', 'sales force opinions', 'consumer surveys', 'the Delphi method', 'time series analysis'], answer: 4, explanation: 'Time series analysis is a quantitative approach.' },
            { id: 259, chapter: 3, text: 'Accuracy in forecasting can be measured by:', options: ['MSE', 'MRP', 'MAPE', 'MTM', 'A & C'], answer: 4, explanation: 'MSE is mean squared error; MAPE is mean absolute percent error.' },
            { id: 260, chapter: 3, text: 'Which of the following would be an advantage of using a sales force composite to develop a demand forecast?', options: ['The sales staff is least affected by changing customer needs.', 'The sales force can easily distinguish between customer desires and probable actions.', 'The sales staff is often aware of customers\' future plans.', 'Salespeople are least likely to be influenced by recent events.', 'Salespeople are least likely to be biased by sales quotas.'], answer: 2, explanation: 'Members of the sales force should be the organization\'s tightest link with its customers.' },
            { id: 261, chapter: 3, text: 'Which phrase most closely describes the Delphi technique?', options: ['associative forecast', 'consumer survey', 'series of questionnaires', 'developed in India', 'historical data'], answer: 2, explanation: 'The questionnaires are a way of fostering a consensus among divergent perspectives.' },
            { id: 262, chapter: 3, text: 'The forecasting method which uses anonymous questionnaires to achieve a consensus forecast is:', options: ['sales force opinions', 'consumer surveys', 'the Delphi method', 'time series analysis', 'executive opinions'], answer: 2, explanation: 'Anonymity is important in Delphi efforts.' },
            { id: 263, chapter: 3, text: 'One reason for using the Delphi method in forecasting is to:', options: ['avoid premature consensus (bandwagon effect)', 'achieve a high degree of accuracy', 'maintain accountability and responsibility', 'be able to replicate results', 'prevent hurt feelings'], answer: 0, explanation: 'A bandwagon can lead to popular but potentially inaccurate viewpoints to drown up other important considerations.' },
            { id: 264, chapter: 3, text: 'Detecting non-randomness in errors can be done using:', options: ['MSEs', 'MAPs', 'Control Charts', 'Correlation Coefficients', 'Strategies'], answer: 2, explanation: 'Control charts graphically depict the statistical behavior of forecast errors.' },
