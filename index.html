            { id: 1086, chapter: 10, text: 'The optimum level of inspection is where the:', options: ['cost of inspection is minimum', 'cost of passing defectives is minimum', 'total cost of inspection and defectives is maximum', 'total cost of inspection and defectives is minimum', 'difference between inspection and defectives costs is minimum'], answer: 3, explanation: 'At the optimum level these costs are, in total, minimized.' },
            { id: 1087, chapter: 10, text: 'The purpose of control charts is to:', options: ['estimate the proportion of output that is acceptable', 'weed out defective items', 'determine if the output is within tolerances/specifications', 'distinguish between random variation and assignable variation in the process', 'provide meaningful work for quality inspectors'], answer: 3, explanation: 'Control charts are used to signal assignable variation.' },
            { id: 1088, chapter: 10, text: 'The process capability index (Cpk) may mislead if: (I) the process is not stable. (II) the process output is not normally distributed. (III) the process is not centered.', options: ['I and II', 'I and III', 'II and III', 'II only', 'I, II and III'], answer: 0, explanation: 'When using Cpk these concerns should be addressed.' },
            { id: 1089, chapter: 10, text: 'A time-ordered plot of sample statistics is called a(n) ______ chart.', options: ['Statistical', 'Inspection', 'Control', 'SIMO', 'Limit'], answer: 2, explanation: 'A control chart is a time-ordered plot of sample statistics.' },
            { id: 1090, chapter: 10, text: 'A process that makes chocolate candy bars has an output that is normally distributed with a mean of 6 oz. and a standard deviation of .01 oz. A job is to be run that requires 200 candy bars. Determine three sigma control limits for an x-bar chart assuming a sample size of 10. If specifications are 5.98 to 6.02, what run size should be used for this job so that the expected number of good candy bars is 200, assuming the process is in control?', options: ['Approximately 210', 'Approximately 200', 'Approximately 220', 'Approximately 190', 'Approximately 205'], answer: 0, explanation: 'The specifications are at ± 2 process standard deviations, which would include 95.44% of the output. Thus, .9544Q = 200, so Q = 209.6 or 210.' },
            { id: 1091, chapter: 10, text: 'Four samples of three observations each have been taken, with actual measurements (in centimeters) shown below. Construct three-sigma mean and range charts.', options: ['All points are within the limits', 'Some points are outside the limits', 'Mean chart shows out of control', 'Range chart shows out of control', 'Both charts show out of control'], answer: 0, explanation: 'Although all points are within the limits, a plot of the sample means would strongly suggest non-randomness.' },

            // === CHƯƠNG 10S: 70 câu ===
            { id: 1092, chapter: '10s', text: 'Acceptance sampling is applied to batches of items during the production process.', options: ['True', 'False'], answer: 1, explanation: 'Acceptance sampling is applied to batches before or after production.' },
            { id: 1093, chapter: '10s', text: 'Acceptance sampling procedures are applicable for inspection both before and after production.', options: ['True', 'False'], answer: 0, explanation: 'Acceptance sampling is not applicable during production.' },
            { id: 1094, chapter: '10s', text: 'Flexible acceptance sampling revises the sampling plan in response to actual results.', options: ['True', 'False'], answer: 1, explanation: 'Multiple acceptance sampling revises the sampling plan in response to actual results.' },
            { id: 1095, chapter: '10s', text: 'The purpose of acceptance sampling is to decide whether a batch of items satisfies pre-determined standards.', options: ['True', 'False'], answer: 0, explanation: 'Sampling plans are used to determine whether a batch of items conforms to expectations.' },
            { id: 1096, chapter: '10s', text: 'A good sampling plan will occasionally reject a lot with very good quality.', options: ['True', 'False'], answer: 0, explanation: 'This is called producer\'s risk.' },
            { id: 1097, chapter: '10s', text: 'Acceptance sampling is most useful when the cost consequences of passing defectives are low.', options: ['True', 'False'], answer: 0, explanation: 'If they are high, 100% sorting becomes more attractive.' },
            { id: 1098, chapter: '10s', text: 'Acceptance sampling procedures can be applied to both attribute and variables inspection.', options: ['True', 'False'], answer: 0, explanation: 'Either type of occurrence can be evaluated with acceptance sampling.' },
            { id: 1099, chapter: '10s', text: 'Acceptance sampling plans must specify the lot size, the sample size, and the acceptance/rejection criteria.', options: ['True', 'False'], answer: 0, explanation: 'These make up the sampling plan.' },
            { id: 1100, chapter: '10s', text: 'In a single-sampling plan, the entire lot, or batch of items, is accepted or rejected based upon only one specified sized sample.', options: ['True', 'False'], answer: 0, explanation: 'One sample is used to evaluate the lot.' },
            { id: 1101, chapter: '10s', text: 'A double-sampling plan requires a second sample of exactly twice the size of the first sample.', options: ['True', 'False'], answer: 1, explanation: 'There is no required size for the second sample.' },
            { id: 1102, chapter: '10s', text: 'Sampling plans are designed considering both the cost and time required for the inspection.', options: ['True', 'False'], answer: 0, explanation: 'These factors must be weighed in formulating the sampling plan.' },
            { id: 1103, chapter: '10s', text: 'In a double-sampling plan, a second sample may not be taken if the results of the first sample are conclusive.', options: ['True', 'False'], answer: 0, explanation: 'If the first sample is conclusive, the second sample is not taken.' },
            { id: 1104, chapter: '10s', text: 'Acceptance sampling is a form of inspection applied to items during an ongoing process.', options: ['True', 'False'], answer: 1, explanation: 'Acceptance sampling occurs either before or after a process.' },
            { id: 1105, chapter: '10s', text: 'In a double-sampling plan, a second sample is taken if the results of the first sample are inconclusive.', options: ['True', 'False'], answer: 0, explanation: 'Results from the second sample are then combined with the first to evaluate the batch.' },
            { id: 1106, chapter: '10s', text: 'The ability of an acceptance sampling plan to discriminate between good and bad lots is described by its operating characteristic curve.', options: ['True', 'False'], answer: 0, explanation: 'The operating characteristic curve describes a sampling plan\'s power.' },
            { id: 1107, chapter: '10s', text: 'The AQL determines the percentage level of defects in batches that are acceptable.', options: ['True', 'False'], answer: 0, explanation: 'Good lots\' defect rate is acceptable to customers.' },
            { id: 1108, chapter: '10s', text: 'The Lot tolerance percent defective (LTPD) is associated with a consumer\'s risk.', options: ['True', 'False'], answer: 0, explanation: 'At this defect rate, there should be a low probability of acceptance.' },
            { id: 1109, chapter: '10s', text: 'The Acceptable quality level (AQL) is associated with a producer\'s risk.', options: ['True', 'False'], answer: 0, explanation: 'At this defect rate, there should be a low probability of rejection.' },
            { id: 1110, chapter: '10s', text: 'An alternative to acceptance sampling is 100% inspection.', options: ['True', 'False'], answer: 0, explanation: '100% inspection eliminates the need for acceptance sampling.' },
            { id: 1111, chapter: '10s', text: 'Due to the nature of acceptance sampling, the average outgoing quality limit (AOQL) occurs when the incoming fraction defective reaches a maximum.', options: ['True', 'False'], answer: 0, explanation: 'Beyond that point, fewer and fewer lots are accepted.' },
            { id: 1112, chapter: '10s', text: '"Average outgoing quality" curves show the average quality level of inspected and un-inspected lots for any given incoming fraction defective.', options: ['True', 'False'], answer: 0, explanation: 'These curves integrate the average quality level that results from some good lots being rejected and some bad lots being accepted.' },
            { id: 1113, chapter: '10s', text: 'The purpose of acceptance sampling is to:', options: ['estimate process quality', 'estimate lot quality', 'detect and eliminate defectives', 'decide if a lot meets predetermined standards', 'accept samples of products'], answer: 3, explanation: 'Acceptance sample is used to evaluate lots with respect to predetermined standards.' },
            { id: 1114, chapter: '10s', text: 'Acceptance sampling plans might call for selection of:', options: ['one or more samples', 'a variable number of samples based on actual results', 'random inspections', 'outside audits by testing agencies', '100% inspection'], answer: 0, explanation: 'More than one sample is possible in acceptance sampling.' },
            { id: 1115, chapter: '10s', text: 'Which one of the following would not be a reason for using acceptance sampling?', options: ['high cost of passing defectives', 'large number of items', 'destructive testing', 'boredom and fatigue that would accompany complete inspection', 'low cost of passing defectives'], answer: 0, explanation: 'High cost of passing defective items makes acceptance sampling inadvisable.' },
            { id: 1116, chapter: '10s', text: 'Sampling plans typically specify:', options: ['lot size', 'sample size', 'number of samples to be taken', 'acceptance/rejection criteria', 'all of the above'], answer: 4, explanation: 'All of these are facets of sampling plans.' },
            { id: 1117, chapter: '10s', text: 'A lot can be "accepted" or "rejected" in a double-sampling plan:', options: ['after one sample is taken', 'after two samples are taken', 'only after two samples are taken', 'All of the above are correct', 'Only a and b are correct'], answer: 3, explanation: 'Decisions about lots can be made with either one or two samples under double-sampling plans.' },
            { id: 1118, chapter: '10s', text: 'A lot can be "accepted" or "rejected" in a multiple-sampling plan:', options: ['after one sample is taken', 'after two samples are taken', 'after three or more samples are taken', 'all of the above', 'none of the above'], answer: 3, explanation: 'Decisions about lots can be made at any point in the sampling process.' },
            { id: 1119, chapter: '10s', text: 'An OC curve shows:', options: ['average outgoing quality', 'the average outgoing quality limit', 'out of control criteria', 'operating control', 'probability of acceptance versus lot quality'], answer: 4, explanation: 'The OC curve plots the probability of acceptance against the defect rate.' },
            { id: 1120, chapter: '10s', text: 'The ability of a sampling plan to discriminate between lots of high quality and lots of low quality is described by:', options: ['a Gantt chart', 'an operating characteristic curve', 'an average outgoing quality curve', 'a process control chart', 'a range chart'], answer: 1, explanation: 'The operation characteristic curve captures a plan\'s discrimination ability.' },
            { id: 1121, chapter: '10s', text: 'The AQL indicates:', options: ['acceptable quality level', 'average quality level', 'actual quality level', 'aggregate quality level', 'approximate quality level'], answer: 0, explanation: 'AQL is acceptable quality level.' },
            { id: 1122, chapter: '10s', text: 'A Type II (beta) error occurs when:', options: ['A bad lot is accepted', 'A good lot is rejected', 'A bad lot is rejected', 'A good lot is accepted', 'none of the above'], answer: 0, explanation: 'This is called consumer\'s risk.' },
            { id: 1123, chapter: '10s', text: 'A Type I (alpha) error occurs when:', options: ['A bad lot is accepted', 'A good lot is rejected', 'A bad lot is rejected', 'A good lot is accepted', 'none of the above'], answer: 1, explanation: 'This is called producer\'s risk.' },
            { id: 1124, chapter: '10s', text: 'An AOQ curve shows:', options: ['the maximum quality', 'average outgoing quality relative to incoming quality', 'how well a sampling plan can discriminate between good and bad lots', 'the actual quality level', '"good" quality'], answer: 1, explanation: 'The AOQ curve shows average outgoing quality relative to incoming quality.' },
            { id: 1125, chapter: '10s', text: 'In acceptance sampling, the level of inspection automatically adjusts to the quality of lots being inspected, assuming that:', options: ['A single-sampling plan is used', 'Double-sampling plans are used', 'Multiple-sampling plans are used', '"Rejected" lots are subjected to 100 percent inspection', 'none of the above'], answer: 3, explanation: 'As quality increases, the number of samples decreases.' },
            { id: 1126, chapter: '10s', text: 'Shipments of bowling balls are sampled before delivery to a warehouse. Lots of 600 balls are checked, using 10 observations from each lot. Any lot with more than one defective is rejected. Calculate values for the operating characteristic curve for this sampling plan.', options: ['The following values would be found using the binomial distribution', 'The following values would be found using the Poisson distribution', 'The following values would be found using the normal distribution', 'The following values would be found using the exponential distribution', 'The following values would be found using the uniform distribution'], answer: 0, explanation: 'Use the binomial distribution with various values for the fraction defective, sample size n = 10 and c = 1.' },
            { id: 1127, chapter: '10s', text: 'A firm that makes plastic wrapping material takes random samples of 50 items from each lot before it is sent to a customer. Lots contain 2,000 items each. Any lot with more than one defective is subjected to 100 percent inspection, and any defectives are replaced with good ones. (A) Construct the OC curve for this plan. (B) Construct the AOQ curve for this plan. What is the approximate AOQ limit?', options: ['AOQ peaks at approximately .0168', 'AOQ peaks at approximately .0200', 'AOQ peaks at approximately .0100', 'AOQ peaks at approximately .0300', 'AOQ peaks at approximately .0250'], answer: 0, explanation: 'Using the Poisson distribution with various values for the fraction defective, sample size n = 50 and c = 1, we see that the AOQ peaks at approximately .0168, when the proportion defective is equal to .032.' },
            { id: 1128, chapter: '10s', text: 'A manufacturer purchases large quantities of metal brackets from several suppliers. The brackets are shipped in lots of 8,000 each. Random samples of 40 brackets are taken from each lot, and the lot is rejected if any defectives are discovered. Rejected lots are subjected to 100 percent inspection, and any defectives are replaced with good brackets. Determine the average outgoing quality limit for this sampling plan.', options: ['AOQ peaks at approximately .0092', 'AOQ peaks at approximately .0100', 'AOQ peaks at approximately .0080', 'AOQ peaks at approximately .0110', 'AOQ peaks at approximately .0075'], answer: 0, explanation: 'Using the Poisson distribution with various values for the fraction defective, sample size n = 40 and c = 0, we see that the AOQ peaks at approximately .0092, when the proportion defective is approximately .025.' },

            // === CHƯƠNG 11: 86 câu ===
            { id: 1129, chapter: 11, text: 'Aggregate planning is intermediate-range capacity planning that typically covers a time horizon of one to three months.', options: ['True', 'False'], answer: 1, explanation: 'Aggregate planning covers the mid-term, typically two to 12 months.' },
            { id: 1130, chapter: 11, text: 'The goal of aggregate planning is to achieve a production plan that attempts to balance the organization\'s resources and meet expected demand.', options: ['True', 'False'], answer: 0, explanation: 'This is the goal of aggregate planning.' },
            { id: 1131, chapter: 11, text: 'Aggregate planners are concerned with the quality and quantity of expected demand.', options: ['True', 'False'], answer: 1, explanation: 'Aggregate planners are concerned with the quantity and timing of expected demand.' },
            { id: 1132, chapter: 11, text: 'Aggregate planning is used to establish general levels of employment, output, and inventories over an intermediate-range of time.', options: ['True', 'False'], answer: 0, explanation: 'This is the domain of aggregate planning.' },
            { id: 1133, chapter: 11, text: 'The assignment of work to specific machines and people are examples of aggregate planning.', options: ['True', 'False'], answer: 1, explanation: 'Assigning work to specific machines or people is an example of detailed scheduling.' },
            { id: 1134, chapter: 11, text: 'The output from aggregate planning is a detailed business plan covering the next 2 to 12 months.', options: ['True', 'False'], answer: 1, explanation: 'The output is an aggregate production plan.' },
            { id: 1135, chapter: 11, text: 'Demand can be altered in aggregate planning by promotion and producing additional product using overtime.', options: ['True', 'False'], answer: 1, explanation: 'These are supply options.' },
            { id: 1136, chapter: 11, text: 'Capacity can be modified in aggregate planning by promotion and producing additional product using overtime.', options: ['True', 'False'], answer: 1, explanation: 'Promotions do not modify capacity.' },
            { id: 1137, chapter: 11, text: 'Organizations facing seasonal changes in demand are prevented from using aggregate planning techniques.', options: ['True', 'False'], answer: 1, explanation: 'Aggregate planning can accommodate seasonal changes in demand.' },
            { id: 1138, chapter: 11, text: 'Seasonality in demand has the advantage of leveling out requirements for our product or service.', options: ['True', 'False'], answer: 1, explanation: 'Seasonality increases variation in requirements.' },
            { id: 1139, chapter: 11, text: 'A level capacity strategy is also known as a chase demand strategy.', options: ['True', 'False'], answer: 1, explanation: 'Level and chase strategies are opposite approaches.' },
            { id: 1140, chapter: 11, text: 'An advantage of a "chase" strategy for aggregate planning is that inventories can be kept relatively low.', options: ['True', 'False'], answer: 0, explanation: 'The chase strategy keeps inventories low.' },
            { id: 1141, chapter: 11, text: 'Linear programming models yield the optimal solution.', options: ['True', 'False'], answer: 0, explanation: 'Linear programming models can find an optimal solution if one exists.' },
            { id: 1142, chapter: 11, text: 'Ultimately the overriding factor in choosing a strategy in aggregate planning is overall cost.', options: ['True', 'False'], answer: 0, explanation: 'The task of aggregate planning is to strike a balance between demand and capacity at minimum cost.' },
            { id: 1143, chapter: 11, text: 'Aggregate planners commonly use trial-and-error methods in developing aggregate plans.', options: ['True', 'False'], answer: 0, explanation: 'Trial-and-error approaches can lead to good solutions.' },
            { id: 1144, chapter: 11, text: 'The use of tables and charts in aggregate planning usually enables planners to arrive at an optimal plan.', options: ['True', 'False'], answer: 1, explanation: 'Such solutions may be good solutions, but they\'re usually not optimal.' },
            { id: 1145, chapter: 11, text: 'Aggregate planners typically use mathematical techniques such as linear programming and linear decision rules for planning.', options: ['True', 'False'], answer: 1, explanation: 'Both qualitative and quantitative approaches are used in aggregate planning.' },
            { id: 1146, chapter: 11, text: 'Disaggregating an aggregate plan leads to a master schedule.', options: ['True', 'False'], answer: 0, explanation: 'This is an output of the aggregate planning process.' },
            { id: 1147, chapter: 11, text: 'The master schedule indicates the quantity and timing for delivery of a product, but not the dates production will need to start.', options: ['True', 'False'], answer: 0, explanation: 'Required start dates depend on products\' lead times.' },
            { id: 1148, chapter: 11, text: 'Departmental budgeting is an example of aggregate planning.', options: ['True', 'False'], answer: 0, explanation: 'The challenge is to get requirements into balance with resources.' },
            { id: 1149, chapter: 11, text: 'Master schedulers are employed primarily by service organizations.', options: ['True', 'False'], answer: 1, explanation: 'Master schedulers are primarily employed in manufacturing.' },
            { id: 1150, chapter: 11, text: 'Subcontracting \'in\' would apply to periods in which our organization has excess capacity.', options: ['True', 'False'], answer: 0, explanation: 'Subcontracting in would be selling some available capacity.' },
            { id: 1151, chapter: 11, text: 'Available-to-promise in the first week is equal to beginning inventory plus MPS quantity, if any, less committed customer orders before the next MPS quantity.', options: ['True', 'False'], answer: 0, explanation: 'This is the ATP calculation for the first week.' },
            { id: 1152, chapter: 11, text: 'A time fence in the master schedule is used to prevent unauthorized people from making changes to the schedule.', options: ['True', 'False'], answer: 1, explanation: 'Time fences are used to ensure that full consideration is given when schedule changes are being considered.' },
            { id: 1153, chapter: 11, text: 'After the first period of the planning horizon, available-to-promise is computed only for those periods in which there is an MPS quantity.', options: ['True', 'False'], answer: 0, explanation: 'After the first week, ATP values will only occur in periods in which there are MPS quantities.' },
            { id: 1154, chapter: 11, text: 'In the master production schedule, production is planned for the next period whenever the available-to-promise quantity becomes negative.', options: ['True', 'False'], answer: 1, explanation: 'Production is planned to be complete in the period in which the projected on-hand becomes negative.' },
            { id: 1155, chapter: 11, text: 'Which of the following best describes aggregate planning?', options: ['the link between intermediate term planning and short term operating decisions', 'a collection of objective planning tools', 'make or buy decisions', 'an attempt to respond to predicted demand within the constraints set by product, process and location decisions', 'manpower planning'], answer: 3, explanation: 'A workable balance between demand and these constraints is sought.' },
            { id: 1156, chapter: 11, text: 'Accommodating peak demands and effectively using labor resources during periods of low demand would be the goal of aggregate planners in …', options: ['Manufacturing', 'Military', 'Archeology', 'Libraries', 'Financial Services'], answer: 3, explanation: 'These are the considerations in aggregate planning for service firms.' },
            { id: 1157, chapter: 11, text: 'Aggregate planning is capacity planning for:', options: ['the long range', 'the intermediate range', 'the short range', 'typically one to three months', 'typically one or more years'], answer: 1, explanation: 'The intermediate range typically runs from two to 12 months.' },
            { id: 1158, chapter: 11, text: 'One area to which aggregate planning decisions relate is:', options: ['job sequencing', 'customer order quantities', 'inventory levels', 'location', 'layout'], answer: 2, explanation: 'Different aggregate planning strategies affect inventory levels differently.' },
            { id: 1159, chapter: 11, text: 'Which of the following is an input to aggregate planning?', options: ['beginning inventory', 'forecasts for each period of the schedule', 'customer orders', 'all of the above', 'quantity discounts'], answer: 3, explanation: 'All except quantity discounts are aggregate planning inputs.' },
            { id: 1160, chapter: 11, text: 'Essentially, the output of aggregate planning is the:', options: ['marketing plan', 'production plan', 'rough-cut capacity plan', 'assignment plan', 'material requirements plan'], answer: 1, explanation: 'The production plan largely results from the aggregate planning effort.' },
            { id: 1161, chapter: 11, text: 'In doing "aggregate planning" for a firm producing paint, the aggregate planners would most likely deal with:', options: ['just gallons of paint, without concern for the different colors and sizes', 'gallons of paint, but be concerned with the different colors to be produced', 'gallons, quarts, pints, and all the different sizes to be produced', 'all the different sizes and all the different colors by size', 'none of the above'], answer: 0, explanation: 'The principle of aggregation is reflected in this answer.' },
            { id: 1162, chapter: 11, text: 'Aggregate planning requires which of the following information?', options: ['a forecast of expected demand', 'current levels of inventory', '(a) and (b)', 'policies regarding employment levels', 'all of the above'], answer: 4, explanation: 'All of these are inputs into the aggregate planning process.' },
            { id: 1163, chapter: 11, text: 'Aggregate planners attempt to balance:', options: ['demand and inventories', 'demand and costs', 'capacity and inventories', 'capacity and costs', 'capacity and demand'], answer: 4, explanation: 'Capacity and demand are roughly balanced in aggregate planning.' },
            { id: 1164, chapter: 11, text: 'Which of the following is not an input to the aggregate planning process?', options: ['resources available', 'demand forecast', 'policies on work force changes', 'master production schedules', 'cost information'], answer: 3, explanation: 'The master production schedule is an output of the aggregate planning process.' },
            { id: 1165, chapter: 11, text: 'Which one of the following would not be considered a decision option for purposes of aggregate planning?', options: ['inventory levels', 'manpower levels', 'pricing', 'production costs', 'promotion'], answer: 3, explanation: 'Production costs would be a critical variable, but they would not be a decision variable.' },
            { id: 1166, chapter: 11, text: 'Which of the following is not a basic option for altering the availability of capacity in a service environment?', options: ['overtime', 'hiring/layoff', 'part time', 'inventory', 'All of these are basic capacity options.'], answer: 3, explanation: 'Inventory is typically not an option in services.' },
            { id: 1167, chapter: 11, text: 'Which one of the following is not a basic option for altering demand?', options: ['promotion', 'backordering', 'pricing', 'subcontracting', 'All are demand options.'], answer: 3, explanation: 'Subcontracting is an option for altering capacity.' },
            { id: 1168, chapter: 11, text: 'One option for altering the pattern of demand is:', options: ['backorders', 'overtime', 'part-time workers', 'inventories', 'subcontracting'], answer: 0, explanation: 'Backordering shifts demand to later time periods.' },
            { id: 1169, chapter: 11, text: 'Which of the following would not be a strategy associated with adjusting aggregate capacity to meet expected demand?', options: ['subcontract', 'vary the size of the workforce', 'vary the intensity of workforce utilization', 'allow inventory levels to vary', 'use backorders'], answer: 4, explanation: 'Backorders do not involve adjusting capacity.' },
            { id: 1170, chapter: 11, text: 'One option for altering the availability of manufacturing capacity is:', options: ['pricing', 'promotion', 'backorders', 'inventories', 'none of the above apply to manufacturing capacity'], answer: 3, explanation: 'Inventory involves using capacity from earlier periods to satisfy demand in later periods.' },
            { id: 1171, chapter: 11, text: 'One option for altering the availability of capacity is:', options: ['use of overtime or slack time', 'pricing', 'promotion', 'backorders', 'none of the above'], answer: 0, explanation: 'Overtime or slack time alters the availability of capacity.' },
            { id: 1172, chapter: 11, text: 'In order to use the "level capacity strategy," variations in demand are met by:', options: ['varying output during regular time without changing employment levels', 'varying output during regular time by changing employment levels', '(a) and (b)', 'using combination of inventories, overtime, part time, and back orders', 'price adjustments'], answer: 3, explanation: 'A combination of inventories, overtime, part time, and back orders is the level strategy.' },
            { id: 1173, chapter: 11, text: 'In using the "chase strategy" variations in demand could be met by:', options: ['varying output during regular time without changing employment levels', 'varying output during regular time by changing employment levels', '(a) and (b)', 'varying inventory levels', 'price increases'], answer: 1, explanation: 'Changing employment levels to vary output is representative of a chase strategy.' },
            { id: 1174, chapter: 11, text: 'Uncommitted inventory is called …', options: ['Available-to-promise inventory', 'Free inventory', 'Safety stock', 'Lead time inventory', 'Obsolete inventory'], answer: 0, explanation: 'Uncommitted inventory is available-to-promise.' },
            { id: 1175, chapter: 11, text: 'Aggregate planners seek to match supply and demand:', options: ['at minimum overall cost', 'by staying within company policy', '(a) and (b)', 'keeping inventories at a minimum', 'all of the above'], answer: 2, explanation: 'Aggregate plans minimize costs but conform to company policies.' },
            { id: 1176, chapter: 11, text: 'In practice, the more commonly used techniques for aggregate planning are:', options: ['mathematical techniques', 'informal trial-and-error techniques', '(a) and (b) about equally', 'simulation models', 'linear programming optimization'], answer: 1, explanation: 'Trial-and-error techniques are more commonly used.' },
            { id: 1177, chapter: 11, text: 'The main disadvantage(s) of informal techniques used for aggregate planning is(are):', options: ['they are expensive to do', 'they may not result in the best plan', 'they take a long time to do', 'they require use of a computer', 'lack of formal education of the planners'], answer: 1, explanation: 'Informal solutions may not be costly or difficult, but they may be less likely to offer up the best plan.' },

            // === CHƯƠNG 12: 91 câu ===
            { id: 1178, chapter: 12, text: 'MRP works best if the inventory items have dependent demand.', options: ['True', 'False'], answer: 0, explanation: 'MRP is best for dependent demand scenarios.' },
            { id: 1179, chapter: 12, text: 'Low level coding represents items less than $18 per unit.', options: ['True', 'False'], answer: 1, explanation: 'Low-level coding codes items at their lowest BOM levels.' },
            { id: 1180, chapter: 12, text: 'Independent demand tends to be more \'lumpy\' than dependent demand meaning that we need large quantities followed by periods of no demand.', options: ['True', 'False'], answer: 1, explanation: 'Dependent demand is more lumpy.' },
            { id: 1181, chapter: 12, text: 'Lumpy demand for components results primarily from the periodic scheduling of batch production.', options: ['True', 'False'], answer: 0, explanation: 'Batch production leads to lumpy demand for components.' },
            { id: 1182, chapter: 12, text: 'MRP is used within most MRP II and ERP systems.', options: ['True', 'False'], answer: 0, explanation: 'MRP II and ERP systems incorporate MRP.' },
            { id: 1183, chapter: 12, text: 'The master production schedule states which end items are to be produced, in addition to when and how many.', options: ['True', 'False'], answer: 0, explanation: 'These are critical inputs into MRP.' },
            { id: 1184, chapter: 12, text: 'Net requirements equal gross requirements minus safety stock.', options: ['True', 'False'], answer: 1, explanation: 'If safety stock is required, net requirements will be higher.' },
            { id: 1185, chapter: 12, text: 'The master schedule needs to be for a period long enough to cover the stacked or cumulative lead time necessary to produce the end items.', options: ['True', 'False'], answer: 0, explanation: 'This ensures that materials plans can be adequately formulated.' },
            { id: 1186, chapter: 12, text: 'Initially, a master production schedule - the output from MRP - may not represent a feasible schedule.', options: ['True', 'False'], answer: 0, explanation: 'Management must make more detailed capacity requirements planning to determine whether these more specific capacity requirements can be met and some adjustments in the master production schedule may be required.' },
            { id: 1187, chapter: 12, text: 'MRP, considering inventory position, bills of material, open purchase orders and lead times guarantees a feasible production plan if the inputs to MRP are accurate.', options: ['True', 'False'], answer: 1, explanation: 'MRP may lead to an infeasible production plan if capacity requirements are not considered.' },
            { id: 1188, chapter: 12, text: 'The bill of materials indicates how much material will be needed to produce the quantities on a given master production schedule.', options: ['True', 'False'], answer: 1, explanation: 'The bill of materials indicates how much material will be needed to produce one unit of the item in question.' },
            { id: 1189, chapter: 12, text: 'A bill of materials contains a listing of all the assemblies, parts, and materials needed to produce one unit of an end item.', options: ['True', 'False'], answer: 0, explanation: 'The bill of materials indicates how much material will be needed to produce one unit of the item in question.' },
            { id: 1190, chapter: 12, text: 'The bill of materials contains information on lead times and current inventory position on every component required to produce the end item.', options: ['True', 'False'], answer: 1, explanation: 'Inventory records contain this information.' },
            { id: 1191, chapter: 12, text: 'The inventory records contain information on the status of each item by time period.', options: ['True', 'False'], answer: 0, explanation: 'Inventory records also contain information on lead times and current inventory position.' },
            { id: 1192, chapter: 12, text: 'An assembly-time chart indicates gross and net requirements taking into account the current available inventory.', options: ['True', 'False'], answer: 1, explanation: 'Assembly-time charts have to do with capacity, not inventory.' },
            { id: 1193, chapter: 12, text: 'MRP II did not replace or improve the basic MRP.', options: ['True', 'False'], answer: 0, explanation: 'MRP II incorporates basic MRP.' },
            { id: 1194, chapter: 12, text: 'The gross requirements at one level of an MRP plan determine the gross requirements at the next lower level continuing on down to the lowest levels shown on the bill of material.', options: ['True', 'False'], answer: 1, explanation: 'Released order quantities at one level determine gross requirements at the next lower level.' },
            { id: 1195, chapter: 12, text: 'The gross requirements value for any given component is equal to the net requirements of that component\'s immediate parent multiplied by the quantity per parent.', options: ['True', 'False'], answer: 1, explanation: 'Released order quantities for the parent lead to gross requirements of the child.' },
            { id: 1196, chapter: 12, text: 'The term pegging refers to identifying the parent items that have generated a given set of material requirements for a part or subassembly.', options: ['True', 'False'], answer: 0, explanation: 'Pegging ties items to their parents.' },
            { id: 1197, chapter: 12, text: 'A net-change MRP system is one that is updated periodically but not less frequently than once a week.', options: ['True', 'False'], answer: 1, explanation: 'A net-change system is updated as transactions occur.' },
            { id: 1198, chapter: 12, text: 'One reason that accurate bills of material are important is that errors at one level become magnified at lower levels because of the multiplication process used by MRP.', options: ['True', 'False'], answer: 0, explanation: 'Small higher-level errors can be magnified into larger lower-level errors.' },
            { id: 1199, chapter: 12, text: 'A regenerative MRP system is one that is updated continuously - every time there is a schedule change.', options: ['True', 'False'], answer: 1, explanation: 'Regenerative systems are updated periodically.' },
            { id: 1200, chapter: 12, text: 'One of the primary output reports of MRP concerns changes to planned orders.', options: ['True', 'False'], answer: 0, explanation: 'Changes to planned orders can be outputs from MRP systems.' },
            { id: 1201, chapter: 12, text: 'Safety time is sometimes used in MRP rather than safety stock quantities.', options: ['True', 'False'], answer: 0, explanation: 'Safety time is a substitute for safety stock.' },
            { id: 1202, chapter: 12, text: 'Lot-for-lot ordering in MRP provides coverage for some predetermined number of periods using forecasted demand to extend beyond the orders already received for those periods.', options: ['True', 'False'], answer: 1, explanation: 'This is fixed-period ordering.' },
            { id: 1203, chapter: 12, text: 'MRP output reports are divided into two main groups - daily and weekly.', options: ['True', 'False'], answer: 1, explanation: 'The two groups are primary and secondary.' },
            { id: 1204, chapter: 12, text: 'In MRP, EOQ models tend to be less useful for materials at the lowest levels than for upper level assemblies of the bill of materials since higher-level assemblies have larger dollar investments.', options: ['True', 'False'], answer: 1, explanation: 'EOQ is more useful at lower levels since lower-level items often have less lumpy demand.' },
            { id: 1205, chapter: 12, text: 'Load reports show capacity requirements for departments or work centers which may be more or less than the capacity available in that work center.', options: ['True', 'False'], answer: 0, explanation: 'Load reports facilitate the formulation of feasible production schedules.' },
            { id: 1206, chapter: 12, text: 'ERP began in manufacturing organizations but has spread into service organizations.', options: ['True', 'False'], answer: 0, explanation: 'Over time ERP has spread into a wide variety of organizations.' },
            { id: 1207, chapter: 12, text: 'MRP II is simply an improved version of MRP that processes faster and can plan for a larger number of end items.', options: ['True', 'False'], answer: 1, explanation: 'MRP II takes into account capacity requirements.' },
            { id: 1208, chapter: 12, text: 'Lot-for-lot ordering in MRP eliminates the holding costs for parts that are carried over to other periods.', options: ['True', 'False'], answer: 0, explanation: 'Lot-for-lot ordering minimizes holding costs.' },
            { id: 1209, chapter: 12, text: 'Capacity requirements planning (CRP) is an important feature in MRP+.', options: ['True', 'False'], answer: 1, explanation: 'CRP is a feature of MRP II.' },
            { id: 1210, chapter: 12, text: 'Project Management approaches can help in a conversion to an ERP system.', options: ['True', 'False'], answer: 0, explanation: 'ERP conversions can be complex projects.' },
            { id: 1211, chapter: 12, text: 'As long as a forecast is plus or minus 10%, MRP works well.', options: ['True', 'False'], answer: 1, explanation: 'MRP needs accurate forecasts.' },
            { id: 1212, chapter: 12, text: 'ERP represents an expanded effort to integrate standardized record-keeping that shares information among different areas of an organization.', options: ['True', 'False'], answer: 0, explanation: 'ERP is intended to facilitate consistent decision-making across the organization.' },
            { id: 1213, chapter: 12, text: 'Back flushing takes place after the production has been completed.', options: ['True', 'False'], answer: 0, explanation: 'Records are updated based on end-item production.' },
            { id: 1214, chapter: 12, text: 'Before a schedule receipt can take place, and order must be placed with a vendor.', options: ['True', 'False'], answer: 0, explanation: 'A scheduled receipt is an order that has already been placed.' },
            { id: 1215, chapter: 12, text: 'MRP really doesn\'t apply to services since raw material isn\'t required.', options: ['True', 'False'], answer: 1, explanation: 'MRP can be used in services.' },
            { id: 1216, chapter: 12, text: 'ERP implementation requires support and a direct mandate from the CEO because it impacts so many different functional areas.', options: ['True', 'False'], answer: 0, explanation: 'ERP implementation is an organization-wide initiative.' },
            { id: 1217, chapter: 12, text: 'ERP automates the tasks involved in performing a business process, such as order fulfillment and financial reporting.', options: ['True', 'False'], answer: 0, explanation: 'ERP extends beyond purchasing and materials management.' },
            { id: 1218, chapter: 12, text: 'Which of the following most closely describes dependent demand?', options: ['demand generated by suppliers', 'estimates of demand using regression analysis of independent variables', 'derived demand', 'demands placed on suppliers by their customers', 'net material requirements'], answer: 2, explanation: 'Dependent demand results from decisions to produce parent items.' },
            { id: 1219, chapter: 12, text: 'ERP implementation probably won\'t require:', options: ['cross functional teams', 'just a few weeks to install', 'intensive training', 'high funding for both initial cost and maintenance', 'frequent upgrades after installation'], answer: 1, explanation: 'ERP implementation can take years.' },
            { id: 1220, chapter: 12, text: 'A computer-based information system designed to handle ordering and scheduling of dependent-demand inventories is:', options: ['computer aided manufacturing (CAM)', 'computer integrated manufacturing (CIM)', 'economic order quantity (EOQ)', 'material requirements planning (MRP)', 'economic run size (ERS)'], answer: 3, explanation: 'MRP is targeted toward dependent-demand inventories.' },
            { id: 1221, chapter: 12, text: 'The development and application of MRP depended upon two developments: (1) the recognition of the difference between independent and dependent demand, and (2):', options: ['computers', 'development of the EOQ model', 'inventory control systems', 'blanket purchase orders', 'the internet'], answer: 0, explanation: 'Computer technology made MRP feasible.' },
            { id: 1222, chapter: 12, text: 'The output of MRP is:', options: ['gross requirements', 'net requirements', 'a schedule of requirements for all parts and end items', 'inventory reorder points', 'economic order quantities and reorder points'], answer: 2, explanation: 'MRP schedules part and end item requirements.' },
            { id: 1223, chapter: 12, text: 'Which one of the following is not an input in an MRP system?', options: ['planned-order schedules', 'bill of materials', 'master production schedule', 'inventory records', 'All are inputs.'], answer: 0, explanation: 'Planned-order schedules are outputs from MRP.' },
            { id: 1224, chapter: 12, text: 'The MRP input stating which end items are to be produced, when they are needed, and what quantities are needed, is the:', options: ['master schedule', 'bill-of-materials', 'inventory-records', 'assembly-time chart', 'net-requirements chart'], answer: 0, explanation: 'This is the master schedule.' },
            { id: 1225, chapter: 12, text: 'In an MRP master schedule, the planning horizon is often separated into a series of times periods called:', options: ['pegging', 'lead times', 'stacked lead times', 'time buckets', 'firm, fixed and frozen'], answer: 3, explanation: 'Time buckets are discrete time periods.' },
            { id: 1226, chapter: 12, text: 'The MRP input listing the assemblies, subassemblies, parts, and raw materials needed to produce one unit of finished product is the:', options: ['master production schedule', 'bill-of-materials', 'inventory-records', 'assembly-time chart', 'net-requirements chart'], answer: 1, explanation: 'This is the bill of materials.' },
            { id: 1227, chapter: 12, text: 'A visual depiction of the subassemblies and components that are needed to produce and/or assemble a product is called a(n):', options: ['assembly time chart', 'product structure tree', 'MRP II', 'pegging', 'Gantt chart'], answer: 1, explanation: 'This is a product structure tree.' },
            { id: 1228, chapter: 12, text: 'The MRP input storing information on the status of each item by time period (e.g., scheduled receipts, lead time, lot size) is the:', options: ['master production schedule', 'bill-of-materials', 'inventory-records', 'assembly-time chart', 'net-requirements chart'], answer: 2, explanation: 'Inventory records contain this information.' },
            { id: 1229, chapter: 12, text: 'Which one of the following most closely describes net material requirements?', options: ['gross requirements - amount on-hand - scheduled receipts', 'gross requirements - planned receipts', 'gross requirements - order releases + amount on-hand', 'gross requirements - planned order releases', 'gross requirements - amount on-hand + planned order releases'], answer: 0, explanation: 'On-hand and scheduled receipts must be subtracted from gross requirements.' },
            { id: 1230, chapter: 12, text: 'In MRP, "scheduled receipts" are:', options: ['identical to "planned-order receipts"', 'identical to "planned-order releases"', 'open orders (that is, ordered before the first time bucket, but not delivered yet)', '"net requirements"', 'available to promise inventory'], answer: 2, explanation: 'Scheduled receipts are orders that have already been placed.' },
            { id: 1231, chapter: 12, text: 'In MRP, under lot-for-lot ordering, "planned-order receipts" are:', options: ['identical to "scheduled receipts"', 'identical to "planned-order releases"', 'open orders (that is, ordered before the first time bucket, but not delivered yet)', '"gross requirements"', 'available to promise inventory'], answer: 1, explanation: 'Planned receipts would be equal to planned releases under any lot sizing rule.' },
            { id: 1232, chapter: 12, text: 'Under lot-for-lot, order sizes for component parts are essentially determined directly from which one of the following?', options: ['gross requirements', 'net requirements', 'economic order quantity', 'gross requirements - net requirements', 'net requirements - amount on-hand'], answer: 1, explanation: 'Net requirements would exactly equal planned releases.' },
            { id: 1233, chapter: 12, text: 'In MRP, the gross requirements of a given component part are calculated from:', options: ['net requirements + amount on-hand', 'gross requirements of the immediate parent', 'planned orders of the end item', 'net requirements of end item', 'planned orders of the immediate parent'], answer: 4, explanation: 'Planned orders for parents drive gross requirements for children.' },
            { id: 1234, chapter: 12, text: 'The identification of parent items is called:', options: ['Paternity', 'Pegging', 'Requirement I.D.', 'Relationship tracking', 'Master Scheduling'], answer: 1, explanation: 'Pegging links children to parents.' },
            { id: 1235, chapter: 12, text: 'Periodic updating of an MRP system to account for all changes which have occurred within a given time interval is called:', options: ['pegging', 'planned order release', 'net change', 'regenerative', 'exception report'], answer: 3, explanation: 'Regenerative systems are updated periodically.' },
            { id: 1236, chapter: 12, text: 'An MRP system whose records are updated continuously is referred to as a(n):', options: ['regenerative system', 'batch-type system', 'Plossl-Wright system', 'net-change system', 'gross-change system'], answer: 3, explanation: 'Net-change systems are updated as transactions occur.' },
            { id: 1237, chapter: 12, text: 'Which is true of a net-change system?', options: ['It is a batch-type system which is updated periodically.', 'It is usually run at the beginning of each month.', 'The basic production plan is modified to reflect changes as they occur.', 'It is used to authorize the execution of planned orders.', 'It indicates the amount and timing of future changes.'], answer: 2, explanation: 'Net-change systems are updated as transactions occur.' },
            { id: 1238, chapter: 12, text: 'Which one of the following most closely describes the MRP approach that is used for components or subassemblies to compensate for variations in lead time?', options: ['pegging', 'safety stock', 'increased order sizes', 'safety time', 'low-level coding'], answer: 3, explanation: 'Safety time provides protection against the effects of lead time variation.' },
            { id: 1239, chapter: 12, text: 'Which of the following lot sizing methods does not attempt to balance ordering (or setup) and holding costs?', options: ['economic order quantity', 'economic run size', 'lot-for-lot', 'part-period', 'all of the above'], answer: 2, explanation: 'Lot-for-lot does not attempt to balance these costs.' },
            { id: 1240, chapter: 12, text: 'When MRP II systems include feedback, they are known as:', options: ['MRPIII', 'Enterprise resource planning', 'Circular MRP', 'Feasible MRP', 'Closed Loop MRP'], answer: 4, explanation: 'The feedback has to do with capacity.' },
            { id: 1241, chapter: 12, text: 'The multiplication process used by MRP to determine lower level requirements is called:', options: ['time-phasing', 'pegging', 'netting', 'projecting', 'exploding'], answer: 4, explanation: 'Bills of material are exploded into gross requirements for lower level items.' },
            { id: 1242, chapter: 12, text: '_______ is choosing how many to order or make.', options: ['Quantity determination', 'Package sizing', 'Lot sizing', 'Grouping', 'Aggregation'], answer: 2, explanation: 'Lot sizing sets the order or batch quantity.' },
            { id: 1243, chapter: 12, text: 'Which of the following is not usually necessary in order to have an effective MRP system?', options: ['a computer and software', 'an accurate bill of materials', 'lot-for-lot ordering', 'an up-to-date master schedule', 'integrity of file data'], answer: 2, explanation: 'MRP does not depend on lot-for-lot ordering.' },
            { id: 1244, chapter: 12, text: 'The _________ of ERP makes it valuable as a strategic planning tool.', options: ['Internet base', 'Rapid Batch capability', 'Employee focus', 'Real-time aspect', 'Database structure'], answer: 3, explanation: 'ERP provides real-time, consistent guidance to decision-making.' },
            { id: 1245, chapter: 12, text: 'A recent effort to expand the scope of production resource planning by involving other functional areas in the planning process has been:', options: ['material requirements planning', 'capacity requirements planning', 'manufacturing resources planning', 'Just-In-Time planning', 'multifunctional relationships planning'], answer: 2, explanation: 'MRP II brings other functional areas into the planning process.' },
            { id: 1246, chapter: 12, text: 'Which statement concerning MRP II is false?', options: ['It is basically a computerized system.', 'It can handle complex planning and scheduling quickly.', 'It involves other functional areas in the production planning process.', 'It involves capacity planning.', 'It produces a production plan which includes all resources required.'], answer: 4, explanation: 'MRP II doesn\'t necessarily consider all production resources.' },
            { id: 1247, chapter: 12, text: 'Which of these items would be most likely to have dependent demand?', options: ['Xbox batteries', 'toy trains', 'flowers', 'chocolate chip cookies', 'wrist watches'], answer: 0, explanation: 'Xbox batteries would only be needed if Xbox consoles were being produced.' },
            { id: 1248, chapter: 12, text: 'Which of these products would be most likely to have dependent demand?', options: ['refrigerators', 'automobile engines', 'televisions', 'brownies', 'automobiles'], answer: 1, explanation: 'Engines would only be necessary when automobiles were being produced.' },

            // === CHƯƠNG 13: 169 câu ===
            { id: 1249, chapter: 13, text: 'One important use of inventories in manufacturing is to decouple operations through the use of work in process inventories.', options: ['True', 'False'], answer: 0, explanation: 'Decoupling operations is an important use of inventories.' },
            { id: 1250, chapter: 13, text: 'The objective of inventory management is to minimize the cost of holding inventory.', options: ['True', 'False'], answer: 1, explanation: 'The objective of inventory management is to allow satisfactory customer service while keeping costs down.' },
            { id: 1251, chapter: 13, text: 'A retail store that carries twice the inventory as its competitor will provide twice the customer service level.', options: ['True', 'False'], answer: 1, explanation: 'There is a limit to how high service level can go; if the competitor\'s service level is 90%, the retailer can\'t double that.' },
            { id: 1252, chapter: 13, text: 'The overall objective of inventory management is to achieve satisfactory levels of customer service while keeping inventory costs reasonable.', options: ['True', 'False'], answer: 0, explanation: 'This is the overall objective of inventory management.' },
            { id: 1253, chapter: 13, text: 'The two main concerns of inventory control relate to the costs and the level of customer service.', options: ['True', 'False'], answer: 0, explanation: 'These are the essential facets of inventory control.' },
            { id: 1254, chapter: 13, text: 'To provide satisfactory levels of customer service while keeping inventory costs within reasonable bounds, two fundamental decisions must be made about inventory: the timing and size of orders.', options: ['True', 'False'], answer: 0, explanation: 'These are the fundamental decisions regarding inventory control.' },
            { id: 1255, chapter: 13, text: 'In the EOQ formula, holding costs under 10% are expressed as percentages, above 10% are expressed as annual unit costs.', options: ['True', 'False'], answer: 1, explanation: 'Holding costs are expressed in monetary terms, whether as a set value or as a percentage of the per-unit cost.' },
            { id: 1256, chapter: 13, text: 'DVD recorders would be an example of independent demand items.', options: ['True', 'False'], answer: 0, explanation: 'Components of the DVD recorders would be dependent demand items.' },
            { id: 1257, chapter: 13, text: 'Reorder point models are primarily used for dependent demand items.', options: ['True', 'False'], answer: 1, explanation: 'Reorder point models are primarily used for independent demand items.' },
            { id: 1258, chapter: 13, text: 'An example of inventory holding cost is the cost of moving goods to temporary storage after receipt from a supplier.', options: ['True', 'False'], answer: 1, explanation: 'These are ordering costs.' },
            { id: 1259, chapter: 13, text: 'Decoupling operations applies to the railroad industry.', options: ['True', 'False'], answer: 1, explanation: 'Decoupling refers to buffering operations in manufacturing.' },
            { id: 1260, chapter: 13, text: 'Interest, insurance, and opportunity costs are all associated with holding costs.', options: ['True', 'False'], answer: 0, explanation: 'These are holding costs.' },
            { id: 1261, chapter: 13, text: 'The A-B-C approach involves classifying inventory items by unit cost, with expensive items classified as \'A\' items and low cost items classified as \'C\' items.', options: ['True', 'False'], answer: 1, explanation: 'A-B-C approach classifies inventory according to some measure of importance.' },
            { id: 1262, chapter: 13, text: 'An inventory buffer adds value and lowers cost in all supply chains.', options: ['True', 'False'], answer: 1, explanation: 'Many buffers increase costs across supply chains.' },
            { id: 1263, chapter: 13, text: 'In the A-B-C approach, C items typically represent about 15 percent of the number of items, but 60 percent of the dollar usage.', options: ['True', 'False'], answer: 1, explanation: 'C items typically represent about 60 percent of the number of items and about 15 percent of the dollar usage.' },
            { id: 1264, chapter: 13, text: 'EOQ inventory models are basically concerned with the timing of orders.', options: ['True', 'False'], answer: 1, explanation: 'EOQ models are concerned with the size of orders.' },
            { id: 1265, chapter: 13, text: 'The average inventory level is inversely related to order size.', options: ['True', 'False'], answer: 1, explanation: 'The average inventory level is positively related to order size.' },
            { id: 1266, chapter: 13, text: 'The average inventory level and the number of orders per year are inversely related: As one increases, the other decreases.', options: ['True', 'False'], answer: 0, explanation: 'These are inversely related.' },
            { id: 1267, chapter: 13, text: 'The EOQ should be regarded as an approximate quantity rather than an exact quantity. Thus, rounding the calculated value is acceptable.', options: ['True', 'False'], answer: 0, explanation: 'The total cost function is relatively flat, so rounding costs little.' },
            { id: 1268, chapter: 13, text: 'Carrying cost is a function of order size; the larger the order, the higher the inventory carrying cost.', options: ['True', 'False'], answer: 0, explanation: 'Larger order quantities lead to higher inventory carrying cost.' },
            { id: 1269, chapter: 13, text: 'Understocking an inventory item is a sure sign of inadequate inventory control.', options: ['True', 'False'], answer: 1, explanation: 'Having an occasional stockout is not necessarily a sign of inadequate inventory control.' },
            { id: 1270, chapter: 13, text: 'Annual ordering cost is inversely related to order size.', options: ['True', 'False'], answer: 0, explanation: 'Annual ordering cost decreases as order size increases.' },
            { id: 1271, chapter: 13, text: 'The total cost curve is relatively flat near the EOQ.', options: ['True', 'False'], answer: 0, explanation: 'Thus approximating the EOQ can be a very good solution.' },
            { id: 1272, chapter: 13, text: 'Because price isn\'t a factor in the EOQ formula, quantity discounts won\'t affect EOQ calculations.', options: ['True', 'False'], answer: 1, explanation: 'If quantity discounts are offered, the EOQ might vary based on different holding costs.' },
            { id: 1273, chapter: 13, text: 'In the quantity discount model, if holding costs are given as a percentage of unit price, a graph of the total cost curves will have the same EOQ for each curve.', options: ['True', 'False'], answer: 1, explanation: 'Total cost curves will differ across the price levels.' },
            { id: 1274, chapter: 13, text: 'In the quantity discount model, the optimum quantity will always be found on the lowest total cost curve.', options: ['True', 'False'], answer: 1, explanation: 'The optimum quantity might actually be when the discount is passed up.' },
            { id: 1275, chapter: 13, text: 'ROP models indicate to managers the time between orders.', options: ['True', 'False'], answer: 1, explanation: 'ROP models indicate when, with regard to on-hand inventory, orders should be placed.' },
            { id: 1276, chapter: 13, text: 'When to order can be calculated by the ROP and expressed as a quantity.', options: ['True', 'False'], answer: 0, explanation: 'ROP models indicate when, with regard to on-hand inventory, orders should be placed.' },
            { id: 1277, chapter: 13, text: 'The rate of demand is an important factor in determining the ROP.', options: ['True', 'False'], answer: 0, explanation: 'The demand rate multiplied by the lead time is a major part of the ROP.' },
            { id: 1278, chapter: 13, text: 'The inventory value of the supply chain exceeds the inventory value of the organization\'s work in process inventory.', options: ['True', 'False'], answer: 0, explanation: 'There can be raw materials and finished goods inventory at the organization. Other organizations in the supply chain will have inventories, too.' },
            { id: 1279, chapter: 13, text: 'Safety stock is held because we anticipate future demand.', options: ['True', 'False'], answer: 1, explanation: 'Safety stock is held because we anticipate fluctuations in future demand or in lead time.' },
            { id: 1280, chapter: 13, text: 'Variability in demand and/or lead time can be compensated for by safety stock.', options: ['True', 'False'], answer: 0, explanation: 'Safety stock can be used to accommodate these.' },
            { id: 1281, chapter: 13, text: 'Solving quality problems can lead to lower inventory levels.', options: ['True', 'False'], answer: 0, explanation: 'Leaning out the organization can be facilitated by solving quality problems.' },
            { id: 1282, chapter: 13, text: 'ROP models assume that demand during lead time is composed of a series of dependent daily demands.', options: ['True', 'False'], answer: 1, explanation: 'ROP models assume that demand during lead time is composed of a series of independent daily demands.' },
            { id: 1283, chapter: 13, text: 'Profit margins tend to be inversely related to inventory turns.', options: ['True', 'False'], answer: 0, explanation: 'This is typically the case.' },
            { id: 1284, chapter: 13, text: 'In the fixed-order interval model, the order size is the same for each order.', options: ['True', 'False'], answer: 1, explanation: 'Order size varies from order to order in a fixed-order interval model.' },
            { id: 1285, chapter: 13, text: 'The fixed-order interval model requires a continuous monitoring of inventory levels.', options: ['True', 'False'], answer: 1, explanation: 'The fixed-order interval model leads to periodic monitoring of inventory levels.' },
            { id: 1286, chapter: 13, text: 'Discrete stocking levels are used when an organization doesn\'t want visibility of inventory levels.', options: ['True', 'False'], answer: 1, explanation: 'Discrete stocking refers to having to stock a discrete number of units.' },
            { id: 1287, chapter: 13, text: 'The fixed-order interval model requires a larger amount of safety stock than the ROP model for the same risk of a stockout.', options: ['True', 'False'], answer: 0, explanation: 'Fixed-order intervals typically carry more safety stock.' },
            { id: 1288, chapter: 13, text: 'The single-period model can be very helpful in determining when to order.', options: ['True', 'False'], answer: 1, explanation: 'The single-period model helps determine how many to order.' },
            { id: 1289, chapter: 13, text: 'The single-period model can be very helpful in determining how much to order.', options: ['True', 'False'], answer: 0, explanation: 'The single-period model helps determine how many to order.' },
            { id: 1290, chapter: 13, text: 'Monitoring inventory turns over time can be used as a measure of performance.', options: ['True', 'False'], answer: 0, explanation: 'Greater turnover often implies better performance.' },
            { id: 1291, chapter: 13, text: 'A single-period model would be used mainly by organizations going out of business.', options: ['True', 'False'], answer: 1, explanation: 'The single-period model applies to many regularly occurring circumstances.' },
            { id: 1292, chapter: 13, text: 'The basic EOQ model ignores the purchasing cost.', options: ['True', 'False'], answer: 0, explanation: 'Only if quantity discounts are offered does purchasing cost enter into EOQ analysis.' },
            { id: 1293, chapter: 13, text: 'When the item is offered for resale, shortage costs in the single-period model can include a charge for loss of customer goodwill.', options: ['True', 'False'], answer: 0, explanation: 'Greater loss of goodwill would equate with a higher shortage cost.' },
            { id: 1294, chapter: 13, text: 'In the single-period model, the service level is the probability that demand will not exceed the stocking level in any period.', options: ['True', 'False'], answer: 0, explanation: 'If demand exceeds the stocking level, a stockout as occurred.' },
            { id: 1295, chapter: 13, text: 'A quantity discount will lower the reorder point.', options: ['True', 'False'], answer: 1, explanation: 'The reorder point is independent of quantity discounts.' },
            { id: 1296, chapter: 13, text: 'It is critical that the exact quantity calculated in the EOQ model be ordered.', options: ['True', 'False'], answer: 1, explanation: 'Because the total cost curve is flat, modest rounding of the EOQ is permissible.' },
            { id: 1297, chapter: 13, text: 'Safety stock eliminates all stock outs.', options: ['True', 'False'], answer: 1, explanation: 'Safety stock only ensures that a given likelihood of stock outs.' },
            { id: 1298, chapter: 13, text: 'The calculation of safety stock requires knowledge of demand and lead time variability.', options: ['True', 'False'], answer: 0, explanation: 'Both of these play a role in the calculation of safety stock.' },
            { id: 1299, chapter: 13, text: 'The two basic issues in inventory are how much to order and when to order.', options: ['True', 'False'], answer: 0, explanation: 'Quantity and timing are the two basic issues in inventory management.' },
            { id: 1300, chapter: 13, text: 'Cycle counting can be used in motorcycle inventory control.', options: ['True', 'False'], answer: 0, explanation: 'Cycle counting can also be used in automobile inventory control.' },
            { id: 1301, chapter: 13, text: 'Using the EOQ model, the higher an item\'s carrying costs, the more frequently it will be ordered.', options: ['True', 'False'], answer: 0, explanation: 'As carrying costs increase, the optimal order quantity decreases.' },
            { id: 1302, chapter: 13, text: 'The cycle time represents the time between reorder point and receipt of order.', options: ['True', 'False'], answer: 1, explanation: 'The cycle time represents the time between orders.' },
            { id: 1303, chapter: 13, text: 'The cost of placing an order is a function of order size.', options: ['True', 'False'], answer: 1, explanation: 'The cost of placing an order is typically unrelated to order size.' },
            { id: 1304, chapter: 13, text: 'All stock outs must be avoided.', options: ['True', 'False'], answer: 1, explanation: 'Most of the time it would be too costly to avoid all stockouts.' },
            { id: 1305, chapter: 13, text: 'In the basic EOQ model, annual holding cost is one-half of the total annual cost for all items purchased.', options: ['True', 'False'], answer: 1, explanation: 'Annual holding cost equals half the product of the order quantity and the per-unit-per-year holding cost.' },
            { id: 1306, chapter: 13, text: 'Quantity discounts are generally given for large number of orders.', options: ['True', 'False'], answer: 1, explanation: 'Quantity discounts are given for smaller, but larger, orders.' },
            { id: 1307, chapter: 13, text: 'The larger the number of orders placed, the larger the average level of inventory.', options: ['True', 'False'], answer: 1, explanation: 'More orders means smaller quantities, which means lower average inventory.' },

            // === CHƯƠNG 14: 88 câu ===
            { id: 1308, chapter: 14, text: 'In lean operations, input resources arrive for processing only after the preceding batch has been completed.', options: ['True', 'False'], answer: 0, explanation: 'When the preceding batch has been completed, the workstation authorizes new input resources to arrive.' },
            { id: 1309, chapter: 14, text: 'A functioning MRP system is required prior to adopting lean planning and control systems.', options: ['True', 'False'], answer: 1, explanation: 'Lean planning and control can be implemented without the use of MRP.' },
            { id: 1310, chapter: 14, text: 'In a lean environment, anything not essential to the product or process is viewed as waste.', options: ['True', 'False'], answer: 0, explanation: 'Eliminating such waste is central to the lean philosophy.' },
            { id: 1311, chapter: 14, text: 'The ultimate goal of lean operations is a system characterized by the smooth, rapid flow of materials.', options: ['True', 'False'], answer: 0, explanation: 'A smooth, rapid material flow is the ideal in a lean environment.' },
            { id: 1312, chapter: 14, text: 'Although inventories are maintained, the goal of lean operations is to minimize safety stock.', options: ['True', 'False'], answer: 1, explanation: 'The goal of lean operations is to eliminate safety stock.' },
            { id: 1313, chapter: 14, text: 'Lean operations are unable to easily handle changes of output or product mix.', options: ['True', 'False'], answer: 1, explanation: 'Volume or product mix changes can easily undermine a system being operated according to lean principles.' },
            { id: 1314, chapter: 14, text: 'In the lean philosophy, producing more than two order quantities represents waste.', options: ['True', 'False'], answer: 1, explanation: 'Producing one order quantity in advance of demand represents waste.' },
            { id: 1315, chapter: 14, text: 'The four building blocks of lean operations are: product design, process design, personnel/organizational elements, and manufacturing planning and control.', options: ['True', 'False'], answer: 0, explanation: 'These are the building blocks of lean operations.' },
            { id: 1316, chapter: 14, text: 'Fast and simple are two common threads that run through the four building blocks of lean operations.', options: ['True', 'False'], answer: 0, explanation: 'Streamlined and error-proof are lean ideals.' },
            { id: 1317, chapter: 14, text: 'Value-stream mapping is a technique focused on finding new ways of adding value for critical stakeholders such as customers.', options: ['True', 'False'], answer: 1, explanation: 'Value-stream mapping is a visual tool used to systematically examine the flow of materials and information.' },
            { id: 1318, chapter: 14, text: 'If a firm\'s product mix is 60% of product A and 20% each of products B and C, an optimal mix-model production schedule would be successive sequences of AAABC.', options: ['True', 'False'], answer: 1, explanation: 'An optimal schedule would be successive sequences of ABACA.' },
            { id: 1319, chapter: 14, text: 'Quality and highly capable production systems are requirements for the successful implementation of lean operations.', options: ['True', 'False'], answer: 0, explanation: 'These help prevent waste.' },
            { id: 1320, chapter: 14, text: 'The small lot-sizing policy works well in a situation where both holding costs and setup costs are high.', options: ['True', 'False'], answer: 1, explanation: 'Small lot-sizing is only workable when setup costs are low.' },
            { id: 1321, chapter: 14, text: 'The use of small lot sizes in lean operations is in conflict with the EOQ approach since setup costs tend to be significantly higher than holding costs.', options: ['True', 'False'], answer: 1, explanation: 'These are not in conflict, since with low setup costs the EOQ leads to small lot sizes.' },
            { id: 1322, chapter: 14, text: 'A basic requirement for operating with low inventories in lean systems is that major system problems must already have been solved and new problems will be solved as they appear.', options: ['True', 'False'], answer: 0, explanation: 'Unless these problems are solved, steps required to work with low inventories are economically infeasible.' },
            { id: 1323, chapter: 14, text: 'A benefit of small lot sizes in lean systems is that each product is produced less frequently.', options: ['True', 'False'], answer: 1, explanation: 'Product versions are produced more frequently in lean systems.' },
            { id: 1324, chapter: 14, text: 'In the lean philosophy, the larger the lot size, the easier it is to schedule.', options: ['True', 'False'], answer: 1, explanation: 'In the lean system, items with large lot sizes tend to be scheduled less frequently.' },
            { id: 1325, chapter: 14, text: 'Setup time and its associated cost can often be reduced by the use of group technology.', options: ['True', 'False'], answer: 0, explanation: 'Group technology can help with reducing setup time and its associated cost.' },
            { id: 1326, chapter: 14, text: 'Lean systems often use layouts that are based on group technology product requirements.', options: ['True', 'False'], answer: 0, explanation: 'Group technology can help with reducing setup time and its associated cost.' },
            { id: 1327, chapter: 14, text: 'The goal of lean operations is to produce output using fewer resources than traditional planning systems.', options: ['True', 'False'], answer: 0, explanation: 'Economizing on resource usage is at the heart of lean operations.' },
            { id: 1328, chapter: 14, text: '"Autonomation" indicates that the firm is attempting to reduce its dependence on automated equipment.', options: ['True', 'False'], answer: 1, explanation: 'Autonomation involves the automatic detection of defects during production.' },
            { id: 1329, chapter: 14, text: '"Preventive maintenance" is additional maintenance done immediately after a breakdown has occurred to help prevent any further breakdowns.', options: ['True', 'False'], answer: 1, explanation: 'Preventative maintenance is done on a regularly scheduled basis to help prevent breakdowns.' },
            { id: 1330, chapter: 14, text: 'In the lean approach, inventories are reduced gradually, instead of eliminating inventories as rapidly as possible.', options: ['True', 'False'], answer: 0, explanation: 'Inventories are reduced as problems are solved.' },
            { id: 1331, chapter: 14, text: 'One problem with lean operations is that they can lead to much frustration and disappointment of people on the shop floor due to the need for continuously monitoring and expediting resource availability.', options: ['True', 'False'], answer: 0, explanation: 'Workers are challenged to take on more responsibility for the process in lean operations.' },
            { id: 1332, chapter: 14, text: 'A real advantage of the lean philosophy is the reduction of co-ordination effort required.', options: ['True', 'False'], answer: 1, explanation: 'Substantial co-ordination effort is required in the lean philosophy.' },
            { id: 1333, chapter: 14, text: 'The lean philosophy recognizes that some work-in-process inventories are a necessary investment to allow for smooth work-flow.', options: ['True', 'False'], answer: 1, explanation: 'The lean philosophy sees smooth flows enabled by work-in-process inventory as inherently wasteful.' },
            { id: 1334, chapter: 14, text: 'Preventive maintenance will eliminate the need to carry supplies of spare parts.', options: ['True', 'False'], answer: 1, explanation: 'The need to carry spare parts is not eliminated by preventative maintenance.' },
            { id: 1335, chapter: 14, text: 'A fundamental tenet of the lean philosophy is that workers are paid based on seniority.', options: ['True', 'False'], answer: 1, explanation: 'The lean philosophy has no tenet based on how workers are to be paid.' },
            { id: 1336, chapter: 14, text: 'In lean operations, a responsibility of the cross-trained worker is to check the quality of the work of others.', options: ['True', 'False'], answer: 0, explanation: 'Worker responsibilities are greater in lean operations.' },
            { id: 1337, chapter: 14, text: 'In lean operations, when work is completed at one work center, it is important to immediately move the completed work to the next work center to minimize idle time.', options: ['True', 'False'], answer: 1, explanation: 'Work is only moved downstream when such work has been authorized; thus it is important to move finished work downstream because the downstream operation might be starved for inputs.' },
            { id: 1338, chapter: 14, text: 'In a "pull system," a quantity of inventory in front of a workstation indicates problems at that workstation.', options: ['True', 'False'], answer: 0, explanation: 'If that workstation is not authorizing production upstream, soon upstream production will cease.' },
            { id: 1339, chapter: 14, text: 'Limited WIP lowers inventory carrying costs but reduces flexibility.', options: ['True', 'False'], answer: 1, explanation: 'Limited WIP actually makes the system more flexible.' },
            { id: 1340, chapter: 14, text: 'Engineering changes can be very disruptive to smooth operations and should not be made in the six month period following introduction of a new product.', options: ['True', 'False'], answer: 1, explanation: 'Engineering changes should be minimized by doing a better job of product/process design before the product is in production.' },
            { id: 1341, chapter: 14, text: 'Kanban is the Japanese term for autonomation.', options: ['True', 'False'], answer: 1, explanation: 'Kanban is a Japanese term for "sign" or "visible record."' },
            { id: 1342, chapter: 14, text: 'Increased setup times equal increased work in process inventories.', options: ['True', 'False'], answer: 0, explanation: 'With higher setup times, batch quantities and work-in-process inventory increases.' },
            { id: 1343, chapter: 14, text: 'Kanban focuses on specific part numbers; CONWIP does not.', options: ['True', 'False'], answer: 0, explanation: 'This makes CONWIP more suitable for a mixed-product environment.' },
